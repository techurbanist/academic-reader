# Builds the app and deploys it to the Cloudflare Worker "academic-reader" on every push to main.
# Needs, in the GitHub environment "production", secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, and variables
# DROPBOX_APP_KEY and GOOGLE_CLIENT_ID (public identifiers; see README). Without the token, the deploy is skipped.
name: Deploy to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    # The Cloudflare secrets go only to the steps that need them, and every tool that runs next to them is pinned
    # to an exact version, so a new release of an action or of wrangler cannot read the token.
    env:
      DROPBOX_APP_KEY: ${{ vars.DROPBOX_APP_KEY }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      PUBLIC_URL: https://academic-reader.initialloop.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check configuration
        id: cfg
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping deploy."; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ -n "$DROPBOX_APP_KEY" ] || echo "::warning::DROPBOX_APP_KEY is not set; Dropbox sync will show as not set up."
          [ -n "$GOOGLE_CLIENT_ID" ] || echo "::warning::GOOGLE_CLIENT_ID is not set; Google Drive sync will show as not set up."
      - name: Build
        if: steps.cfg.outputs.skip != '1'
        run: bash build.sh
      - name: Deploy
        if: steps.cfg.outputs.skip != '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4.140.0 deploy
