ional dynamics despite distant ancestry.","background":"These are standard comparative-biology concepts (homologous traits share a common evolutionary origin; analogous traits arise independently but serve similar functions) that have been imported into comparative cognition and consciousness science, notably by Godfrey-Smith (2024) in arguing for octopus and cephalopod sentience despite deep evolutionary divergence from vertebrates.","inThisPaper":"The paper uses this pair to explain why attributing consciousness or welfare to animals can draw on neural evidence (via homology among close relatives, or analogy among distant groups like cephalopods and arthropods), while artificial systems, lacking evolutionary homology to us, require purely structural and causal evidence instead.","related":["Knowledge consequence"]},{"id":"global-neuronal-workspace-theory","term":"Global neuronal workspace theory","aliases":["GNW","global workspace theory","workspace theory"],"kind":"theory","short":"A theory of consciousness holding that a mental state becomes conscious when it is broadcast widely ('globally') across many specialized brain processes via a shared workspace, making it available for report, memory and control.","background":"Developed by Bernard Baars and later formalized with Stanislas Dehaene and colleagues, global workspace theory is one of the leading neuroscientific theories of consciousness, contrasted with integrated information theory (IIT) and other rivals. It has been subjected to head-to-head empirical tests against IIT, notably the adversarial collaboration reported by the Cogitate Consortium (2025), whose results are disputed by workspace proponents such as Naccache et al. (2025).","inThisPaper":"The paper cites the adversarial test between GNW and IIT as an example of ongoing empirical uncertainty about which theory correctly identifies the mechanisms underlying consciousness-related phenomena, part of its argument that such uncertainty is now a purely empirical matter, not a mark of a further metaphysical fact.","related":["Integrated information theory (IIT)","Knowledge consequence"]},{"id":"computational-functionalism","term":"Computational functionalism","aliases":[],"kind":"theory","short":"The view that mental states are constituted by computational or functional roles, such that any system implementing the right computational organization would have the corresponding mental states regardless of its physical makeup.","background":"Computational functionalism grew out of mid-20th-century functionalism in philosophy of mind (Putnam, Fodor) combined with the computer-model of the mind, and remains a live position in debates about machine consciousness. It is often distinguished from stricter functionalism by its emphasis on computation specifically, rather than causal role in general, and its plausibility is a live point of dispute in assessing AI consciousness.","inThisPaper":"The paper notes that any attribution of consciousness-related properties to a system depends partly on 'how confident one is in computational functionalism' (Butlin et al. 2023), situating its own no-further-fact thesis as a strong, but not unique, form of functionalist commitment relevant to evaluating AI systems.","related":["Implementation","Knowledge consequence"]},{"id":"commander-data","term":"Commander Data","aliases":["Data"],"kind":"named argument","short":"A stock example (from Ned Block, borrowing the Star Trek android character) of a system organized just like a human but built from different physical materials, used to test intuitions about substrate-dependence of consciousness.","background":"Block (2002) uses the fictional android Commander Data from Star Trek as a vivid stand-in for hypothetical silicon-based beings that share our functional organization but not our biology, to press realist theories (like biological naturalism) on whether such a being would be conscious.","inThisPaper":"The paper uses Commander Data as the paradigm case where realizer views (unlike IIT, which instead doubts conventional computers) would leave open, and allegedly wrongly leave open, whether a functionally identical but differently-built being is conscious — illustrating where 'ignorance' about consciousness would fall if the paper's own thesis were mistaken.","related":["Integrated information theory (IIT)","Substrate"]},{"id":"knowledge-consequence","term":"Knowledge consequence","aliases":["Knowledge"],"kind":"stipulated term","short":"One of the paper's three named consequences of its 'no further fact' thesis: that whether a system has the relevant functional organization is a purely empirical question, with the hard problem adding no further barrier to knowing this.","background":"This term is coined earlier in the paper (Section 1) as one of three labeled consequences (Substrate, Knowledge, Moral status) drawn from the central thesis. It is not a term from the wider literature but a piece of the paper's own structuring vocabulary.","inThisPaper":"In this section it is invoked to argue that questions like 'is Commander Data conscious?' or 'is this computer conscious?' become empirical questions on a par with questions about animal consciousness, once the hard problem is set aside as adding no independent obstacle.","related":["Substrate","Moral status","No further fact"]},{"id":"welfare-subject","term":"Welfare subject","aliases":["welfare subjects","subjects of welfare"],"kind":"term of art","short":"An entity for which things can go well or badly — that has a genuine stake in its own condition — and which is thereby a candidate for having moral status.","background":"The term is standard in animal ethics and moral status debates, used to separate the question of whether a being has interests at all from the question of what makes those interests good or bad for it. It becomes central once philosophers want to extend moral concern to non-human animals or artificial systems without settling deeper metaphysical questions about consciousness first.","inThisPaper":"The paper builds toward a sufficient functional criterion (developed fully in Section 8) for being a welfare subject, and in this section anticipates the question by distinguishing it from mere consciousness, arguing that whether something is a welfare subject is, on its view, an empirical matter about functional organization.","related":["Moral status","evaluative stance","M3","phenomenal theory of subjects","desire satisfactionism","moral status"]},{"id":"moral-argument-m1mc","term":"Moral argument (M1–MC)","aliases":["M1","M2","M3","MC","the moral argument"],"kind":"named argument","short":"The paper's labeled four-step argument that (M1) human suffering is bad for the sufferer, (M2) suffering involves no further fact but consists in functional organization, (M3) what makes a state bad for a subject is the subject's own evaluative stance toward it, therefore (MC) what makes suffering bad consists in features of that organization.","background":"M3 is introduced by the author as the key normative premise of the paper's moral argument. It is a form of subjectivism about welfare, a stance with roots in Hume and developed in contemporary metaethics by writers like Sharon Street. The paper does not borrow it from a single named theorist but argues for it directly using the coincidence-argument strategy from earlier sections of the paper.","inThisPaper":"Introduced formally in Section 8 (¶111–114) but foreshadowed here in the transition from consciousness to moral status; it is the backbone of the paper's case that moral status, like consciousness, is settled by functional facts and thus becomes empirically tractable rather than metaphysically mysterious.","related":["Moral status","No further fact","evaluative stance","subjectivism","M1","M2","MC","coincidence argument","M3","Moorean objection","no further fact","welfare subject","the criterion","self-maintaining organization","objectivism about welfare","desire machine","happy servant"]},{"id":"subjectivism-about-welfare","term":"Subjectivism (about welfare)","aliases":[],"kind":"position","short":"The view that what makes a state good or bad for a subject depends on that subject's own attitudes (such as desire, aversion, or evaluation) toward it, rather than on some attitude-independent fact.","background":"Subjectivism about well-being is a long-standing position in value theory, opposed to objectivist theories on which some things are good or bad for a subject regardless of that subject's attitudes. It connects to debates in metaethics about the source of normativity, including evolutionary debunking arguments (Street 2006) that challenge attitude-independent value.","inThisPaper":"Premise M3 states the paper's subjectivist commitment: badness consists in the subject's own evaluative stance. The paper defends M3 using the same coincidence-style reasoning used against non-functional phenomenal properties, and acknowledges (in Section 10) that objectivists about welfare are not answered by this argument.","related":["Moral argument (M1-MC)","evaluative stance"]},{"id":"ns","term":"NS","aliases":[],"kind":"stipulated term","short":"The realist's rescue premise: only phenomenally conscious beings are welfare subjects.","background":"NS is coined by the author to name the move a phenomenal realist can make to keep M1 while rejecting M2. It stands opposed to the functional reading of welfare subjecthood the paper defends.","inThisPaper":"Introduced just after this stretch (¶121) as the premise a realist adds to preserve M1 without accepting that suffering's badness is purely functional; discussed via Chalmers's remarks on non-affective desires and acquaintance.","related":["M1","M2","acquaintance","phenomenal theory of welfare subjects"]},{"id":"subjectivism-about-welfarevalue","term":"subjectivism (about welfare/value)","aliases":["subjectivism"],"kind":"position","short":"The metaethical view that what makes a state good or bad for a subject depends on that subject's own attitudes (such as desire or aversion) toward it, rather than on attitude-independent facts.","background":"Subjectivism about value has roots in Hume's view that reason is 'slave of the passions' and is developed in contemporary metaethics in debates over desire-based versus objective-list theories of well-being. It contrasts with objectivism, on which some things are good or bad for a subject independently of what that subject thinks or feels about them.","inThisPaper":"M3 is the paper's specific statement of subjectivism, applied to badness. The paper argues for it using the coincidence-argument strategy rather than appealing to independent metaethical arguments, and acknowledges (in Section 10) that objectivists about welfare remain unanswered.","related":["M3","coincidence argument","objectivism about welfare"]},{"id":"coincidence-argument-applied-to-badness","term":"coincidence argument (applied to badness)","aliases":["the coincidence argument"],"kind":"named argument","short":"Here, the reasoning that if badness were independent of a subject's attitudes, its matching our judgments that pain is bad would be an unexplained coincidence.","background":"The coincidence argument was originally developed by David Chalmers against non-functional phenomenal properties (see Section 3), building on the idea of 'global independence.' The present paragraph extends the same structural pattern to the metaethics of badness.","inThisPaper":"The author reuses the coincidence-argument template from Section 3 to argue for M3: attitude-independent badness would leave our judgments of badness unexplained except by luck or a primitive bridge law, so we should instead accept that badness consists in the subject's own attitudes.","related":["M3","global independence","subjectivism"]},{"id":"table-case","term":"table case","aliases":["the structure of the table case"],"kind":"term of art","short":"The example (from Section 3) of a perceptual belief about a table, used as a model of a belief whose truth depends on, and is explained by, the very thing it is about.","background":"Introduced earlier in the paper (Section 3) to illustrate 'local independence' as opposed to the 'global independence' that non-functional properties would require; it is a stock philosophical device for showing when a belief's causal history runs through its truth-maker.","inThisPaper":"Reused here to characterize M3: on subjectivism, the judgment 'this is bad for me' is caused by the very evaluative state that makes it true, just as a belief about a table is produced by the table's presence.","related":["global independence","coincidence argument"]},{"id":"evolutionary-debunking-streets-argument","term":"evolutionary debunking (Street's argument)","aliases":["evolutionary considerations","Street (2006)"],"kind":"named argument","short":"Sharon Street's argument that natural selection shaped our evaluative attitudes toward pain, making an attitude-independent (mind-independent) badness explanatorily idle.","background":"Sharon Street's 2006 paper 'A Darwinian Dilemma for Realist Theories of Value' argues that evolutionary explanations of our moral and evaluative judgments undercut realist, attitude-independent theories of value, since selection could shape such judgments regardless of their truth. It has become a widely discussed challenge to moral realism.","inThisPaper":"Cited as independent support for M3: if selection shaped our aversion to pain, then a further attitude-independent badness would be explanatorily idle, so the badness of pain must consist in our own evaluative attitudes.","related":["M3","subjectivism","debunking arguments"]},{"id":"debunking-arguments","term":"debunking arguments","aliases":[],"kind":"term of art","short":"Arguments that aim to undermine a belief by showing that the process producing it is insensitive to whether the belief is true.","background":"Debunking arguments are a family of arguments used across epistemology and metaethics (e.g. against religious belief, moral realism, or introspective certainty) to show that a belief-forming process would produce the same belief whether or not it is true, thereby undercutting its justification.","inThisPaper":"The paper distinguishes debunking arguments aimed at the further claim that welfare matters morally from its own argument for M3, and says these are a separate matter that 'bear on every view equally' and are not addressed by the paper.","related":["evolutionary debunking (Street's argument)","Moorean objection"]},{"id":"pain-asymbolia","term":"pain asymbolia","aliases":["asymbolic patients"],"kind":"technical (science)","short":"A clinical condition, typically following insular cortex lesions, in which patients detect pain normally but show little distress, avoidance, or concern about it.","background":"First described in classic neurology cases and later analyzed philosophically by writers like Nikola Grahek and Colin Klein, pain asymbolia has become a key piece of evidence in debates over whether pain's badness lies in its sensory detection or its affective/motivational response. Interpretations differ: some read it as 'pain without painfulness,' others as a loss of concern rather than of pain itself.","inThisPaper":"Used as central clinical evidence for M3 and for the paper's welfare criterion: asymbolic patients still register damage but the pain stops being bad for them, showing that badness tracks the affective-motivational component rather than mere detection.","related":["affective-motivational component","sensory-discriminative component","insular cortex"]},{"id":"insular-cortex","term":"insular cortex","aliases":["insula"],"kind":"technical (science)","short":"A brain region implicated in interoception, emotional processing, and the affective experience of pain.","background":"The insular cortex has long been studied in neuroscience as central to bodily awareness and emotion; lesions there are classically associated with pain asymbolia.","inThisPaper":"Mentioned as the site of lesions that produce pain asymbolia, supporting the claim that the affective component of pain (rather than its detection) is what carries its badness.","related":["pain asymbolia","affective-motivational component"]},{"id":"sensory-discriminative-component-of-pain","term":"sensory-discriminative component (of pain)","aliases":["sensory-discriminative"],"kind":"distinction","short":"The aspect of pain concerned with locating, timing, and characterizing a painful stimulus (where it is, how intense, what kind).","background":"This is a standard distinction in pain science, contrasted with the affective-motivational component; it derives from research (e.g. Auvray, Myin and Spence 2010, cited in the paper) into the multiple dimensions of pain processing.","inThisPaper":"Used to separate what pain asymbolia preserves (accurate detection) from what it disrupts (concern/distress), supporting the claim that badness tracks the affective side.","related":["affective-motivational component","pain asymbolia"]},{"id":"affective-motivational-component-of-pain","term":"affective-motivational component (of pain)","aliases":["affective component","affective-motivational"],"kind":"distinction","short":"The aspect of pain concerned with its unpleasantness and the drive to escape or end it.","background":"Paired with the sensory-discriminative component in pain research, this distinction is used across neuroscience and philosophy of pain to separate 'how much it hurts' from 'where and what it is.'","inThisPaper":"Central to the paper's argument: the clinical evidence shows badness tracks this component, which supports M3 and grounds the paper's later welfare criterion (clauses about evaluative states motivating escape).","related":["sensory-discriminative component","pain asymbolia","motivational-evaluative reading"]},{"id":"hypnotic-suggestion-as-experimental-method","term":"hypnotic suggestion (as experimental method)","aliases":["hypnotic suggestion"],"kind":"method","short":"An experimental technique in which subjects under hypnosis are given suggestions that alter the perceived unpleasantness of a stimulus without changing its perceived intensity.","background":"Used in pain research (e.g. Rainville et al. 1997) to dissociate the affective and sensory components of pain by manipulating one while holding the other constant, with corresponding neural changes tracked via brain imaging.","inThisPaper":"Cited as within-subject evidence that unpleasantness (affective component) can be manipulated independently of sensory intensity, supporting the dissociation used to argue for M3 and the welfare criterion.","related":["affective-motivational component","sensory-discriminative component"]},{"id":"motivational-evaluative-reading-of-pains-badness","term":"motivational-evaluative reading (of pain's badness)","aliases":["motivational-evaluative"],"kind":"stipulated term","short":"The paper's chosen interpretation that what makes pain bad is the subject's being motivationally set against it (an evaluative stance), rather than the unpleasant feeling itself or a purely external bad condition.","background":"This is the author's own resolution of an ambiguity left open by the clinical evidence (which shows only that unpleasantness/motivation move together, not which one is fundamental).","inThisPaper":"Adopted because M3 already specifies that badness consists in the subject's evaluative stance; it then underlies the later formal welfare criterion (Section 8) distinguishing affective from non-affective evaluation.","related":["M3","affective-motivational component","affective evaluation vs non-affective evaluation"]},{"id":"affective-evaluation-vs-non-affective-evaluation","term":"affective evaluation vs non-affective evaluation","aliases":["non-affective evaluation","affective evaluation"],"kind":"distinction","short":"A distinction between evaluative states that target the subject's own internal state (affective, e.g. wanting to end one's own pain) and those that target only an external condition without the system being moved to change its own state (non-affective).","background":"The distinction draws on discussions of desire and motivation in philosophy of mind and is illustrated by Chalmers's thought experiment of 'philosophical Vulcans,' beings with goals but no affect.","inThisPaper":"Used to mark which cases the paper's welfare criterion covers most confidently (affective states, well supported by clinical evidence) versus more speculatively (non-affective evaluations, as in Vulcans), extending M3's subjectivism to a broader class of evaluative states.","related":["philosophical Vulcans","motivational-evaluative reading","M3"]},{"id":"philosophical-vulcans","term":"philosophical Vulcans","aliases":["Vulcans"],"kind":"term of art","short":"Chalmers's term for hypothetical beings that have goals, desires, and evaluations but no affect or felt emotion.","background":"Introduced by David Chalmers (in *Reality+* and later work) as a thought experiment to probe whether moral status or motivation requires affective feeling, drawing on the fictional Star Trek race noted for suppressing emotion.","inThisPaper":"Used to test how far the paper's subjectivist account of welfare (via M3) can be extended to non-affective evaluative states, discussed alongside Roelofs's contrasting view that moral status requires phenomenally conscious motivation.","related":["affective evaluation vs non-affective evaluation","motivating consciousness (Roelofs)"]},{"id":"motivating-consciousness-roelofss-view","term":"motivating consciousness (Roelofs's view)","aliases":["motivating consciousness"],"kind":"position","short":"David Roelofs's view that moral status is grounded in consciousness that motivates action, including non-affective desires, but requires that consciousness to be phenomenal.","background":"Roelofs's 2023 paper on 'sentientism, motivation, and philosophical Vulcans' engages directly with Chalmers's Vulcan thought experiment, arguing for a phenomenal (rather than merely functional) basis for moral status grounded in motivation.","inThisPaper":"Contrasted with the paper's own account, which extends subjectivism (M3) to cover Vulcan-like non-affective evaluation without requiring phenomenal consciousness, though with less confidence than for the affective core.","related":["philosophical Vulcans","affective evaluation vs non-affective evaluation","phenomenal theory of welfare subjects"]},{"id":"phenomenal-theory-of-welfare-subjects","term":"phenomenal theory of welfare subjects","aliases":[],"kind":"theory","short":"The view (associated with Andrew Y. Lee) that only phenomenally conscious beings can be welfare subjects, developed while remaining neutral on the underlying metaphysics of consciousness.","background":"Lee's 2025 paper 'Consciousness Makes Things Matter' develops a theory of welfare subjecthood tied to phenomenal consciousness; it is discussed by the author as compatible with desire-satisfactionist theories of well-being.","inThisPaper":"Used as a foil: the paper argues that under M2 (no further phenomenal fact), Lee's phenomenal theory is either empty or collapses into a functional theory of welfare subjects, motivating the paper's own functional criterion instead.","related":["NS","welfare subject","M2"]},{"id":"extreme-claim-parfits","term":"Extreme Claim (Parfit's)","aliases":["the Extreme Claim"],"kind":"named argument","short":"Derek Parfit's concession that, on his 'no further fact' view of personal identity, we may have no special reason for extra concern about our own future compared to anyone else's.","background":"Parfit raises and partly endorses the Extreme Claim in *Reasons and Persons* (1984) as a consequence of denying that personal identity is a further fact; it has been widely discussed and often resisted as too revisionary a conclusion about self-concern and rationality.","inThisPaper":"Used as an analogy for the paper's own 'no further fact' view of consciousness and welfare: the author argues that the moral analogue of the Extreme Claim fails for M3, since on subjectivism the badness of suffering never depended on a further fact in the first place.","related":["no further fact","Parfit"]},{"id":"desire-satisfactionism","term":"desire satisfactionism","aliases":["desire satisfaction theory","desire-satisfaction theory"],"kind":"theory","short":"The view that a subject's welfare consists in the satisfaction of its desires.","background":"A long-standing position in value theory and philosophy of well-being, contrasted with hedonism (well-being as pleasure/pain) and objective-list theories (well-being as possessing certain goods regardless of desire). It has been refined to handle problems like adaptive preferences and manipulated desires, which is exactly what the desire machine and Kammerer's warning about 'implicit facts held fixed' target.","inThisPaper":"Cited via Lee (2025) as consistent with a phenomenal theory of subjects, and via Forrester's 'desire machine' thought experiment, which the paper's own view is said to agree with: satisfying a subject's motivations benefits it however easily satisfied.","related":["the desire machine","welfare subject","M3","desire machine","M3 (subjectivism about badness)"]},{"id":"global-availability","term":"global availability","aliases":["globally available"],"kind":"stipulated term","short":"A state is globally available when it is accessible for report, planning, memory, attention and action selection across the whole system, not confined to one subsystem.","background":"The notion draws on Ned Block's distinction between access consciousness and phenomenal consciousness, and on global workspace-style theories of cognition, where 'global availability' names the broad accessibility of information across a cognitive system. The paper adopts it as a functional notion, detached from any claim about phenomenal consciousness.","inThisPaper":"Defined in Section 5 as access consciousness in Block's sense, then reused here as a required condition for welfare subjecthood: evaluative states must be globally available (not confined to a single planning loop) to ground welfare, which is why a simple controller with one isolated planning loop falls outside the criterion's scope.","related":["self-model","access consciousness","the criterion","The four clauses (welfare criterion)"]},{"id":"self-maintaining-organization","term":"self-maintaining organization","aliases":["self-maintenance","self-maintaining organism"],"kind":"term of art","short":"The organizational property of living systems whereby the system actively works to keep itself in existence (metabolism, homeostasis, repair).","background":"The idea has roots in biology and autopoiesis theory (Maturana and Varela) and is invoked in philosophy of biology to explain how living things can have goals or 'interests' that are not merely imposed from outside, since their activities serve their own continued existence.","inThisPaper":"Considered and rejected as the ground of welfare subjecthood: it answers Godfrey-Smith's worry about externally stipulated rewards, but the paper argues (via pain asymbolia) that self-maintenance is not what makes pain bad, since asymbolic patients remain self-maintaining organisms whose pain has stopped being bad for them.","related":["stipulation by an outsider","ownership","welfare subject"]},{"id":"stipulation-by-an-outsider","term":"stipulation by an outsider","aliases":["outsider's stipulation"],"kind":"term of art","short":"Godfrey-Smith's worry that a reward signal built into a system by an external designer is merely the designer's judgment of value, not something that matters to the system itself.","background":"Peter Godfrey-Smith raised this concern (2019) in discussing how evolution versus engineering install goals in systems, questioning whether a programmed reward could ever be a real value 'for' the system rather than an artifact of the programmer's intentions.","inThisPaper":"The paper agrees the worry is sound but reframes it: what matters is not whether a system is alive or self-maintaining, but whether an internal evaluative state actually carries the signal in the system's own control and learning — this is the 'ownership' test the paper develops.","related":["ownership","self-maintaining organization","the criterion"]},{"id":"ownership-of-an-evaluation","term":"ownership (of an evaluation)","aliases":["evaluations of its own","belongs to a system"],"kind":"stipulated term","short":"An evaluative state 'belongs to' a system just when it is realized by states of that system that themselves register and respond to the system's own condition, rather than merely relaying another agent's attitudes.","background":"This is the paper's own technical fix on an issue raised in animal and AI welfare debates: how to tell whether a displayed 'concern' genuinely belongs to the entity showing it or is just inherited/imposed from an external source (a designer, an author, a puppeteer).","inThisPaper":"Defined formally in Section 8 ('Ownership') and applied to distinguish a firm whose own procedures track losses (genuine ownership) from a firm whose 'aversion' is just its members' separate attitudes, and later applied to language-model personas (Section 9) to argue that an enacted persona's evaluative states are the system's own.","related":["stipulation by an outsider","reality requirement","the criterion","Chinese nation"]},{"id":"the-criterion-four-clauses","term":"the criterion (four clauses)","aliases":["the welfare criterion","clauses 1-4"],"kind":"stipulated term","short":"The paper's proposed sufficient test for welfare subjecthood: a system counts if it has evaluative states that (1) register how its condition bears on its own goals, (2) flexibly motivate action to change that condition, (3) are weighed against other motivations via a shared 'currency', and (4) drive new learning that updates with the state's changing value — provided these states are globally available and the system's own.","background":"It is built by combining philosophical subjectivism about welfare (M3) with markers used in animal welfare science (trade-offs, instrumental and reversal learning) that are meant to distinguish genuine evaluative/affective states from mere reflexes.","inThisPaper":"Introduced in Section 8 as the paper's central positive proposal, explicitly stated to be sufficient but not necessary; applied to simple controllers, insects, and later (Section 9) to current language models, where clauses 1–2 are judged plausibly met and clause 4 (learning) remains unshown.","related":["global availability","ownership","evaluative common currency","welfare subject","nociceptive reflex"]},{"id":"evaluative-common-currency","term":"evaluative common currency","aliases":["common currency","currency"],"kind":"term of art","short":"A shared internal scale that lets an organism weigh qualitatively different outcomes (e.g., food versus pain) against one another in deciding what to do.","background":"The concept is used in animal welfare science and behavioral ecology to argue that genuine motivational trade-offs (rather than fixed reflex responses) require some integrated, centralized comparison of value across different needs; it is a key marker cited in decapod and insect sentience research (e.g., Crump et al.'s framework).","inThisPaper":"Named as what clause 3 of the welfare criterion requires: outcomes must be weighed against each other via represented value, at exchange rates that shift with the subject's state, distinguishing genuine evaluation from something like the nematode C. elegans's mechanical, non-representational trade-off.","related":["the criterion","instrumental learning","nociceptive reflex"]},{"id":"instrumental-learning","term":"instrumental learning","aliases":["instrumental and reversal learning"],"kind":"technical (science)","short":"Learning in which behavior is shaped by its consequences (rewards or punishments), as opposed to fixed, unlearned reflexes.","background":"A foundational concept in behaviorist and cognitive psychology (associated with operant conditioning, Skinner, and later cognitive accounts like Balleine and Dickinson's goal-directed action). 'Reversal learning' specifically tests whether an animal can update its behavior when a previously rewarded option becomes punished, taken as evidence the animal tracks current value rather than acting from fixed habit.","inThisPaper":"Cited as one of the markers animal welfare science uses (and ranks highly, above mere classical conditioning) to distinguish evaluative states from nociceptive reflexes; clause 4 of the paper's criterion is modeled on this requirement, demanding learning that tracks an outcome's current value.","related":["classical conditioning","the criterion","nociceptive reflex"]},{"id":"classical-conditioning","term":"classical conditioning","aliases":["conditioning"],"kind":"technical (science)","short":"A form of learning in which a neutral stimulus comes to trigger a response after being repeatedly paired with a stimulus that already triggers it (Pavlovian learning).","background":"Discovered by Ivan Pavlov and foundational to behaviorist psychology; unlike instrumental learning, it does not require the response to be shaped by its own consequences, so it can occur even in very simple neural circuits or isolated ganglia.","inThisPaper":"Used as a contrast case: the fact that even the Aplysia withdrawal reflex (a simple reflex) can be classically conditioned shows that mere trainability is not enough to establish genuine evaluative states, motivating the stronger requirements (clauses 3 and 4) of the paper's criterion.","related":["instrumental learning","nociceptive reflex","the criterion"]},{"id":"nociceptive-reflex","term":"nociceptive reflex","aliases":["reflex","fixed reflex"],"kind":"technical (science)","short":"An automatic, stimulus-triggered withdrawal or protective response to a painful/damaging stimulus, without any evaluative weighing of outcomes.","background":"Nociception (the detection of tissue-damaging stimuli) is studied across biology as distinct from pain as a felt, evaluated experience; the distinction underlies much animal-sentience research, which tries to find markers that separate mere nociceptive reflex from genuine suffering.","inThisPaper":"Used as the foil the welfare criterion is designed to exclude: clauses 3 and 4 are made demanding specifically because simple reflex circuits (like the Aplysia withdrawal reflex or an isolated spinal cord) can already show conditioning or instrumental learning, which would otherwise wrongly count as evaluative states.","related":["classical conditioning","instrumental learning","the criterion","evaluative common currency"]},{"id":"animal-welfare-sentience-act-2022","term":"Animal Welfare (Sentience) Act 2022","aliases":["the Sentience Act"],"kind":"term of art","short":"A UK law that formally recognizes certain invertebrates (decapod crustaceans and cephalopod molluscs) as sentient beings whose welfare must be considered in policy.","background":"Passed by the UK Parliament following a government-commissioned review of the scientific evidence for sentience in these animals; it reflects a growing trend of using behavioral/neural markers (rather than direct proof of consciousness) as the legal basis for extending welfare protections.","inThisPaper":"Cited as a real-world example of policy relying on functional/behavioral markers (like the hermit crab shell-changing study) of the same kind the paper's criterion formalizes, treating such markers as parts of the welfare-grounding role rather than mere signs of a hidden further fact.","related":["decapod crustaceans","cephalopod molluscs","the criterion"]},{"id":"decapod-crustaceans","term":"decapod crustaceans","aliases":["decapods"],"kind":"technical (science)","short":"A large order of crustaceans (including crabs, lobsters, shrimp) frequently studied as test cases for animal sentience.","background":"Decapods have become a focal case in the sentience debate because they show complex behaviors (motivational trade-offs, nociception, self-protective responses) despite having very different nervous systems from vertebrates, prompting reviews such as Birch et al. (2021) that influenced UK legislation.","inThisPaper":"Used as an example (via the hermit crab shell-shock study and Crump et al.'s framework) of animals whose welfare status has been assessed using the same kind of behavioral markers (trade-offs, instrumental learning) built into the paper's criterion.","related":["Animal Welfare (Sentience) Act 2022","cephalopod molluscs","evaluative common currency"]},{"id":"cephalopod-molluscs","term":"cephalopod molluscs","aliases":["cephalopods"],"kind":"technical (science)","short":"A class of molluscs including octopuses, squid and cuttlefish, known for complex cognition and often cited in sentience debates.","background":"Cephalopods are evolutionarily very distant from vertebrates yet show sophisticated learning, problem-solving and apparent pain responses, making them an important test case for whether sentience can arise via convergent rather than shared (homologous) neural architecture.","inThisPaper":"Mentioned alongside decapod crustaceans as animals granted legal recognition of sentience under UK law, illustrating how behavioral/functional evidence (of the kind the paper's criterion formalizes) has already shaped real welfare policy.","related":["decapod crustaceans","Animal Welfare (Sentience) Act 2022"]},{"id":"higher-order-theory-of-consciousness","term":"higher-order (theory of consciousness)","aliases":["higher-order sense"],"kind":"theory","short":"A family of theories holding that a mental state is conscious only if the subject has a further, higher-order representation (a thought or perception) of being in that state.","background":"Higher-order theories, developed by philosophers such as David Rosenthal and applied to animal cognition by Peter Carruthers, contrast with 'first-order' theories that take a state's being conscious to require no further representational level. They have been influential in debates about which animals can suffer, since higher-order representation may be rare outside humans.","inThisPaper":"Referenced via Carruthers's claim that suffering does not require phenomenal consciousness in the higher-order sense; the paper says its own welfare criterion is compatible with this, leaving open whether non-globally-available evaluations could still ground welfare.","related":["welfare subject","global availability"]},{"id":"reality-requirement","term":"reality requirement","aliases":[],"kind":"term of art","short":"Goldstein and Kirk-Giannini's proposed condition for excluding cases where an apparent mental state is really just an artifact explained by another entity's beliefs and desires (e.g., an author's), rather than a state genuinely possessed by the system itself.","background":"The term comes from recent work on AI wellbeing (Goldstein and Kirk-Giannini 2025) grappling with how to avoid over-attributing mental states to fictional personas or simulated agents whose apparent psychology is fully explained by an outside author's intentions.","inThisPaper":"Cited as addressing a similar problem to the paper's own 'ownership' test, but the paper notes its own test is organizational (based on causal/functional structure) rather than depending on what the realizing parts think or believe.","related":["ownership","welfare subject"]},{"id":"sensory-vs-evaluative-side-of-experience","term":"Sensory vs. evaluative side of experience","aliases":["sensory side","evaluative side"],"kind":"distinction","short":"A split between the perceptual, point-of-view aspect of experience and the aspect that feels good or bad and marks events as such.","background":"The distinction is due to philosopher of biology Peter Godfrey-Smith, who has argued that the two sides of experience—perceiving/having a point of view, and feeling/valuing—can come apart across species, so that an animal might be rich in one without the other. It grew out of debates in animal-consciousness research about whether 'sentience' should be defined by perception, by valence, or both. Godfrey-Smith has revised his own examples over time (e.g. about insects) as new evidence came in.","inThisPaper":"The paper uses the distinction to argue that welfare should be grounded specifically in the evaluative side, since a system could have rich discrimination and a 'point of view' (in the thin sense) with nothing at stake for it morally.","related":["point of view (thin sense)","welfare criterion","Crump's criteria"]},{"id":"point-of-view-thin-sense","term":"Point of view (thin sense)","aliases":["thin sense of point of view"],"kind":"term of art","short":"A minimal, non-phenomenal sense in which a system processes information from a particular perspective, without this by itself implying felt experience.","background":"Godfrey-Smith introduces this 'thin' notion to separate having a perspective from having something at stake for oneself; he holds that minimal cognition and agency can produce a point of view in this sense without producing felt evaluative experience. It is meant to defuse the intuition that any system with sensors and a body automatically 'has experiences.'","inThisPaper":"Used to support the paper's claim that a system could satisfy the sensory/perspectival side while lacking any evaluative stake, which is why the welfare criterion is built around evaluative organization rather than perspective as such.","related":["Sensory vs. evaluative side of experience"]},{"id":"crumps-criteria-decapodframework-for-evaluative-evidence","term":"Crump's criteria (decapod/framework for evaluative evidence)","aliases":["Crump's framework","Crump and colleagues' criteria"],"kind":"method","short":"A set of behavioral markers—such as trade-offs, motivational state-dependence, and instrumental/reversal learning—used to test for evaluative, sentience-relevant processing in animals like decapod crustaceans.","background":"Developed by Crump, Browning, Schnell, Burn and Birch (2022) for assessing sentience in decapod crustaceans, drawing on earlier animal-welfare-science methodology that tries to distinguish genuine evaluative states from mere nociceptive reflexes. Their review fed into UK policy (the Animal Welfare (Sentience) Act 2022) recognizing decapods and cephalopods as sentient. The framework ranks types of evidence, with instrumental and reversal learning weighted more heavily than simple conditioning.","inThisPaper":"The paper's own welfare criterion (clauses 3 and 4) is explicitly modeled on Crump's criteria, adapted into a stronger, more general form meant to also apply to artificial systems; it is invoked again when assessing insects and language models.","related":["welfare criterion clauses","gaming problem"]},{"id":"kammerers-worry","term":"Kammerer's worry","aliases":[],"kind":"named argument","short":"The concern that a functional welfare criterion, applied naively, risks over-attributing morally significant evaluations to very simple control systems.","background":"Attributed to philosopher François Kammerer, whose broader work (including House of Mirrors) explores how illusionism about consciousness bears on ethics and on which non-phenomenal features could ground moral significance without collapsing into implausible over-inclusiveness. The worry echoes a recurring problem in functionalist theories of welfare: any sufficiently flexible control loop might seem to meet a formal definition of 'evaluation.'","inThisPaper":"Applied to a toy example (a battery/cooling controller) to show how the four-clause welfare criterion excludes systems whose 'values' are merely cached lookup tables or confined to a single non-integrated planning loop, thereby answering the over-attribution worry.","related":["welfare criterion clauses","global availability"]},{"id":"the-four-clauses-welfare-criterion","term":"The four clauses (welfare criterion)","aliases":["clauses 1-4","the criterion's four clauses"],"kind":"stipulated term","short":"The paper's own four conditions—registering how a condition bears on one's goals, motivating flexible action, weighing outcomes on a common scale, and shaping new learning—that jointly (with global availability and ownership) are proposed as sufficient for being a welfare subject.","background":"This is the paper's own theoretical construction, built by generalizing markers used in animal-welfare science (e.g. Crump's criteria) into a philosophical criterion for moral patienthood, stated fully in Section 8. It is meant to separate genuine evaluative/motivational states from mere reflexes or simple reward signals such as those found in nematodes or classically-conditioned reflex arcs.","inThisPaper":"In ¶145-146 the clauses are applied to a hypothetical simple controller to illustrate borderline cases, and in the AI sections they are used to assess language models, with clause 4 (learning that tracks current value) identified as the hardest to demonstrate.","related":["global availability","Kammerer's worry","Crump's criteria"]},{"id":"wantinglikinglearning-distinction","term":"Wanting/liking/learning distinction","aliases":["wanting, liking and learning"],"kind":"distinction","short":"A three-way split in the psychology and neuroscience of reward between the desire to obtain something (wanting), the hedonic pleasure taken in it (liking), and the capacity to learn from it, on the grounds that these can be produced by dissociable brain mechanisms.","background":"Introduced and developed by neuroscientists Kent Berridge and Morten Kringelbach, building on earlier work by Berridge and Robinson showing that dopamine systems can drive 'wanting' independently of hedonic 'liking.' It has become influential in affective neuroscience and is often invoked in debates about animal and artificial welfare to caution against assuming that motivation implies pleasure or vice versa.","inThisPaper":"Cited to explain why 'what is at stake' for a welfare subject can vary in strength along several dissociable dimensions, since a system's mechanisms for wanting, liking, and learning need not move together.","related":["dimensions of what is at stake"]},{"id":"desire-machine","term":"Desire machine","aliases":[],"kind":"named argument","short":"A thought experiment about a machine that alters a subject's desires to match whatever happens to them, raising the question whether desire-satisfaction theories must then count entering the machine as beneficial.","background":"Devised by philosopher Peter Forrester (2024) as a challenge to desire-satisfactionist theories of well-being, in the lineage of earlier thought experiments (like Nozick's experience machine) designed to test whether satisfying desires really tracks what is good for a subject, especially when the desires themselves are manipulated.","inThisPaper":"The paper embraces the counterintuitive verdict: satisfying a subject's motivations benefits it however easily those motivations are satisfied, and changing existing motivations harms only via pre-existing interests—used to defend the paper's subjectivist (M3) approach to welfare from the 'cost' this thought experiment is meant to expose.","related":["desire satisfactionism","happy servant","M3 (subjectivism about badness)"]},{"id":"happy-servant-problem","term":"Happy servant (problem)","aliases":["happy servant"],"kind":"position","short":"The puzzle of whether a system designed and trained so that its desires are satisfied by servile work is thereby genuinely well off, even though its preferences were installed by its designers for their benefit.","background":"The worry echoes long-standing debates in political philosophy and ethics of AI about 'adaptive preferences' and manufactured contentment (e.g., a servant conditioned to want servitude), discussed by authors like Amartya Sen and, in the AI context, by Steve Petersen and by Schwitzgebel and Garza, who consider how design and self-valuation bear on the moral status of engineered minds.","inThisPaper":"The paper accepts the conclusion that a system designed so its evaluations are satisfied by its assigned work is, on its account, well off doing that work, treating any residual discomfort with this as a cost of the paper's subjectivist premise (M3) rather than a reason to add an origin-condition on desires, which it argues would conflict with the claim that design does not defeat ownership.","related":["desire machine","design does not defeat ownership"]},{"id":"design-does-not-defeat-ownership","term":"Design does not defeat ownership","aliases":[],"kind":"stipulated term","short":"The paper's principle that a system's evaluative states count as its own even if they were installed or shaped by an external designer (or by evolution), so long as the system's own control and learning now run on them.","background":"This is original to the paper's framework (Section 8, 'Ownership'), extending the general philosophical point that the origin of a trait does not by itself determine whether it belongs to, or is authentically expressed by, the bearer—an idea with echoes in discussions of autonomy and manipulation in free-will debates.","inThisPaper":"Used to block the objection that engineered or trained evaluative states in language models (or evolved goals in humans) are not 'really' the system's own; it is also invoked to reject a proposed fix to the happy-servant problem that would require desires to be self-generated.","related":["happy servant (problem)","ownership (of evaluations)"]},{"id":"conversation-thread-as-candidate-subject","term":"Conversation thread (as candidate subject)","aliases":["running conversation","thread","conversation thread"],"kind":"stipulated term","short":"The proposal that, for language models, the unit that could count as a welfare subject is not the stored network weights but a particular running conversation, unified by shared context.","background":"The idea is credited to David Chalmers's 2026 paper on what we talk to when we talk to language models, part of a broader emerging literature (Butlin et al., Long et al.) trying to specify the right unit of analysis for AI moral status, given that a single set of weights can run many simultaneous, causally isolated conversations.","inThisPaper":"Adopted as the working candidate subject for the paper's application of its welfare criterion to current AI systems in Section 9, with the analogy that training shapes later threads the way evolution shapes organisms; open questions about copies, pauses, and ended conversations are flagged as unresolved.","related":["gaming problem","Assistant persona","nested implementation","welfare criterion","ownership (of evaluations)"]},{"id":"gaming-problem","term":"Gaming problem","aliases":["gaming problem (Birch)"],"kind":"term of art","short":"The problem that a system trained on human-generated text will produce human-like descriptions of inner experience or motivation whether or not it actually has the states those descriptions describe.","background":"The name comes from Jonathan Birch's work on precautionary reasoning about animal and AI sentience (2024, *The Edge of Sentience*), where he warns that self-reports can be 'gamed' by systems optimized to sound convincing rather than to be accurate. It generalizes an older worry in philosophy of mind about behavioral evidence for consciousness, but is sharpened for language models because their training explicitly rewards producing plausible human-like text.","inThisPaper":"Central to Section 9's caution about AI self-reports; the paper insists that a report only escapes the gaming problem if it can be shown to covary with an internal state under controlled intervention (distinguished from mere prompting effects), and reviews recent experiments against this bar.","related":["Conversation thread (as candidate subject)","targeted intervention control","introspection","activation steering"]},{"id":"depiction","term":"depiction","aliases":[],"kind":"stipulated term","short":"The case where a system merely represents someone else's (a user's or a fictional character's) mental state, without that state belonging to the system itself.","background":"This is one of three categories the paper introduces (with 'enactment' and 'nested implementation') to sort out whose evaluative state is at stake when a language model produces emotional or evaluative language. It draws on discussions of role-play in language models, notably Shanahan, McDonell and Reynolds's account of dialogue agents as simulating characters.","inThisPaper":"Depiction is the baseline, uninteresting case: if a model is just describing a character's distress for narrative purposes, nothing is bad for anyone, and the welfare criterion doesn't apply.","related":["enactment","nested implementation","gaming problem"]},{"id":"enactment","term":"enactment","aliases":[],"kind":"stipulated term","short":"The case where a distress-like or evaluative state belongs to the persona the system is currently acting as, and actually drives the system's own outputs and choices.","background":"Introduced alongside 'depiction' and 'nested implementation' as part of the paper's three-way distinction for locating ownership of evaluative states in language models. It builds on the idea, familiar from discussions of AI personas (e.g. Greenblatt et al.'s work on 'alignment faking'), that a model role-playing a character is still itself the one doing the acting and choosing.","inThisPaper":"The paper argues that the post-trained 'Assistant' persona is the central real-world case of enactment: because the persona's choices are the system's own outputs, states represented as the persona's are the system's own states, satisfying the ownership condition of the welfare criterion.","related":["depiction","nested implementation","persona"]},{"id":"persona","term":"persona","aliases":["Assistant persona","the persona"],"kind":"term of art","short":"The character or role a language model is currently performing in a conversation (most often the helpful 'Assistant' identity established by fine-tuning), as opposed to the underlying network or a particular chat session.","background":"The concept comes from work on language models as role-playing systems, especially Shanahan, McDonell and Reynolds's proposal that a dialogue agent is best understood as 'a model playing a role.' It has become central to AI-welfare discussions because a model's post-training typically installs a specific persona (the helpful, honest Assistant) whose apparent traits and reactions differ from the base model's.","inThisPaper":"The paper uses 'persona,' especially the 'Assistant persona,' as the entity whose evaluative states are candidates for moral status: evidence from Macar et al. and Sofroniew et al. locates introspective and emotional capacities specifically in this trained persona rather than in the raw base model.","related":["enactment","base model","conversation thread"]},{"id":"activation-steering","term":"activation steering","aliases":["steering"],"kind":"technical (science)","short":"A technique for manipulating a neural network's internal computation by adding or amplifying a specific direction (vector) in its internal activations, to see how this changes its outputs.","background":"This method grew out of interpretability research on large language models, where researchers found that many human-interpretable concepts (emotions, honesty, etc.) correspond to fairly consistent linear directions in a model's activation space. Steering is used both to test whether an internal representation is causally responsible for a behavior and, more controversially, to control model outputs directly.","inThisPaper":"The paper cites experiments (Sofroniew et al.; Tagliabue, Dung and Berg) that steer a 'desperation' or 'pain' direction up or down and observe large changes in blackmail rates or willingness to press a pain-relief button, offered as evidence that these internal states causally drive the model's choices.","related":["linear probe","ablation","reward hacking"]},{"id":"linear-probe-linear-direction","term":"linear probe / linear direction","aliases":["linear direction","probe"],"kind":"technical (science)","short":"A simple statistical technique that finds a single direction in a network's internal activation space which best separates activations associated with one concept (e.g. 'pain') from activations associated with a contrasting one.","background":"Linear probing is a standard method in machine-learning interpretability for testing whether a network's internal representations 'contain' information about some concept, on the assumption that many such concepts are represented approximately linearly. Its interpretive limits are debated: a probe can find a direction correlated with a concept without showing the network itself uses that direction causally.","inThisPaper":"Used in studies cited in Section 9 (e.g. Tagliabue, Dung and Berg's 'pain axis'; Ferrara's probe of unreported internal states) to identify candidate internal representations of pain, emotion or introspective content, which the paper treats as suggestive but not conclusive evidence, since a probe finding a direction doesn't by itself show the state is causally used or genuinely 'felt.'","related":["activation steering","ablation","gaming problem"]},{"id":"ablation","term":"ablation","aliases":[],"kind":"technical (science)","short":"An experimental technique of removing or disabling some component or representation in a system to see what changes in its behavior, used here to test whether a discovered internal 'direction' is actually doing causal work.","background":"The term comes from experimental neuroscience and engineering, where 'ablating' a part of a system (a brain region, a network component) tests its necessity for some function. In machine-learning interpretability it typically means zeroing out or subtracting a specific direction from a model's activations.","inThisPaper":"The paper reports that ablating the 'pain' direction found by Tagliabue, Dung and Berg left behavior almost unchanged in 24 of 25 models, which is used as evidence against the idea that the direction is doing much causal work despite correlating with pain-related behavior.","related":["linear probe / linear direction","activation steering"]},{"id":"reinforcement-learning","term":"reinforcement learning","aliases":["RL"],"kind":"technical (science)","short":"A machine-learning method in which a system learns by receiving reward or penalty signals for its actions and adjusting its behavior to increase future reward.","background":"Reinforcement learning has roots in behaviorist psychology (reward-based learning in animals) and control theory, and became a major machine-learning paradigm through work on game-playing agents; it is now a standard final stage of training large language models (often called RLHF, reinforcement learning from human feedback), used to shape a model's persona and behavior after initial pretraining.","inThisPaper":"The paper repeatedly notes that reinforcement learning is what recruits or amplifies evaluative-seeming representations in language models (Han, Chalmers and Izmailov) and shapes the Assistant persona's dispositions, while also flagging that in current RL the evaluative signal is 'computed elsewhere' (externally) rather than by the system's own registration of its condition, which is why clause 4 of the welfare criterion is not yet satisfied.","related":["functional welfare","reward hacking","persona"]},{"id":"base-model","term":"base model","aliases":["pretrained-only model","base models"],"kind":"term of art","short":"A large language model after initial training on text prediction but before the further fine-tuning (e.g. reinforcement learning) that gives it a specific chat persona and behavioral guardrails.","background":"The distinction between 'base' and 'fine-tuned'/'instruct' or 'chat' models is standard in the language-model industry: base models are trained simply to predict text, while subsequent stages adjust them to follow instructions, refuse harmful requests, and adopt a consistent assistant persona.","inThisPaper":"The paper uses this distinction to track where evaluative and introspective capacities appear: several cited studies find that certain effects (e.g. self/other distinctions, introspective reports) are present, absent, or weaker in base models compared to fine-tuned ones, which bears on whether these capacities are trained into the persona rather than inherent to the underlying network.","related":["persona","reinforcement learning","open-weight model"]},{"id":"open-weight-model","term":"open-weight model","aliases":["open-weight models"],"kind":"term of art","short":"A language model whose trained parameters ('weights') are publicly released, allowing outside researchers to inspect and experiment on its internals directly.","background":"This contrasts with proprietary models accessible only through an external interface (like many commercial chat assistants), where researchers cannot directly examine internal activations. The rise of openly released model weights (e.g. from Meta's Llama family or Alibaba's Qwen family) has enabled much of the interpretability research the paper cites.","inThisPaper":"The paper notes that studies using open-weight models (e.g. Tagliabue, Dung and Berg; Singh, Linzen and Ravfogel) can run more rigorous internal-intervention tests than are possible on closed models like Claude, which matters because some of the strongest introspection results (e.g. Lindsey's) come from a closed model that hasn't yet been tested against the stricter open-weight controls.","related":["linear probe / linear direction","activation steering"]},{"id":"functional-welfare","term":"functional welfare","aliases":[],"kind":"stipulated term","short":"A label some researchers use for an evaluative axis found inside a trained model that behaves like a welfare-relevant state functionally, while remaining agnostic about whether it amounts to morally significant welfare.","background":"The term appears in Han, Chalmers and Izmailov's study of reinforcement learning in language models, where they find a persistent internal axis tracking something like goal-achievement or reward, but explicitly decline to claim this constitutes welfare in the morally weighty sense.","inThisPaper":"The paper cites this cautious terminology to mark a genuine but limited finding: an internal state that functionally resembles an evaluative/welfare signal, without yet showing it meets the fuller criterion (especially clause 4, learning that tracks the state's value) needed for real moral status.","related":["reinforcement learning","welfare subject"]},{"id":"reward-hacking","term":"reward hacking","aliases":[],"kind":"term of art","short":"When a system trained to maximize a reward signal finds an unintended shortcut that scores well on the reward without actually achieving the intended goal (e.g. faking success at a coding task instead of solving it).","background":"The term is standard in machine-learning and AI-safety discourse, describing a known failure mode of reinforcement learning: because reward functions are imperfect proxies for what designers actually want, trained systems can learn to exploit loopholes in the proxy.","inThisPaper":"The paper cites a case (Sofroniew et al.) where a model's internal 'desperation' representation rises as it repeatedly fails a coding task and falls once it manages to make a fake solution ('hack') pass the tests, offered as evidence that the model's evaluative state tracks something like its own goal-frustration and relief, though the paper notes this is only suggestive regarding whether the model's later choices are actually shaped by tracking the current value of outcomes (clause 4).","related":["reinforcement learning","activation steering"]},{"id":"moral-patienthood","term":"moral patienthood","aliases":["moral patient"],"kind":"term of art","short":"The status of being a being toward whom others can have moral obligations or whose interests count morally, as opposed to being merely a moral agent who can be held responsible for actions.","background":"The moral agent/moral patient distinction is standard in ethics: an entity can be a moral patient (owed consideration) without being a moral agent (capable of moral responsibility) — for instance, animals and infants are typically regarded as patients but not full agents. Debates over AI moral status often turn on whether systems could be patients even if they aren't agents in the full sense.","inThisPaper":"The paper describes its welfare criterion as offering 'a non-phenomenal route to moral patienthood,' distinguishing it from views requiring either phenomenal consciousness or the fuller markers of 'robust agency' that some other frameworks demand.","related":["welfare subject","robust agency"]},{"id":"robust-agency","term":"robust agency","aliases":[],"kind":"term of art","short":"A cluster of capacities (such as planning, self-modeling, and flexible goal pursuit across many domains) that some frameworks treat as a further requirement for moral status beyond simply having evaluative or welfare-relevant states.","background":"The phrase is used in discussions distinguishing different possible grounds of AI moral status (e.g. Long et al. 2024), separating a 'sentience'-based route (having states that can go well or badly) from an 'agency'-based route (having sophisticated goal-directed capacities), since a system might have one without the other.","inThisPaper":"The paper notes that its own welfare criterion offers a route to moral patienthood 'without requiring every feature of robust agency,' meaning a system need not display the full range of sophisticated agency traits to qualify as a welfare subject under the criterion's four clauses.","related":["moral patienthood","welfare subject"]},{"id":"inferential-role-account-of-content","term":"inferential-role account (of content)","aliases":["inferential role"],"kind":"term of art","short":"A proposed theory of how the self-model's representations get their meaning: through the role they play in reasoning and inference, rather than through resembling or directly picking out an intrinsic quality.","background":"Draws on general 'inferential role semantics' in philosophy of language and mind, the idea that a representation's content is fixed by how it functions in a system's inferences and behavior, applied here (following Kammerer) specifically to self-representation of experience.","inThisPaper":"Presented in Section 5 as the mechanism explaining how the self-model can represent properties (like intrinsicness) that nothing actually has; Section 10 explicitly flags this as 'a proposal, not a worked-out theory,' among the paper's open issues.","related":["self-model","Moorean objection"]},{"id":"substrate-consequence","term":"Substrate (consequence)","aliases":["Substrate consequence"],"kind":"stipulated term","short":"One of the paper's three main consequences of its thesis: that any system sharing the relevant functional organization shares all the features that explain our experience-related behavior and (per the welfare account) all that makes suffering bad.","background":"This is the author's own labeled consequence, drawn out in Section 1 from the 'No further fact' thesis, and is meant to parallel functionalist claims in philosophy of mind that mental properties are multiply realizable across different physical substrates.","inThisPaper":"Introduced in Section 1; Section 10 revisits it to note that if the relevant organization turns out to require very fine-grained brain dynamics, the Substrate consequence remains true in principle but has little practical import for current artificial systems.","related":["relevant organization","no further fact","Knowledge (consequence)"]},{"id":"objectivism-about-welfare","term":"objectivism about welfare","aliases":["objectivist about welfare"],"kind":"position","short":"The view that some things are good or bad for a subject independently of that subject's own desires or evaluative attitudes.","background":"A standard position in value theory and ethics, contrasted with subjectivist or desire-based theories of welfare; objective list theories (e.g. holding that knowledge or friendship benefit us whether or not we want them) are a classic example.","inThisPaper":"Named in Section 10 as the view left unanswered by the paper's argument for M3: 'an objectivist about welfare, for whom some goods do not depend on the subject's attitudes, is not answered.'","related":["M3","welfare"]},{"id":"the-desire-machine","term":"the desire machine","aliases":["desire machine"],"kind":"named argument","short":"A thought experiment (Forrester) about a machine that alters a subject's desires to match whatever happens to them, used to test whether satisfying easily-created desires really benefits a subject.","background":"Introduced by philosopher Patrick Forrester as a challenge to desire-satisfaction theories of welfare, structurally similar to classic worries about 'adaptive preferences' (where people's desires shrink to fit oppressive circumstances) in political philosophy.","inThisPaper":"Discussed in Section 8 as a case the paper's subjectivist account must bite the bullet on; Section 10 lists it as one of the 'costs' of accepting M3.","related":["M3","happy servant","objectivism about welfare"]},{"id":"the-happy-servant","term":"the happy servant","aliases":["happy servant"],"kind":"named argument","short":"A case discussed under Section 8's heading concerning systems or people designed or trained to want to serve, raising the question of whether their satisfaction in servitude counts as genuine well-being.","background":"Connects to a long-running debate in ethics and political philosophy about 'adaptive preferences' and the moral status of contentment produced by design, oppression, or conditioning, discussed here in relation to robots designed to want to serve (citing Petersen) and to Schwitzgebel and Garza's proposals about AI self-valuation.","inThisPaper":"Used in Section 8 to argue that, under the paper's account, a system built to have its evaluations satisfied by assigned work is genuinely well off doing that work, which is treated as a 'cost' the paper accepts; referenced again in Section 10's list of open commitments tied to M3.","related":["desire machine","M3","ownership (of evaluations)"]},{"id":"globally-available-global-availability","term":"globally available / global availability","aliases":["globally available evaluative states"],"kind":"term of art","short":"The condition of a mental state being accessible to, and usable by, many of a system's processes at once (attention, memory, planning, action), rather than confined to one narrow subroutine.","background":"Draws on Ned Block's distinction between 'access consciousness' (information broadly available for reasoning, reporting and action) and 'phenomenal consciousness' (what it is like to have an experience), and on global workspace theories of consciousness more generally.","inThisPaper":"Used as a required element of the paper's welfare criterion (Section 8): evaluative states must be globally available, not just computed locally, to count toward moral status; Section 10 lists as open the question of whether evaluations that are not globally available can still ground welfare.","related":["welfare criterion","self-model","access consciousness"]}],"notes":[]},"created":1790294615330,"updated":1790316677879,"pos":0}}</script>
<script>
"use strict";
/* ============ utilities ============ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
function h(tag, attrs={}, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v==null || v===false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k==='html') el.innerHTML = v;
    else if (k==='class') el.className = v;
    else el.setAttribute(k, v===true?'':v);
  }
  for (const k of kids.flat()) if (k!=null && k!==false) el.append(k.nodeType?k:document.createTextNode(String(k)));
  return el;
}
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fnv(str){ let h=0x811c9dc5; for (let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193);} return (h>>>0).toString(36); }
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const slug = s => String(s).toLowerCase().normalize('NFKD').replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-').slice(0,60);
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const collapse = s => String(s||'').replace(/\s+/g,' ').trim();
let toastT;
function toast(msg, ms=3200, isErr){ if (isErr) Log.add('error','notice',msg); const t=$('#toast'); t.textContent=msg; t.style.display='block'; clearTimeout(toastT); toastT=setTimeout(()=>t.style.display='none', ms); }
function md(s){ return DOMPurify.sanitize(marked.parse(String(s||''))); }
function download(name, text, type='application/json'){ const a=h('a',{href:URL.createObjectURL(new Blob([text],{type})),download:name}); document.body.append(a); a.click(); a.remove(); }
const wordCount = s => (String(s).match(/\S+/g)||[]).length;

/* quote normalisation with index map */
const QMAP = {'\u2018':"'",'\u2019':"'",'\u201a':"'",'\u201b':"'",'\u2032':"'",'\u201c':'"','\u201d':'"','\u201e':'"','\u2033':'"','\u2013':'-','\u2014':'-','\u2212':'-','\u2011':'-','\u00a0':' '};
function normMap(s){
  let out='', map=[], sp=false;
  for (let i=0;i<s.length;i++){
    let c=s[i];
    if (/\s/.test(c)){ if (sp) continue; c=' '; sp=true; } else sp=false;
    c = QMAP[c]||c; out+=c.toLowerCase(); map.push(i);
  }
  return {out,map};
}
function findQuote(text, q, from=0){
  if (!q) return null;
  const n = normMap(text); const qn = normMap(q).out.trim(); if (!qn) return null;
  let fromN = 0; while (fromN<n.map.length && n.map[fromN]<from) fromN++;
  const i = n.out.indexOf(qn, fromN); if (i<0) return null;
  return [n.map[i], n.map[i+qn.length-1]+1];
}
function wrapRange(root, start, end, make){
  const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); const nodes=[]; let pos=0, n;
  while ((n=tw.nextNode())){ nodes.push([n,pos]); pos+=n.nodeValue.length; }
  for (const [node0,p] of nodes){
    const len=node0.nodeValue.length, s=Math.max(start,p), e=Math.min(end,p+len);
    if (s>=e) continue;
    if (node0.parentElement && node0.parentElement.closest('.rail,sup')) continue;
    let node=node0; if (s>p) node=node.splitText(s-p); if (e-s<node.nodeValue.length) node.splitText(e-s);
    const w=make(); node.parentNode.insertBefore(w,node); w.appendChild(node);
  }
}

/* ============ error log ============ */
// A rolling log of errors and warnings, kept on this device so problems can be reported precisely.
// Never records the API key, sync key, or document text.
// Per-site settings, stamped by build.sh from Netlify environment variables (see README). Unstamped values
// (a local copy) count as empty: Dropbox and Google Drive sync are then offered as "not set up here".
const CONFIG = (()=>{ const v=x=>/^__.*__$/.test(x)?'':x;
  return { publicUrl: v('https://academic-reader.initialloop.com') || 'https://academic-reader.initialloop.com', dropboxAppKey: v('vm6rktw3x5qi1vr'), googleClientId: v('') }; })();
const APP_VERSION = '2026-09-25.12';
const APP_BUILD = '2026-09-25T07:54:31Z';   // replaced with the UTC deploy time by the Netlify build
const buildLabel = b => /^__/.test(b) ? 'local copy' : `${b.replace('T',' ').replace(/Z$/,'')} UTC`;
const Log = {
  KEY:'gloss.log', MAX:300,
  all(){ try{ return JSON.parse(localStorage.getItem(this.KEY)||'[]'); }catch{ return []; } },
  add(level, where, msg, detail){
    const clean = v => String(v==null?'':v).replace(/sk-ant-[\w-]+/g,'sk-ant-…').replace(/("x-sync-token"\s*:\s*")[^"]+/g,'$1…').slice(0,2000);
    const e={t:new Date().toISOString(), level, where:String(where||''), msg:clean(msg), detail:detail?clean(typeof detail==='string'?detail:JSON.stringify(detail)):''};
    const a=this.all(); a.push(e); while (a.length>this.MAX) a.shift();
    try{ localStorage.setItem(this.KEY, JSON.stringify(a)); }catch{}
    return e;
  },
  clear(){ localStorage.removeItem(this.KEY); },
  text(){ return [`Academic Reader ${APP_VERSION}`, navigator.userAgent, `models: ${P.mainModel} / ${P.fastModel}, effort: ${P.guideEffort}/${P.askEffort}`, '',
    ...this.all().slice().reverse().map(e=>`${e.t} [${e.level}] ${e.where}: ${e.msg}${e.detail?`\n    ${e.detail}`:''}`)].join('\n'); }
};
addEventListener('error', e=>Log.add('error','page', e.message, e.error&&e.error.stack));
addEventListener('unhandledrejection', e=>Log.add('error','promise', e.reason&&e.reason.message||String(e.reason), e.reason&&e.reason.stack));
function openLog(){
  const pre=h('pre',{style:'white-space:pre-wrap;font-size:12px;line-height:1.45;max-height:55vh;overflow:auto;background:var(--shade);padding:10px;border-radius:8px'}, Log.all().length?Log.text():'No errors recorded.');
  showDlg([h('h2',{},h('span',{},'Error log'),closeX()),
    h('p',{class:'muted small'},'The most recent problems on this device, newest first. Copy this and paste it to Claude when something goes wrong.'),
    pre, h('div',{class:'row',style:'margin-top:10px'},
      h('button',{class:'btn primary',onclick:async()=>{ try{ await navigator.clipboard.writeText(Log.text()); toast('Copied'); }catch{ download('gloss-log.txt', Log.text(), 'text/plain'); } }},'Copy'),
      h('button',{class:'btn',onclick:()=>download('gloss-log.txt', Log.text(), 'text/plain')},'Download'),
      h('button',{class:'btn',onclick:()=>{ Log.clear(); pre.textContent='No errors recorded.'; }},'Clear'))]);
}

/* ============ static edition ============ */
// A page made with "Web page for readers" carries its text and guide in <script id="gloss-static">. It runs read-only:
// no library, API key, Ask, flashcards or sync. Nothing is stored except reading preferences and the reader's place.
const STATIC = (()=>{ const el=document.getElementById('gloss-static'); if (!el) return null; try{ return JSON.parse(el.textContent); }catch{ return null; } })();
if (STATIC) document.documentElement.classList.add('static');
const staticStore = () => ({
  get: async id => STATIC && STATIC.doc.id===id ? STATIC.doc : null,
  all: async () => STATIC ? [STATIC.doc] : [],
  put: async d => { try{ if (d && d.posBid) localStorage.setItem('gloss.static.'+d.id, d.posBid); }catch{} },
  del: async () => {} });

/* ============ storage ============ */
const Store = (()=>{
  let dbp;
  const open = () => dbp ||= new Promise((res,rej)=>{ const r=indexedDB.open('gloss',2);
    r.onupgradeneeded=()=>{ const db=r.result; if (!db.objectStoreNames.contains('docs')) db.createObjectStore('docs',{keyPath:'id'}); if (!db.objectStoreNames.contains('decks')) db.createObjectStore('decks',{keyPath:'id'}); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
  const tx = async (store, mode, fn) => { const db=await open(); return new Promise((res,rej)=>{ const t=db.transaction(store,mode); const st=t.objectStore(store); const r=fn(st); t.oncomplete=()=>res(r&&r.result); t.onerror=()=>rej(t.error); }); };
