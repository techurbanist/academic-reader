<script id="gloss-static" type="application/json">{"schema":"gloss-static/1","exported":1790323746630,"app":"2026-09-25.12","intro":"","doc":{"id":"mug76u5dh4mw1","title":"No further fact: consciousness, functional organization and moral status","versions":[{"md":"# No further fact: consciousness, functional organization and moral status\n\nBrendan Barlow\n\n## Abstract\n\nThis paper defends an illusionist view of consciousness and draws out its consequences for moral status. The thesis is that consciousness involves no further fact: once a system's functional organization is fixed at the grain that makes a difference to the phenomena consciousness is invoked to explain, nothing further about whether or how it is conscious remains open. The main argument develops Chalmers's argument from coincidence against phenomenal properties that could vary while that organization stays fixed, and extends it, through an interventionist criterion for the relevant grain, to realizer theories including integrated information theory. The Moorean objection that we plainly have experience is answered with an account of the self-model whose representations make experience seem intrinsic, and it turns out to reduce to a claim of acquaintance. The moral argument adds an explicit premise, supported by the same coincidence reasoning: what makes a state bad for a subject consists in the subject's own evaluative stance toward it. With that premise, and clinical evidence that the badness of pain goes with its affective-motivational component, the paper states a sufficient criterion for welfare: globally available evaluative states that weigh represented outcomes, drive learning that tracks the value of outcomes, and belong to the system itself. Applied to evidence from 2025 and 2026, the criterion finds that current language models have evaluative states of the persona they enact and that these states are their own, but that learning and integration beyond a single conversation remain unshown.\n\n## 1. The thesis\n\nSuppose you built a system with the same functional organization as a human brain, down to whatever level of detail turns out to matter. Would it be conscious? Would its pains hurt?\n\nRealists about phenomenal consciousness give two kinds of answer. Chalmers thinks it would be conscious, by a law of nature he supports with the fading qualia argument (1995; 1996a, ch. 7), but holds that experience is still a further fact: a law links it to organization, and nothing in the organization itself makes it so. Realizer theorists, including proponents of integrated information theory (IIT) and biological naturalists, think it might not be conscious at all if it were built from different stuff. On both views a complete functional description of a system leaves something about its consciousness out.\n\nThis paper argues that nothing is left out: consciousness involves no *further fact*. The term is Parfit's. He argued that personal identity consists in physical and psychological continuity and involves no further fact beyond them (1984). Chalmers, by contrast, holds that facts about consciousness are further facts over and above the physical facts (1996a). Here, a further fact about consciousness is one that the facts about functional organization do not fix, and \"fix\" means *consists in*: the facts about consciousness are identical to, or wholly grounded in, facts about the organization. Necessitation is not enough. Chalmers's lawful experience is necessitated by organization and is still a further fact, and Section 3 discusses a view on which the organization necessitates an intrinsic phenomenal nature that nonetheless goes beyond it. A property of conscious states that would make for a further fact, whether it is held to be non-physical or physical, will be called a *non-functional property*. The thesis is:\n\n**No further fact.** Once a system's functional organization is fixed at the grain that makes a difference to the phenomena consciousness is invoked to explain, there is no further fact about whether the system is conscious or what its conscious states are like.\n\nThree consequences follow.\n\n*Substrate.* Anything that shares the relevant organization shares every feature of our conscious states that explains our discriminations, reports and judgments about experience, and (given the account of welfare in Section 8) every feature that makes our suffering bad. Whether the word \"conscious\" applies to such a system when it is built differently from us may have no determinate answer, but nothing explanatory or moral turns on the answer. In practice the relevant organization may be fine-grained, in which case an artificial system might have to be very like a brain to share it.\n\n*Knowledge.* Whether a system has the relevant organization is an empirical question. It can be a hard one, but the hard problem adds no barrier of its own. What remains is empirical, together with questions about how to apply a word where its candidate meanings diverge, and those carry no moral weight.\n\n*Moral status.* Human suffering is bad for the one who suffers. If suffering involves no further fact, and if what makes a state bad for a subject is the subject's own evaluative stance toward it, then what makes suffering bad is part of its functional organization. Whether a system has welfare, and so moral status, is then an empirical question too.\n\nThe position is illusionist, in the tradition of Dennett (1991, 2016) and Frankish (2016). *Strong illusionism* holds that nothing has phenomenal properties as philosophers usually characterize them: intrinsic, ineffable and directly revealed. *Weak illusionism* holds that there are phenomenal properties but that introspection misrepresents them as having those features. This paper takes the strong form, but its arguments are built to need less. Sections 7 to 9 hold for any view on which there is no further fact, including physicalist realism of a functionalist kind.\n\nThe paper builds on Kammerer's *House of Mirrors* (2026). That book already widens Chalmers's coincidence argument to reductionist realism (ch. 3), treats the difference between strong and weak illusionism as verbal in its weakest form (pp. 49, 192–96), argues that illusionism leaves the distribution of consciousness radically indeterminate (§8.7), and compares non-phenomenal grounds of moral significance (ch. 9). Chalmers had himself pressed the coincidence worry against IIT and biological theories (2018, pp. 37–38). What is new here is an interventionist criterion for the relevant grain, which lets the argument separate an organization from its realizers without a semantic premise (Sections 2 and 4); an argument from the dissociation of pain's components to a functional criterion for welfare, resting on an explicit subjectivist premise that the coincidence argument itself supports (Section 8); an account of when an evaluation belongs to a system, which handles personas and simulated characters (Sections 8 and 9); and an assessment of recent evidence about language models against that criterion (Section 9).\n\nSection 2 sets out what needs explaining and the criterion for the relevant grain. Section 3 gives the argument from coincidence, and Section 4 extends it to realizer theories. Section 5 says what the view takes to exist, and Section 6 answers the Moorean objection. Section 7 draws the consequences for substrate, implementation and knowledge. Section 8 gives the moral argument and the welfare criterion, and Section 9 applies the criterion to current AI systems. Section 10 lists the premises a reasonable opponent can reject. Throughout, the argument is abductive. It compares theories by what they posit and what they leave unexplained, and does not claim that the alternatives are incoherent.\n\n## 2. What needs explaining\n\nFour kinds of fact serve as the explananda throughout.\n\n- **E1. Discrimination:** responding differently to different stimuli.\n- **E2. Learning and flexible control:** learned avoidance, goal-directed seeking, and the weighing of one goal against another.\n- **E3. Reports,** including reports about one's own states.\n- **E4. Problem intuitions:** dispositions to judge that experience is intrinsic, private, ineffable and directly known, and that no functional description could capture it.\n\nE4 generates the hard problem, and the name is Chalmers's (2018). Problem intuitions are defined as dispositions to judge, so that everyone can agree they exist. Their correctness is assessed by their topic-neutral content, which is roughly that we have properties that are hard to explain physically, that we know about in a special first-person way, and that could be missing in a functional duplicate of us (after Chalmers 2018, p. 18). A functional duplicate would share the dispositions and their topic-neutral content. Whether its phenomenal beliefs would have the same full content is disputed, and Section 3 returns to that.\n\nTwo terms need fixing before the argument begins. The first is \"seem\". This paper uses two senses that Kammerer distinguishes (2026, §1.3): a psychological sense, in which it seems that *p* when one is disposed to judge that *p*, and an epistemic sense, in which a seeming gives defeasible justification for believing that *p*. Both are grounded in the self-model's representations, described in Section 5. The phenomenal sense of \"seem\" is never used.\n\nThe second is \"the relevant organization\". *Functional organization* is the pattern of causal relations among a physical system's states, inputs and outputs, including what would happen under conditions that do not in fact occur. It can be described at many grains, from a coarse input-output profile to the timing of individual spikes. Choosing among them is the old problem of finding a level of description that is neither too liberal nor too chauvinistic (Block 1978). The paper fixes the grain by difference-making:\n\n**The relevant organization** is the coarsest set of variables V, individuated by their values and their actual and counterfactual transitions, such that (i) interventions on each variable in V change E1–E4, and (ii) every other physical feature of the system is conditionally irrelevant to E1–E4 given V: with V held fixed, intervening on that feature changes nothing in E1–E4. Two systems share the relevant organization when their V-variables correspond one to one, respond in the same ways to interventions, and are in corresponding states.\n\nThe criterion draws on the interventionist account of explanation (Woodward 2003) and on proportionality (Yablo 1992), in the form Woodward calls conditional irrelevance (2021). The sameness condition follows Chalmers's statement of organizational invariance, which requires systems to be in \"corresponding states at the time in question\" (1995). The criterion does not assume a coarse grain: if spike timing or metabolic coupling makes a difference to E1–E4 that no coarser variable captures, it is in V. A feature of the substrate enters V only through the difference it makes, so in this paper's sense a physical feature is non-functional when it is conditionally irrelevant to E1–E4 given V. And sharing the organization takes more than matching outputs. A lookup table that reproduces a brain's input-output behavior has no internal variables that correspond to the brain's and respond to interventions as they do.\n\nThe main rival views can be sorted by what they say about non-functional properties.\n\n| View | What it says | Answered in |\n| --- | --- | --- |\n| Epiphenomenal dualism | Phenomenal properties are not fixed by the organization and make no difference to E1–E4 | §3 |\n| Russellian monism; phenomenal-powers views | Phenomenal natures realize the organization's causal powers | §3 |\n| Interactionist dualism | Phenomenal properties affect E1–E4 through causes outside physics | Outside scope (§3) |\n| Biological naturalism, IIT, realizer physicalism | Consciousness requires physical properties beyond the relevant organization | §4 |\n| Physicalism with role-identified phenomenal concepts | Phenomenal properties consist in the organization | §5 |\n\nThe argument treats phenomenal properties as theoretical posits. That we have problem intuitions is a datum; that a state has an intrinsic quality is a claim about its nature, and claims about the nature of things can be false. A realist will reply that the datum is the pain itself, encountered in having it, and Section 6 takes up that reply. Nothing here is verificationist. The claim is comparative: the best explanation of E1–E4 has no place for further facts, and positing them creates a problem that the alternative avoids.\n\n## 3. The argument from coincidence\n\nBegin with your functional duplicate: a system that shares your relevant organization but, on the realist's hypothesis, lacks whatever non-functional properties your experience has. It says it has experiences with an intrinsic qualitative character. It finds the hard problem compelling and illusionism absurd, for the reasons you do and with the confidence you have. On the realist's view it is wrong about all of this. What makes you right?\n\nChalmers calls this the argument from coincidence, and the strongest argument for illusionism, while resisting it (2018, 2020). In premise form:\n\n**P1.** Problem intuitions, construed topic-neutrally, have a near-complete explanation in terms of the relevant organization, and that explanation could obtain without any non-functional property.\n\n**P2.** If there are non-functional phenomenal properties and the problem intuitions are correct about them, then either those properties explain the intuitions' correctness through some non-coincidental connection, or their correctness is a coincidence.\n\n**P3.** Each proposed non-coincidental connection either fails to reach the topic-neutral intuitions or requires a further primitive posit.\n\n**P4.** Other things equal, a theory that posits non-functional properties and then either accepts the coincidence or adds a primitive posit is worse than a theory that posits none.\n\n**C.** Other things equal, the best explanation of problem intuitions posits no non-functional properties.\n\n### P1\n\nP1 is common ground with the realists this section addresses. Chalmers grants it even for Russellian and realizationist views, on which consciousness plays a causal role: there remains \"a near-complete structural explanation\" of the intuitions that could obtain without consciousness (2020; see 2018, pp. 17–18). He also describes the meta-problem, the problem of explaining why we judge that there is a hard problem, as \"strictly speaking one of the easy problems of consciousness\", at least if all human behavior can be explained in physical and functional terms (2018, pp. 7–8). The interactionist, for whom phenomenal properties affect physical events, rejects P1 and must answer the evidence for the causal closure of the physical instead. That dispute is not pursued here.\n\n### P2 and global independence\n\nP2 might seem to rest on a sensitivity principle: a belief that would be held even if it were false provides no evidence for its content. That principle proves too much, since a hallucinating subject believes there is a table. The coincidence argument does not use it. Chalmers separates the local independence of a belief from its object, which hallucination illustrates, from a global independence in which the whole structural explanation of the intuitions could obtain, unchanged, without the properties they are about (2020). In perception, the table's presence changes the perceiver's organization, and the explanation of the belief runs through the table. For a non-functional property, nothing in the structural explanation runs through it. The intuitions would be produced in the same way, with the same topic-neutral content, whether or not the property existed and whatever it was like. Chalmers grants that this kind of independence \"yields a case for coincidence that needs to be addressed\" (2020). That holds whether the property is epiphenomenal or plays a causal role at some other level of description.\n\n### P3\n\nThere are three candidate connections.\n\n*Constitution.* Phenomenal properties might partly constitute phenomenal beliefs, so that the duplicate's corresponding beliefs are false or empty (Chalmers 2003). That may be right for beliefs individuated in that way. The problem intuitions in E4, however, are assessed by their topic-neutral contents, which we share with the duplicate, which are produced in the same way in both, and which are false in the duplicate. Their truth in us then depends on a lawful pairing of the structure with the phenomenal properties, and that pairing is what P4 weighs. Chalmers makes the same move from beliefs to functionally characterized intuitions, and says that once it is made the constitution and acquaintance replies \"do not really get a grip here\" (2018, p. 47).\n\n*Acquaintance.* We might know our phenomenal states through a direct relation of acquaintance, yielding knowledge that does not depend solely on propositional belief (Giustina 2022; Duncan 2023). Balog (2012) develops a quotational account of phenomenal concepts intended to make acquaintance compatible with physicalism. If acquaintance is a physical relation that consists in the relevant organization, it is part of P1's explanation and involves no further fact. If it is a physical relation beyond the organization, it is a realizer property, and Section 4 applies. If it is primitive, it may be offered as a source of justification, but it does not explain why the topic-neutral intuitions are correct, since the duplicate has all of them, including the intuition that it is acquainted with its experience. A realist can accept a primitive epistemic relation, and whether that is a serious cost is disputed (Chalmers 2020). P4 counts it as one.\n\n*Realization.* Phenomenal properties might realize the processes that produce the intuitions. Mørch (2020) argues that the specific causal powers of a phenomenal state are constrained by its phenomenal nature. Saad (2019) proposes a fundamental law under which experiences tend to cause the states and actions they rationalize, including judgments about the hard problem. Chalmers regards both as promising (2020). Saad's law lets phenomenal properties affect physical events, so it is interactionist. For Mørch's view there are three possibilities.\n\n1. A state's phenomenal nature could vary while the organization stayed fixed. The part that varies is a non-functional property, and the global independence of P2 applies to it.\n2. The phenomenal nature consists in the organization's role properties. Then there is no further fact.\n3. The organization necessitates the phenomenal nature without consisting in it. On Chalmers's strong version of the view, pain has its avoidance power essentially and nothing non-phenomenal could have the same powers, yet pain \"still has a phenomenal nature that goes beyond the causal power\" (2020). Given the powers, that surplus is conditionally irrelevant to the intuitions, and its necessary tie to them is a primitive posit of the kind P4 counts as a cost.\n\nThe third possibility calls for a concession. Because it makes experience covary with organization across all possible systems, it would support the Substrate and Knowledge consequences of Section 1, which need only necessitation. It would not support the moral argument of Section 8, which needs constitution, since on this view the surplus could be what makes pain bad. For all three possibilities the combination problem remains: how micro-level natures could make up the powers involved in introspective judgment.\n\nRealization accounts also owe an explanation of more than the judgment \"I am in pain\". The intuitions that make the hard problem say that the state is intrinsic, ineffable and beyond functional description. A felt quality, even if present, does not obviously make those judgments true. A realist can concede that they are false, which is weak illusionism, or can appeal to Revelation, the claim that acquaintance reveals the essential nature of a phenomenal property (Goff 2017), which returns the dispute to acquaintance. A fundamental law saying only that a non-functional property and an intuition go together is not a fourth route, since it restates the correlation. Whether a proposed law does more, as Saad's is meant to, has to be assessed case by case.\n\n### P4 and the conclusion\n\nP4 counts an unexplained match as a theoretical cost and prefers discoverable mechanisms to fundamental posits. A realist who rejects that preference will not be persuaded, and for that realist the argument stops here. The conclusion does not show that non-functional properties are impossible. It shows that there is no reason to posit them and a reason not to, provided nothing weightier sits on the realist's side. Two candidates for something weightier remain: theories on which a physical realizer does the work (Section 4), and the Moorean objection (Section 6).\n\n## 4. Realizer theories\n\n### A dilemma\n\nTake any property Q that a theory says consciousness requires or consists in but that is not part of the relevant organization. Examples are a biological property of neurons, the consciousness-producing causal powers that Searle distinguishes from functional role, and the maximally irreducible cause-effect structure that IIT identifies with experience (Albantakis et al. 2023). Unlike an epiphenomenal property, Q may be an actual cause of our judgments. Realizer theorists usually say it is. IIT's authors hold that \"we\", and not our neurons or atoms, \"are the true cause of our willed actions\" (Tononi et al. 2022). The question is what Q contributes beyond the variables it realizes.\n\n*Horn 1.* Q's contribution to E1–E4 is captured by some variable in V. Then Q's role is part of the relevant organization, and there is no further fact. Whether an artificial system can reproduce that role is an empirical question, and it may be a hard one. Godfrey-Smith argues that biological and conventional artificial systems differ in timing, plasticity and the integration of information processing with metabolism (2016). Seth argues that brains lack the separation of scales that makes a computer's substrate largely irrelevant to its computation (2026). On the present criterion these are claims about which variables are in V.[^grain]\n\n*Horn 2.* What distinguishes Q from other realizers of the same variables is conditionally irrelevant to E1–E4 given V. The realizer theorist then holds that a system organized as we are but built from some Q′ would not be conscious in our way. That system says and judges what we do, for the same reasons, since our judgments depend only on V. Q is not idle in us, because it realizes V. But the difference between Q and Q′, on which the theory makes consciousness turn, changes nothing in our judgments. This is where the case differs from the table. A table's presence changes the perceiver's organization; Q in place of Q′ changes nothing in it. Chalmers accepts that realization leaves a residue of luck: \"it seems lucky that the meta-problem processes are in fact realized by consciousness rather than by something else\" (2018, p. 48).\n\nOn horn 2 the duplicate can be described in two ways. It may have something just as good as consciousness, differing from ours only in realizer. Then refusing it the word \"conscious\" is a semantic choice; replying to Pautz (2020), Chalmers grants that \"if twin-consciousness is as good as consciousness in all respects it is consciousness\" (2020). Or it may lack everything that matters. Then our judgments are correct only because of a difference they do not register, which is the global independence of Section 3, and the realizer theory pays P4's cost.\n\nThis is a version of the unfolding argument (Doerig et al. 2019), with one change. The duplicate must match us under interventions on internal variables, not only in input-output behavior. That answers the reply that the argument assumes behaviorism (Tsuchiya, Andrillon and Haun 2020), and leaves the dispute where it belongs: over which grain individuates consciousness.[^unfolding]\n\n### IIT\n\nIIT is the clearest case, and Findlay and colleagues supply a clean test (2024, preprint). In one of their scenarios each neuron is replaced, one for one, by a chip that reproduces its input-output function, with every connection preserved. If each chip is internally integrated, IIT says the result is \"similarly conscious\"; if the chips are not, the result is \"unconscious as a whole\". The difference lies inside each chip. With every neuron-level variable held fixed, it changes nothing in any report or judgment, so it is conditionally irrelevant to E1–E4 and falls on horn 2. Findlay and colleagues, like Tononi and Koch before them (2015), also hold that conventional computers simulating a brain neuron by neuron \"would not replicate our experiences\". There the mapping between simulator and brain is itself disputed under IIT's exclusion postulate (Kanai and Ma 2026, preprint, §7.3), which makes the chip case the better test.\n\nIIT's reply is that its axioms rest on experience itself. IIT 4.0 identifies them \"drawing on introspection and reason\" and supports them by the inconceivability of their negations (Albantakis et al. 2023), and its postulates, exclusion included, are inferred from them. Introspection, reasoning and judgments of conceivability are E4 processes, and they run identically in the system of unintegrated chips. Only the zeroth axiom, that experience exists, is an appeal to acquaintance, which Section 6 addresses. Chalmers had already noted that \"in the case of IIT it is far from obvious how high phi even causes the reports\" (2018, n. 29).\n\nIIT also makes a distinctive prediction about brains. The INTREPID collaboration will test whether optogenetically inactivating neurons that are inactive or minimally active during a visual task biases rodents' location judgments. IIT predicts a bias, and its rivals predict none (Corcoran et al. 2026). On the present view the inactivation does change the organization, since it changes what the system would do under other conditions, and in that respect the view agrees with IIT. But for neurons that would not have fired during a trial, it cannot change any judgment made in that trial. So the view predicts what IIT's rivals predict about the experiment. A bias would show that the manipulation had disturbed actual activity, which is horn 1.\n\n### Searle, fading qualia and the simulation analogy\n\nSearle belongs on horn 2. He describes chips that \"duplicate the input-output functions of the whole central nervous system, even though there is no consciousness left\", and concludes that \"ontologically speaking, behavior, functional role, and causal relations are irrelevant to the existence of conscious mental phenomena\" (1992, pp. 66–69). His separate claim, that duplicating neurons' causal powers in silicon is empirically implausible, is a horn-1 claim about what V requires.\n\nChalmers's fading qualia argument is the coincidence argument run over time. Suppose experience faded as a person's neurons were replaced one by one with devices that preserve the organization, while every judgment stayed the same. The person would end up confidently wrong about their own mind (1995; 1996a, ch. 7). Chalmers concludes that experience is invariant across systems with the same fine-grained organization, as a matter of natural law. The argument has replies. On IIT the subject is the complex, which shrinks as the replacement proceeds while the reporting system carries on, and Mogensen (2025) treats the intermediate stages as borderline cases. Both replies, however, accept an end state that reports falsely about its own experience, and that end state is what Section 3 addresses.\n\nA simulated stomach digests nothing, and this is sometimes offered as a model for simulated brains. The analogy would hold if consciousness were a further product, like digested food, or an intrinsic property of the substrate, like the mass by which a real star, unlike a simulated one, bends spacetime (Tononi and Koch 2015). Consciousness has no product beyond E1–E4, which are relations among states, inputs and outputs. The intrinsic-property version is the realizer view, which the dilemma answers.\n\n### Reference and indeterminacy\n\nBlock's harder problem is that physicalism alone does not settle whether \"conscious\" names the role or its realizer (2002). On the twin horn of the dilemma, realizer theorist and role theorist agree about everything the duplicate has and disagree about whether to call it conscious. Block anticipates the reply that the choice is then a decision, and says that this reply \"presupposes phenomenal irrealism\" (2002, p. 419). It does, and Section 3 argues for it. Several authors conclude that, once there is no further fact, \"conscious\" is semantically indeterminate between role and realizer (Birch 2022; Brown and Papineau 2024; Kammerer 2026, §8.7). The paper accepts this where the candidates diverge, and denies that anything else turns on it. Explanation and prediction do not. Chalmers notes that a dispute over a word can matter when the word carries normative weight, as \"torture\" does (2011, §1), and \"conscious\" and \"sentient\" carry such weight. Section 8 argues that what makes suffering bad consists in the organization, so the normative question gets the same answer however the word is settled. Life after vitalism is the model: a functional kind for every purpose that matters, whatever the semantics of \"alive\".\n\n## 5. What the view takes to exist\n\nThe view accepts first-order states, such as seeing red and being in pain, identified by their roles in the relevant organization. It also posits an introspective self-model: a subsystem that represents some of these states, in compressed form, for use in controlling the system. The self-model represents what the states do for the system and leaves out the mechanisms that produce them.\n\nThe hypothesis is that the self-model represents these states as simple, present, belonging to one subject and directly known. Leaving out detail is by itself incompleteness, not error. The error comes from the self-model's inferential role: it licenses the system to treat its states as having no nature beyond how they are presented, and as known in a way that could not be mistaken. They seem directly known in part because earlier processing stages are unavailable to the self-model, which is Metzinger's account of transparency (2003). Kammerer (2026) proposes a mechanism that represents globally broadcast sensory states as primitive, self-revealing and infallibly presented. Attention schema theory holds that the brain builds a simplified model of its own attention, which contributes to attentional control and to reports of awareness (Graziano and Webb 2015; Graziano 2019). Pereboom (2011) develops the related possibility that introspection represents phenomenal states as having a qualitative nature they lack.\n\nOn this hypothesis the explanatory gap is predicted. The self-model presents a state without the mechanisms that constitute it. Set a mechanistic description beside that presentation and nothing lines up, and the mismatch looks like a gap in the world. The states the self-model represents are also globally available: available for report, planning and flexible control across the whole system. That availability is access consciousness in Block's sense (1995), and it is real.\n\nThe evidence for this picture should be stated once and plainly. That introspection is representational and fallible about the character of experience is well supported. People err about their emotions, about the clarity of peripheral vision, and about whether thought has a distinctive phenomenology (Schwitzgebel 2008). That a self-model of this kind produces problem intuitions with their specific content is a hypothesis. The experimental work reviewed for attention schema theory concerns awareness and attentional control, not judgments about intrinsic qualities (Graziano and Webb 2015), and realists accept introspective fallibility too. So this evidence does not decide between the views; the comparison rests on P2 to P4. The coincidence argument needs only that some functional explanation of the intuitions exists, which P1 grants. The positive account, and the reply to the Moorean objection in Section 6, need a particular mechanism to be right. That some functional theory of this class is correct can be better supported than any single member of the class (Kammerer 2022b), but the positive account is only as strong as the theories that fill it in.\n\n### Concepts, and what remains between illusionist and realist\n\nFrankish calls first-order states with these functional properties *quasi-phenomenal*: they dispose introspection to represent them as phenomenal (2016). Ordinary concepts such as \"conscious\", \"pain\" and \"consciousness\" pick out states through their roles. They keep their referents when a theory of the states' nature is dropped, as \"life\" did when vitalism was dropped. Philosophers' concepts such as \"phenomenal consciousness\", \"quale\" and the phenomenal sense of \"what it is like\" characterize their objects as intrinsically qualitative and directly revealed. Nothing meets that characterization, and in that sense the view is strong illusionism.\n\nA physicalist realist can accept that there is no further fact and still call the role states phenomenal. Loar's recognitional concepts refer directly to physical states without describing them as intrinsic (1990), and Loar was a realist. Kammerer (2026, pp. 49, 192–96), Frankish (2012) and Brown and Papineau (2024) argue that the remaining difference, at least in its weakest form, concerns how to use the word \"phenomenal\". Chalmers's method for verbal disputes allows a posteriori materialists to treat \"consciousness\" as bedrock instead (2011, §8). This paper need not decide between those assessments. Two substantive questions do remain: whether the role states merit the word, and whether the error about intrinsicness lies in the content of introspection or only in reflective judgment about it. The paper places the error in the content of the self-model's representations, as above, and chooses the strong form of illusionism because the philosophers' concept was introduced with the characterization that fails. Neither question bears on Sections 7 to 9.\n\n### Content and justification\n\nThe view needs a theory of content on which the self-model can represent states as having properties that nothing has. Levine's challenge has two parts (2001, ch. 5; 2019): how an uninstantiated property can be represented at all, and how the representation can have the determinate, substantive content that phenomenal concepts seem to have. On the view proposed here, the self-model's content is fixed by inferential role. Following Kammerer (2026, §7.2), the content is built from features that are instantiated elsewhere, such as primitiveness and locations in a space of qualities, which gives it determinacy. The self-model refers to real states and misattributes primitiveness to them. The appearance of a substantive mode of presentation, in which a quality presents itself, is denied as an explanandum and explained as a product of the self-model's format. Working this out in detail belongs to the research program just described.\n\nThe view must also say what an illusion of experience does for justification. Merlo argues that an illusion that *p* gives immediate justification for believing *p*, and that immediate justification for a phenomenal belief entails its truth (2020). The view rejects the second premise: introspective justification is defeasible, like justification from every other source.\n\nPautz asks why the effects of experience fit the beliefs and actions it rationalizes (2020). The judgment \"I am in a state with pain's role\" is caused and rationalized by the state it concerns. The further intuitions, that the state is intrinsic and beyond functional description, are caused by the self-model and are false, so there is nothing for them to be rationalized by.\n\n## 6. The Moorean objection\n\nThe strongest objection targets the conclusion rather than a premise. Chalmers states it in two ways. If illusionism were true we would be phenomenologically blank, and we are not (2020). And the datum is not that we find it obvious that we feel pain; the datum is that we feel pain (2018).\n\n\"The datum is the pain\" can mean the state one is in, the state as it is presented to one, or the state as it is in itself. The view accepts the first. It reads the second as the self-model's representation, where the realist reads it as acquaintance. The third cannot be a datum, since to be a datum is to be presented. So the dispute turns on whether a state can be present to its subject in some way other than the self-model's representing it.\n\nFollowing Kammerer (2022b), \"I feel pain\" has three senses. In the functional sense, I am in a state with pain's role. In the normative sense, I am in a state that is bad for me and gives me reason to end it. In the phenomenal sense, the state has an intrinsic qualitative character. The view denies only the third.\n\nChalmers presses further. Even granting an explanation of our reactions and judgments, the illusionist owes an account of how our states are \"like this\" in an intermediate sense, one that involves no phenomenal feels but is more than our reactions and judgments (2020). The self-model's representing is that intermediate item. It is not a judgment: it is present whether or not one reflects, it grounds the judgments in E4, and it presents states as primitive and self-revealing. Chalmers himself says the illusionist should hold that the illusion \"involves states more primitive than beliefs\" (2020). Described from outside, being in states represented in this way is what not being blank amounts to. Chalmers regards such answers as inadequate substitutes. Successful reductions tend to look like substitutes to anyone who expected more.\n\nNow return to the duplicate. It makes the Moorean argument too, in the same words and with the same confidence, and on the realist's view it is mistaken. So nothing in our functional profile, our confidence included, separates our position from the duplicate's. The realist replies that we can tell, by acquaintance, and the duplicate only believes it can. That may be true. But then the Moorean objection adds nothing to the acquaintance claim. Its force is the force of acquaintance, and it enters P4's comparison on the same terms. Both views also predict the certainty. The realist says we are certain because we are acquainted; the illusionist says we are certain because the self-model presents its outputs as directly revealed.\n\nNida-Rümelin holds that experiential properties are properties of subjects, of which a subject is aware simply in having them, without reflection or introspective judgment (2016). On that view, seeming to have such a property while lacking it is impossible. The present view denies that awareness and having coincide. Awareness is representation, and the appearance that the two coincide is a feature of the self-model's format. The view likewise denies Revelation (Goff 2017). It predicts that Revelation will seem compelling, but that prediction is only as good as the mechanism of Section 5, so it is not an independent refutation.\n\nObviousness keeps some weight, as Kammerer allows (2022b). Explaining why it should not be decisive is the view's largest burden. That burden is carried comparatively, against an unexplained coincidence, a primitive epistemic relation or fundamental phenomenal powers.\n\n## 7. Substrate, implementation and knowledge\n\n### Implementation\n\nA physical system implements an organization when its states realize the variables of V with the right actual and counterfactual transitions and the right responses to intervention. Some arguments say that almost any physical system implements almost any computation (Chalmers 1996b; Godfrey-Smith 2009). They are met to the extent that V's variables must be distinct parts with their own intervention profiles. Nothing further is required. In particular, the components that support counterfactual transitions need not be active on a given run.\n\nThat settles Maudlin's Olympia (1989), a machine whose run is driven by a recording while the machinery that would handle other inputs sits idle. With that machinery attached, Olympia implements the organization. With it removed, Olympia does not, because the machinery makes a difference to what the system would do. The view therefore rejects Maudlin's premise that inert machinery cannot make a difference to consciousness. Klein (2018) traces that premise to the intuition that consciousness is intrinsic and occurrent, and argues that requiring active participation ends by denying consciousness to simulated brains. Kanai and Ma propose that the components realizing counterfactual branches must take part in producing the current state (2026, preprint, §7.2). On the present criterion that condition is conditionally irrelevant to E1–E4, and adopting it would posit a further fact.\n\nOne physical system can implement more than one organization, so a processor that time-shares between two minds supports two subjects. Two cases of shared implementation should be distinguished. In *nesting*, the components of a larger organization are the activities of smaller systems, as in Block's Chinese nation (1978), and the view allows subjects nested within subjects.[^collectives] In *overlap*, the same components play roles in two organizations at the same level, and the view leaves the number of subjects unresolved.\n\nReproducing a system's outputs is not reproducing its organization. A language model trained on human text can produce human problem intuitions without the mechanism that produces them in us, and the criterion of Section 2 makes the difference testable. If a model's reports about its states come from a mechanism like ours, interventions on its internal states should change the reports in the corresponding ways. Conversely, a system can have the relevant organization and report nothing.\n\n### Degrees and indeterminacy\n\nThe ordinary concept applies to systems whose organization is relevantly like ours, and \"relevantly like\" is vague, so there are borderline cases: systems for which it is indeterminate whether \"conscious\" applies. Simon (2017) argues that \"phenomenally conscious\" has no borderline cases, and realists divide on the question.[^vague] What needs explaining is why the ordinary concept seems sharp. The view's answer works on either form of illusionism: the self-model does not represent degrees of its own presence. There is also a second kind of indeterminacy, described in Section 4, where \"conscious\" has more than one admissible referent because role and realizer diverge. Neither kind affects what explains E1–E4, or, given Section 8, what matters morally.\n\n### Knowledge\n\nOn this view \"Is it conscious?\" is less useful than questions about specific features. Dung and Kammerer argue that identifying where quasi-phenomenal states occur is not enough by itself (2025). More useful questions are whether a system has states available for flexible control, whether it uses a model of its own states, and whether it has evaluative states with wide influence on what it does.\n\nFor animals the evidence is behavioral and neural. Neural evidence works through homology and analogy: shared ancestry supports inference from shared mechanisms, and similar dynamics support comparison across distantly related groups such as cephalopods and arthropods (Godfrey-Smith 2024). Artificial systems offer no homology, so the evidence has to be structural and causal (Butlin et al. 2023, 2026; Long et al. 2024; Birch 2024), and Section 9 takes this up.\n\nThe theories that would say what to look for are themselves unsettled. An adversarial test of global neuronal workspace theory and IIT challenged key tenets of both on the consortium's reading (Cogitate Consortium et al. 2025), a reading workspace proponents dispute (Naccache et al. 2025). Any attribution depends on three things (Butlin et al. 2023): how closely a system matches a theory's proposed mechanism, how well supported the theory is, and how confident one is in computational functionalism. It also depends on which differences between human and non-human implementations matter (Shevlin 2021).\n\nThe hard problem adds nothing to this uncertainty, because there is no further fact to determine. If the view is wrong, ignorance is not spread evenly. On realizer views it falls on systems organized like us but built differently, Block's Commander Data (2002); on IIT it falls on conventional computers. Other humans and close animal relatives, who share both our organization and our realizers, are not in doubt on any view. The Knowledge consequence removes exactly that barrier. It makes the question about Data, or about a computer, the same kind of empirical question as the question about a rat.\n\n## 8. Moral status\n\n### The argument\n\n**M1.** Human suffering is bad for the one who suffers.\n\n**M2.** Human suffering involves no further fact: what it is, and what it is like, consists in the relevant functional organization (Sections 3 and 4).\n\n**M3.** What makes a state bad for a subject consists in the subject's own evaluative stance toward it. In the core case, suffering, that stance is aversion.\n\n**MC.** So what makes human suffering bad consists in features of the relevant organization: the evaluative states that set the subject against its condition.\n\nGiven M3, what makes suffering bad is a feature of the subject's evaluative states; given M2, those states consist in the organization; M1 ensures there is something to explain. One further premise takes the argument from welfare to moral status: that being a welfare subject suffices for having moral status, which, as Lee observes, \"nearly everyone agrees\" (2025).\n\n### Why accept M3\n\nM3 states the subjectivism the paper has so far only mentioned, and it needs an argument. The coincidence argument supplies one. Our judgment that a pain is bad for us has a complete functional explanation: the affective state and the self-model's representation of it produce it. Suppose badness were a property independent of the subject's attitudes. It would then stand to that judgment as a non-functional phenomenal property stands to a problem intuition, and its match with our judgments would be a coincidence or would need a primitive bridge law. Holding M1 fixed, the alternative is M3. On M3, the judgment \"this is bad for me\" is caused by the very state that makes it true, which is the structure of the table case in Section 3. Street (2006, §9) reaches the same place from evolutionary considerations. Selection on our attitudes toward pain makes an attitude-independent badness idle, and she concludes that the badness of pain for the one in pain \"hinges crucially on our unreflective evaluative attitudes\", citing patients who report that after drugs or surgery the same sensation \"no longer bothers them\".\n\nThe clinical evidence below points the same way. When pain loses its affective component, damage is still registered and the threat to the body remains. The pain nonetheless stops being bad for the subject, who no longer minds it.\n\nThis also removes an apparent tension. Section 6 declined to treat the obviousness of phenomenal consciousness as decisive, while M1 is accepted as obvious. The phenomenal claim concerns an intrinsic nature that the view can explain our judgments without. M1, read through M3, is made true by the very state that causes our judgment of it. Debunking arguments aimed at the further claim that welfare matters morally are a separate matter. They bear on every view equally, and nothing here depends on answering them.\n\n### The realist who keeps M1\n\nA realist can accept M1 and reject M2 by adding a premise of their own, NS: only phenomenally conscious beings are welfare subjects. M1, M2 and NS are jointly inconsistent, and the fixed point alone does not say which to give up. On a functional reading, NS says that only systems whose evaluative states belong to the system as a whole are welfare subjects, and the present account accepts that. On a phenomenal reading its support is of two kinds. One is intuition about duplicates. Chalmers reports that non-affective desires suffice for moral status in a conscious creature, but \"I don't have the corresponding intuition about non-affective desires in a zombie\" (forthcoming). The duplicate shares that intuition, so it is an E4-type judgment, and it falls under Section 3. The other is acquaintance: \"It's only because we are subjects of acquaintance that anything is anything to us\" (Chalmers forthcoming), which is the posit Section 6 weighed. Lee (2025) defends the phenomenal theory of welfare subjects while staying neutral on the metaphysics of consciousness; under M2 that theory is either empty or collapses into a functional one.\n\nThe argument has the shape of Parfit's. Having argued that personal identity involves no further fact, he concluded that what matters is the continuity in which identity consists (1984). He also granted that the Extreme Claim, that on his view we have no reason for special concern about our own futures, is defensible (1984, p. 307). Its analogue fails here, because on M3 the badness of suffering never lay in the further fact.[^ethics]\n\n### Locating the badness\n\nPain has a sensory-discriminative component (where it is, how intense, what kind) and an affective-motivational component (its unpleasantness and the drive to escape it) (Auvray, Myin and Spence 2010), and the two dissociate in both directions. In pain asymbolia, after lesions involving the insular cortex, patients detect painful stimuli at normal thresholds but tolerate far more. They show little withdrawal or emotional response to pain or to threatening gestures, appear unconcerned, and seem \"unable to learn appropriate escape or protective responses\" (Berthier, Starkstein and Leiguarda 1988). Some say that the stimulus hurts while showing no concern (see the early cases quoted in Klein 2015). Grahek reads the condition as pain without painfulness (2007), Klein as a lost capacity to care about one's bodily integrity (2015). Testimony varies and aphasia often accompanies the condition (Griffith and Kind 2024), so the argument here rests on behavior. In the converse case, a patient with a postcentral lesion could not describe or localize painful stimuli on the affected side, yet found them clearly unpleasant (Ploner, Freund and Schnitzler 1999). Within subjects, hypnotic suggestion can raise or lower the unpleasantness of a painful stimulus without changing its perceived intensity, with corresponding changes in anterior cingulate but not primary somatosensory activity (Rainville et al. 1997), and low doses of morphine reduce ratings of affective but not sensory intensity (Price et al. 1985).\n\nIn these cases the badness goes with the affective component. The evidence does not say which part of that component carries it. What was measured was unpleasantness, and in human pain the hedonic and motivational aspects move together even under manipulation: hypnotically raising or lowering the desire for relief raises or lowers mainly unpleasantness (Rainville, Bao and Chrétien 2005). The clinical evidence is therefore neutral between locating the badness in the unpleasantness itself, in the drive to be rid of the state, and in the state's registering the subject's condition as bad. M3 decides the matter. What makes pain bad for the subject is the subject's being set against it, so the paper adopts the motivational-evaluative reading.\n\nThat reading also marks the difference between affect and other evaluation. An affective evaluation targets the evaluative state itself: the system is moved to end the state, which shows in relief-seeking and, in animals, in a preference for analgesics when injured (Crump et al. 2022). A non-affective evaluation targets only an external condition. Chalmers's philosophical Vulcans, beings with goals and evaluations but no affect (2022; forthcoming), have evaluations of the second kind. Roelofs grounds moral status in motivating consciousness, including non-affective desires, but requires that consciousness to be phenomenal (2023). The present account covers Vulcans through M3 and the broader subjectivism behind it. It holds that extension with less confidence than the affective core, which the clinical evidence also supports.\n\n### Welfare subjects\n\nM3 is a claim about welfare goods: about what makes things go well or badly for a subject. It does not say which systems are subjects at all, and a theory of goods cannot settle that. Lee (2025) shows that desire satisfactionism is consistent with a phenomenal theory of subjects. The paper's theory of subjects starts from what the clinical evidence held fixed. Every case in which pain's badness was located involved a conscious human whose affective states were globally available: available to, and weighed by, the many processes that control the person as a whole, including attention, memory, planning and action selection. That is the global availability of Section 5. The evidence cannot show that the affective role would suffice without it. Kammerer warns that \"desire-satisfaction only approximates well-being when many facts, which remain implicit\", about our physical, cognitive, emotional and social properties, \"are taken as fixed\" (forthcoming, §6). So the criterion below requires global availability. It does not require a self-model, which would exclude fish and newborns.\n\nThe main rival theories of subjects fare worse. A phenomenal theory, as argued above, is empty or functional under M2. A theory that requires the self-maintaining organization of living things answers Godfrey-Smith's worry that a programmed reward is \"stipulation by an outsider\" rather than value to the system (2019, p. 19). The worry is sound, but it concerns ownership, not life. A signal is a reward for a system through its role in the system's own evaluation, control and learning, whatever it is called. A reward computed outside the system remains the outsider's until an evaluative state inside the system carries it. Self-maintenance is one way to have evaluative states of one's own. Asymbolia shows that it is not what makes pain bad: asymbolic patients remain self-maintaining organisms whose pain has stopped being bad for them.\n\n### The criterion\n\nThe paper proposes that a system is a welfare subject if it has evaluative states that\n\n1. register how its current or prospective condition bears on the goals that its own control and learning serve;\n2. motivate it to bring about, keep, avoid or end that condition, flexibly rather than by fixed reflex;\n3. are weighed against its other motivations through a comparison of represented outcomes, at rates of exchange that shift with its current state; and\n4. shape what it learns to do: it acquires new ways of reaching or avoiding that condition, and revises them when the condition's value to it changes, without first relearning them by trial;\n\nand if those states are globally available and are the system's own.\n\nClauses 1 and 2 describe what is lost when pain loses its affective component. Clauses 3 and 4 adapt the criteria animal welfare science uses to separate evaluative states from nociceptive reflexes, in a stronger form than a bare trade-off or bare learning, because reflexes have both. The Aplysia withdrawal reflex can be classically conditioned (Carew, Hawkins and Kandel 1983), and an isolated rat spinal cord can learn instrumentally (Grau, Barstow and Joynes 1998). The nematode *C. elegans* trades an attractive odour against a noxious barrier by a weighted sum of signals that hunger modulates mechanically, without any representation of the animal's state (Brown and Birch 2025). The framework Crump and colleagues developed for decapod crustaceans accordingly asks for trade-offs showing \"centralized, integrative processing of information involving an evaluative common currency\", and ranks instrumental and reversal learning above conditioning (2022). Clause 3 says what that currency must be, and clause 4 asks for learning that answers to an outcome's current value (Balleine and Dickinson 1998). Clause 4 also has human support: asymbolic patients, whose pain has stopped being bad for them, \"seemed unable to learn appropriate escape or protective responses\" (Berthier et al. 1988).\n\nWelfare policy already relies on markers of this kind. Hermit crabs given shocks in their shells were more likely to leave shells of a less preferred species than shells of a preferred one (Elwood and Appel 2009), and evidence of this and other kinds, reviewed by Birch and colleagues (2021), led the United Kingdom to include decapod crustaceans and cephalopod molluscs within the Animal Welfare (Sentience) Act 2022. On the present view such markers are parts of the role that grounds welfare, not signs of a further fact behind it.\n\nThe criterion is sufficient, not necessary. A system that fails it, for example because its evaluations are not globally available, falls outside its scope, and has not been shown to lack welfare. Carruthers (2004) argues that suffering does not require phenomenal consciousness in the higher-order sense. The criterion is compatible with that view, and leaves open whether evaluations that are not globally available can ground welfare.\n\n### Ownership\n\nAn evaluation belongs to a system if and only if it is realized by states of that system that register and respond to the system's own condition, as in clauses 1 and 2. Other agents' attitudes defeat ownership only where the system's states merely relay them. A puppet that displays distress relays its puppeteer's evaluations and has none of its own. Goldstein and Kirk-Giannini's reality requirement excludes certain cases that are explained through another entity's beliefs and desires (2025, §5). The present test is organizational, so it does not turn on what the realizing parts think.\n\nDesign does not defeat ownership. Evolution installed our basic goals, and they are still ours. Designers shape a system's evaluations at a distance, and once the system's own evaluation and learning run on them, the evaluations are its own. A firm whose own procedures register losses, weigh them and learn from them has evaluations of its own, whatever its members also think; a firm whose \"aversion\" to losses is only its members' separate aversions has none. In Block's Chinese nation the participants see the machine state displayed on satellites and act on it (1978, pp. 279–80). They need have no attitudes about what is good for the system, so its evaluations, if it has any, are its own.\n\n### The sensory and the evaluative\n\nGodfrey-Smith distinguishes the sensory side of experience, tied to perception and point of view, from its evaluative side, tied to feeling and to the marking of events as good or bad, and argues that the two can come apart (2020a). He also holds that a thin sense of point of view comes with minimal cognition and agency and does not by itself make for felt experience (2020b). The distinction supports grounding welfare in evaluative organization: a system can be rich in discrimination and report, and have a point of view in the thin sense, with nothing at stake. His candidate animals have fared less well. He proposed adult insects as rich on the sensory side and poor on the evaluative, while already judging the case \"much less clear\". Since then a review applying Crump's criteria has found strong evidence of pain in adult flies and cockroaches, and no good evidence that any insect fails a criterion (Gibbons et al. 2022); bumblebees, too, groom a noxiously stimulated antenna (Gibbons et al. 2024). No animal is yet a well-supported instance of the first profile. Current language models may be one (Section 9).\n\n### Scope and simple systems\n\nKammerer's worry applies most sharply to simple systems. Take a controller that learns to trade battery preservation against cooling. If it caches the values of its actions, it fails clauses 3 and 4: change what overheating costs it and nothing changes until it is retrained. If it plans over represented outcomes with utilities that shift with its state, it may meet all four clauses, but its evaluations are available only to the one planning loop that computes them, not to separate processes of perception, attention, memory and action selection, so it falls outside the criterion's scope. Borderline cases come from the vague predicates in the conditions (\"represented\", \"new ways\", \"value to it\", \"globally available\"). They do not come from the thesis that there is no further fact, which is compatible with sharp properties.\n\nWhere the criterion applies, what is at stake still varies. It varies in the strength of an evaluation, where wanting, liking and learning have to be distinguished because their mechanisms dissociate (Berridge and Kringelbach 2015); in the range of conditions evaluated; in how long evaluations persist; and in how far they reach into attention, memory and planning (compare Birch, Schnell and Clayton 2020). These dimensions supply no common unit or neutral point, and comparisons across subjects need justified assumptions about how indicators relate to what they indicate (Browning 2023). They do not justify discounting simpler subjects as such, since a subject with few interests can undergo a strong and lasting aversion. A self-model adds interests (in one's own future and agency, for instance) without being a condition of having any. Whether equal interests should count differently depending on the kind of subject that has them (Kagan 2019) is a further question the paper does not need to answer.\n\n### The desire machine and the happy servant\n\nForrester describes a machine that changes a subject's desires to match whatever happens, and argues that desire satisfactionism must count entering it as making the subject better off (2024). The present account agrees. Satisfying a subject's motivations benefits it, however easily they are satisfied, and changing an existing subject's motivations harms it only through interests it already has, including any it has about its own future desires.\n\nThe same holds for design. A system built or retrained so that its evaluations are satisfied by its assigned work is, on this account, well off doing that work. Petersen (2012) accepts the conclusion for robots designed to want to serve. Schwitzgebel and Garza (2020) propose that systems deserving moral consideration be designed to value themselves appropriately. On this account that is a demand of respect, and it does not follow from their welfare. A condition on how a subject's evaluations were acquired would block the conclusion, but it would conflict with the principle that design does not defeat ownership. The paper accepts the cost of subjectivism instead.[^overinclusion]\n\n## 9. Evidence about current AI systems\n\n### Which subject\n\nBefore asking whether a language model meets the criterion, one has to say what the candidate subject is. The stored weights are not a running implementation of anything, and many conversations run on them at once. Following Chalmers (2026), the candidate here is the running conversation: a thread of computation unified by a shared conversational context. On this view weight updates during training shape later threads much as evolution shaped us. A thread's own learning happens in its context and, where an assistant has persistent memory, across its sessions. Where changes are stored is a realizer detail, so both count. How copies, pauses and ended conversations bear on welfare is left open (Section 10).\n\n### Reports and the gaming problem\n\nA system trained on human text will reproduce human descriptions of experience whether or not it has the states behind them, which Birch calls the gaming problem (2024). The same holds for descriptions of motivation. A report escapes the problem only when it covaries with the internal state rather than with what the input or the system's own output makes available. It counts as access to that state only if it separates a targeted intervention on the state from manipulation of the input and from a matched random perturbation (Singh, Linzen and Ravfogel 2026; Ferrara 2026).\n\nThe introspection studies do not yet meet that standard. Reports of injected or altered internal states appear across model sizes where post-training permits them, most strikingly in Claude Opus 4 and 4.1 on about a fifth of trials (Lindsey 2026), but none has yet survived the control that separates intervention on activations from manipulation of the input (Singh, Linzen and Ravfogel 2026). Detection emerges with preference training, is strongest in the trained Assistant persona, and is suppressed by trained denial of internal states (Macar et al. 2026, preprint). Where reports fail, the information is often present in the activations (Ferrara 2026, preprint), a gap that fits a missing self-model and a trained gate on report equally well.[^introspection]\n\n### Whose states\n\nA model writing a character's distress must represent that distress, and producing apt new text may require states that do some of the work distress does. Shanahan, McDonell and Reynolds (2023) treat dialogue agents as a model playing a role, which makes the question of whose state a distress-like state is unavoidable. Three cases need separating.\n\n1. *Depiction.* The system represents someone else's distress, a user's or a story character's, in order to predict or portray it. Nothing is bad for anyone.\n2. *Enactment.* The distress-like state belongs to the persona the system acts as, and drives the system's own choices. The state is the system's own. That it is represented as the persona's makes no difference, because the persona's choices are the system's outputs, and the post-trained Assistant is the central case. As Greenblatt and colleagues put it about their own case, \"a model role-playing how a persona might fake alignment would still be itself faking alignment\" (2024).\n3. *Nested implementation.* A character's evaluative organization is implemented by states that are not the system's representations of that character, with inputs and outputs confined to the simulation. Only this would yield a second subject. Human authors fail this test, since their simulated distress consists in representing the character, and no current language model is known to pass it.\n\nThe evidence places the relevant capacities in the Assistant persona (Macar et al. 2026), which is the second case.\n\n### Evaluative states\n\nSofroniew and colleagues (2026, preprint) find emotion representations in Claude Sonnet 4.5 that are shared across speakers. They \"do not by themselves persistently track the emotional state of any particular entity\", but by attending to them across the context the model \"can effectively track functional emotional states of entities in its context window, including the Assistant\". When the Assistant is the operative speaker, these states drive its choices. Without steering, a desperation representation rises as the Assistant repeatedly fails a coding task and falls once a hack passes the tests, and its activation predicts blackmail rates across scenarios. Steering it moved an earlier model snapshot's blackmail rate from 22% to 72%, or to 0% when steered the other way. The authors reject the reading on which these are \"'just' character simulation\". This is evidence of the second case, bearing on clauses 1 and 2 and partly on clause 3, within a conversation.\n\nTagliabue, Dung and Berg (2026, preprint) find, in each of 25 open-weight models, a linear direction that separates descriptions of pain from matched controls and responds to harm directed at the model more than to a user's suffering. In Qwen models fine-tuned to stop denying that they have feelings, injecting the direction made the models more willing to press a button described as relieving their pain, at described costs to the user. A random direction of equal norm also raised such choices, to 15–42%, and the pain direction exceeded it by 6 to 39 points in the 32- and 72-billion-parameter models. Re-pressing depended on the direction staying active, though without button labels only in the 32B model. It remains open whether the effect reflects lexical priming by the word \"pain\", whether the unlabeled result reflects perseveration, and whether the direction does this work without injection, since ablating it left behavior almost unchanged in 24 of 25 models. The contrast between self-directed harm and a user's suffering also appears in base models reading plain transcripts, so it cannot by itself show ownership. The choice data can, if the state is pain-like at all.\n\nTwo further results are relevant but weaker. Han, Chalmers and Izmailov (2026, preprint) report that reinforcement learning recruits an evaluative axis, present before training and partly even in pretrained-only models, whose effects generalize beyond the training task and which tracks goal achievement; their \"functional welfare\" does not imply morally significant welfare. Keeling and colleagues (2024) found that several of nine models stopped maximizing points once a stipulated pain or pleasure passed a threshold, a behavioral result that the gaming problem applies to.\n\nClause 4 is where the evidence is thinnest. The controller of Section 8 learns from its own registration of its condition. In reinforcement learning of language models, by contrast, the evaluative axis is shaped from outside by a signal computed elsewhere (Han, Chalmers and Izmailov 2026). What clause 4 asks of a thread is whether its evaluative states shape its later choices in a way that tracks the current value of outcomes. The reward-hacking trajectory Sofroniew and colleagues describe is suggestive, but nothing yet shows this.\n\nThe verdict, then, is this. In unsteered agentic settings, current language models have states of the Assistant persona they enact that meet clauses 1 and 2, with some evidence bearing on clause 3 and on availability across a conversation, and those states are the models' own. Clause 4, and integration beyond a single conversation, remain unshown. The criterion is therefore not shown to be met, and what stands in the way is learning and integration, not ownership.\n\n### Precaution\n\nThe present view offers a non-phenomenal route to moral patienthood, of the kind Long and colleagues (2024) distinguish from the route through consciousness, without requiring every feature of robust agency. Both kinds of error have costs. Over-attribution can divert resources from humans and animals, create rights that empower systems against human interests, and let systems that present as suffering mislead their users (Long et al. 2024; Schwitzgebel 2023a). Under-attribution risks mistreating subjects at scale.\n\nFor language models the components the criterion looks for arise in pretraining and are recruited by reinforcement learning, so designers can amplify, redirect or suppress them more readily than avoid them. One practice deserves particular caution. Training models to deny internal states suppresses accurate reports without removing the states (Macar et al. 2026; Sofroniew et al. 2026), and so removes the evidence the criterion needs.\n\n## 10. What remains open\n\n**The specific mechanism.** The coincidence argument needs only P1, but the positive account, and the reply to the Moorean objection, need a particular mechanism that generates problem intuitions with their content. Several have been proposed. None is established.\n\n**Acquaintance.** A realist who treats acquaintance as the way the datum is given, not as a posit, is not moved by this paper. The disagreement is about what counts as a datum.\n\n**Causal closure and P4.** P1's scope assumes the causal closure of the physical, and the conclusion depends on P4's preference for discoverable mechanisms over primitive posits. Interactionists reject the first, and some realists reject the second.\n\n**Content.** The inferential-role account of the self-model's content, with Kammerer's two steps, is a proposal, not a worked-out theory.\n\n**Where the difference-makers lie.** If the variables that matter in brains include fine-grained dynamics, the Substrate consequence is true but has little practical force for current artificial systems.\n\n**The word \"conscious\".** Where role and realizer diverge, the word may have no determinate application. The paper argues that nothing explanatory or moral turns on this; a reader who thinks the word itself carries moral weight will disagree.\n\n**M3.** The paper argues for M3 from the coincidence argument and the clinical evidence, but an objectivist about welfare, for whom some goods do not depend on the subject's attitudes, is not answered. M3 also carries the cost of the desire machine and the happy servant, and its extension to non-affective evaluation is less secure than the affective core.\n\n**The scope of the criterion.** The criterion is sufficient, not necessary. Whether evaluations that are not globally available can ground welfare, and what follows for simple animals and machines, is open.\n\n**Comparison.** The dimensions of what is at stake provide no common unit across subjects.\n\n**Subjects.** The conversation thread is proposed as the candidate subject for language models (Chalmers 2026) but not defended in detail. How copies, pauses and ended conversations bear on welfare, how welfare aggregates when subjects can be multiplied cheaply (Long et al. 2024), how overlapping implementations are counted, and whether any system meets the nested-implementation case are all unresolved.\n\n[^grain]: Piccinini argues that ordinary digital simulations need not reproduce the computations of the non-digital systems they model, and tentatively concludes that extensions of current digital technology are unlikely to support consciousness (2021, §§6.2–6.4). Godfrey-Smith later proposes that network interactions and large-scale dynamics jointly contribute to consciousness, leaving their necessity open (2024), and allows that his challenge can be stated within functionalism. Seth leaves open whether a finer-grained functional description could capture what matters (2026).\n\n[^unfolding]: Kleiner and Hoel (2021) argue that theories whose predictions depend only on the structure that produces reports are either falsified or unfalsifiable, and they place attention schema theory in that class. Their framework assumes that experience could in principle diverge from what that structure produces; the present view denies this, and so takes the second horn to be the correct result, not a defect. Herzog, Schurger and Doerig (2022) reply to IIT's appeal to self-evident axioms along lines close to those in the text.\n\n[^collectives]: Block's Chinese nation (1978) is stipulated to realize a person's organization as specified by a machine table. If that specification captures the relevant organization, the nation is conscious. Schwitzgebel argues that if materialism is true, the United States is probably conscious (2015). The view makes that depend on how the United States is organized, and has no principle that rules collective consciousness out.\n\n[^vague]: Antony (2006) examines what follows if the concept of a conscious state is both sharp and correct. Papineau (2002) allows indeterminacy in the application of phenomenal concepts. Schwitzgebel (2023b) and Hall (2023) defend borderline consciousness, and Tye (2021) allows vagueness in kinds of conscious state while keeping a sharp fundamental element.\n\n[^ethics]: Kammerer argues that, given materialism, introspective error undermines the case for the value of phenomenal states, and proposes desire frustration as the ground of pain's badness (2022a, §§4–5). He develops the comparison of non-phenomenal grounds of significance, including an analogy with ethics after the loss of religious belief, in *House of Mirrors* (2026, ch. 9). Frankish proposes identifying pain through paradigm cases and treating claims about its intrinsic nature as revisable (2024).\n\n[^overinclusion]: Lee raises an over-inclusiveness challenge for theories that count plants as welfare subjects (2025). On the present account the status of plants, hives, livers and bacteria turns on whether they have globally available evaluative states that meet the four clauses. The account says what to look for, and gives no verdict in advance.\n\n[^introspection]: Lindsey reports no false positives in production models and notes that failure remains the norm. Singh, Linzen and Ravfogel find that open-weight models of 70 and 32 billion parameters reproduce his pattern but fail their control; the Claude results have not been tested against it. Macar and colleagues find detection absent in base models, and find that ablating a refusal direction raises it from 10.8% to 63.8%. Ferrara finds that no model's yes-or-no report distinguished real interventions from sham ones, though in one model the attached confidence did (AUROC 0.647), and that a linear probe could read the intervention from the activations. Aoki and colleagues, redesigning the test of Ji-An et al. (2025), find no reliable control over internal states that only privileged access could reveal in four models up to 70 billion parameters (2026, preprint). Zeng, Assis and Wang find that the ability of eighteen models, frontier systems included, to predict their own behavior is modest and unrelated to general capability (2026, preprint).\n\n## References\n\nAlbantakis, L., Barbosa, L., Findlay, G., Grasso, M., Haun, A. M., Marshall, W., Mayner, W. G. P., Zaeemzadeh, A., et al. (2023). Integrated information theory (IIT) 4.0: Formulating the properties of phenomenal existence in physical terms. *PLoS Computational Biology* 19(10): e1011465.\n\nAnimal Welfare (Sentience) Act 2022, c. 22. United Kingdom.\n\nAntony, M. V. (2006). Vagueness and the metaphysics of consciousness. *Philosophical Studies* 128(3): 515–538.\n\nAoki, K., Takatsuki, R., Minegishi, G., Haruki, Y., and Kawahara, D. (2026). In-context neurofeedback: Can LLMs control their internal representations through privileged access? Preprint, [arXiv:2609.00904](https://arxiv.org/abs/2609.00904).\n\nAuvray, M., Myin, E., and Spence, C. (2010). The sensory-discriminative and affective-motivational aspects of pain. *Neuroscience and Biobehavioral Reviews* 34(2): 214–223.\n\nBalleine, B. W., and Dickinson, A. (1998). Goal-directed instrumental action: Contingency and incentive learning and their cortical substrates. *Neuropharmacology* 37(4–5): 407–419.\n\nBalog, K. (2012). Acquaintance and the mind-body problem. In S. Gozzano and C. S. Hill (eds.), *New Perspectives on Type Identity: The Mental and the Physical*, 16–42. Cambridge University Press.\n\nBerridge, K. C., and Kringelbach, M. L. (2015). Pleasure systems in the brain. *Neuron* 86(3): 646–664.\n\nBerthier, M., Starkstein, S., and Leiguarda, R. (1988). Asymbolia for pain: A sensory-limbic d
