e developed at ¶46.","signals":[{"q":"near-complete explanation","note":"hedge that concedes minor gaps while still doing the needed work"},{"q":"could obtain without any non-functional property","note":"states the key counterfactual independence claim underlying the whole argument"}],"critique":""},"bo4pjqq":{"kind":"premise","label":"P2: the coincidence dilemma","what":"States that if non-functional phenomenal properties exist and problem intuitions are correct about them, either those properties explain the intuitions' correctness through some non-coincidental connection, or their correctness is a mere coincidence.","how":"A formal disjunctive premise that frames the rest of the argument as a dilemma, to be resolved by eliminating the first disjunct's candidates in P3.","signals":[{"q":"either those properties explain the intuitions' correctness ... or their correctness is a coincidence","note":"sets up the disjunction that structures the following section's case-by-case rebuttals"}],"critique":""},"bea1506":{"kind":"premise","label":"P3: candidate connections fail","what":"States that every proposed non-coincidental connection between phenomenal properties and problem intuitions either fails to reach the topic-neutral intuitions or requires a further primitive posit.","how":"A compressed premise whose defense is deferred to the detailed case analysis under the later 'P3' subsection (constitution, acquaintance, realization).","signals":[{"q":"fails to reach the topic-neutral intuitions","note":"names one failure mode later illustrated by the constitution reply"},{"q":"requires a further primitive posit","note":"names the other failure mode, whose cost P4 formally counts"}],"critique":""},"b1uotcgw":{"kind":"premise","label":"P4: theoretical cost comparison","what":"States that, other things equal, a theory positing non-functional properties and then either accepting a coincidence or adding a primitive posit is worse than a theory positing none.","how":"The explicit ceteris paribus clause marks this as a defeasible comparative preference rather than an absolute refutation, which the paper later acknowledges (¶58) a realist can simply reject.","signals":[{"q":"Other things equal","note":"explicit qualifier that limits the premise's force and concedes it isn't compelling to everyone"},{"q":"either accepts the coincidence or adds a primitive posit","note":"restates the two costly outcomes P3 established as exhaustive"}],"critique":""},"b1dvksc2":{"kind":"conclusion","label":"Conclusion: best explanation posits nothing extra","what":"Concludes that, other things equal, the best explanation of problem intuitions posits no non-functional properties.","how":"Follows as an inference to the best explanation from P1–P4, repeating the 'other things equal' hedge to keep the conclusion comparative and abductive rather than a claim of impossibility.","signals":[{"q":"Other things equal, the best explanation of problem intuitions posits no non-functional properties","note":"repeats the hedge, marking the conclusion as defeasible and comparative, not a proof"}],"critique":""},"bir7bow":{"kind":"evidence","label":"Chalmers concedes P1","what":"The paragraph shows that even realists who posit non-functional properties (Russellian monists, realizationists) admit that the problem intuitions have a near-complete structural explanation that could hold without consciousness. It also flags that Chalmers calls the meta-problem 'strictly speaking one of the easy problems' if behavior is fully physically/functionally explicable, and notes the interactionist is the one view that must reject P1 outright.","how":"The move is to secure P1 as common ground rather than argue for it from scratch, by citing an opponent's own concession; this raises the argument's dialectical force since it isn't just the illusionist's claim. The final sentence carves out an exception (interactionism) and explicitly defers that dispute ('not pursued here'), narrowing the paper's target.","signals":[{"q":"common ground with the realists","note":"signals this premise is not contested by the intended opponents, shifting the burden of proof"},{"q":"at least if all human behavior can be explained in physical and functional terms","note":"hedge marking the conditional nature of Chalmers's concession"},{"q":"must answer the evidence for the causal closure of the physical instead","note":"explicitly scopes out interactionism as an unaddressed rival, a concession of the argument's limits"}],"critique":"Relying on an opponent's concession is rhetorically strong but means the whole argument inherits the causal closure assumption, which is separately contestable (as §10 admits)."},"b1kwq4dr":{"kind":"distinction","label":"local vs global independence","what":"The paragraph blocks a misreading of P2 as relying on a general 'sensitivity principle' (a belief that would be held even if false is unjustified), which fails because it wrongly discredits ordinary perceptual beliefs like a hallucinated table. Instead it introduces Chalmers's distinction between local independence (belief detached from its object, as in hallucination) and global independence (the entire causal story of the belief could unfold identically whether or not the posited property existed).","how":"This is a reply to an anticipated objection, structured as: state the tempting-but-wrong principle, show a counterexample (hallucination) that sinks the strong version, then rescue the underlying worry via a narrower, correctly targeted principle. The distinction is doing definitional work so that P2 survives the counterexample.","signals":[{"q":"That principle proves too much","note":"marks rejection of the naive sensitivity principle via reductio"},{"q":"global independence in which the whole structural explanation of the intuitions could obtain, unchanged, without the properties they are about","note":"precise definition isolating the special case that does the argumentative work"},{"q":"yields a case for coincidence that needs to be addressed","note":"quotes Chalmers conceding the force of exactly this distinction, again borrowing opponent authority"}],"critique":"The move depends on cleanly separating cases where 'something in the structural explanation runs through' the property from cases where it doesn't; a realist could contest whether phenomenal properties really fail this test for causally efficacious versions."},"b5yt7er":{"kind":"signpost","label":"three candidate connections","what":"A one-line transition announcing that P3 will be defended by examining three possible ways a non-functional phenomenal property could be non-coincidentally connected to the topic-neutral intuitions.","how":"Pure structural signpost, setting up the taxonomy that ¶49–¶56 work through one by one (constitution, acquaintance, realization).","signals":[{"q":"There are three candidate connections.","note":"explicit enumeration cueing the reader to expect an exhaustive-seeming survey, which underwrites P3's universal claim ('each proposed... connection')"}],"critique":"The exhaustiveness of 'three' is asserted rather than argued for; a critic could ask whether other connections are conceivable."},"btwhfzi":{"kind":"reply","label":"constitution fails","what":"Considers the idea that phenomenal properties partly constitute phenomenal beliefs, so the duplicate's beliefs are false or empty; concedes this may work for beliefs 'individuated in that way' but argues it doesn't touch the topic-neutral E4 intuitions, which are shared with the duplicate and produced identically in both, yet false in the duplicate. Their truth in us would then depend on an unexplained lawful pairing, which is exactly what P4 is designed to penalize.","how":"The paragraph grants the constitution view a narrow victory (a concession) before showing it's irrelevant to the actual explananda (topic-neutral intuitions), a move that preserves P3 by re-focusing the target. It closes by citing Chalmers's own agreement that once intuitions are functionally characterized, 'constitution and acquaintance replies do not really get a grip.'","signals":[{"q":"That may be right for beliefs individuated in that way","note":"concession marking the scope-limit of the reply"},{"q":"assessed by their topic-neutral contents, which we share with the duplicate","note":"reasserts the definitional move from §2 that fixes what must be explained"},{"q":"do not really get a grip here","note":"borrowed quotation used as authoritative confirmation that constitution/acquaintance fail against topic-neutral intuitions"}],"critique":"The argument assumes the topic-neutral/full-content distinction is legitimate and exhaustive; a realist could insist the full phenomenal content is what needs vindicating, not just the topic-neutral remainder."},"bart3fo":{"kind":"dilemma","label":"acquaintance's three fates","what":"Considers acquaintance (direct, non-belief-based knowledge of one's states) as a possible non-coincidental link. It argues that if acquaintance is a physical relation consisting in the organization, it's already covered by P1 and is no further fact; if it's a physical relation beyond the organization, it becomes a realizer property handled in §4; if it's primitive, it can offer justification but still can't explain why the topic-neutral intuitions (including the intuition of being acquainted) are correct, since the duplicate has all of them too.","how":"This is a three-horn dilemma exhausting acquaintance's possible metaphysical status, each horn either collapsing the view into 'no further fact' or deferring it to another section or flagging it as a cost under P4. The final sentence explicitly assigns the primitive-posit cost to P4's ledger rather than resolving the dispute outright.","signals":[{"q":"If acquaintance is a physical relation that consists in the relevant organization, it is part of P1's explanation","note":"first horn, collapses acquaintance into the functional story"},{"q":"it does not explain why the topic-neutral intuitions are correct, since the duplicate has all of them","note":"key argumentative payload: even primitive acquaintance can't beat the duplicate symmetry"},{"q":"P4 counts it as one","note":"explicit hand-off marking this as a comparative cost rather than a refutation"}],"critique":"The paper doesn't fully rule out that acquaintance could be a sui generis, non-'primitive-posit' kind of explanation that resists this trichotomy; a realist like Giustina or Duncan might reject the forced choice between 'physical' and 'primitive.'"},"b1f1lhfy":{"kind":"taxonomy","label":"realization and its three possibilities","what":"Introduces the third candidate connection: phenomenal properties might realize (constrain the causal powers of) the intuition-producing processes, citing Mørch's phenomenal powers view and Saad's fundamental law linking experience to rationalized action. It notes Saad's proposal is interactionist (properties affecting physical events) and then sets up three sub-possibilities for Mørch's view, to be examined in the next paragraphs.","how":"This paragraph is a structural pivot: it names the two live proposals, sorts one (Saad) out of scope as already-addressed interactionism, and hands the more serious challenge (Mørch) to a three-way branching analysis in ¶52–54.","signals":[{"q":"Chalmers regards both as promising","note":"flags these as the strongest remaining challenges, raising the stakes for what follows"},{"q":"Saad's law lets phenomenal properties affect physical events, so it is interactionist","note":"a classificatory move that exempts Saad from the current physicalist-focused dialectic"},{"q":"For Mørch's view there are three possibilities","note":"explicit signpost for the branching argument to come"}],"critique":"None flagged; this is largely organizational, though one could ask whether Saad's proposal deserves fuller treatment rather than being set aside as 'interactionist.'"},"b1blvn0t":{"kind":"argument","label":"horn: nature varies freely","what":"If a state's phenomenal nature could vary independently while the organization stays fixed, then the varying part is a non-functional property, and the global-independence argument of P2 applies directly to it.","how":"This is the first branch of the dilemma set up in ¶51, phrased as a conditional that folds straight back into the paper's central machinery (P2's global independence), showing the branch adds nothing new.","signals":[{"q":"The part that varies is a non-functional property","note":"labels the variable component precisely as the target category the whole coincidence argument is built to catch"},{"q":"the global independence of P2 applies to it","note":"explicit cross-reference collapsing this branch back into the main argument rather than treating it as a separate case"}],"critique":""},"b15npar6":{"kind":"argument","label":"horn: nature is the role","what":"If the phenomenal nature just consists in the organization's role properties, then there is no further fact at all — this branch simply concedes the paper's thesis.","how":"The shortest possible branch: a one-sentence dispatch showing that this option is definitionally equivalent to the paper's own 'no further fact' thesis, requiring no further argument.","signals":[{"q":"Then there is no further fact.","note":"flat declarative marking immediate victory for the thesis under this branch, no hedging needed"}],"critique":""},"b185y4ws":{"kind":"argument","label":"horn: necessitated surplus","what":"The third option is that the organization necessitates the phenomenal nature without that nature consisting in it — Chalmers's 'strong' version, where pain has its causal powers essentially yet still has a phenomenal nature 'beyond' those powers. The paragraph argues that given the powers are fixed, the extra phenomenal surplus is conditionally irrelevant to the intuitions, and the necessary tie between them is exactly the kind of primitive posit P4 penalizes.","how":"This branch is treated most seriously since it resists easy collapse; the paragraph uses the paper's own technical vocabulary ('conditionally irrelevant', from §2's difference-making criterion) to show that even a metaphysically necessary surplus fails the explanatory test, then explicitly reclassifies it as a P4-cost rather than a refutation.","signals":[{"q":"still has a phenomenal nature that goes beyond the causal power","note":"direct quotation of Chalmers's own formulation of the strongest version of the view under attack"},{"q":"Given the powers, that surplus is conditionally irrelevant to the intuitions","note":"applies the technical difference-making criterion from §2 to adjudicate this branch"},{"q":"a primitive posit of the kind P4 counts as a cost","note":"explicit accounting move, not a knockdown refutation but a comparative cost assignment"}],"critique":"Labeling necessary-but-non-constitutive surplus as merely a 'cost' rather than impossible leaves the realist an escape route if they're willing to accept theoretical primitiveness, which ¶58 later admits stops the argument for such a realist."},"b1dhs4gb":{"kind":"concession","label":"third horn's partial success","what":"The paragraph concedes that the third possibility (necessitated but non-constitutive surplus) is strong enough to support the paper's Substrate and Knowledge consequences, since those only require necessitation across possible systems. But it denies this saves the moral argument of §8, which needs full constitution, since on this view the surplus itself could be what makes pain bad. It also flags an unresolved 'combination problem' for all three possibilities.","how":"This is an explicit qualification narrowing the scope of the paper's victory: it distinguishes which downstream claims survive and which don't under this specific rival view, a careful concession rather than an overreach. The final sentence adds a further outstanding difficulty (the combination problem) as an open cost for the realization view generally.","signals":[{"q":"calls for a concession","note":"explicit marker that the author is conceding ground rather than claiming full victory"},{"q":"It would not support the moral argument of Section 8, which needs constitution","note":"precise scope-limiting distinction between necessitation and constitution, tied to which sections require which strength of thesis"},{"q":"the combination problem remains: how micro-level natures could make up the powers involved in introspective judgment","note":"names an independent, unresolved difficulty left dangling for the realization view"}],"critique":"By conceding this much, the paper implicitly admits its moral argument (§8) rests on a stronger and less secure premise than its metaphysical consequences, a asymmetry a critic of §8 specifically could exploit."},"b1jy71bq":{"kind":"objection","label":"realization must explain more than 'I'm in pain'","what":"The paragraph raises a further demand on any realization account: it's not enough to explain the bare judgment 'I am in pain'; the account must also explain why we judge the state to be intrinsic, ineffable, and beyond functional description (the actual content of E4). It notes a felt quality alone doesn't obviously deliver those judgments, leaving realists to either concede they're false (weak illusionism) or invoke 'Revelation' (which just relocates the dispute to acquaintance), and dismisses a bare correlational law as not really a fourth option since it merely restates the correlation rather than explaining it.","how":"This functions as an additional, sharper objection layered onto the whole realization discussion, tightening the explanatory target from a generic pain-judgment to the specific rich content of problem intuitions defined in ¶21 (E4). It closes off an apparent escape route (a bare fundamental law) by arguing it doesn't add explanatory content, and it defers final judgment on richer laws (like Saad's) to case-by-case assessment.","signals":[{"q":"A felt quality, even if present, does not obviously make those judgments true","note":"presses the gap between having a quale and having the specific meta-cognitive judgments that need explaining"},{"q":"which returns the dispute to acquaintance","note":"shows the Revelation escape route just relocates rather than resolves the problem, tying back to ¶50"},{"q":"A fundamental law saying only that a non-functional property and an intuition go together is not a fourth route, since it restates the correlation","note":"explicit rejection of a cheap escape, insisting a real explanation must do more than assert the correlation"}],"critique":"The final line ('assessed case by case') is a notable hedge that leaves open whether Saad's specific law might actually satisfy the stronger explanatory demand, somewhat softening the paragraph's otherwise firm conclusion."},"bftsqm":{"kind":"conclusion","label":"abductive verdict, not proof","what":"The paper states what the coincidence argument actually establishes: a comparative theoretical cost against non-functional properties, not a demonstration that such properties are impossible. A realist who rejects the underlying preference for explanatory economy (P4) simply won't be moved.","how":"Explicitly restates the argument's abductive character and marks a dialectical stopping point for a certain kind of opponent, then defuses overclaiming by conceding what the conclusion does not show, before signposting the two remaining challenges the rest of the paper must address.","signals":[{"q":"will not be persuaded, and for that realist the argument stops here","note":"marks an acknowledged limit to the argument's force"},{"q":"does not show that non-functional properties are impossible","note":"explicitly limits the strength of the conclusion"},{"q":"Two candidates for something weightier remain","note":"signposts forward to Sections 4 and 6"}],"critique":"Conceding that a realist who denies P4 is simply unpersuaded leaves the argument's force resting entirely on a contested methodological preference, which critics could reject wholesale."},"b1fejrql":{"kind":"dilemma","label":"setting up the realizer dilemma","what":"Defines Q as whatever non-functional property a theory (biological naturalism, Searle, IIT) claims consciousness requires beyond the relevant organization, and asks what Q contributes beyond the organizational variables it realizes.","how":"Introduces a variable placeholder (Q) to generalize across otherwise very different theories, grounds it with concrete examples, and quotes IIT proponents to establish that Q is meant to do real causal work, not sit idle epiphenomenally, before posing the guiding question the next two paragraphs answer.","signals":[{"q":"a property Q that a theory says consciousness requires or consists in but that is not part of the relevant organization","note":"stipulates the target of the whole dilemma"},{"q":"we\", and not our neurons or atoms, \"are the true cause of our willed actions","note":"quoted to show realizer theorists insist Q is causally efficacious, ruling out an easy epiphenomenalist dismissal"},{"q":"The question is what Q contributes beyond the variables it realizes","note":"states the organizing question of the dilemma"}],"critique":""},"b4qmiui":{"kind":"dilemma","label":"horn one: Q collapses into organization","what":"If Q's contribution to the explananda is already captured by some variable in V, then Q is simply part of the relevant organization and there is no further fact; whether an artificial system can replicate that variable is a separate empirical matter, possibly a hard one.","how":"Uses a conditional ('If... Then...') to state the resolving case, then immediately reclassifies substantive scientific disagreements (Godfrey-Smith on metabolism, Seth on scale-separation) as disputes about which variables belong in V rather than evidence of a further fact, folding potential objections into the framework.","signals":[{"q":"Then Q's role is part of the relevant organization, and there is no further fact","note":"the conditional's resolving clause, doing the dilemma's main logical work"},{"q":"these are claims about which variables are in V","note":"reframes rival empirical claims as internal to the paper's own criterion rather than external challenges"}],"critique":""},"b6ey1zk":{"kind":"dilemma","label":"horn two: idle difference, residue of luck","what":"If what distinguishes Q from other possible realizers makes no difference to E1–E4 once V is fixed, then a system built from a different realizer would behave and judge exactly as we do, yet the theory denies it consciousness—making our own correctness a matter of luck.","how":"Contrasts this case with the earlier perceptual/table example to show the disanalogy (nothing here 'runs through' the object as in perception), and quotes Chalmers's own concession to lend the point authority from an opponent rather than mere assertion.","signals":[{"q":"changes nothing in our judgments","note":"the diagnostic criterion for horn 2, echoing Section 2's conditional irrelevance"},{"q":"it seems lucky that the meta-problem processes are in fact realized by consciousness rather than by something else","note":"quotes the rival theorist conceding the cost the paragraph is describing"}],"critique":""},"b8qc2d0":{"kind":"distinction","label":"twin-consciousness: semantic slip or real loss","what":"On horn 2 the duplicate can be read two ways: either it has something just as good as consciousness, making the dispute merely verbal, or it lacks everything that matters, making our own correctness a coincidence and paying the theoretical cost described in Section 3.","how":"Splits horn 2 into two exhaustive alternatives via 'It may... Or it may...', cites Chalmers's own concession on the first alternative to show the realist's position tends toward semantic deflation, and explicitly cross-references Section 3 to tie the second alternative back to the earlier coincidence machinery.","signals":[{"q":"if twin-consciousness is as good as consciousness in all respects it is consciousness","note":"quoted concession showing the realist's own reply collapses the dispute into semantics"},{"q":"which is the global independence of Section 3","note":"explicit cross-reference linking this horn to the earlier argument's technical apparatus"}],"critique":""},"b5336oo":{"kind":"comparison","label":"aligning with, and refining, the unfolding argument","what":"The dilemma is presented as a version of the existing 'unfolding argument' with one change: sameness between systems must be established through interventions on internal variables, not mere input-output matching, which blocks the standard objection that the argument assumes behaviorism.","how":"Names the prior argument explicitly and flags 'one change' as the paper's specific contribution, then directly answers a cited objection (Tsuchiya, Andrillon and Haun) by explaining why the modification defeats it, ending by relocating the remaining dispute to a question about grain-individuation.","signals":[{"q":"with one change","note":"marks precisely what is original versus borrowed from the literature"},{"q":"leaves the dispute where it belongs: over which grain individuates consciousness","note":"reframes the residual disagreement in the paper's own technical terms"}],"critique":""},"b1oe2obj":{"kind":"evidence","label":"the chip-replacement test for IIT","what":"Describes a proposed experiment where each neuron is replaced by a functionally identical chip; IIT predicts consciousness only if each chip is internally integrated, even though nothing about behavior or reports changes—showing the difference IIT cares about is conditionally irrelevant to E1–E4 and so falls on horn 2.","how":"Uses a citable, concrete experimental design (Findlay et al.) as a real instance of the abstract dilemma, applying the paper's own technical vocabulary directly to classify the result, and briefly notes and sets aside a complication about whole-brain simulation via a footnote.","signals":[{"q":"similarly conscious","note":"IIT's own predicted verdict when chips are integrated, used against the theory"},{"q":"unconscious as a whole","note":"IIT's predicted verdict when chips are not integrated, showing the difference lies entirely inside each chip"},{"q":"falls on horn 2","note":"explicitly classifies the case using the dilemma's own labels"}],"critique":""},"b12ox3cx":{"kind":"objection","label":"the acquaintance retreat for IIT's axioms","what":"IIT might reply that its axioms rest on experience itself rather than organization; the paper answers that introspection, reasoning and conceivability judgments are themselves E4 processes that run identically in the unintegrated-chip system, leaving only the bare 'experience exists' axiom as an appeal to acquaintance.","how":"States the strongest available reply for the opponent, then reclassifies its evidential basis as itself part of what needs explaining, narrowing IIT's remaining resource to a single primitive claim already addressed in Section 6, and closes with a supporting quotation from Chalmers.","signals":[{"q":"drawing on introspection and reason","note":"IIT's own stated method, quoted so it can be reclassified as an E4 process"},{"q":"Only the zeroth axiom, that experience exists, is an appeal to acquaintance","note":"narrows the opponent's surviving move and links it forward to Section 6"},{"q":"it is far from obvious how high phi even causes the reports","note":"independent quoted support from Chalmers reinforcing the objection"}],"critique":""},"b18w10ed":{"kind":"evidence","label":"the INTREPID prediction test","what":"Describes a planned experiment inactivating neurons that were inactive during a trial; IIT predicts a resulting bias in judgments while rival theories predict none. The paper's own criterion agrees with IIT's rivals here, since inactivating never-firing neurons cannot change any judgment made in that trial, though a bias found would instead show the manipulation disturbed actual activity (horn 1).","how":"Applies the horn 1/horn 2 distinction to a forthcoming real experiment, stating a specific falsifiable prediction and explaining in advance how a seemingly contrary result would be reinterpreted, which demonstrates the framework's resilience without making it unfalsifiable.","signals":[{"q":"IIT predicts a bias, and its rivals predict none","note":"states the concrete empirical stakes distinguishing the theories"},{"q":"the view predicts what IIT's rivals predict about the experiment","note":"commits the paper's own framework to a specific testable outcome"},{"q":"which is horn 1","note":"shows how an apparently disconfirming result is reclassified within the dilemma's own vocabulary"}],"critique":""},"b169nlb2":{"kind":"taxonomy","label":"Searle placed on horn 2","what":"Searle's thought experiment replaces neurons with chips that duplicate all input-output functions of the nervous system while consciousness is supposedly lost, and he concludes that functional organization is metaphysically irrelevant to consciousness. The paper separates this metaphysical claim from Searle's other, empirical claim that silicon could not really duplicate neurons' causal powers.","how":"The paragraph slots Searle into the dilemma set up in §4 by quoting his own words, then explicitly splits his position into two independent claims so that only one falls under 'horn 2' and the other is redirected to the horn-1 empirical dispute about what V requires.","signals":[{"q":"ontologically speaking, behavior, functional role, and causal relations are irrelevant to the existence of conscious mental phenomena","note":"Searle's own conclusion, quoted to show unambiguous commitment to horn 2"},{"q":"His separate claim","note":"explicit signal that the paragraph is dividing one philosopher's view into two distinguishable claims"}],"critique":"Treating Searle's empirical skepticism as a separate 'horn-1' matter conveniently defuses the more famous objection but may understate how much his metaphysical argument depends on that empirical premise."},"b19aaozx":{"kind":"thought-experiment","label":"fading qualia as coincidence over time","what":"The paragraph reprises Chalmers's fading qualia argument: as neurons are replaced one by one by organization-preserving devices, if experience faded while judgments stayed constant, the person would end up confidently and wrongly certain about their own mind. It treats this as the coincidence argument unfolding in time, and surveys two replies (IIT's shrinking complex, Mogensen's borderline states) that both still concede a false end-state report.","how":"The move reframes a well-known argument as an instance of the paper's own general pattern ('the argument from coincidence'), which lets it recruit the machinery of §3 rather than build a new case; noting that rival replies still concede the crucial datum turns those replies into partial confirmations of the paper's own point.","signals":[{"q":"the coincidence argument run over time","note":"explicit identification linking this classic argument to the paper's central pattern"},{"q":"confidently wrong about their own mind","note":"restates the coincidence problem in vivid first-person terms to sharpen the intuition"},{"q":"Both replies, however, accept an end state that reports falsely about its own experience","note":"turns cited counter-replies into concessions supporting the author's own conclusion"}],"critique":"The claim that both replies 'accept' a false end-state may be too quick; Mogensen's borderline-case framing is meant precisely to deny that there is a determinately false report, so calling it a concession may beg the question."},"b1tr3i36":{"kind":"objection","label":"answering the simulated-stomach analogy","what":"Addresses the common objection that a simulated brain no more has experience than a simulated stomach digests food. It argues the analogy only holds if consciousness were a separate causal product (like digested food) or an intrinsic property of the substrate (like the mass of a real star); since consciousness is neither, the analogy fails, and the intrinsic-property option collapses into the realizer view already refuted.","how":"The paragraph uses a conditional ('The analogy would hold if...') to isolate exactly which premise the objection needs, then denies that premise by appeal to the paper's own definition of the explananda (E1-E4), and finally shows the one surviving reading of the objection reduces to a case the dilemma of §4 already handles, avoiding duplicated argument.","signals":[{"q":"The analogy would hold if","note":"conditional framing that isolates the hidden premise doing the objection's work"},{"q":"Consciousness has no product beyond E1–E4, which are relations among states, inputs and outputs","note":"direct denial of the premise, grounded in the paper's earlier definitions"},{"q":"which the dilemma answers","note":"cross-reference collapsing the remaining option into an already-settled case"}],"critique":"The move assumes without much defense that consciousness could not be a 'product' in the relevant sense, which is exactly what a realist about phenomenal properties would dispute."},"b1b8myyh":{"kind":"objection","label":"conceding semantic indeterminacy","what":"Presents Block's 'harder problem': physicalism alone can't settle whether 'conscious' names the functional role or its physical realizer. The paper accepts that where role and realizer diverge the word may be genuinely indeterminate, but insists nothing explanatory or predictive depends on that, while granting (via the 'torture' comparison) that normative uses of the word could matter - a worry it says §8 defuses.","how":"The paragraph concedes the objection outright ('It does') rather than resisting it, then narrows the concession's importance by distinguishing semantic indeterminacy from substantive (explanatory or moral) stakes, closing with a deferral to a later section and an analogy to a resolved historical dispute ('life' after vitalism).","signals":[{"q":"presupposes phenomenal irrealism","note":"Block's charge, quoted before being accepted rather than rebutted"},{"q":"It does, and Section 3 argues for it","note":"blunt concession combined with a pointer to where the concession is actually earned"},{"q":"Life after vitalism is the model","note":"analogy used to reassure that indeterminate terminology needn't threaten explanatory or practical significance"}],"critique":"The vitalism analogy assumes the disanalogy between 'alive' and 'conscious' won't reintroduce moral stakes, but the paper itself admits words with 'normative weight' are different, so the analogy may not fully cover the case it's meant to settle."},"bohkugg":{"kind":"stipulation","label":"positing first-order states and self-model","what":"States what the theory takes to genuinely exist: ordinary functional states like seeing red or being in pain, defined by their role in the relevant organization, plus an introspective self-model - a subsystem that represents some of these states in compressed form for use in controlling the system.","how":"This is a positive ontological commitment, introduced with stipulative verbs ('accepts,' 'posits'), that sets up the explanatory machinery used later (§6) to answer the Moorean objection without appeal to non-functional properties; noting that the self-model 'leaves out the mechanisms' plants the seed for the error account in the following paragraphs.","signals":[{"q":"It also posits an introspective self-model","note":"explicit introduction of a new theoretical entity"},{"q":"in compressed form, for use in controlling the system","note":"ties the self-model's existence to a functional role, keeping it consistent with the no-further-fact thesis"},{"q":"leaves out the mechanisms that produce them","note":"sets up the incompleteness/error distinction developed in the next paragraph"}],"critique":""},"bv4k4wo":{"kind":"argument","label":"self-model as source of illusion","what":"Hypothesizes that the self-model represents states as simple, present, belonging to one subject, and directly known; merely leaving out detail is not yet an error, but the self-model's further inferential role - licensing the belief that a state has no hidden nature and is known infallibly - is what generates the false appearance of intrinsic, ineffable qualities. Cites related work (Metzinger's transparency, Kammerer's mechanism, attention schema theory, Pereboom) as converging support.","how":"The paragraph carefully distinguishes incompleteness from error to block a cheap objection (any compressed model is 'incomplete') before locating the actual mistake in a specific inferential move, which sharpens and narrows the claim being defended; it then bolsters plausibility by citing several independent research programs that propose similar mechanisms, without claiming any one of them is confirmed.","signals":[{"q":"Leaving out detail is by itself incompleteness, not error","note":"explicit distinction preempting a trivializing objection"},{"q":"licenses the system to treat its states as having no nature beyond how they are presented","note":"names precisely where the error is supposed to arise"},{"q":"which is Metzinger's account of transparency","note":"anchors the speculative mechanism in existing, independently motivated theory"}],"critique":"The specific claim about 'inferential licensing' is asserted rather than independently evidenced; the cited theories support something in this vicinity but not this exact formulation."},"b7m5ig5":{"kind":"inference","label":"predicting the explanatory gap","what":"Argues that the puzzling explanatory gap between physical descriptions and subjective experience is exactly what the self-model account predicts, since the self-model presents a state stripped of the mechanisms that produce it, so no mechanistic description will ever seem to 'line up' with it. Adds that the represented states are also globally available for report, planning and control - which is Block's access consciousness - and this part is real, not illusory.","how":"The move claims explanatory success as evidence for the theory ('the explanatory gap is predicted'), which strengthens its credibility by showing it accounts for an independently recognized puzzle as a byproduct rather than an ad hoc patch; it then draws a careful boundary around what is denied (phenomenal character) versus affirmed (access/global availability), guarding against overclaiming.","signals":[{"q":"the explanatory gap is predicted","note":"claims a positive, testable payoff for the theory, a mark of explanatory strength"},{"q":"nothing lines up, and the mismatch looks like a gap in the world","note":"gives the causal story for why an illusory gap would feel metaphysically real"},{"q":"and it is real","note":"qualification marking exactly where illusionism stops, preserving access consciousness as genuine"}],"critique":""},"byntglq":{"kind":"qualification","label":"what the evidence actually supports","what":"Separates two claims: that introspection is representational and often mistaken (well supported by evidence such as misjudging emotions or the clarity of peripheral vision) from the much more specific hypothesis that a self-model of this particular kind produces problem intuitions with their exact content (not directly tested, and not something that distinguishes illusionism from realism). Notes the coincidence argument itself needs only that some functional explanation exists, which realists already grant, while the positive account and the reply to the Moorean objection need the specific mechanism to be correct.","how":"This is a self-limiting move: the author explicitly flags where confidence is warranted and where it is not, rather than letting the reader assume all of Sections 5-6 rest on solid evidence; it cites Kammerer's meta-level defense (that some theory of this general type is well supported even if no specific version is confirmed) to soften, without erasing, the admission.","signals":[{"q":"The evidence for this picture should be stated once and plainly","note":"signals an unusually direct, honest stock-taking of evidential limits"},{"q":"That a self-model of this kind produces problem intuitions with their specific content is a hypothesis","note":"explicitly labels the weaker, unproven claim as a hypothesis rather than an established result"},{"q":"the positive account is only as strong as the theories that fill it in","note":"final qualifying admission scoping the whole positive account's reliability"}],"critique":"This concession is significant: it means the reply to the Moorean objection (§6), which depends on this specific mechanism, is only as secure as an admittedly untested hypothesis, which a determined realist could exploit."},"b16718fw":{"kind":"distinction","label":"quasi-phenomenal vs philosophers' concepts","what":"Ordinary words like \"conscious\" or \"pain\" pick out functional (quasi-phenomenal) states and keep working once the theory of their nature changes, the way \"life\" survived the death of vitalism. Technical philosophers' terms like \"quale\" build in intrinsic, directly-revealed character, and nothing satisfies that description.","how":"Introduces Frankish's term as a label for the earlier positive account, then splits vocabulary into two classes by what each is defined to require, so the failure of philosophers' concepts doesn't touch ordinary usage. The vitalism analogy licenses treating reference-continuity as unproblematic.","signals":[{"q":"quasi-phenomenal","note":"borrowed technical term marking states that merely dispose introspection to seem phenomenal"},{"q":"as \"life\" did when vitalism was dropped","note":"analogy used to defuse worry that dropping a metaphysical story empties a term of meaning"}],"critique":"Whether ordinary concepts really behave like \"life\" rather than being more tightly bound to phenomenal character is exactly what's disputed, so the analogy assumes part of what needs showing."},"b12dmrx9":{"kind":"concession","label":"realist can keep the word 'phenomenal'","what":"A physicalist who agrees there's no further fact could still call the role-states phenomenal, using Loar's idea of concepts that refer directly to physical states without describing them as intrinsic. Several authors think the remaining disagreement, in its weakest form, is just about how to use the word \"phenomenal\"; the paper doesn't need to settle that, but does flag two questions that survive regardless.","how":"Grants ground to a rival camp (a concession) to narrow the real dispute, citing Kammerer, Frankish, Brown and Papineau for the verbal-dispute reading, then explicitly declines to adjudicate it (\"This paper need not decide\") while ring-fencing two substantive residual questions and stating they don't affect the paper's core sections.","signals":[{"q":"Loar was a realist","note":"pre-empts the objection that using 'recognitional concepts' commits one to illusionism"},{"q":"This paper need not decide between those assessments","note":"explicit scope-limiting move, bracketing a dispute rather than resolving it"},{"q":"Neither question bears on Sections 7 to 9","note":"insulates the paper's practical/moral conclusions from this unresolved terminological issue"}],"critique":"Bracketing the verbal dispute is convenient for the paper's practical aims but leaves unclear whether 'strong illusionism' is doing real philosophical work beyond a stylistic choice."},"bmks81n":{"kind":"reply","label":"a theory of self-model content","what":"The view needs to explain how the self-model can represent a property nothing has, and how that representation can feel determinate and substantive. The proposed answer: content is built from real, elsewhere-instantiated features (like primitiveness) misattributed to the state, and the felt sense of a quality 'presenting itself' is just an artifact of the self-model's format.","how":"States Levine's two-part challenge as the target, then answers each part in turn (existence of content, determinacy of content), attributing the account to Kammerer and marking it explicitly as unfinished (\"belongs to the research program\").","signals":[{"q":"how an uninstantiated property can be represented at all","note":"isolates the first horn of the challenge the paragraph must answer"},{"q":"denied as an explanandum","note":"signals a debunking move: the apparent phenomenon is dissolved rather than explained"},{"q":"Working this out in detail belongs to the research program just described","note":"explicit hedge marking the account as a promissory sketch, not a finished theory"}],"critique":"Denying that the 'substantive mode of presentation' needs explaining, rather than explaining it, risks looking like it dodges exactly what realists find most compelling."},"b1qx60zv":{"kind":"objection","label":"Merlo's justification argument answered","what":"Merlo argues that an illusion of pain would still justify believing one is in pain, and that such justification for a phenomenal belief must be true — so illusionism is self-undermining. The paper rejects the second premise: introspective justification, like any other kind, can be misleading.","how":"Presents the rival argument in compressed premise form, then blocks it by denying one specific premise, treating introspection as continuous with fallible perceptual justification rather than as a special guarantor of truth.","signals":[{"q":"immediate justification for a phenomenal belief entails its truth","note":"the premise identified as the weak point"},{"q":"defeasible, like justification from every other source","note":"the reply's key phrase, normalizing introspection as ordinary and fallible"}],"critique":"The reply asserts fallibility by analogy to other justification but doesn't independently establish why phenomenal justification in particular should lack the infallibility Merlo assumes."},"bw91flw":{"kind":"reply","label":"answering Pautz on rationalization","what":"Pautz asks why the effects of experience fit so neatly with the beliefs and actions it's supposed to rationalize. The answer: the basic judgment (having a state with pain's role) really is caused and rationalized by that state, while the extra intuitions about intrinsic, ineffable character are just false products of the self-model, so there's nothing genuine for them to fit.","how":"Splits the target claim into two components (functional judgment vs further intuitions) and gives each a different causal story, dissolving the fit-question for the second component by denying it needs a rationalizing cause at all.","signals":[{"q":"there is nothing for them to be rationalized by","note":"denies the presupposition of Pautz's question rather than answering it directly"}],"critique":"This move works only if the prior self-model story (Section 5) is correct, so it inherits that section's speculative status."},"b1gskr4d":{"kind":"objection","label":"the Moorean objection stated","what":"The strongest challenge doesn't attack a premise but the conclusion directly: if illusionism were true we'd be blank of experience, and we obviously aren't. Chalmers puts the datum not as our finding it obvious that we feel pain, but as the plain fact that we feel pain.","how":"Frames this as targeting the conclusion rather than premises, distinguishing it in kind from the coincidence-argument's premise-by-premise structure, and gives two closely paraphrased formulations from Chalmers to make the challenge as strong as possible before answering it.","signals":[{"q":"targets the conclusion rather than a premise","note":"marks this as a different, more direct kind of objection than P1-P4"},{"q":"the datum is that we feel pain","note":"exact quoted formulation used to set up the analysis in following paragraphs"}],"critique":"None noted; this paragraph is exposition of the objection, setting up the reply that follows."},"b1on9r0h":{"kind":"distinction","label":"three senses of 'the datum'","what":"\"The pain is the datum\" could mean the state itself, the state as represented to the subject, or the state as it is in itself. The paper accepts the first sense as harmless, reinterprets the second as self-model representation (versus the realist's acquaintance), and rules the third out because a datum must, by definition, be presented to someone.","how":"Uses a three-way disambiguation to relocate the entire dispute onto a single narrow question, closing off one horn by a stipulative point about what \"datum\" means.","signals":[{"q":"to be a datum is to be presented","note":"a near-definitional move that eliminates the third reading outright"},{"q":"the view accepts the first","note":"concedes the weakest reading to defuse the objection's apparent force"}],"critique":"Ruling out the third sense by definition is quick; a realist might insist the state-in-itself can be a datum via direct acquaintance, which is precisely what's contested next."},"b3xutif":{"kind":"distinction","label":"three senses of 'I feel pain'","what":"Borrowing from Kammerer, \"I feel pain\" can mean I'm in a state with pain's functional role, that the state is bad for me and gives me reason to act, or that the state has an intrinsic quality. The view denies only the third.","how":"A tripartite disambiguation that lets the paper affirm two ordinary-language readings of the sentence people find obviously true while denying only the technical phenomenal reading, minimizing what illusionism has to deny.","signals":[{"q":"The view denies only the third","note":"narrows the scope of denial to make illusionism look less revisionary"}],"critique":"This narrowing is persuasive rhetorically but depends on readers accepting that ordinary talk of feeling pain doesn't already smuggle in the phenomenal sense."},"b6b130f":{"kind":"reply","label":"the self-model as the 'intermediate' item","what":"Chalmers demands something between mere judgments and full phenomenal feels — some sense in which our states are 'like this.' The answer: the self-model's act of representing states as primitive and self-revealing is exactly that intermediate item, present prior to and independent of reflection.","how":"Takes Chalmers's own concession (that the illusion involves \"states more primitive than beliefs\") as license to supply a mechanism satisfying his demand, then anticipates that he'll find it an inadequate substitute and answers that objection with a general point about how successful reductions look.","signals":[{"q":"involves states more primitive than beliefs","note":"quoting the opponent to claim his own words support the reply"},{"q":"Successful reductions tend to look like substitutes to anyone who expected more","note":"a general meta-level move discounting the 'feels like a substitute' complaint as an expected artifact of any successful reduction"}],"critique":"The closing aphorism is double-edged: it could equally be used by any inadequate reductive theory to explain away dissatisfaction, so it doesn't uniquely vindicate this account."},"b1s7875d":{"kind":"argument","label":"duplicate runs the same Moorean argument","what":"The functional duplicate makes the exact same Moorean argument with the same confidence, yet on the realist's own view it's wrong. So nothing distinguishes our epistemic position from the duplicate's except the acquaintance claim itself — meaning the Moorean objection has no force beyond whatever force acquaintance already has.","how":"Reapplies the coincidence-argument structure from Section 3 to this specific objection, showing it collapses into the same dialectical spot rather than being an independent, additional consideration.","signals":[{"q":"makes the Moorean argument too, in the same words and with the same confidence","note":"reasserts the duplicate thought experiment to strip the objection of independent weight"},{"q":"Its force is the force of acquaintance","note":"explicit conclusion reducing the objection to a prior, already-addressed posit"}],"critique":"This assumes the duplicate thought experiment is legitimate and decisive, which is exactly what a realist defending acquaintance would resist granting."},"bieuzd7":{"kind":"reply","label":"against Nida-Rümelin's awareness-as-having","what":"Nida-Rümelin holds that having an experiential property just is being aware of it, with no room for a gap. The paper denies this identification: awareness is representation, done by the self-model, and the appearance that awareness and having coincide is itself a product of that representational format.","how":"States the rival's thesis, denies the key identity claim, and folds in a parallel denial of Goff's Revelation doctrine, while immediately qualifying the reply as only as strong as the underlying mechanism from Section 5.","signals":[{"q":"denies that awareness and having coincide","note":"the core rejection, stated flatly"},{"q":"that prediction is only as good as the mechanism of Section 5, so it is not an independent refutation","note":"explicit self-qualification limiting how much weight this reply can bear"}],"critique":"The paragraph itself admits the reply isn't independently decisive, making it more a promissory placeholder than a refutation."},"b1q2enc1":{"kind":"qualification","label":"obviousness still counts for something","what":"The paper admits that the sheer obviousness of having experience retains some evidential weight and that explaining why it shouldn't be decisive is the theory's biggest burden. That burden is to be met only comparatively, by showing the alternatives (unexplained coincidence, primitive acquaintance, fundamental powers) are worse.","how":"A concessive move that keeps the objection alive rather than dismissing it, framing the whole dispute as resting on comparative theoretical cost (echoing P4) rather than any knockdown refutation.","signals":[{"q":"Obviousness keeps some weight","note":"explicit concession preventing overclaiming"},{"q":"the view's largest burden","note":"marks this as the paper's acknowledged weak point"},{"q":"carried comparatively","note":"reiterates the abductive, cost-comparison method used throughout instead of claiming certainty"}],"critique":"By admitting the burden is comparative and not fully discharged, the paragraph concedes the Moorean objection is not conclusively answered, only outweighed on balance."},"b3ccrth":{"kind":"reply","label":"Implementation defined against triviality","what":"Defines when a physical system implements an organization: its states must realize V's variables with the right actual and counterfactual transitions and intervention responses. This is meant to answer arguments that almost any system implements almost any computation.","how":"States the rival worry first, then claims it is 'met' by requiring distinct parts with their own intervention profiles rather than by adding new metaphysics; the phrase 'Nothing further is required' signals the fix is minimal and consistent with the paper's no-further-fact thesis.","signals":[{"q":"almost any physical system implements almost any computation","note":"names the triviality objection being answered"},{"q":"Nothing further is required","note":"signals the reply adds no extra posit, keeping consistency with the thesis"}],"critique":"Whether 'distinct parts with their own intervention profiles' really blocks all triviality arguments is asserted rather than fully argued."},"btavzyc":{"kind":"thought-experiment","label":"Olympia and inert machinery","what":"Applies the implementation criterion to Maudlin's Olympia: with idle backup machinery attached the system implements the organization, because that machinery affects what would happen under other inputs; removing it means the organization is not implemented. The paper rejects Maudlin's assumption that inert machinery is irrelevant to consciousness.","how":"Uses a conditional pair ('With that machinery attached... With it removed...') to let the counterfactual-based criterion of Section 2 do the deciding, then cites Klein's diagnosis that Maudlin's premise rests on an intuition of consciousness as intrinsic and occurrent, which the paper has already denied.","signals":[{"q":"That settles Maudlin's Olympia","note":"claims the case is dispositively resolved by the criterion, not by fresh argument"},{"q":"makes a difference to what the system would do","note":"invokes the intervention/counterfactual test from Section 2"}],"critique":"The claim that this 'settles' the case presupposes the reader already accepts the difference-making criterion from Section 2."},"bs85ot2":{"kind":"distinction","label":"Nesting vs overlap of subjects","what":"Distinguishes two ways one physical system can implement more than one organization at once: nesting, where a larger organization is built from smaller subject-systems (allowing subjects within subjects), and overlap, where the same components realize two organizations at the same level, leaving the number of subjects unresolved.","how":"Uses concrete cases (a time-sharing processor, Block's Chinese nation in a footnote) to anchor the abstract distinction, and explicitly commits on one case while declaring the other an open question, showing the paper's willingness to accept indeterminacy where the criterion doesn't decide.","signals":[{"q":"the view allows subjects nested within subjects","note":"commits to a definite answer for the nesting case"},{"q":"the view leaves the number of subjects unresolved","note":"flags genuine indeterminacy for the overlap case, contrasting with the nesting verdict"}],"critique":""},"b1lkzbby":{"kind":"distinction","label":"Outputs vs organization; testable criterion","what":"Argues that matching a system's outputs is not the same as matching its organization: a language model can produce human-style problem intuitions without the mechanism that produces them in humans, and Section 2's criterion makes this difference empirically testable via interventions on internal states.","how":"Gives a concrete example (trained language model) then states a falsifiable prediction (interventions on internal states should change reports correspondingly if the mechanism is like ours), tying the abstract organizational criterion to an empirical test used later in Section 9.","signals":[{"q":"the criterion of Section 2 makes the difference testable","note":"links the earlier definitional apparatus to a concrete empirical method"},{"q":"without the mechanism that produces them in us","note":"names exactly what could be missing despite matching outputs"}],"critique":""},"b199pbq9":{"kind":"qualification","label":"Borderline cases explained, not eliminated","what":"Because 'relevantly like ours' is vague, there are borderline cases where it is indeterminate whether 'conscious' applies, though some philosophers (Simon) deny any borderline cases exist. The self-model's failure to represent degrees of its own presence explains why the ordinary concept nonetheless feels sharp.","how":"Cites opposing views to show this is a live dispute, then offers an explanatory answer that works on either form of illusionism, explicitly distinguishing this semantic vagueness from the separate role/realizer indeterminacy of Section 4 and denying either bears on morality (forward-referencing Section 8).","signals":[{"q":"is vague, so there are borderline cases","note":"moves from a stipulated vagueness in the concept to a metaphysical claim about indeterminate cases"},{"q":"Neither kind affects what explains E1–E4, or, given Section 8, what matters morally","note":"scope-limits the indeterminacy so it carries no explanatory or moral weight"}],"critique":""},"b8eonkt":{"kind":"reply","label":"Better questions than 'is it conscious?'","what":"Argues that the binary question 'is it conscious?' is less useful than asking about specific functional features: whether a system has states available for flexible control, whether it models its own states, and whether it has evaluative states with wide influence on behavior.","how":"Cites Dung and Kammerer for the general point that locating quasi-phenomenal states isn't enough, then lists three targeted alternative questions, setting up the criteria used to assess AI systems in Section 9.","signals":[{"q":"is less useful than questions about specific features","note":"reframes the debate's central question rather than answering it directly"},{"q":"is not enough by itself","note":"qualifies rather than dismisses the original question, keeping the move modest"}],"critique":""},"b1m4aflk":{"kind":"evidence","label":"Evidence sources: animal vs artificial","what":"For animals, evidence about the relevant organization is behavioral and neural, supported by homology (shared ancestry) for close relatives and by analogy (similar dynamics) for distant groups like cephalopods and arthropods. Artificial systems, lacking evolutionary homology, require structural and causal evidence instead.","how":"Draws an evidential asymmetry between biological and artificial cases and cites literature for each side, preparing the ground for Section 9's discussion of AI-specific evidentiary standards.","signals":[{"q":"Artificial systems offer no homology","note":"marks the key disanalogy that forces a different evidentiary approach for AI"}],"critique":""},"bihlyvm":{"kind":"concession","label":"Theories of consciousness themselves unsettled","what":"Notes that the theories that would tell us what functional evidence to look for are themselves contested, citing an adversarial test of global workspace theory and IIT whose result is disputed by workspace proponents. Attributing consciousness depends on three further factors: fit to a theory's mechanism, the theory's independent support, and confidence in computational functionalism.","how":"Presents a concession that limits confidence in any current empirical verdict, using dueling citations (Cogitate Consortium vs Naccache et al.) as evidence that even a designed adversarial collaboration failed to settle the dispute.","signals":[{"q":"a reading workspace proponents dispute","note":"signals ongoing contestation rather than a settled result"},{"q":"challenged key tenets of both","note":"shows the adversarial test complicated rather than resolved the theoretical picture"}],"critique":""},"btsshno":{"kind":"conclusion","label":"Hard problem adds no extra uncertainty","what":"Concludes that the metaphysical debate contributes nothing beyond ordinary empirical uncertainty, since there is no further fact to be uncertain about. But if the paper's view is wrong, the resulting ignorance is unevenly distributed: it falls on cases like Commander Data or computers (on rival views), not on humans or close animal relatives, who remain undoubted on any view.","how":"Uses a conditional ('If the view is wrong, ignorance is not spread evenly') to show the thesis is compatible with, and explains, our existing confidence patterns about who is conscious, then cross-references Section 1's Knowledge consequence as the payoff of removing the metaphysical barrier.","signals":[{"q":"adds nothing to this uncertainty, because there is no further fact to determine","note":"directly restates the central no-further-fact thesis as doing explanatory work here"},{"q":"ignorance is not spread evenly","note":"names the key asymmetry the paragraph relies on"}],"critique":""},"bxx7fmc":{"kind":"premise","label":"Suffering is bad (M1)","what":"States as a premise that human suffering is bad for the one who suffers.","how":"Presented as a bare, minimally controversial premise labeled 'M1' for use in the syllogism that follows, intended to be common ground with realist opponents as well.","signals":[{"q":"Human suffering is bad for the one who suffers.","note":"stated flatly with no hedge, functioning as an near-undeniable starting point"}],"critique":""},"buwinu7":{"kind":"premise","label":"No further fact about suffering (M2)","what":"States that human suffering, both what it is and what it is like, consists in the relevant functional organization, per the metaphysical argument of earlier sections.","how":"Restates the paper's central no-further-fact thesis as a premise (M2) in the moral syllogism, citing Sections 3 and 4 rather than re-arguing the point, so the moral argument builds directly on the earlier metaphysical one.","signals":[{"q":"consists in the relevant functional organization (Sections 3 and 4)","note":"explicit cross-reference importing the earlier metaphysical conclusion as a premise here"}],"critique":""},"b8jfvjd":{"kind":"premise","label":"Subjectivism about badness (M3)","what":"States the paper's distinctive normative premise: what makes a state bad for a subject consists in the subject's own evaluative stance toward it, with aversion as the paradigm instance in the case of suffering.","how":"Introduces the substantive new premise the paper must argue for (deferred to the following subsection), flagging it as a general principle ('In the core case') of which suffering-aversion is one instance rather than the whole content.","signals":[{"q":"consists in the subject's own evaluative stance toward it","note":"states the core subjectivist claim being added to the argument"},{"q":"In the core case, suffering, that stance is aversion","note":"marks this as a specific instantiation, leaving room for broader application later"}],"critique":""},"blucqsy":{"kind":"inference","label":"Conclusion: badness is organizational","what":"Draws the conclusion that what makes human suffering bad consists in features of the relevant functional organization, specifically the evaluative states that set the subject against its condition.","how":"A straightforward substitution inference from M1–M3 (labeled MC for 'conclusion'), chaining M3's stance-dependence through M2's organizational grounding, with M1 ensuring there is something genuine to explain.","signals":[{"q":"So what makes human suffering bad consists in features of the relevant organization","note":"the 'So' marks this explicitly as the argument's conclusion, drawn from the prior three premises"}],"critique":""},"bpubblu":{"kind":"inference","label":"From welfare to moral status","what":"Walks through how M1–M3 combine to yield MC, then adds a further premise needed to move from welfare to moral status: that being a welfare subject suffices for having moral status, a premise the paper treats as nearly consensual.","how":"Explicitly narrates the logical dependency ('Given M3... given M2... M1 ensures...') before introducing the additional premise, which is supported not by fresh argument but by an appeal to near-universal agreement, quoting Lee.","signals":[{"q":"One further premise takes the argument from welfare to moral status","note":"explicitly marks the logical gap between welfare and moral status being bridged"},{"q":"nearly everyone agrees","note":"appeals to consensus to justify accepting this premise without independent defense"}],"critique":""},"b1trmupw":{"kind":"argument","label":"coincidence argument for M3","what":"The paragraph argues that M3 itself needs support, and gives that support by reusing the coincidence structure from Section 3: if badness were an attitude-independent property, its match with our judgment that pain is bad would be an unexplained coincidence or need a primitive bridge law. It notes that Street's independent evolutionary argument reaches the same conclusion.","how":"The move works by analogy: badness-independent-of-attitude is treated as playing the same role a non-functional phenomenal property played earlier, so the same P1-P4 machinery applies without restating it. The phrase \"Holding M1 fixed\" marks this as a conditional argument that only shows M3 given M1 already accepted, and the closing citation of Street functions as independent corroboration rather than part of the deductive chain.","signals":[{"q":"The coincidence argument supplies one.","note":"explicitly announces that this paragraph is not a new argument but a redeployment of the earlier one"},{"q":"Holding M1 fixed, the alternative is M3.","note":"frames the conclusion as forced by elimination given a fixed premise, not independently established"},{"q":"reaches the same place from evolutionary considerations","note":"signals convergence from a different method as added support, hedged as separate rather than identical"}],"critique":"The whole move inherits the contestability of P4's preference for non-coincidental explanations over primitive posits; a moral realist who rejected P4 in Section 3 can reject it again here."},"b1fc17mo":{"kind":"evidence","label":"forward pointer to clinical data","what":"This short paragraph asserts that clinical evidence (detailed later) also supports locating badness in the affective component rather than in pain sensation itself, using the loss of affect after certain treatments as an example.","how":"It functions as a signpost bridging the abstract argument of ¶117 to the empirical material of ¶124-126, stating the conclusion before the supporting detail is given, which is a common structuring device in the paper.","signals":[{"q":"The clinical evidence below points the same way.","note":"explicit forward reference marking this as a preview rather than a complete argument"},{"q":"The pain nonetheless stops being bad for the subject, who no longer minds it.","note":"encapsulates the empirical claim in one sentence, to be unpacked later"}],"critique":""},"b1q6snm2":{"kind":"reply","label":"resolving the obviousness tension","what":"The paragraph explains why treating M1 (suffering is bad) as obvious does not conflict with Section 6's refusal to treat phenomenal obviousness as decisive: M1 read through M3 is made true by the very state that causes the judgment, unlike the phenomenal claim which posits an intrinsic nature the theory can already explain away. It also brackets debunking arguments about whether welfare matters morally at all as a separate issue that affects every theory equally.","how":"It works by distinguishing two different obviousness claims (phenomenal intrinsicness vs. moral badness) and showing that only one of them faces the coincidence problem, using M3 to ground the second in the causing state itself. The final sentence scopes the argument by explicitly setting aside a further objection as out of scope.","signals":[{"q":"made true by the very state that causes our judgment of it","note":"shows M3 doing the grounding work that removes the coincidence"},{"q":"Debunking arguments aimed at the further claim that welfare matters morally are a separate matter.","note":"marks a scope limitation, deliberately excluding a related but distinct objection"},{"q":"bear on every view equally","note":"neutralizes the excluded objection by claiming it is not a comparative disadvantage for this view specifically"}],"critique":""},"be5zijc":{"kind":"objection","label":"realist keeps M1, rejects M2","what":"The paragraph presents the realist alternative: accept M1 but reject M2 by adding a premise NS (only phenomenally conscious beings are welfare subjects). It examines NS on a functional reading (which the author accepts) and a phenomenal reading, whose two supports—intuitions about duplicates and appeal to acquaintance—are shown to reduce to moves already answered in Sections 3 and 6.","how":"It sets up an inconsistent triad (M1, M2, NS) and argues that rejecting M2 is not cost-free, since the phenomenal version of NS depends on exactly the kind of E4-type intuition or acquaintance-posit the coincidence argument already targets. Quoting Chalmers's own admission about duplicates is used to reclassify his intuition as evidence within the paper's own framework rather than as independent support.","signals":[{"q":"M1, M2 and NS are jointly inconsistent","note":"states the logical structure explicitly, framing the choice as which premise to drop"},{"q":"I don't have the corresponding intuition about non-affective desires in a zombie","note":"quoted intuition used as the target datum to be reclassified"},{"q":"so it is an E4-type judgment, and it falls under Section 3","note":"explicit move folding the objection back into the earlier coincidence machinery"}],"critique":"The reply mainly redescribes the realist's intuitions in the paper's own vocabulary rather than engaging with why a realist might resist that redescription; it also dismisses Lee's neutral phenomenal theory somewhat quickly as collapsing under M2."},"b1uev84g":{"kind":"comparison","label":"Parfit precedent and disanalogy","what":"The paragraph compares the paper's argument structure to Parfit's argument that personal identity involves no further fact, noting Parfit conceded that an unsettling 'Extreme Claim' (no special reason for self-concern) was defensible on his view. It argues the analogous worry does not arise here, because under M3 the badness of suffering was never located in a further fact to begin with.","how":"It uses a historical, well-known philosophical precedent to lend credibility to the paper's argument form, then immediately blocks the worry a reader might raise by disanalogy, using a footnote to develop the point further.","signals":[{"q":"The argument has the shape of Parfit's.","note":"explicit structural comparison signaling borrowed authority"},{"q":"Its analogue fails here, because on M3 the badness of suffering never lay in the further fact.","note":"direct block of the potential parallel worry, doing the paragraph's main defensive work"}],"critique":""},"bui9cke":{"kind":"evidence","label":"dissociating pain's two components","what":"The paragraph reports clinical dissociations between pain's sensory-discriminative and affective-motivational components: asymbolia patients detect pain but don't mind it, a converse lesion patient felt unpleasantness without localization, and hypnosis/morphine can change unpleasantness without changing perceived intensity. It uses these cases to argue that badness tracks the affective component.","how":"It builds an inductive case from four largely independent lines of evidence (lesion studies in both directions, hypnotic suggestion, pharmacology) converging on the same dissociation, while flagging evidential caution about testimony and aphasia to keep the argument grounded in behavior rather than possibly unreliable self-report.","signals":[{"q":"pain without painfulness","note":"quoted phrase (from Grahek) crystallizing the dissociation in one formula"},{"q":"Testimony varies and aphasia often accompanies the condition","note":"hedge limiting reliance on patient self-report and justifying the behavioral focus"},{"q":"unable to learn appropriate escape or protective responses","note":"detail that anticipates the later learning-based welfare criterion (clause 4) in Section 8"}],"critique":"The evidence rests on small clinical samples and interpretively contested testimony (as the paragraph itself admits), so the inductive generalization to 'badness tracks affect' is stronger as a pattern than as a proof."},"b1g6tq89":{"kind":"inference","label":"M3 resolves residual underdetermination","what":"The paragraph notes the clinical evidence shows badness goes with the affective component generally, but is neutral among three possible loci within it: the unpleasantness itself, the drive to end the state, or the state's registering the condition as bad. It then argues that M3 decides in favor of the motivational-evaluative reading.","how":"This is an argument by elimination: empirical data narrows the field but cannot settle among the remaining options, so a prior philosophical premise (M3) is invoked to break the tie, showing how theory and evidence combine rather than evidence alone deciding.","signals":[{"q":"The clinical evidence does not say which part of that component carries it.","note":"explicitly marks the limit of what the empirical data alone shows"},{"q":"M3 decides the matter.","note":"flags the premise, not the evidence, as doing the final interpretive work"}],"critique":""},"b1gnyroh":{"kind":"distinction","label":"affective vs non-affective evaluation","what":"The paragraph distinguishes affective evaluation, where the system is moved to end the evaluative state itself (shown by relief-seeking), from non-affective evaluation, which targets only an external condition, illustrated by Chalmers's 'philosophical Vulcans' who have goals but no affect. It extends the account to cover such non-affective cases via M3, but with less confidence than for ordinary pain.","how":"It introduces a new conceptual distinction to widen the theory's scope beyond the pain cases just discussed, contrasts it with Roelofs's rival view that requires phenomenal consciousness, and explicitly flags the extension as less secure, which limits the paragraph's claim to a qualified generalization.","signals":[{"q":"philosophical Vulcans, beings with goals and evaluations but no affect","note":"example used to illustrate and motivate the new category of non-affective evaluation"},{"q":"with less confidence than the affective core, which the clinical evidence also supports","note":"explicit hedge marking the extension as weaker than the paragraph's central, evidence-backed claim"}],"critique":""},"b3lad9q":{"kind":"distinction","label":"goods vs. subjects","what":"The paper separates the question of what makes a state bad for a subject (settled by M3) from the question of which systems count as subjects at all; a theory of welfare goods alone cannot answer the second question. It grounds the criterion's requirement of global availability in what every clinical case in Section 8 had in common: a conscious human whose affective states were available to attention, memory, planning and action.","how":"Opens with an explicit scope-limiting stipulation, then reasons inductively from a shared feature of all the evidence discussed so far to a necessary ingredient of the coming criterion, while flagging with a hedge that the evidence cannot on its own prove sufficiency. A quotation from Kammerer supplies independent support for treating background facts as usually left implicit.","signals":[{"q":"It does not say which systems are subjects at all","note":"marks a scope limit separating M3 from the theory of subjects"},{"q":"The evidence cannot show that the affective role would suffice without it","note":"hedge acknowledging the inductive step is not fully proven"},{"q":"many facts, which remain implicit","note":"quoted external support from Kammerer for the point about background assumptions"}],"critique":""},"b146tgzq":{"kind":"objection","label":"rival subject theories dismissed","what":"Two competing accounts of which systems are welfare subjects are considered and rejected: a phenomenal theory of subjects collapses into emptiness or functionalism given M2, and a theory requiring self-maintaining biological organization, though it rightly answers a worry about ownership of rewards, wrongly locates what makes pain bad in being alive rather than in evaluation.","how":"Argues by elimination against two rivals, reusing M2 from the earlier moral argument to dispatch the first and using the asymbolia evidence from Section 8 to refute the second; a concession ('The worry is sound') is granted before being redirected to show it supports a different conclusion than intended.","signals":[{"q":"empty or functional under M2","note":"invokes the earlier premise to dismiss the phenomenal rival"},{"q":"The worry is sound, but it concerns ownership, not life","note":"concession followed by redirection, isolating two distinct issues"},{"q":"asymbolic patients remain self-maintaining organisms whose pain has stopped being bad for them","note":"counterexample refuting the self-maintenance theo
