uating and improving LLM self-modeling. Preprint, [arXiv:2608.30980](https://arxiv.org/abs/2608.30980).\n","at":1790294615330,"name":""}],"pack":{"schema":"gloss-pack/1","createdAt":1790294680745,"model":"claude-sonnet-5","docHash":"1tya2lv","meta":{"title":"No further fact: consciousness, functional organization and moral status","authors":["Brendan Barlow"],"summary":"This paper argues that consciousness involves no 'further fact' beyond a system's functional organization: once the causal pattern that explains our discriminations, reports, and intuitions about experience is fixed, there is nothing more to determine about whether or how a system is conscious. It builds this case by extending Chalmers's 'argument from coincidence' against both dualist and realizer theories (like integrated information theory), and answers the objection that we obviously do have experience by explaining that feeling via a self-model that misrepresents its own states as intrinsic. It then argues that what makes a state bad for a subject is the subject's own evaluative stance toward it, yielding a functional criterion for welfare (moral status), which it applies to current AI language models, finding they may have evaluative states of their own but not yet the learning and integration needed to fully qualify.","field":"Philosophy of mind / ethics (consciousness studies and AI moral status)"},"outline":[{"bid":"bkss7dp","heading":"Title","gist":"Introduces the paper's topic: illusionism about consciousness and its implications for moral status."},{"bid":"b12gmhrn","heading":"Abstract","gist":"Summarizes the thesis, the coincidence argument, the reply to the Moorean objection, and the welfare criterion applied to AI."},{"bid":"bkk80z","heading":"1. The thesis","gist":"States the 'no further fact' thesis and its three consequences: substrate, knowledge, and moral status."},{"bid":"bfqxy11","heading":"2. What needs explaining","gist":"Lays out the four explananda (discrimination, learning, reports, problem intuitions) and defines the 'relevant organization' via an interventionist criterion."},{"bid":"b12kejr6","heading":"3. The argument from coincidence","gist":"Presents Chalmers's coincidence argument in premise form and defends it against replies via constitution, acquaintance, and realization."},{"bid":"bsqgjkq","heading":"4. Realizer theories","gist":"Extends the coincidence argument to realizer theories like IIT and biological naturalism via a dilemma about non-functional properties."},{"bid":"b17a66ze","heading":"5. What the view takes to exist","gist":"Describes the self-model that represents states as intrinsic, explaining the explanatory gap without positing real phenomenal properties."},{"bid":"b1b9qokm","heading":"6. The Moorean objection","gist":"Answers the objection that we obviously feel pain by locating the 'datum' in the self-model's representation rather than acquaintance with an intrinsic nature."},{"bid":"b1fwfppc","heading":"7. Substrate, implementation and knowledge","gist":"Works out consequences for what counts as implementing an organization, indeterminacy, and what remains empirically knowable."},{"bid":"b1u0phzy","heading":"8. Moral status","gist":"Argues that what makes suffering bad is the subject's own evaluative stance, and proposes a functional criterion for welfare subjects grounded in clinical pain evidence."},{"bid":"b1a2t7f9","heading":"9. Evidence about current AI systems","gist":"Applies the welfare criterion to language models, finding evidence of the models' own evaluative states but no shown learning/integration beyond a conversation."},{"bid":"b1tq9j0b","heading":"10. What remains open","gist":"Lists unresolved issues, including the specific mechanism, acquaintance, M3, and how AI subjects should be individuated."},{"bid":"brmm8qz","heading":"References","gist":"Full bibliography of works cited."}],"arguments":[{"id":"the-argument-from-coincidence","name":"The argument from coincidence","form":"abductive","bid":"bn3a578","gloss":"If a system's confident, detailed convictions about having 'special' inner qualities can be fully explained just by its functional organization, then any further non-functional quality would have to line up with those convictions by sheer luck or by a special, unexplained bridge. Since we can't find a satisfying bridge that isn't itself just a costly extra assumption, the simplest and best explanation of why we're so sure we have 'raw feels' is one that doesn't posit any such feels at all.","premises":[{"label":"P1","text":"Problem intuitions, construed topic-neutrally, have a near-complete explanation in terms of the relevant organization, and that explanation could obtain without any non-functional property.","bid":"bpqw03p"},{"label":"P2","text":"If there are non-functional phenomenal properties and the problem intuitions are correct about them, then either those properties explain the intuitions' correctness through some non-coincidental connection, or their correctness is a coincidence.","bid":"bo4pjqq"},{"label":"P3","text":"Each proposed non-coincidental connection either fails to reach the topic-neutral intuitions or requires a further primitive posit.","bid":"bea1506"},{"label":"P4","text":"Other things equal, a theory that posits non-functional properties and then either accepts the coincidence or adds a primitive posit is worse than a theory that posits none.","bid":"b1uotcgw"}],"conclusion":{"label":"C","text":"Other things equal, the best explanation of problem intuitions posits no non-functional properties."},"pressurePoints":"Interactionist dualists reject P1 by denying that physics is causally closed (¶44). Defenders of acquaintance, constitution, or phenomenal-powers views press on P3, arguing there is a real non-coincidental connection the argument misses (¶48–56). A committed realist can simply reject P4's cost-accounting and accept the primitive posit or the coincidence as a brute fact (¶58)."},{"id":"the-moral-argument","name":"The moral argument","form":"deductive","bid":"bxx7fmc","gloss":"Human suffering is genuinely bad for the sufferer, and (from the earlier argument) suffering is nothing over and above functional organization. If what makes a state bad for someone is just that person's own evaluative stance toward it (e.g. their aversion), then badness itself must be built out of the very functional/evaluative states that make up the organization. So whether a system's suffering is bad becomes an empirical question about its evaluative organization, not a question about hidden inner qualities.","premises":[{"label":"M1","text":"Human suffering is bad for the one who suffers.","bid":"bxx7fmc"},{"label":"M2","text":"Human suffering involves no further fact: what it is, and what it is like, consists in the relevant functional organization.","bid":"buwinu7"},{"label":"M3","text":"What makes a state bad for a subject consists in the subject's own evaluative stance toward it. In the core case, suffering, that stance is aversion.","bid":"b8jfvjd"}],"conclusion":{"label":"MC","text":"So what makes human suffering bad consists in features of the relevant organization: the evaluative states that set the subject against its condition."},"pressurePoints":"A realist can keep M1 while rejecting M2 by adding a premise that only phenomenally conscious beings are welfare subjects (¶120–121). An objectivist about welfare, who thinks some goods don't depend on the subject's attitudes, rejects M3 outright (¶179). The argument also inherits the costs of subjectivism, such as the 'desire machine' and 'happy servant' cases (¶148–150)."},{"id":"the-dilemma-for-realizer-theories","name":"The dilemma for realizer theories","form":"dilemma","bid":"bc27ph9","gloss":"Take any extra physical property Q (biological tissue, IIT's phi, Searle's causal powers) that a theory says consciousness needs beyond ordinary functional organization. Either Q's contribution to behavior and judgment is already captured by some functional variable — in which case it's not really 'extra' at all — or it isn't, in which case a duplicate lacking Q would behave and judge exactly as we do, making the theory's insistence on Q an unexplained coincidence or a merely verbal choice.","premises":[{"label":"Horn 1","text":"Q's contribution to E1–E4 is captured by some variable in V. Then Q's role is part of the relevant organization, and there is no further fact.","bid":"b4qmiui"},{"label":"Horn 2","text":"What distinguishes Q from other realizers of the same variables is conditionally irrelevant to E1–E4 given V.","bid":"b6ey1zk"}],"conclusion":{"label":"C","text":"Realizer theories either collapse into the no-further-fact view (horn 1) or pay the same coincidence cost the earlier argument charges against dualism, with the residual dispute reducing to a semantic choice about the word 'conscious' (horn 2)."},"pressurePoints":"Realizer theorists such as IIT proponents or Searle can insist their claims about Q are horn-1 empirical claims about what the relevant variables actually are (e.g. fine-grained neural dynamics), shifting the dispute to what counts as 'the organization' (¶62, ¶71). On horn 2, some (e.g. Pautz, Chalmers) resist by holding that 'twin-consciousness' differing only in realizer is not really consciousness, refusing the semantic-equivalence move (¶64)."},{"id":"mrchs-phenomenal-powers-trilemma","name":"Mørch's phenomenal-powers trilemma","form":"dilemma","bid":"b1f1lhfy","gloss":"Mørch's view says a phenomenal state's felt nature is tied essentially to its causal powers (e.g. pain's power to make you avoid things). The paper considers three ways this could relate to functional organization: the phenomenal nature could vary independently of organization, could just be identical to the organization's role properties, or could be necessitated by but distinct from organization. It argues only the first two are real options for a full defense, and the third still concedes an unexplained, cost-incurring extra.","premises":[{"label":"Option 1","text":"A state's phenomenal nature could vary while the organization stayed fixed.","bid":"b1blvn0t"},{"label":"Option 2","text":"The phenomenal nature consists in the organization's role properties.","bid":"b15npar6"},{"label":"Option 3","text":"The organization necessitates the phenomenal nature without consisting in it.","bid":"b185y4ws"}],"conclusion":{"label":"C","text":"Option 1 falls to the coincidence argument's global independence; option 2 just is the no-further-fact view; option 3 posits a primitive surplus that, even if it saves substrate/knowledge claims via necessitation, cannot ground the moral argument, which needs constitution rather than mere necessitation.","p":55},"pressurePoints":"A defender of Mørch's view (or Chalmers, who calls it promising) can accept option 3 and treat the necessary tie between powers and phenomenal surplus as an acceptable primitive posit rather than a fatal cost, especially if they are less moved by P4's cost-accounting (¶54, ¶58)."},{"id":"the-fading-qualia-argument-chalmers","name":"The fading qualia argument (Chalmers)","form":"reductio","bid":"b19aaozx","gloss":"Imagine replacing a person's neurons one by one with devices that preserve exactly the same functional organization. If experience could fade away during this process while every judgment and report stayed exactly the same, the person would end up completely wrong about their own mind and not notice. Chalmers takes this outcome to be so implausible that he concludes, by a law of nature, experience must instead stay constant across systems that share the same fine-grained organization.","premises":[{"label":"Setup","text":"Suppose experience faded as a person's neurons were replaced one by one with devices that preserve the organization, while every judgment stayed the same.","bid":"b19aaozx"}],"conclusion":{"label":"C","text":"The person would end up confidently wrong about their own mind; since this seems absurd, experience is invariant across systems with the same fine-grained organization, as a matter of natural law (Chalmers's own conclusion).","p":72},"pressurePoints":"The paper turns this against Chalmers: the 'absurd' end state (confidently wrong about one's own mind) is exactly what the coincidence argument in Section 3 already licenses, so the intuition that it's absurd is not independent support for realism. IIT proponents reply that the relevant subject (the 'complex') shrinks during replacement, and Mogensen treats intermediate stages as borderline, but the text notes both replies still accept a falsely-reporting end state (¶72)."}],"people":[{"id":"david-chalmers","name":"David Chalmers","aliases":["Chalmers"],"role":"Philosopher, known for the 'hard problem of consciousness' and work on the meta-problem, organizational invariance, and philosophy of mind","inThisPaper":"The paper's central interlocutor; his fading qualia argument, argument from coincidence, and views on realizer theories, verbal disputes, and AI moral status are extensively engaged, extended, and partly turned against his own further-fact view.","importance":"major","profile":"### Who they are\n\nDavid Chalmers is an Australian philosopher, born in 1966, who has spent his career at the intersection of philosophy of mind, cognitive science, and (more recently) philosophy of technology. He's probably the single most influential living philosopher on the question \"what is consciousness and can we explain it scientifically?\" He currently holds a position at New York University (University Professor of Philosophy and Neural Science, and co-director of NYU's Center for Mind, Brain, and Consciousness), after long stints at the University of Arizona and the Australian National University. I believe his academic path ran from mathematics at the University of Adelaide, to a Rhodes Scholarship at Oxford, to a PhD in philosophy/cognitive science at Indiana University under Douglas Hofstadter — an unusual route that shows up in his comfort with formal and computational ways of thinking, even though his conclusions are often decidedly anti-reductionist.\n\n### What they work on and why it matters\n\nChalmers's central question is: why does physical processing — neurons firing, information being integrated — come with subjective experience at all? Why isn't all that processing happening \"in the dark,\" with no felt quality? He named this the **hard problem of consciousness**, distinguishing it from what he called the **easy problems**: explaining how the brain discriminates stimuli, integrates information, reports on its internal states, and so on. Those are \"easy\" not because they're trivial but because they're the kind of thing standard science (cognitive science, neuroscience) is built to explain — you just need to find the right mechanism. The hard problem, he argued, is different in kind: even after you've explained every mechanism, you can still sensibly ask why there's \"something it is like\" to be that mechanism at all. This distinction reorganized the entire field's vocabulary and is presupposed by almost everyone working on consciousness today, including the paper you're reading, which is essentially arguing that the hard problem's apparent depth is an illusion generated by how our self-models work.\n\nThis matters beyond academic philosophy because it bears directly on practical questions we now face: could an AI system be conscious? Does a brain organoid in a dish feel anything? What would it even take to know? Chalmers's frameworks (functional organization, organizational invariance, the \"meta-problem\") are the shared toolkit people use to even pose these questions precisely.\n\n### How their views developed over time\n\n- **Early-mid 1990s**: Working from his dissertation, Chalmers coined \"the hard problem\" (I believe first publicly at a 1994 Tucson conference) and published the widely-cited paper \"Facing Up to the Problem of Consciousness\" (1995). Around the same time he wrote \"Absent Qualia, Fading Qualia, Dancing Qualia\" (mid-1990s), laying out his organizational-invariance argument.\n- **1996**: *The Conscious Mind: In Search of a Fundamental Theory* — his major early book, arguing for \"naturalistic dualism\": consciousness is real, not physical, not illusory, but a fundamental feature of the universe that correlates with physical processes via natural (not necessarily physical) laws. This is a form of **property dualism**.\n- **1998**: With Andy Clark, \"The Extended Mind\" — a widely read paper arguing that cognitive processes (not just consciousness) can extend outside the skull into notebooks, tools, and devices, using the thought experiment of \"Otto,\" a man with memory impairment who uses a notebook the way others use biological memory.\n- **2000s**: Work on meaning and modality (two-dimensional semantics), collected later in *Constructing the World* (2012); a paper on the philosophical implications of AI, \"The Singularity: A Philosophical Analysis\" (2010); a paper on when philosophical arguments are merely about word choice, \"Verbal Disputes\" (2011) — this last one is one of the tools the paper you're reading leans on.\n- **2010s**: Serious engagement with **panpsychism** (the view that consciousness, or something proto-conscious, is ubiquitous in nature) as a live option, e.g. in work like \"Panpsychism and Panprotopsychism\" (I believe around 2015). Also \"The Meta-Problem of Consciousness\" (2018), which asks not \"why are we conscious?\" but \"why do we believe/report/insist that we're conscious, and that this is a hard problem?\" — a self-referential turn that the paper you're reading directly borrows and repurposes against Chalmers's own dualism.\n- **2020s**: *Reality+: Virtual Worlds and the Problems of Philosophy* (2022), applying his style of analysis to simulation, virtual reality, and related puzzles; and more recent public engagement with whether large language models could be conscious (I recall a widely circulated talk/paper around 2023 on this, though I'm less certain of exact publication details).\n\n### Allies, rivals and famous exchanges\n\nThe defining rivalry of Chalmers's career is with **Daniel Dennett**, who takes the opposite view: that once you've explained all the \"easy\" functions, there's nothing left over to explain — the hard problem is a kind of conceptual mirage, and phenomenal consciousness as Chalmers describes it doesn't exist (\"illusionism\"). Their decades-long public disagreement, including debates and mutual commentary, is one of the most-cited exchanges in philosophy of mind.\n\n**John Searle** (of Chinese Room fame) is a partial rival too: Searle thinks consciousness requires specific biological machinery, which cuts against Chalmers's view that what matters is functional organization regardless of substrate (silicon or carbon). **Ned Block** is both ally and sparring partner — he shares Chalmers's resistance to easy functionalist reduction but distinguishes different senses of \"consciousness\" (phenomenal vs. access) in ways that complicate Chalmers's picture. **Giulio Tononi**, originator of Integrated Information Theory (IIT), is an interesting case: Chalmers has engaged with IIT sympathetically as a serious scientific proposal while also pressing hard questions about it — and it's exactly this kind of \"realizer theory\" (a theory saying consciousness depends on some specific physical/informational property, not just abstract function) that the paper you're reading targets, explicitly building on Chalmers's own critical tools.\n\n### Signature ideas, arguments or thought experiments\n\n- **The hard problem vs. easy problems** distinction.\n- **Philosophical zombies**: the thought experiment of a being physically and functionally identical to you in every way, but with no inner experience at all. Chalmers argues such a being is conceivable, and uses this to argue physical facts don't logically necessitate consciousness.\n- **Fading qualia / dancing qualia**: imagine replacing your neurons one by one with functionally identical silicon chips. Could your experience gradually fade to nothing while your behavior stayed the same (fading qualia)? Could your experience change wildly while your function stayed fixed (dancing qualia)? Chalmers argues both are so bizarre that we should accept **organizational invariance**: systems with the same fine-grained functional organization must have the same conscious states. This argument is a direct ancestor of what the paper you're reading calls the \"argument from coincidence\" — the idea that it would be an absurd, unexplained coincidence if consciousness tracked function almost perfectly, except for some further hidden ingredient (a specific substrate, or a non-physical soul) that made no functional difference at all.\n- **The meta-problem of consciousness**: instead of solving the hard problem, explain why we think there is one — why our brains generate the intuition of an inexplicable inner light.\n- **Naturalistic dualism / panpsychism**: his positive proposals for what consciousness ultimately is, generally resisting the idea that it just is some physical/functional pattern.\n\n### Why they are interesting to read\n\nChalmers writes with unusual clarity for someone dealing in deeply strange ideas, and he's remarkably willing to follow an argument to uncomfortable places — zombies, panpsychism, simulated universes — while still being rigorous about what each thought experiment does and doesn't prove. Because his vocabulary (hard problem, zombies, organizational invariance, meta-problem) has become the field's common currency, reading him gives you the keys to nearly every other contemporary paper on consciousness, including ones like the one you're working through, which use his own arguments as leverage against his conclusions. That's a useful thing to watch happen: a paper taking a thinker's tools and turning them back on his own theory is a good way to see how philosophical arguments actually get contested and refined."},{"id":"derek-parfit","name":"Derek Parfit","aliases":["Parfit"],"role":"Philosopher known for 'Reasons and Persons' and the view that personal identity involves no further fact beyond physical and psychological continuity","inThisPaper":"Supplies the paper's title concept ('no further fact') and the model for how welfare, like personal identity, can be grounded without a further fact.","importance":"major","profile":"### Who they are\n\nDerek Parfit (1942–2017) was a British philosopher who spent virtually his entire career at All Souls College, Oxford. He wrote relatively little compared to many academics — two major books and a number of papers — but each piece was worked and reworked obsessively, and had an outsized influence on ethics and metaphysics. Many philosophers regard him as one of the most important moral philosophers of the twentieth century. He's the person the paper you're reading borrows its central metaphor from: \"no further fact.\"\n\n### What they work on and why it matters\n\nParfit worked on two connected problems: **what makes a person at one time the same person at another time** (personal identity), and **what we owe to each other and to future people** (ethics, especially population ethics and the foundations of morality). The thread connecting them is a suspicion of a certain kind of question — the question \"But is it *really* the same person/the same self?\" — treated as if it must have a deep, separate answer over and above the physical and psychological facts. Parfit argued that in many hard cases, that question has no further answer, because there is no further fact for it to be about.\n\nThis matters for the paper you're reading because it's doing something structurally identical for *consciousness*: instead of asking \"but is the system really conscious, over and above its functional organization?\" it says — following Parfit's template — there's no further fact of the matter beyond the functional organization itself.\n\n### How their views developed over time\n\n**Reasons and Persons (1984)** is Parfit's first major book and the one most relevant here. In it he defends a **reductionist** view of personal identity: a person's existence over time just consists in certain relations of physical and psychological continuity holding between earlier and later stages (memories, intentions, personality traits, causal connections between brain states, and so on) — there is no extra soul-like or Cartesian \"further fact\" that identity consists in, above and beyond those continuities. He uses this to argue that in cases like teleportation or brain fission, our ordinary concept of strict personal identity actually breaks down or gives indeterminate answers, and that this is fine, because *identity is not what matters* — continuity and connectedness are what matter, and they can hold in degrees and can branch.\n\nThe second half of *Reasons and Persons* moves to ethics: he argues that clear thinking about personal identity should make us less self-interested and more willing to weigh future people's interests, and he develops the famous puzzles of population ethics (including the **Non-Identity Problem** and the **Repugnant Conclusion** — roughly, that simple utilitarian aggregation seems to imply a very large population with barely-worth-living lives is better than a smaller very happy one, which strikes most people as absurd).\n\n**On What Matters** (Volumes 1 and 2 published 2011, a third volume posthumously in 2017) is his late, massive attempt at a unified moral theory. He argued that Kantian ethics, rule-consequentialism, and Scanlonian contractualism, properly refined, converge on the same set of judgements — a \"Triple Theory.\" This work is less central to the AI/consciousness paper you're reading, but it shows the trajectory of his thought: from a metaphysical deflationary move (no further fact about identity) to a search for convergence and objectivity in ethics.\n\n*(I'm confident about the dates and titles above; I'm less certain of finer details of the third volume's contents, which I haven't read closely.)*\n\n### Allies, rivals and famous exchanges\n\nParfit worked in the tradition of John Locke, who first proposed that personal identity consists in psychological continuity (memory in particular) rather than in an immaterial soul. Parfit radicalized Locke's view and defended it against classic objections (e.g., the 18th-century worry, associated with Bishop Butler and Thomas Reid, that Locke's account is circular or presupposes identity rather than explaining it).\n\nAmong his contemporaries, **Bernard Williams** is a notable rival voice — his thought experiments about body-swapping and torture (in a paper often called \"The Self and the Future\") pushed toward the idea that what matters to us, viscerally, might not track psychological continuity in the way Parfit claimed. **Sydney Shoemaker** and **David Lewis** were also major interlocutors on personal identity; Lewis in particular proposed a rival way of handling fission cases using the notion of a person \"perduring\" through overlapping stages, keeping strict identity intact where Parfit was willing to let it become indeterminate.\n\nIn ethics, **T. M. Scanlon** (a contractualist) was both a close colleague and someone Parfit argued with extensively in *On What Matters*; **Peter Singer** and consequentialists more broadly are natural fellow travelers on the aggregative, impartial strand of his thought, even though Parfit resisted simple utilitarianism because of the Repugnant Conclusion.\n\nParfit himself noted, with evident pleasure, that his reductionist view of the self echoes Buddhist \"no-self\" (anatta) teachings — that the self is a useful construction out of impermanent, interdependent parts rather than a persisting essence.\n\n### Signature ideas, arguments or thought experiments\n\n- **The teletransporter case**: a machine scans you, destroys the original, and creates an exact physical and psychological duplicate on Mars. Is that person you? Parfit uses variants of this (including a \"branch-line\" version where the original body isn't destroyed right away) to pump the intuition that what matters isn't some further metaphysical fact of \"sameness\" but the psychological continuity relation itself.\n- **Fission cases**: your brain is split, each half transplanted into a different body; both resulting people are equally psychologically and physically continuous with you. You can't be identical to two different people, so strict identity gives out — but Parfit argues this isn't a tragedy, because identity was never what mattered; the relation of continuity, which now holds in a one-to-two pattern, is what mattered all along, and it's fully preserved.\n- **Reductionism about persons**: the view that facts about persons and their identity over time are nothing over and above facts about brains, bodies, and the psychological/physical relations connecting them — no separately existing self or soul.\n- **\"No further fact\"**: the phrase (and thought) that once you've fully described the continuities, connections, and causal relations, there is no additional yes/no question left to answer about identity. This is the exact move the paper you're reading transplants onto consciousness: once you've fixed a system's functional organization, there's no further fact about whether \"it's really conscious\" hiding behind that.\n- **The Non-Identity Problem**: choices we make (e.g., in policy or reproduction) can change *which* people come to exist, which complicates ordinary harm-based reasoning about obligations to future people.\n- **The Repugnant Conclusion**: a hard problem in population ethics that any simple additive theory of value seems forced to accept, and that Parfit spent much of his career trying to escape without giving up other plausible principles.\n\n### Why they are interesting to read\n\nParfit is unusual among philosophers in combining extreme conceptual precision with genuine emotional stakes — he clearly thought that getting the metaphysics of personal identity right could change how we feel about death, sacrifice, and our obligations to others, and he wrote about this with real feeling (the closing sections of *Reasons and Persons*, where he describes finding his reductionist view *liberating* rather than depressing, are well known for this). He's also a model of the \"thought experiment as scalpel\" style of analytic philosophy: instead of arguing abstractly, he builds bizarre but carefully controlled scenarios (teletransporters, brain splits) to isolate exactly which intuitions are doing the work in our ordinary concepts, and then asks whether those intuitions survive once the concept is stress-tested. That style is precisely what the AI-consciousness paper you're reading is borrowing: take the concept \"conscious\" or \"morally significant,\" design test cases, and ask whether anything beyond functional/causal organization survives scrutiny.\n\nOne more thing worth flagging as color rather than firm philosophical fact: Parfit was known to be a somewhat reclusive, intensely focused writer who was also a serious amateur photographer (I recall this being documented in David Edmonds's 2023 biography, *Parfit: A Philosopher and His Ideas*, though I haven't verified every detail of that book myself). It's a nice human counterpoint to a philosopher so associated with dissolving the self into a bundle of relations."},{"id":"daniel-dennett","name":"Daniel Dennett","aliases":["Dennett"],"role":"Philosopher, a founding figure of illusionism about consciousness","inThisPaper":"Cited as part of the illusionist tradition the paper situates itself within.","importance":"minor"},{"id":"keith-frankish","name":"Keith Frankish","aliases":["Frankish"],"role":"Philosopher who coined and developed 'illusionism' as a theory of consciousness, distinguishing strong and weak forms","inThisPaper":"His strong/weak illusionism distinction structures the paper's own position, and his concept of 'quasi-phenomenal' states is used in Section 5.","importance":"major"},{"id":"francois-kammerer","name":"François Kammerer","aliases":["Kammerer"],"role":"Philosopher, author of 'House of Mirrors: The Illusion of Phenomenal Consciousness' (2026), working on illusionism and its ethical implications","inThisPaper":"The paper explicitly builds on Kammerer's book, borrowing his coincidence-argument extensions, his account of self-model content, and his distinctions of senses of 'seem' and 'I feel pain'.","importance":"major"},{"id":"ned-block","name":"Ned Block","aliases":["Block"],"role":"Philosopher known for functionalism critiques, access consciousness, and the 'harder problem of consciousness'","inThisPaper":"His Chinese nation thought experiment, access consciousness, and harder problem of reference are used to discuss implementation, indeterminacy, and nesting of subjects.","importance":"major"},{"id":"peter-godfrey-smith","name":"Peter Godfrey-Smith","aliases":["Godfrey-Smith"],"role":"Philosopher of biology and mind working on animal cognition, octopus/cephalopod minds, and the evolution of consciousness","inThisPaper":"Cited on biological/artificial differences in timing and metabolism, the sensory/evaluative distinction, and evidence about insect consciousness.","importance":"major"},{"id":"john-searle","name":"John Searle","aliases":["Searle"],"role":"Philosopher known for biological naturalism about consciousness and the Chinese Room argument","inThisPaper":"Treated as a realizer theorist whose chip-replacement thought experiment is analyzed under the paper's dilemma for realizer views.","importance":"major"},{"id":"giulio-tononi","name":"Giulio Tononi","aliases":["Tononi"],"role":"Neuroscientist, principal architect of Integrated Information Theory (IIT)","inThisPaper":"IIT is used as the clearest test case for the realizer dilemma; his and colleagues' claims about causation and chip-replacement scenarios are directly examined.","importance":"major"},{"id":"christof-koch","name":"Christof Koch","aliases":["Koch"],"role":"Neuroscientist, co-developer of Integrated Information Theory and researcher on neural correlates of consciousness","inThisPaper":"Cited alongside Tononi on IIT's predictions about simulated brains and the star/simulation analogy.","importance":"minor"},{"id":"thomas-metzinger","name":"Thomas Metzinger","aliases":["Metzinger"],"role":"Philosopher known for the self-model theory of subjectivity","inThisPaper":"His account of transparency is used to explain why introspected states seem directly known.","importance":"major"},{"id":"michael-graziano","name":"Michael Graziano","aliases":["Graziano"],"role":"Neuroscientist/psychologist, developer of attention schema theory","inThisPaper":"Attention schema theory is cited as a candidate mechanism for the self-model producing awareness reports.","importance":"minor"},{"id":"taylor-w-webb","name":"Taylor W. Webb","aliases":["Webb"],"role":"Co-author with Graziano on attention schema theory","inThisPaper":"Cited alongside Graziano for evidence on attentional control and awareness reports.","importance":"minor"},{"id":"andrew-lee","name":"Andrew Lee","aliases":["Lee","Lee, A. Y."],"role":"Philosopher working on consciousness and moral status/welfare subjects","inThisPaper":"His claim that being a welfare subject is widely accepted as sufficient for moral status, and his phenomenal theory of welfare subjects, are discussed and contrasted with the paper's functional account.","importance":"major"},{"id":"sharon-street","name":"Sharon Street","aliases":["Street","Street, S."],"role":"Philosopher known for the evolutionary debunking argument against moral realism","inThisPaper":"Cited for evolutionary reasons to think pain's badness depends on evaluative attitudes, supporting premise M3.","importance":"major"},{"id":"joseph-levine","name":"Joseph Levine","aliases":["Levine"],"role":"Philosopher who coined 'the explanatory gap' and works on the meta-problem of consciousness","inThisPaper":"His challenge about representing uninstantiated properties with determinate content frames the paper's account of self-model content.","importance":"major"},{"id":"brian-loar","name":"Brian Loar","aliases":["Loar"],"role":"Philosopher known for recognitional/phenomenal concepts, a realist about phenomenal consciousness","inThisPaper":"Cited as a realist whose recognitional concepts show a realist can accept 'no further fact' language while still calling states phenomenal.","importance":"minor"},{"id":"tim-maudlin","name":"Tim Maudlin","aliases":["Maudlin"],"role":"Philosopher of physics, known for the 'Olympia' thought experiment against computationalism about consciousness","inThisPaper":"His Olympia machine is used to test and ultimately reject a premise about inert machinery and consciousness.","importance":"major"},{"id":"james-woodward","name":"James Woodward","aliases":["Woodward"],"role":"Philosopher of science known for the interventionist theory of causal explanation","inThisPaper":"His interventionism and 'conditional irrelevance' concept underpin the paper's criterion for the relevant grain of functional organization.","importance":"major"},{"id":"martine-nida-rumelin","name":"Martine Nida-Rümelin","aliases":["Nida-Rümelin"],"role":"Philosopher working on phenomenal consciousness and personal identity","inThisPaper":"Her view that awareness of experiential properties is automatic in having them is discussed and rejected as part of the Moorean objection.","importance":"minor"},{"id":"philip-goff","name":"Philip Goff","aliases":["Goff"],"role":"Philosopher known for panpsychism and the doctrine of Revelation about phenomenal properties","inThisPaper":"His Revelation thesis is cited and denied as part of the reply to the Moorean objection.","importance":"minor"},{"id":"hedda-hassel-mrch","name":"Hedda Hassel Mørch","aliases":["Mørch"],"role":"Philosopher working on the phenomenal powers view of consciousness","inThisPaper":"Her phenomenal powers view is analyzed via three possibilities in the discussion of realization accounts.","importance":"major"},{"id":"bradford-saad","name":"Bradford Saad","aliases":["Saad"],"role":"Philosopher proposing a teleological/fundamental-law solution to the meta-problem of consciousness","inThisPaper":"His proposed fundamental law linking experiences to rationalized actions is discussed as an interactionist realization account.","importance":"minor"},{"id":"adam-pautz","name":"Adam Pautz","aliases":["Pautz"],"role":"Philosopher working on consciousness, perception, and phenomenal concepts","inThisPaper":"His challenge about twin-consciousness and about why experience's effects fit rationalized beliefs is addressed.","importance":"minor"},{"id":"katalin-balog","name":"Katalin Balog","aliases":["Balog"],"role":"Philosopher developing a physicalist quotational account of phenomenal concepts","inThisPaper":"Her acquaintance-based account is discussed as a candidate non-coincidental connection in the coincidence argument.","importance":"minor"},{"id":"anna-giustina","name":"Anna Giustina","aliases":["Giustina"],"role":"Philosopher working on introspective knowledge by acquaintance","inThisPaper":"Cited as a proponent of acquaintance-based introspective knowledge.","importance":"minor"},{"id":"matt-duncan","name":"Matt Duncan","aliases":["Duncan"],"role":"Philosopher working on illusionism and knowledge by acquaintance","inThisPaper":"Cited as a proponent of acquaintance as a source of introspective knowledge.","importance":"minor"},{"id":"elizabeth-schwitzgebel","name":"Elizabeth Schwitzgebel","aliases":["Schwitzgebel"],"role":"Philosopher known for work on introspective unreliability and the moral status of AI","inThisPaper":"Her research on unreliable introspection supports the self-mod ors of consciousness in AI systems","doi":"10.1016/j.tics.2025.10.011","kind":"ally","use":"Cited as part of the research program proposing structural and causal indicators for attributing consciousness to artificial systems, which the paper draws on for its own evidence assessment.","anchors":[{"bid":"b1m4aflk","q":"(Butlin et al. 2023, 2026; Long et al. 2024; Birch 2024)"}],"id":"butlin-et-al-2026-1don"},{"key":"Butlin et al. 2023","full":"Butlin, P., Long, R., Elmoznino, E., Bengio, Y., Birch, J., et al. (2023). Consciousness in artificial intelligence: Insights from the science of consciousness. Research report, arXiv:2308.08708v3.","authors":"Butlin, P., Long, R., Elmoznino, E., Bengio, Y., Birch, J., et al.","year":"2023","title":"Consciousness in artificial intelligence: Insights from the science of consciousness","doi":"","kind":"ally","use":"Cited for the claim that attributing consciousness to a system depends on how closely it matches a theory's mechanism, how well supported the theory is, and confidence in computational functionalism.","anchors":[{"bid":"b1m4aflk","q":"(Butlin et al. 2023, 2026; Long et al. 2024; Birch 2024)"},{"bid":"bihlyvm","q":"Any attribution depends on three things (Butlin et al. 2023)"}],"id":"butlin-et-al-2023-6gdi"},{"key":"Carew, Hawkins, Kandel 1983","full":"Carew, T. J., Hawkins, R. D., and Kandel, E. R. (1983). Differential classical conditioning of a defensive withdrawal reflex in Aplysia californica. Science 219(4583): 397–400.","authors":"Carew, T. J., Hawkins, R. D., and Kandel, E. R.","year":"1983","title":"Differential classical conditioning of a defensive withdrawal reflex in Aplysia californica","doi":"","kind":"evidence","use":"Cited as showing that a simple withdrawal reflex can be classically conditioned, used to argue that mere conditioning is not enough to distinguish evaluative states from reflexes.","anchors":[{"bid":"b99uktn","q":"(Carew, Hawkins and Kandel 1983)"}],"id":"carew-hawkins-kandel-1983-zuws"},{"ke ous' between role and realizer theorists is substantive.","anchors":[{"bid":"b1b8myyh","q":"as \"torture\" does (2011, §1)"},{"bid":"b12dmrx9","q":"as bedrock instead (2011, §8)"}],"id":"chalmers-2011-xjga"},{"key":"Chalmers 2018","full":"Chalmers, D. J. (2018). The meta-problem of consciousness. Journal of Consciousness Studies 25(9–10): 6–61.","authors":"Chalmers, D. J.","year":"2018","title":"The meta-problem of consciousness","doi":"","kind":"opponent","use":"Origin of the 'meta-problem' and 'problem intuitions' terminology and of key moves (constitution reply, luck about realization) that the paper's coincidence argument responds to.","anchors":[{"bid":"b1ulbl1j","q":"(2018, pp. 37–38)"},{"bid":"bh64vpn","q":"the name is Chalmers's (2018)"},{"bid":"bh64vpn","q":"(after Chalmers 2018, p. 18)"},{"bid":"bn3a578","q":"(2018, 2020)"},{"bid":"bir7bow","q":"(2020; see 2018, pp. 17–18)"},{"bid":"bir7bow","q":"(2018, pp. 7–8)"},{"bid":"btwhfzi","q":"(2018, p. 47)"},{"bid":"b6ey1zk","q":"(2018, p. 48)"},{"bid":"b12ox3cx","q":"(2018, n. 29)"},{"bid":"b1gskr4d","q":"the datum is that we feel pain (2018)"}],"id":"chalmers-2018-348c"},{"key":"Chalmers 2020","full":"Chalmers, D. J. (2020). Debunking arguments for illusionism about consciousness. Journal of Consciousness Studies 27(5–6): 258–281.","authors":"Chalmers, D. J.","year":"2020","title":"Debunking arguments for illusionism about consciousness","doi":"","kind":"opponent","use":"States the argument from coincidence and the global-independence distinction that the paper adopts, while Chalmers himself resists the illusionist conclusion.","anchors":[{"bid":"bn3a578","q":"(2018, 2020)"},{"bid":"bir7bow","q":"(2020; see 2018, pp. 17–18)"},{"bid":"b1kwq4dr","q":"without the properties they are about (2020)"},{"bid":"b1kwq4dr","q":"yields a case for coincidence that needs to be addressed"},{"bid":"bart3fo","q":"(Chalmers 2020)"},{"bid":"b1f1lhfy","q":"Chalmers regards both as promising (2020)"},{"bid":"b185y4ws","q":"goes bey "Detection emerges with preference training"},{"bid":"b8fa8pi","q":"The evidence places the relevant capacities in the Assistant persona (Macar et al. 2026)"},{"bid":"bbphgdg","q":"Macar et al. 2026; Sofroniew et al. 2026"},{"bid":"bdx46ct","q":"Macar and colleagues find detection absent in base models"}],"id":"macar-et-al-2026-1epo"},{"key":"Maudlin 1989","full":"Maudlin, T. (1989). Computation and consciousness. Journal of Philosophy 86(8): 407–432.","authors":"Maudlin, T.","year":"1989","title":"Computation and consciousness","doi":"","kind":"opponent","use":"Presents the Olympia thought experiment and the premise that inert machinery cannot make a difference to consciousness, which the paper's account of implementation rejects.","anchors":[{"bid":"btavzyc","q":"That settles Maudlin's Olympia (1989)"},{"bid":"btavzyc","q":"rejects Maudlin's premise that inert machinery"}],"id":"maudlin-1989-19g8"},{"key":"Merlo 2020","full":"Merlo, G. (2020). Appearance, reality, and the meta-problem of consciousness. Journal of Consciousness Studies 27(5–6): 120–130.","authors":"Merlo, G.","year":"2020","title":"Appearance, reality, and the meta-problem of consciousness","doi":"","kind":"opponent","use":"Argues that an illusion of p gives immediate justification for believing p and that such justification for a phenomenal belief entails its truth; the paper rejects the second premise.","anchors":[{"bid":"b1qx60zv","q":"Merlo argues that an illusion that p gives immediate justification"}],"id":"merlo-2020-1632"},{"key":"Metzinger 2003","full":"Metzinger, T. (2003). Being No One: The Self-Model Theory of Subjectivity. MIT Press.","authors":"Metzinger, T.","year":"2003","title":"Being No One: The Self-Model Theory of Subjectivity","doi":"","kind":"method","use":"Source of the transparency account used to explain why states seem directly known because earlier processing stages are unavailable to the self-model.","anchors":[{"bid":"bv4k4wo","q":"which is Metzinger's account of transparency (2003)"}],"id":"metzinger-2003-u1yl"},{"key":"Mogensen 2025","full":"Mogensen, A. L. (2025). How to resist the fading qualia argument. Synthese 206(5): 252.","authors":"Mogensen, A. L.","year":"2025","title":"How to resist the fading qualia argument","doi":"","kind":"opponent","use":"Treats the intermediate stages of the fading-qualia scenario as borderline cases, one of the replies the paper considers to Chalmers's fading qualia argument.","anchors":[{"bid":"b19aaozx","q":"Mogensen (2025) treats the intermediate stages as borderline cases"}],"id":"mogensen-2025-16j6"},{"key":"Mørch 2020","full":"Mørch, H. H. (2020). The phenomenal powers view and the meta-problem of consciousness. Journal of Consciousness Studies 27(5–6): 131–142.","authors":"Mørch, H. H.","year":"2020","title":"The phenomenal powers view and the meta-problem of consciousness","doi":"","kind":"opponent","use":"Argues that a phenomenal state's causal powers are constrained by its phenomenal nature, the realization view the paper analyzes into three possibilities under the coincidence argument.","anchors":[{"bid":"b1f1lhfy","q":"Mørch (2020) argues that the specific causal powers"}],"id":"mrch-2020-f6ni"},{"key":"Naccache et al. 2025","full":"Naccache, L., Sergent, C., Dehaene, S., Wang, X.-J., Farisco, M., and Changeux, J.-P. (2025). GNW theoretical framework and the \"adversarial testing of global neuronal workspace and integrated information theories of consciousness\". Neuroscience of Consciousness 2025(1): niaf037.","authors":"Naccache, L., Sergent, C., Dehaene, S., Wang, X.-J., Farisco, M., and Changeux, J.-P.","year":"2025","title":"GNW theoretical framework and the \"adversarial testing of global neuronal workspace and integrated information theories of consciousness\"","doi":"","kind":"opponent","use":"Disputes the Cogitate Consortium's reading of the adversarial test results for global workspace theory, noted as an unresolved dispute about what the evidence shows.","anchors":[{"bid":"bihlyvm","q":"a reading workspace proponents dispute (Naccache et al. 2025)"}],"id":"naccache-et-al-2025-wb1z"},{"key":"Nida-Rümelin 2016","full":"Nida-Rümelin, M. (2016). The illusion of illusionism. Journal of Consciousness Studies 23(11–12): 160–171.","authors":"Nida-Rümelin, M.","year":"2016","title":"The illusion of illusionism","doi":"","kind":"opponent","use":"Holds that experiential properties are properties subjects are aware of simply in having them, without introspective judgment, a view the paper's account of representation and awareness denies.","anchors":[{"bid":"bieuzd7","q":"Nida-Rümelin holds that experiential properties are properties of subjects"}],"id":"nida-rumelin-2016-14s9"},{"key":"Papineau 2002","full":"Papineau, D. (2002). Thinking about Consciousness. Oxford University Press.","authors":"Papineau, D.","year":"2002","title":"Thinking about Consciousness","doi":"","kind":"background","use":"Cited as allowing indeterminacy in the application of phenomenal concepts, relevant to the paper's discussion of borderline cases.","anchors":[{"bid":"b1fcjjml","q":"Papineau (2002) allows indeterminacy in the application"}],"id":"papineau-2002-756r"},{"key":"Parfit 1984","full":"Parfit, D. (1984). Reasons and Persons. Oxford University Press.","authors":"Parfit, D.","year":"1984","title":"Reasons and Persons","doi":"","kind":"source of a term","use":"Source of the term 'no further fact', used for Parfit's view that personal identity consists in continuity with no further fact beyond it, which the paper's argument structurally parallels.","anchors":[{"bid":"b1oawq67","q":"involves no further fact beyond them (1984)"},{"bid":"b1uev84g","q":"involves no further fact, he concluded that what matters"}],"id":"parfit-1984-1ec3","live":{"title":"Classification of reasons why persons seek primary care: pilot study of a new system.","year":1985,"venue":"PubMed","cited":27,"doi":null,"oa":"https://www.ncbi.nlm.nih.gov/pmc/articles/1424649","abstract":"In 1978, the World Health Organization formed a group to begin work on the Reason for Encounter Classification (RFEC), which is designed to classify the reasons why patients seek care at the primary level. The relatively simple classification is based on two axes--chapters and components--and uses a three-character alpha-numeric code. Chapters, which are named by body systems or more general terms, are the reasons that health care was sought. Five of the seven components, or subdivisions of chapters, contain rubrics identified by the same two-digit numerical code. A pilot study with a training exercise was carried out in The Netherlands by nine family physicians to confirm the feasibility of using the new classification system in primary care settings. Training consisted of viewing videotapes of encounters and an exercise of coding 76 vignettes by the RFEC. Within 2 months, the physicians in the subsequent pilot study had collected and coded 7,503 reasons for encounters. Results of the pilot study confirm that the RFEC is feasible, easy to use in practice, and different from disease-oriented classifications in its system of classifying the reasons for encounter. The pilot study results have been used to modify the RFEC in preparation for a field trial in ambulatory care settings worldwide."}},{"key":"Pautz 2020","full":"Pautz, A. (2020). Consciousness and coincidence: Comments on Chalmers. Journal of Consciousness Studies 27(5–6): 143–155.","authors":"Pautz, A.","year":"2020","title":"Consciousness and coincidence: Comments on Chalmers","doi":"","kind":"opponent","use":"Presses Chalmers on the twin-consciousness case and asks why the effects of experience fit the beliefs and actions it rationalizes, questions the paper answers in Sections 4 and 5.","anchors":[{"bid":"b8qc2d0","q":"replying to Pautz (2020)"},{"bid":"bw91flw","q":"Pautz asks why the effects of experience fit"}],"id":"pautz-2020-1wrk"},{"key":"Pereboom 2011","full":"Pereboom, D. (2011). Consciousness and the Prospects of Physicalism. Oxford University Press.","authors":"Pereboom, D.","year":"2011","title":"Consciousness and the Prospects of Physicalism","doi":"","kind":"background","use":"Develops the possibility that introspection represents phenomenal states as having a qualitative nature they lack, related to the paper's self-model account.","anchors":[{"bid":"bv4k4wo","q":"Pereboom (2011) develops the related possibility"}],"id":"pereboom-2011-tk6g"},{"key":"Petersen 2012","full":"Petersen, S. (2012). Designing people to serve. In P. Lin, K. Abney and G. A. Bekey (eds.), Robot Ethics: The Ethical and Social Implications of Robotics, 283–298. MIT Press.","authors":"Petersen, S.","year":"2012","title":"Designing people to serve","doi":"","kind":"ally","use":"Accepts the conclusion that robots designed to want to serve can be well off doing so, supporting the paper's treatment of design and welfare.","anchors":[{"bid":"b11409ut","q":"Petersen (2012) accepts the conclusion for robots designed to want to serve"}],"id":"petersen-2012-qgjc"},{"key":"Piccinini 2021","full":"Piccinini, G. (2021). The myth of mind uploading. In R. W. Clowes, K. Gärtner and I. Hipólito (eds.), The Mind-Technology Problem, 125–144. Springer.","authors":"Piccinini, G.","year":"2021","title":"The myth of mind uploading","doi":"","kind":"opponent","use":"Argues that ordinary digital simulations need not reproduce the computations of the systems they model and tentatively concludes current digital technology is unlikely to support consciousness, a horn-1 style claim about which variables matter.","anchors":[{"bid":"b1rwvpn8","q":"Piccinini argues that ordinary digital simulations"}],"id":"piccinini-2021-1f9o"},{"key":"Ploner, Freund and Schnitzler 1999","full":"Ploner, M., Freund, H.-J., and Schnitzler, A. (1999). Pain affect without pain sensation in a patient with a postcentral lesion. Pain 81(1–2): 211–214.","authors":"Ploner, M., Freund, H.-J., and Schnitzler, A.","year":"1999","title":"Pain affect without pain sensation in a patient with a postcentral lesion","doi":"","kind":"evidence","use":"Reports a patient who could not describe or localize pain after a postcentral lesion yet found it clearly unpleasant, clinical evidence for the dissociation of pain's sensory and affective components.","anchors":[{"bid":"bui9cke","q":"found them clearly unpleasant (Ploner, Freund and Schnitzler 1999)"}],"id":"ploner-freund-and-schnitzler-1999-xth4"}],"moves":{"b1i7j00p":{"kind":"context","label":"abstract summary","what":"The paragraph previews the whole paper: an illusionist view of consciousness (no further fact once functional organization is fixed), an argument extending Chalmers's coincidence argument to realizer theories like IIT, a reply to the Moorean 'we obviously have experience' objection, and a moral argument yielding a welfare criterion applied to current language models.","how":"It is structured as a compressed sequence of claims, each doing the job of one later section, moving from metaphysics (consciousness) to epistemology (self-model) to ethics (welfare) to application (AI). Phrases signal scope and status of claims (main thesis vs. what a criterion 'finds').","signals":[{"q":"involves no further fact","note":"states the central thesis in advance"},{"q":"sufficient criterion for welfare","note":"marks the welfare claim as sufficient, not necessary, limiting its scope"},{"q":"learning and integration beyond a single conversation remain unshown","note":"hedges the paper's empirical conclusion about AI"}],"critique":"As a summary it asserts conclusions without yet showing the argument, so a skeptical reader has to wait for the reasoning."},"bbwta1t":{"kind":"thought-experiment","label":"brain-duplicate question","what":"It poses the question of whether a system built with the same functional organization as a human brain (down to whatever grain matters) would be conscious and whether its pains would hurt.","how":"The move opens the paper with a concrete hypothetical rather than a definition, setting up the two rival answers discussed in the next paragraph; the hedge 'down to whatever level of detail turns out to matter' anticipates the later technical criterion for the 'relevant grain'.","signals":[{"q":"down to whatever level of detail turns out to matter","note":"flags that the grain of organization is an open variable to be specified later"},{"q":"Would its pains hurt?","note":"shifts from mere consciousness to the morally loaded question of suffering, foreshadowing Section 8"}],"critique":""},"bdekgfw":{"kind":"taxonomy","label":"two realist camps","what":"It sorts existing 'realist' answers to the opening question into two camps: Chalmers, who thinks the duplicate would be conscious by law but that experience remains a further fact beyond organization, and realizer theorists (IIT, biological naturalism), who think it might not be conscious at all if built from different material.","how":"The paragraph is a classificatory move that sets up the two targets (Sections 3 and 4) the paper will argue against; it uses citation to anchor each view to a specific position and ends with a summary claim uniting both under one criticism.","signals":[{"q":"still a further fact","note":"names the shared flaw the paper will attack in both camps"},{"q":"a complete functional description of a system leaves something about its consciousness out","note":"states the common conclusion of both realist views, which the paper's thesis denies"}],"critique":""},"b1oawq67":{"kind":"definition","label":"defining 'further fact'","what":"It defines what 'no further fact' means, borrowing the term from Parfit's work on personal identity, and specifies that a further fact is one not fixed (constituted or grounded) by organizational facts—mere necessitation is not enough.","how":"The move stipulates precise technical usage to prevent equivocation, explicitly distinguishing 'fix' (=consists in) from mere lawful necessitation, and previews that Section 3 will need this distinction to handle Chalmers's lawful-experience view.","signals":[{"q":"The term is Parfit's","note":"credits and borrows terminology, inviting the analogy with personal identity"},{"q":"\"fix\" means consists in","note":"explicit stipulative definition to block a weaker reading"},{"q":"Necessitation is not enough","note":"rules out an easy way for an opponent to claim the criterion is satisfied"}],"critique":"The stipulation of 'fix' as identity-or-grounding is doing heavy work and simply asserts, rather than argues, that lawful necessitation doesn't count—an opponent could reject this framing outright."},"b1khsipn":{"kind":"thesis","label":"the no-further-fact thesis","what":"States the paper's central claim in boxed form: once functional organization is fixed at the grain relevant to the phenomena consciousness explains, there is no further fact about whether or how a system is conscious.","how":"Presented as a formal, isolated statement (set off from surrounding prose) to mark it as the thesis the rest of the paper argues for; it reuses the technical vocabulary just defined ('further fact', 'grain') so the definition in ¶7 does interpretive work here.","signals":[{"q":"No further fact.","note":"labels this as the named central thesis, functioning like a bolded definition"},{"q":"at the grain that makes a difference","note":"builds in the difference-making criterion to be spelled out in Section 2"}],"critique":""},"bfta4bu":{"kind":"signpost","label":"transition to consequences","what":"A one-line bridge announcing that three consequences follow from the thesis.","how":"Pure structural signpost, no argument content; it organizes the reader's expectations for the next three paragraphs.","signals":[{"q":"Three consequences follow.","note":"explicit enumeration marker guiding the reader"}],"critique":""},"b1ligpty":{"kind":"inference","label":"substrate consequence","what":"Derives that any system sharing the relevant organization shares every explanatorily relevant feature of our conscious states and (given Section 8) everything that makes suffering bad, regardless of what the word 'conscious' ends up meaning for it.","how":"The inference draws directly on the thesis (¶8): if organization fixes everything, then matching organization guarantees matching functional/moral properties, even if word-application is indeterminate. It explicitly separates the substantive claim from the merely verbal one to inoculate against objections about terminology.","signals":[{"q":"may have no determinate answer","note":"concedes semantic indeterminacy while denying it matters"},{"q":"nothing explanatory or moral turns on the answer","note":"explicit qualification limiting the force of the semantic concession"},{"q":"may be fine-grained","note":"hedges the practical implication for building artificial minds"}],"critique":"The claim that 'nothing moral turns on the answer' depends on Section 8's premise M3, which is itself contested (see ¶179), so this consequence is only as strong as that later, disputed premise."},"bymjfb9":{"kind":"inference","label":"knowledge consequence","what":"Concludes that whether a system has the relevant organization is simply an empirical question, and that the hard problem adds no extra epistemic obstacle beyond ordinary empirical and semantic difficulty.","how":"This follows from the thesis by elimination: if there's no further fact, then the only remaining question is empirical (does it have this organization?) plus semantic (does the word apply?), and the second is stipulated to carry no weight.","signals":[{"q":"the hard problem adds no barrier of its own","note":"directly denies that hard-problem type uncertainty is a special obstacle"},{"q":"carry no moral weight","note":"reiterates the earlier move discounting semantic indeterminacy"}],"critique":""},"b8x4drk":{"kind":"inference","label":"moral status consequence","what":"Argues that if suffering involves no further fact and if what makes a state bad for a subject is the subject's own evaluative stance, then the badness of suffering is itself part of functional organization, making moral status an empirical matter.","how":"This is a conditional inference chaining the thesis with a new premise (the subjectivist claim about badness, to be argued in Section 8), explicitly flagged as conditional ('if... and if...') rather than asserted outright here.","signals":[{"q":"If suffering involves no further fact, and if","note":"marks the inference as conditional on two premises, one already established and one still to come"},{"q":"an empirical question too","note":"parallels the earlier 'empirical question' framing from ¶11, tying moral status to the same epistemic status as consciousness"}],"critique":"The paragraph borrows credibility from the not-yet-argued subjectivist premise (M3), so its conclusion is provisional until Section 8."},"b1irbhec":{"kind":"distinction","label":"strong vs weak illusionism","what":"Distinguishes strong illusionism (nothing has phenomenal properties as usually characterized) from weak illusionism (phenomenal properties exist but introspection misdescribes them), situates the paper's view in the illusionist tradition, and states that it defends the strong form while noting most of its arguments need only the weaker claim that there's no further fact.","how":"The move first names a school of thought (illusionism, citing Dennett and Frankish) then subdivides it, and finally scopes the paper's commitments precisely, distinguishing what needs the strong thesis (Sections up to 6) from what works under any no-further-fact view, including some physicalist realisms (Sections 7-9).","signals":[{"q":"intrinsic, ineffable and directly revealed","note":"gives the technical content of 'phenomenal properties' being denied"},{"q":"its arguments are built to need less","note":"a qualification limiting how much rides on the stronger, more controversial thesis"},{"q":"hold for any view on which there is no further fact","note":"explicitly broadens the audience of later sections beyond strict illusionists"}],"critique":""},"b1ulbl1j":{"kind":"context","label":"relation to Kammerer's book","what":"Situates the paper relative to Kammerer's House of Mirrors (2026) and Chalmers's earlier remarks, crediting prior work with widening the coincidence argument and treating illusionism's variants as partly verbal, then lists four specific contributions original to this paper.","how":"The paragraph functions as a literature-positioning move: it first acknowledges debts (parenthetical citations to specific chapters/sections) then pivots with 'What is new here' to enumerate original contributions, each tied to a later section number, giving the reader a map of where credit and novelty lie.","signals":[{"q":"What is new here is","note":"explicit marker separating inherited material from original contribution"},{"q":"without a semantic premise","note":"highlights a specific methodological improvement over prior treatments"},{"q":"an assessment of recent evidence about language models","note":"flags the paper's distinctive empirical contribution"}],"critique":""},"b1thygt7":{"kind":"signpost","label":"section-by-section roadmap","what":"Lays out what each of the remaining sections will do, and states that the overall method is abductive comparison of theories rather than a claim that rival views are incoherent.","how":"Pure structural signposting followed by a methodological qualification; the final sentences function as a scope-limiting move, telling the reader not to expect a knockdown refutation but a best-explanation comparison.","signals":[{"q":"Throughout, the argument is abductive","note":"names the argumentative method used across the whole paper"},{"q":"does not claim that the alternatives are incoherent","note":"explicitly limits the ambition of the argument, softening its claims against rivals"}],"critique":""},"b10vxxqg":{"kind":"signpost","label":"Four explananda introduced","what":"Announces that four kinds of facts will serve throughout as what a theory of consciousness needs to explain.","how":"A one-line transition that opens an itemized list (E1–E4), functioning as a roadmap for the technical apparatus to follow.","signals":[{"q":"Four kinds of fact serve as the explananda","note":"flags an upcoming enumerated list used as the paper's fixed target for all rival theories"}],"critique":""},"bq9a5y8":{"kind":"definition","label":"Define discrimination (E1)","what":"Defines E1 as the capacity to respond differently to different stimuli.","how":"Terse stipulative definition, the first of four building blocks against which every theory of consciousness will later be tested.","signals":[{"q":"responding differently to different stimuli","note":"stipulates the minimal, behavior-level sense of discrimination"}],"critique":""},"b1llqfak":{"kind":"definition","label":"Define learning/control (E2)","what":"Defines E2 as learning and flexible control: learned avoidance, goal-directed seeking, and weighing one goal against another.","how":"Continues the stipulative list; this explanandum becomes central later when the welfare criterion (Section 8) is built around evaluative learning.","signals":[{"q":"the weighing of one goal against another","note":"introduces the trade-off idea reused as clause 3 of the welfare criterion in Section 8"}],"critique":""},"b1s5bjrt":{"kind":"definition","label":"Define reports (E3)","what":"Defines E3 as reports, including reports about one's own states.","how":"Short stipulation continuing the enumeration; the parenthetical about self-reports anticipates the self-model discussion in Sections 5–6.","signals":[{"q":"including reports about one's own states","note":"flags introspective report as a distinct subtype that later grounds the self-model account"}],"critique":""},"b1dbytn8":{"kind":"definition","label":"Define problem intuitions (E4)","what":"Defines E4 as dispositions to judge that experience is intrinsic, private, ineffable and directly known, and that no functional description could capture it.","how":"This is the crucial explanandum that generates the hard problem; phrasing it as a disposition (rather than as a fact about experience) keeps the definition neutral on whether the judgments are true.","signals":[{"q":"dispositions to judge","note":"neutral phrasing that avoids presupposing the intuitions are correct, only that they occur"}],"critique":""},"bh64vpn":{"kind":"definition","label":"Topic-neutral content of E4","what":"Explains that E4 generates the hard problem, and that problem intuitions are to be assessed by their topic-neutral content: that we have properties hard to explain physically, known in a special first-person way, and possibly absent in a functional duplicate.","how":"Defines what it would mean for the intuitions to be 'correct' in a way that doesn't already assume phenomenal realism, so a functional duplicate can share the very same intuitions; ends with an explicit hedge deferring a disputed point to Section 3.","signals":[{"q":"topic-neutral content","note":"key technical term letting realist and illusionist compare notes on the same intuitions"},{"q":"Whether its phenomenal beliefs would have the same full content is disputed","note":"hedge that flags an open question and points forward to Section 3"}],"critique":"Defining problem intuitions as mere 'dispositions to judge' secures easy agreement but may understate what realists think is really given, namely the felt quality itself rather than a disposition about it."},"bfiha8f":{"kind":"stipulation","label":"Two senses of 'seem'","what":"Fixes two technical senses of 'seem' (psychological: disposed to judge that p; epistemic: gives defeasible justification for p) and explicitly bars a third, phenomenal, sense from use.","how":"A terminological stipulation borrowed from Kammerer, designed to prevent equivocation later when the paper talks about how experience 'seems'; banning the phenomenal sense preempts question-begging.","signals":[{"q":"The phenomenal sense of \"seem\" is never used.","note":"explicit exclusion that blocks smuggling in the realist's assumption through ordinary usage"}],"critique":""},"b24v6ar":{"kind":"stipulation","label":"Define functional organization; the grain problem","what":"Defines functional organization as the pattern of causal relations among a system's states, inputs and outputs, including counterfactuals, and notes the classic problem of choosing a level of description that is neither too liberal nor too chauvinistic.","how":"Names an existing unsolved problem (Block's) to justify why the next paragraph must supply a principled criterion rather than an arbitrary choice of grain.","signals":[{"q":"neither too liberal nor too chauvinistic","note":"cites the standard dilemma the paper's own criterion is built to resolve"},{"q":"including what would happen under conditions that do not in fact occur","note":"stresses that counterfactual, not just actual, behavior counts as part of organization"}],"critique":""},"b18lhez3":{"kind":"definition","label":"Interventionist criterion for the grain","what":"Gives a formal criterion: the relevant organization is the coarsest set of variables V such that intervening on each changes E1–E4, and every other physical feature is conditionally irrelevant to E1–E4 once V is fixed; also states when two systems count as sharing that organization.","how":"A stipulative, quasi-formal definition using intervention/counterfactual language, providing the technical tool ('conditional irrelevance') used repeatedly later, especially in the Section 4 dilemma between horn 1 and horn 2.","signals":[{"q":"coarsest set of variables V","note":"builds in non-liberality: V must be minimal, not maximal"},{"q":"conditionally irrelevant to E1–E4 given V","note":"the exclusion clause reused later as the test for 'horn 2' realizer properties"},{"q":"correspond one to one","note":"defines the sameness condition needed to compare two systems' organization"}],"critique":""},"b1u2l46n":{"kind":"reply","label":"Sourcing and defending the criterion","what":"Traces the criterion to Woodward's interventionism and Yablo's proportionality, aligns it with Chalmers's 'corresponding states' requirement, and shows it need not be coarse-grained (fine details like spike timing can enter V if they make a difference); also rules out a mere output-matching lookup table as satisfying it.","how":"Preempts two objections at once: that the criterion is covertly liberal/coarse, and that mere behavioral equivalence would count as sharing organization; the lookup-table case is a concrete counterexample closing the second gap.","signals":[{"q":"does not assume a coarse grain","note":"blocks the objection that the criterion is biased toward liberal functionalism"},{"q":"has no internal variables that correspond to the brain's","note":"concrete case ruling out output-only equivalence as sufficient for shared organization"}],"critique":""},"b1iz6o58":{"kind":"signpost","label":"Preview of rival-view taxonomy","what":"Announces that the main rival views on consciousness can be sorted by what they say about non-functional properties.","how":"A brief transitional sentence introducing the classification table that follows, organizing the rest of the paper's targets.","signals":[{"q":"sorted by what they say","note":"signals an upcoming systematic classification"}],"critique":""},"bua8gl3":{"kind":"taxonomy","label":"Table header","what":"Provides the three column headings (View, What it says, Answered in) for the taxonomy of rival views that follows.","how":"Purely structural: it organizes the classification into a comparable grid, cross-referencing each view to the section that later addresses it.","signals":[{"q":"Answered in","note":"signals that each row will be matched to a specific later section of the paper"}],"critique":""},"b1t8rdwv":{"kind":"taxonomy","label":"Epiphenomenal dualism entry","what":"Classifies epiphenomenal dualism as holding that phenomenal properties are not fixed by organization and make no difference to E1–E4.","how":"A one-line categorization using the paper's own conditional-irrelevance vocabulary, flagged for the coincidence argument (§3) since epiphenomenalism makes the independence claim in P2 especially vivid.","signals":[{"q":"make no difference to E1–E4","note":"restates the conditional-irrelevance criterion as applied to this view"}],"critique":""},"bhnue9l":{"kind":"taxonomy","label":"Russellian monism entry","what":"Classifies Russellian monism and phenomenal-powers views as holding that phenomenal natures realize the causal powers picked out by the organization.","how":"Grouped under the same §3 answer as epiphenomenalism, setting up the later discussion of 'realization' as a candidate non-coincidental connection.","signals":[{"q":"realize the organization's causal powers","note":"names the 'realization' option later examined in detail around Mørch's view"}],"critique":""},"b13c29i":{"kind":"taxonomy","label":"Interactionist dualism entry","what":"Classifies interactionist dualism as holding that phenomenal properties affect E1–E4 through causes outside physics, and marks the view as outside the paper's scope.","how":"Explicitly scopes out a rival because it denies the causal-closure premise (P1) rather than engaging the coincidence argument itself; the 'Outside scope' tag is a qualification, not a refutation.","signals":[{"q":"Outside scope (§3)","note":"an explicit scope limitation telling the reader this view is set aside, not defeated"}],"critique":""},"b198w97w":{"kind":"taxonomy","label":"Realizer theories entry","what":"Classifies biological naturalism, IIT and realizer physicalism together as holding that consciousness requires physical properties beyond the relevant organization, to be answered in Section 4.","how":"Groups the main scientifically-oriented rivals under a shared structure (a property Q beyond V) that the Section 4 dilemma is built to target.","signals":[{"q":"physical properties beyond the relevant organization","note":"defines the 'realizer property' class used as the target of Section 4's dilemma"}],"critique":""},"bu7jh1x":{"kind":"taxonomy","label":"Role-identity physicalism entry","what":"Classifies physicalism with role-identified phenomenal concepts as holding that phenomenal properties consist in the organization, and marks this as close to the paper's own view, addressed in Section 5.","how":"Marks this row as an ally rather than an opponent, foreshadowing Section 5's discussion of what remains between illusionist and realist positions of this kind.","signals":[{"q":"consist in the organization","note":"marks explicit agreement with the paper's own no-further-fact thesis"}],"critique":""},"bxeqbjn":{"kind":"argument","label":"Phenomenal properties as theoretical posits","what":"Argues that having problem intuitions is a plain datum, but that claiming a state has an intrinsic quality is a theoretical claim about its nature that could be false; states that the overall method is comparative and abductive, not verificationist.","how":"Distinguishes 'datum' from 'theoretical claim' to preempt the Moorean objection, which is explicitly deferred to Section 6, and disclaims verificationism to block an easy misreading of the whole project.","signals":[{"q":"Nothing here is verificationist.","note":"explicit denial guarding against a common misreading of the illusionist strategy"},{"q":"claims about the nature of things can be false","note":"key move licensing skepticism toward intrinsic-quality claims as posits rather than data"},{"q":"The claim is comparative","note":"signals the argument's abductive, best-explanation character rather than a deductive proof"}],"critique":"Treating the realist's datum-claim as merely a fallible 'claim about nature' risks begging the question against a realist who insists the datum just is the felt quality, a tension the paper defers explicitly to Section 6."},"b1oeo1b":{"kind":"thought-experiment","label":"The functional duplicate scenario","what":"Introduces a hypothetical duplicate that shares your organization but, on the realist's hypothesis, lacks whatever non-functional properties your experience has, yet insists just as confidently that it has intrinsic experience.","how":"Sets up the intuition pump driving the coincidence argument by putting the realist's own commitments under strain, ending in a rhetorical question that shifts the argumentative burden onto the realist.","signals":[{"q":"on the realist's hypothesis, lacks whatever non-functional properties","note":"frames the scenario as testing consequences of the realist's own view, not an external attack"},{"q":"What makes you right?","note":"rhetorical challenge structuring the entire section's argument"}],"critique":""},"bn3a578":{"kind":"signpost","label":"Naming the coincidence argument","what":"Attributes the argument to Chalmers, notes that he calls it the strongest argument for illusionism while still resisting it, and signals that the argument will now be laid out premise by premise.","how":"Uses the opponent's own concession as leverage before formalizing P1 through C, a rhetorical strategy of borrowing credibility from the person being argued against.","signals":[{"q":"the strongest argument for illusionism, while resisting it","note":"concedes the opponent's own high assessment of the argument, strengthening its use here"}],"critique":""},"bpqw03p":{"kind":"premise","label":"P1: near-complete functional explanation","what":"States that problem intuitions, read topic-neutrally, have a near-complete explanation in terms of the relevant organization, one that could hold without any non-functional property.","how":"A formal numbered premise; 'near-complete' is a deliberate hedge allowing for some residual unexplained detail without weakening the overall case, and sets up the notion of global independenc
