ile disputing their correctness; the whole argument from coincidence turns on whether a functional explanation of problem intuitions leaves any need for non-functional properties.","related":["hard problem","topic-neutral content","argument from coincidence"]},{"id":"topic-neutral-content","term":"topic-neutral content","aliases":[],"kind":"term of art","short":"The content of a judgment about experience stated in a way that doesn't presuppose whether the experience is physical, functional, or something further—e.g., 'I have properties hard to explain physically' rather than 'I have an intrinsic quale.'","background":"The idea of topic-neutral analysis goes back to mid-20th-century identity theorists (e.g., Smart) who tried to describe mental states in terms neutral between physicalist and dualist interpretations, so that a physical identification wouldn't obviously misdescribe the mental state. Chalmers (2018) redeploys the idea for problem intuitions, asking what they say when stripped of any commitment to a particular metaphysics of experience.","inThisPaper":"Used to state P1 of the argument from coincidence: the problem intuitions, read topic-neutrally, can be nearly completely explained by functional organization alone, which is common ground even for many realists.","related":["problem intuitions","argument from coincidence"]},{"id":"functional-duplicate","term":"functional duplicate","aliases":["duplicate"],"kind":"term of art","short":"A hypothetical system that shares exactly your functional organization but, on some theories, could lack whatever non-functional properties your experience has.","background":"Functional duplicates and their cousins (zombies, which duplicate physical structure entirely) are standard thought-experimental devices in philosophy of mind, used at least since Putnam and much developed by Chalmers, to test whether some property is fixed by functional or physical facts. A 'zombie' duplicates all physical facts and lacks consciousness; a functional duplicate duplicates only the relevant functional organization.","inThisPaper":"The functional duplicate is the central character of the argument from coincidence (Section 3): it shares your organization but, on realist views, is wrong about having experience, and the question of what could make you (rather than it) right drives the whole argument.","related":["argument from coincidence","global independence"]},{"id":"seem-three-senses","term":"'seem' (three senses)","aliases":["psychological sense","epistemic sense","phenomenal sense"],"kind":"distinction","short":"A three-way distinction in what 'it seems that p' can mean: (1) psychologically, one is disposed to judge p; (2) epistemically, the seeming gives defeasible justification for believing p; (3) phenomenally, there is a distinctive experiential quality of its seeming so.","background":"This distinction is drawn from Kammerer's House of Mirrors (2026), building on a long-standing worry in philosophy of mind that 'seems'-talk is ambiguous between a merely dispositional/judgmental sense and a sense that presupposes phenomenal consciousness, which would make anti-realist arguments about consciousness question-begging if not disambiguated.","inThisPaper":"The paper explicitly restricts itself to the psychological and epistemic senses of 'seem' and never uses the phenomenal sense, to avoid smuggling in the very phenomenal properties whose existence is in question.","related":["self-model","problem intuitions"]},{"id":"grain-liberal-and-chauvinist","term":"grain / liberal and chauvinist","aliases":["level of description","too liberal","too chauvinistic"],"kind":"distinction","short":"The choice of how fine-grained a functional description must be: too coarse ('liberal') risks counting things that intuitively shouldn't qualify, too fine ('chauvinistic') risks excluding things that should.","background":"This is Ned Block's famous 1978 formulation of a dilemma for functionalism in 'Troubles with Functionalism': a functional specification pitched at too high a level (e.g., simple input-output profiles) is liberal because it lets in systems like a nation of people mimicking a mind, while one pitched too low (e.g., requiring neurons specifically) is chauvinistic because it excludes possible non-biological minds that should count. It remains a standard reference point for debates about which functional description 'individuates' mental states.","inThisPaper":"The paper frames its own project—defining the 'relevant organization' via difference-making variables—as a proposed solution to exactly this old liberal/chauvinist problem.","related":["functional organization","relevant organization","Chinese nation"]},{"id":"interventionist-account-of-explanation","term":"interventionist account of explanation","aliases":["interventionism"],"kind":"theory","short":"A theory of causal/scientific explanation on which X explains Y (or a variable X is causally relevant to Y) just when intervening on X would change Y.","background":"This approach is most associated with James Woodward's book *Making Things Happen* (2003), which develops the idea that causation and explanation should be analyzed in terms of what would happen under hypothetical interventions (idealized manipulations) on variables, rather than in terms of laws or counterfactuals alone. It has become highly influential across philosophy of science and is widely used to formalize notions like 'difference-making' and 'relevance.'","inThisPaper":"The paper uses Woodward's interventionist framework to define the 'relevant organization': a variable belongs to it exactly when intervening on it changes E1–E4, giving the paper a way to separate genuinely difference-making organization from inert physical detail without relying on intuitions about meaning.","related":["conditional irrelevance","proportionality","relevant organization"]},{"id":"proportionality","term":"proportionality","aliases":[],"kind":"term of art","short":"The idea that a good causal explanation should cite a cause at the level of description that matches ('is proportional to') the effect—neither too specific nor too general.","background":"The term and concept come from Stephen Yablo's 1992 paper 'Mental Causation,' which argued that mental properties can be genuine causes of behavior, distinct from their physical realizers, if they are the proportional cause—the most general property that still guarantees the effect. It has since been widely discussed in debates about mental causation and multiple realizability.","inThisPaper":"Cited alongside Woodward's interventionism as one of the tools behind the paper's criterion for the 'relevant organization': the criterion looks for the coarsest (most proportional) set of variables that still captures everything that makes a difference to E1–E4.","related":["conditional irrelevance","interventionist account of explanation","relevant organization"]},{"id":"conditional-irrelevance","term":"conditional irrelevance","aliases":[],"kind":"term of art","short":"A physical feature is conditionally irrelevant to some phenomena when, once certain other variables are held fixed, intervening on that feature changes nothing about the phenomena.","background":"The phrase is drawn from James Woodward's later work (2021) refining his interventionist theory of explanation, formalizing the intuitive idea that some details 'don't matter' once the relevant higher-level facts are fixed—for instance, the exact material of a key is conditionally irrelevant to whether it opens a lock, given its shape.","inThisPaper":"This is the technical core of the paper's definition of 'relevant organization' and of 'non-functional property': a feature is non-functional exactly when it is conditionally irrelevant to E1–E4 given the organization (V). It also does the work in the realizer-theory dilemma of Section 4, where Q's specific physical nature (as opposed to its functional role) is argued to be conditionally irrelevant.","related":["relevant organization","interventionist account of explanation","non-functional property"]},{"id":"organizational-invariance","term":"organizational invariance","aliases":[],"kind":"term of art","short":"Chalmers's principle that any two systems with the same fine-grained functional organization have the same conscious experiences.","background":"Chalmers introduced organizational invariance in *The Conscious Mind* (1996) and the earlier fading-qualia paper (1995) as a thesis he takes to be supported (though not entailed) by the fading and dancing qualia thought experiments; it is meant to be compatible with his view that consciousness is still a further, non-functionally-constituted fact governed by a psychophysical law.","inThisPaper":"The paper borrows Chalmers's own formulation—requiring systems to be in 'corresponding states'—for its own sameness condition on sharing the 'relevant organization,' while going further than Chalmers by denying that any further fact rides on top of that shared organization.","related":["relevant organization","fading qualia argument"]},{"id":"epiphenomenal-dualism","term":"epiphenomenal dualism","aliases":["epiphenomenalism"],"kind":"position","short":"The view that phenomenal (conscious) properties exist and are non-physical, but have no causal effects on the physical world, including on our behavior and reports.","background":"Epiphenomenalism has roots in 19th-century debates (T.H. Huxley) and remains a live minority position in philosophy of mind, valued by some dualists because it lets them accept the causal closure of the physical (nothing physical needs a non-physical cause) while still holding that experience is real and non-physical. Its chief cost is explaining how we could know about, or truly believe in, properties that by hypothesis do nothing to our belief-forming processes.","inThisPaper":"Listed as one of the views sorted by the paper's table (¶29): it says phenomenal properties are not fixed by organization and make no difference to E1–E4, which the paper argues is answered by the argument from coincidence in Section 3.","related":["interactionist dualism","non-functional property","argument from coincidence"]},{"id":"russellian-monism","term":"Russellian monism","aliases":["Russellian","Russellian views"],"kind":"position","short":"The view that physics describes only the causal/relational structure of matter, and that this structure is grounded in an intrinsic, possibly proto-phenomenal, nature which physics leaves out.","background":"Russellian monism takes its name from Bertrand Russell's structuralist view of physics, later developed by philosophers such as Galen Strawson, Philip Goff, and others as a way to reconcile physicalism and panpsychist or panprotopsychist intuitions: physics tells us only how matter behaves, not what it intrinsically is, and that intrinsic nature might be phenomenal or proto-phenomenal. It is often paired with 'phenomenal powers' views on which these intrinsic natures constitute the categorical bases of causal powers.","inThisPaper":"Grouped with 'phenomenal-powers views' in the paper's table (¶30) as holding that phenomenal natures realize the causal powers picked out by functional organization; addressed in Section 3 via the discussion of Mørch's phenomenal-powers view.","related":["phenomenal-powers view","non-functional property","phenomenal powers view","realizer theories","Mørch's realization thesis"]},{"id":"phenomenal-powers-view","term":"phenomenal-powers view","aliases":[],"kind":"theory","short":"The view that a conscious state's specific causal powers (e.g., pain's power to cause avoidance) are constrained or explained by its phenomenal, qualitative nature.","background":"This is associated especially with Hedda Hassel Mørch's work (2013 onward, cited here as 2020), which argues that if we take causal powers seriously as intrinsic and not purely dispositional/relational, phenomenal qualities are the best candidates to ground them—linking panpsychist and Russellian-monist ideas to the problem of mental causation.","inThisPaper":"Discussed in detail in Section 3 (¶51–55) as one of three candidate 'non-coincidental connections' a realist might propose between phenomenal properties and problem intuitions; the paper argues that on each of three ways of spelling it out, it either reduces to 'no further fact' or incurs the coincidence argument's cost.","related":["Russellian monism","argument from coincidence","non-functional property"]},{"id":"interactionist-dualism","term":"interactionist dualism","aliases":["interactionism","interactionists"],"kind":"position","short":"The view that phenomenal properties are non-physical and do have genuine causal effects on physical events, including our reports and judgments about experience.","background":"Interactionist (substance) dualism is the classical Cartesian position, historically the default view before physicalism became dominant in 20th-century philosophy of mind; its main modern liability is that it conflicts with the widely-accepted causal closure of the physical (the claim that every physical event has a sufficient physical cause), which is strongly supported by physics.","inThisPaper":"Marked in the table (¶31) as 'outside scope,' since it denies P1 of the argument from coincidence (that problem intuitions have a near-complete functional explanation); the paper notes this dispute is about causal closure and is not pursued.","related":["epiphenomenal dualism","causal closure","causal closure of the physical","P1"]},{"id":"realizer-physicalism-realizer-theories","term":"realizer physicalism / realizer theories","aliases":["realizer theorist","realizer theory"],"kind":"position","short":"The general family of views holding that consciousness requires some specific physical property beyond the functional organization itself—so a functional duplicate built from different material might not be conscious.","background":"This is the paper's own umbrella label for a family of otherwise-distinct positions (biological naturalism, IIT, and related realizer-based views) that share the idea that the physical realizer of a functional role, not just the role, matters for consciousness; the contrasting position is usually called 'role functionalism' or pure functionalism.","inThisPaper":"Used throughout Sections 1, 4, and 7 as the main rival family to the paper's own view; Section 4 develops a general dilemma (horn 1 / horn 2) meant to apply to any realizer theory, with IIT and Searle's biological naturalism as worked examples.","related":["integrated information theory (IIT)","biological naturalism","non-functional property"]},{"id":"physicalism-with-role-identified-phenomenal-concepts","term":"physicalism with role-identified phenomenal concepts","aliases":["role-identified phenomenal concepts"],"kind":"position","short":"A physicalist view on which phenomenal concepts simply refer to whatever functional/physical states play the relevant causal role—so there is no further fact left over once the role is filled.","background":"This tracks a strand of physicalist philosophy of mind (associated with functionalist and 'analytic functionalist' treatments of phenomenal concepts) that treats mentalistic vocabulary as picking out roles rather than intrinsic natures, in contrast to views (like Loar's or Balog's) that treat phenomenal concepts as referring 'directly' to an underlying nature via acquaintance.","inThisPaper":"Listed in the table (¶33) as the view that phenomenal properties simply consist in the organization; the paper's own positive picture (Section 5) is closely related to this option, differing mainly in denying that any concept correctly characterizes states as intrinsically qualitative.","related":["non-functional property","acquaintance","recognitional concepts"]},{"id":"verificationism","term":"verificationism","aliases":[],"kind":"position","short":"Roughly, the view that a claim is meaningful, or that a dispute is real, only if there is some possible observation or evidence that could settle it.","background":"Verificationism was central to logical positivism in the early-to-mid 20th century (the Vienna Circle, A.J. Ayer) as a criterion for meaningfulness, and was later widely rejected as too restrictive (it seemed to rule out much of mathematics, ethics, and even some science); the label is now often used pejoratively, as a criticism that an argument illegitimately dismisses a claim just because it can't be empirically checked.","inThisPaper":"The paper explicitly disclaims verificationism (¶34): it is not arguing that talk of intrinsic qualities is meaningless because unverifiable, but making a comparative claim that the best explanation of the relevant phenomena has no place for such properties.","related":["argument from coincidence"]},{"id":"premise-conclusion-argument-form-p1-p2-c","term":"premise-conclusion argument form (P1, P2, ... C)","aliases":["P1","P2","P3","P4","C","premise 1"],"kind":"method","short":"A standard way of writing an argument in academic philosophy: numbered premises (P1, P2, ...) are stated as claims, followed by a conclusion (C) that is supposed to follow from them, so the argument's structure and each debatable step can be inspected separately.","background":"The paper's coincidence argument is built as a numbered chain of premises (P1–P4) following Chalmers's own presentation of the 'argument from coincidence' against realist theories of consciousness. Labeling premises this way is a common device in analytic philosophy for making an argument's logical structure explicit and easy to reference in later discussion. There is no independent history to 'P1' itself; it is a paper-specific label rather than an established term.","inThisPaper":"The paper uses this format to lay out the argument from coincidence (¶38-42) and the moral argument (¶111-114), which lets it later say precisely which premise (e.g., P1, P4, or M3) a given objector should reject (see Section 10, 'What remains open').","related":["argument from coincidence","Horn (of a dilemma)","P2","P3","P4","topic-neutral","meta-problem","coincidence argument","causal closure of the physical","problem intuitions","acquaintance","further fact"]},{"id":"horn-of-a-dilemma","term":"Horn (of a dilemma)","aliases":["horn 1","horn 2","twin horn"],"kind":"term of art","short":"One of the two mutually exclusive options in a dilemma-style argument, each of which is shown to lead to the same conclusion.","background":"The image of a dilemma having 'horns' is an old figure in logic, used when an arguer wants to show that whichever branch of a forced choice an opponent takes, they end up committed to the same unwelcome result. It's a standard piece of philosophical argumentative vocabulary, not tied to any one author.","inThisPaper":"The paper sets up a two-horned dilemma for any realizer theory: either the extra physical property Q's contribution is already captured by the functional variables in V (horn 1), or it isn't and turns out to be causally idle with respect to what needs explaining (horn 2). Both horns are argued to leave the realizer theorist without a further fact.","related":["realizer theory","conditionally irrelevant"]},{"id":"realizer-theory-realizer-theorist","term":"Realizer theory / realizer theorist","aliases":["realizer theories","realizer physicalism"],"kind":"position","short":"Any view holding that consciousness requires some specific physical property beyond a system's functional organization, so that a functional duplicate built from different material might not be conscious.","background":"This label covers biological naturalism (Searle), integrated information theory (IIT), and other 'physical realizer' views that deny consciousness supervenes on functional organization alone. It contrasts with pure functionalism, on which any system with the right organization is conscious regardless of substrate. The dispute over realizer views versus functionalism has been central to philosophy of mind since the 1960s-70s multiple-realizability debates.","inThisPaper":"The paper treats realizer theories as the second main rival to its no-further-fact thesis (after Chalmers's dualism), and Section 4 runs the dilemma argument against them, using IIT and Searle as its main test cases.","related":["Horn (of a dilemma)","IIT","biological naturalism"]},{"id":"q","term":"Q","aliases":[],"kind":"stipulated term","short":"A stand-in label for whatever extra physical property a realizer theory claims consciousness requires beyond the relevant functional organization.","background":"This is not a term from the wider literature but a variable the author introduces for the dilemma argument, in the style of using letters to stand for unspecified properties in a general argument (so the argument covers any candidate realizer property at once).","inThisPaper":"Q is used to run the dilemma generically: examples given are a biological property of neurons, Searle's consciousness-producing causal powers, and IIT's maximally irreducible cause-effect structure, and the argument asks what Q adds beyond the organization it realizes.","related":["Horn (of a dilemma)","realizer theory"]},{"id":"phi","term":"Phi (Φ)","aliases":["high phi"],"kind":"jargon","short":"IIT's technical measure of a system's integrated information, taken by the theory to correspond to the quantity of consciousness a system has.","background":"Phi was defined within IIT as a way to quantify how much a system's causal structure is irreducible to its parts; higher phi is meant to indicate richer or more unified conscious experience. Critics have questioned both its computability for realistic systems and whether high phi actually explains why a system reports or judges anything about its experience.","inThisPaper":"Quoted via Chalmers's remark that 'it is far from obvious how high phi even causes the reports,' used to press the point that IIT's key posit may be causally idle with respect to the judgments that need explaining.","related":["Integrated Information Theory (IIT)"]},{"id":"exclusion-postulate","term":"Exclusion postulate","aliases":[],"kind":"term of art","short":"An axiom/postulate within IIT stating that only one maximally irreducible cause-effect structure can be the substrate of consciousness at a given spatiotemporal grain, excluding overlapping or coarser/finer candidates.","background":"The exclusion postulate is one of several postulates IIT derives from its phenomenological axioms (alongside intrinsic existence, composition, information, and integration). It has been a focus of technical dispute because it determines which physical system, among many overlapping candidates, 'counts' as the conscious one, and this bears on how IIT treats simulations of brains.","inThisPaper":"Cited as the reason the mapping between a neuron-by-neuron computer simulation and the original brain is disputed under IIT, which is why the paper prefers the chip-replacement scenario as a cleaner test.","related":["Integrated Information Theory (IIT)"]},{"id":"conditionally-irrelevant","term":"Conditionally irrelevant","aliases":["conditional irrelevance"],"kind":"stipulated term","short":"Said of a physical feature when, once the relevant functional variables (V) are held fixed, intervening on that feature makes no difference to the explananda (E1-E4).","background":"The notion is drawn from Woodward's interventionist theory of causal explanation, where it is used to identify which variables in a causal model actually do explanatory work once others are controlled for. The author adapts Woodward's own term 'conditional irrelevance' from his 2021 paper on explanatory autonomy.","inThisPaper":"Central to the paper's criterion for 'the relevant organization' (Section 2) and reused throughout Section 4 to argue that a realizer property Q, once V is fixed, either does or does not make a further difference-if it doesn't, it is conditionally irrelevant and the theory falls on horn 2.","related":["Horn (of a dilemma)","realizer theory"]},{"id":"unfolding-argument","term":"Unfolding argument","aliases":[],"kind":"named argument","short":"An argument (Doerig et al. 2019) claiming that any theory holding consciousness depends on a system's specific causal structure (not just its input-output behavior) cannot be tested, because a feedforward system can always be built to mimic any such structure's outputs.","background":"Doerig, Herzog, and colleagues proposed the unfolding argument as a challenge to 'causal structure theories' of consciousness such as IIT, arguing these theories make untestable claims since any recurrent network's behavior can be 'unfolded' into an equivalent feedforward network with different causal structure but identical output. It provoked replies, including from Tsuchiya, Andrillon and Haun (2020), who argued it wrongly reduces the debate to behaviorism.","inThisPaper":"The paper's own dilemma is presented as 'a version of the unfolding argument, with one change'-requiring the duplicate to match the original system under interventions on internal variables, not just in input-output behavior, which is meant to answer the behaviorism objection.","related":["Horn (of a dilemma)","conditionally irrelevant"]},{"id":"twin-consciousness","term":"Twin-consciousness","aliases":[],"kind":"stipulated term","short":"A hypothetical state posited by realizer theorists as what a functional duplicate built from different material would have instead of 'real' consciousness-differing from consciousness only in its physical realizer.","background":"The term appears in the exchange between Chalmers and Pautz (2020) over how to describe the state of a system that shares our organization but not our realizer property; it names the awkward possibility that such a system might have something extremely similar to consciousness without technically qualifying as conscious by realizer-theoretic lights.","inThisPaper":"Used to state one of two ways the horn-2 duplicate can be described: if 'twin-consciousness' is just as good as consciousness in every respect, Chalmers grants (quoted) that it just is consciousness, which the paper treats as effectively conceding the point at issue.","related":["Horn (of a dilemma)","realizer theory"]},{"id":"intrepid-collaboration","term":"INTREPID collaboration","aliases":["INTREPID"],"kind":"term of art","short":"A named research consortium running an experiment (using optogenetic neuron inactivation in rodents) designed to test competing predictions of IIT and rival theories of consciousness.","background":"INTREPID is one of several large adversarial-collaboration projects (alongside the Cogitate Consortium) set up to pit rival theories of consciousness against each other using pre-registered, theory-neutral experimental designs, a methodological trend meant to resolve disputes that pure philosophical argument cannot settle.","inThisPaper":"Cited (Corcoran et al. 2026) as an empirical test: IIT predicts that inactivating neurons inactive during a task will still bias rodents' judgments, while rivals predict no such bias; the paper argues its own framework agrees with IIT's rivals on this specific prediction.","related":["Integrated Information Theory (IIT)"]},{"id":"optogenetically","term":"Optogenetically","aliases":["optogenetic inactivation"],"kind":"technical (science)","short":"A laboratory technique that uses light-sensitive proteins inserted into neurons to switch specific neurons on or off with light, allowing precise causal manipulation of neural activity.","background":"Optogenetics was developed in the mid-2000s (Deisseroth, Boyden and others) and transformed neuroscience by allowing researchers to test causal, not just correlational, claims about which neurons produce which behaviors or experiences, replacing cruder methods like lesioning or pharmacological blocking.","inThisPaper":"Named as the method the INTREPID experiment uses to inactivate neurons that were inactive or minimally active during a visual task, testing whether this biases rodents' location judgments as IIT predicts.","related":["INTREPID collaboration"]},{"id":"harder-problem-of-consciousness","term":"Harder problem (of consciousness)","aliases":["Block's harder problem"],"kind":"named argument","short":"Ned Block's problem that even a complete physicalist theory may not tell us whether 'conscious' picks out a functional role or the specific physical realizer that plays it in us.","background":"Block proposed this in a 2002 paper as a companion to Chalmers's 'hard problem,' arguing that physicalism alone underdetermines whether consciousness is a functional/relational property or an intrinsic physical (realizer) property. It has been influential in debates about whether functional duplicates built from different materials would really be conscious, and about whether such disputes are substantive or merely verbal.","inThisPaper":"Used in Section 4 to frame the dispute between 'role' and 'realizer' theorists about artificial or differently-built systems; the paper argues that once there is no further fact, this becomes a semantic indeterminacy that carries no explanatory or moral weight, though it does affect which word applies.","related":["Realizer theory","Semantic/verbal indeterminacy","Phenomenal irrealism"]},{"id":"phenomenal-irrealism","term":"Phenomenal irrealism","aliases":[],"kind":"position","short":"The view that there are no phenomenal properties of the intrinsic, directly-revealed kind philosophers usually posit.","background":"The term is used by Block (2002) to characterize a possible reply to his harder problem: that treating the choice between role and realizer as a mere decision presupposes there's no fact about phenomenal properties to be right or wrong about. It overlaps heavily with what this paper elsewhere calls 'illusionism.'","inThisPaper":"Block says the 'verbal dispute' reply to his harder problem 'presupposes phenomenal irrealism'; the paper accepts that this is exactly right and takes Section 3's coincidence argument as its defense of phenomenal irrealism.","related":["Harder problem (of consciousness)","Strong illusionism"]},{"id":"semanticverbal-indeterminacy","term":"Semantic/verbal indeterminacy","aliases":["indeterminacy of 'conscious'"],"kind":"distinction","short":"The idea that once role and realizer come apart, the word 'conscious' may simply have no fixed, determinate referent — it's a question about language, not about an extra fact in the world.","background":"This kind of move is common in philosophy when two candidate meanings for a term both fit ordinary usage equally well; Chalmers's own work on 'verbal disputes' (2011) supplies a general method for diagnosing such cases. Several authors cited here (Birch, Brown and Papineau, Kammerer) have argued that the illusionism/realism dispute itself, or the role/realizer dispute, reduces to this kind of indeterminacy.","inThisPaper":"Used to explain why, on the twin horn of the realizer dilemma (Section 4), realist and role theorist can agree on every fact about a duplicate system and still disagree only about which word to use — and the paper argues nothing important turns on settling that verbal question, since Section 8 shows the moral answer doesn't depend on it.","related":["Harder problem (of consciousness)","Phenomenal irrealism","Reference and indeterminacy"]},{"id":"horn-1-horn-2","term":"Horn 1 / Horn 2","aliases":["twin horn","the dilemma"],"kind":"stipulated term","short":"The two branches of a dilemma the paper poses to any theory positing a non-functional property Q that consciousness supposedly requires: either Q's causal contribution is already captured by the functional variables (horn 1), or it isn't and makes no difference to behavior or judgments (horn 2).","background":"This is the paper's own stipulated framework (Section 4), built on the interventionist criterion introduced in Section 2 and inspired by the 'unfolding argument' against causal-structure theories of consciousness (Doerig et al. 2019). It is not a term with independent currency outside this paper but a device for classifying rival theories such as IIT, biological naturalism, and Searle's views.","inThisPaper":"Applied repeatedly in ¶70–¶73 to Searle: his claim that silicon chips duplicating neurons' input-output function would lack consciousness places him on horn 2, while his separate empirical claim that silicon can't duplicate neurons' causal powers is treated as a horn-1 claim about what the relevant variables (V) require.","related":["Realizer theory","IIT","Argument from coincidence"]},{"id":"simulation-analogy-simulated-stomach","term":"Simulation analogy (simulated stomach)","aliases":["simulated stomach digests nothing"],"kind":"named argument","short":"An objection, illustrated by the fact that a computer simulation of a stomach doesn't digest anything, used to suggest that a simulated brain likewise wouldn't really be conscious.","background":"This kind of analogy is a recurring move in debates over computational theories of mind, often traced to arguments like Searle's Chinese Room and repeated by realist theorists including Tononi and Koch, who use it (2015) to argue that a simulated star doesn't bend spacetime the way a real one does, so a simulated brain might not produce real experience.","inThisPaper":"The paper concedes the analogy would hold if consciousness were an extra 'product' (like digested food) or an intrinsic substrate property (like mass), but argues neither model fits: consciousness, on this view, just is patterns of discrimination, learning, report, and problem intuitions (E1–E4), which a sufficiently organized simulation can reproduce.","related":["Horn 1 / Horn 2","Realizer theory"]},{"id":"life-after-vitalism","term":"Life after vitalism","aliases":["vitalism analogy"],"kind":"named argument","short":"An analogy comparing debates over consciousness and function to the historical abandonment of vitalism (the view that living things have a special non-physical 'life force'): once vitalism was dropped, 'life' still named a perfectly good functional kind.","background":"This is a common illustrative analogy in philosophy of mind and biology for cases where discarding a metaphysically loaded theory doesn't require abandoning the ordinary concept it was attached to; it echoes points made by illusionists and functionalists (including Dennett) about consciousness surviving the loss of a 'phenomenal' metaphysics.","inThisPaper":"Offered at the end of Section 4 as the paper's model for how to think about the word 'conscious' after abandoning non-functional properties: a useful functional kind remains for every practical and moral purpose, regardless of how the semantics of the word itself gets settled.","related":["Semantic/verbal indeterminacy"]},{"id":"transparency","term":"Transparency","aliases":[],"kind":"term of art","short":"The phenomenon whereby introspection 'looks through' the mechanisms producing an experience and presents only the experience's surface features, making the underlying processing invisible.","background":"The term and its main theoretical development come from Thomas Metzinger's Being No One (2003), where transparency explains why we take our mental representations for reality itself rather than seeing them as representations. It has since been widely used in philosophy of mind to explain naive realist intuitions about perception and experience.","inThisPaper":"Cited as the mechanism by which the self-model's outputs seem 'directly known': because earlier processing stages are unavailable to the self-model, its representations seem to present states with no further nature behind them, which is Metzinger's account as the paper adopts it.","related":["Self-model","Explanatory gap"]},{"id":"attention-schema-theory","term":"Attention schema theory","aliases":["AST"],"kind":"theory","short":"A theory holding that the brain builds a simplified internal model of its own attention, and that this model contributes to attentional control and to reports of subjective awareness.","background":"Developed by Michael Graziano and colleagues (Graziano and Webb 2015; Graziano 2019), it proposes that consciousness-talk arises because the brain represents its own attentional state in a schematic, incomplete way, similar to how the brain represents the body via a body schema. It has been discussed both as a candidate mechanistic explanation of introspective reports and, by critics like Kleiner and Hoel, as vulnerable to falsifiability worries shared by other 'causal structure' theories.","inThisPaper":"Offered in Section 5 as one concrete proposal for the kind of self-model mechanism the paper's account needs, though the paper notes (¶80) that its supporting evidence concerns awareness and attentional control specifically, not directly the judgments about intrinsic qualities that drive the hard problem.","related":["Self-model","Transparency"]},{"id":"explanatory-gap","term":"Explanatory gap","aliases":[],"kind":"term of art","short":"The apparent mismatch between any physical/mechanistic description of a state and what that state is like from the inside, which makes physical explanations of experience seem to leave something out.","background":"The phrase was coined by Joseph Levine in the 1980s and developed at length in his book Purple Haze (2001) to name the persistent sense that no amount of physical detail seems to explain why a state feels a particular way. It is one of the central data points motivating the hard problem of consciousness and dualist or non-reductive views.","inThisPaper":"The paper predicts the explanatory gap as a straightforward consequence of its self-model account: because the self-model presents a state without the mechanisms that constitute it, comparing a mechanistic description to that presentation produces a mismatch that looks like (but isn't) a genuine gap in the world.","related":["Self-model","Problem intuitions"]},{"id":"access-consciousness","term":"Access consciousness","aliases":[],"kind":"term of art","short":"Ned Block's term for the property a state has when it is globally available for use in reasoning, reporting, and rational control of action and speech, as opposed to any further 'phenomenal' quality.","background":"Block introduced the access/phenomenal consciousness distinction in his influential 1995 paper 'On a confusion about a function of consciousness,' arguing that many discussions of consciousness conflate the two properties. Access consciousness is generally treated as functionally definable and uncontroversial, while phenomenal consciousness is the more disputed, harder-to-explain notion.","inThisPaper":"The paper affirms that the global availability of self-modeled states — for report, planning, and flexible control — is real and is exactly Block's access consciousness; it denies only that anything further ('phenomenal' in the intrinsic sense) accompanies it.","related":["Self-model","Explanatory gap"]},{"id":"iit-in-this-passage-the-complex","term":"IIT (in this passage: 'the complex')","aliases":["Integrated Information Theory","complex"],"kind":"theory","short":"Here, the specific IIT notion that the true subject of experience is a system's 'complex' — the substrate with maximal integrated information — which can shrink or shift as parts of a system are altered.","background":"Integrated Information Theory, developed by Giulio Tononi and collaborators, identifies consciousness with a system's capacity for integrated information (phi) and holds that the subject of experience is the 'complex' with maximal phi, distinct from other overlapping candidate substrates; this notion has been used to answer objections about gradual neuron replacement by saying the conscious complex simply relocates or shrinks.","inThisPaper":"Cited (¶72) as one reply to the fading qualia argument: on IIT, as neurons are replaced, 'the subject is the complex,' which shrinks even as the reporting system continues normally — a reply the paper says still concedes an end state that reports falsely about its own experience, which is what the coincidence argument targets.","related":["Fading qualia argument","Realizer theory","Horn 1 / Horn 2"]},{"id":"borderline-case","term":"Borderline case","aliases":["intermediate stages"],"kind":"term of art","short":"A case that falls between clear instances of a category, where it is indeterminate whether the category applies at all.","background":"The notion of borderline cases comes from the general philosophical treatment of vagueness (e.g., in Sorites-style puzzles), and has been specifically applied to consciousness by philosophers debating whether 'phenomenally conscious' admits of vague or sharp boundaries (Simon 2017; Schwitzgebel 2023b; Tye 2021).","inThisPaper":"Mogensen (2025) is cited as treating the intermediate stages of the fading-qualia neuron-replacement scenario as borderline cases of consciousness, which the paper treats as another way of conceding an end state that reports falsely about its own experience.","related":["Fading qualia argument","Semantic/verbal indeterminacy"]},{"id":"topic-neutral-content","term":"topic-neutral (content)","aliases":["topic-neutrally","topic-neutral intuitions"],"kind":"term of art","short":"Content of a belief or intuition described in a way that doesn't commit to whether its subject matter is physical, functional, or phenomenal.","background":"The topic-neutral analysis of mental language traces to J.J.C. Smart's mid-20th-century defense of mind-brain identity theory, where he proposed describing sensations in terms that leave open their ultimate nature, so that identity claims wouldn't be self-contradictory. The idea was later adapted by philosophers discussing consciousness to isolate the 'safe', functionally specifiable core of introspective judgments from more contentious claims about intrinsic qualia. Chalmers uses the notion to state what a functional duplicate would share with us even under illusionism.","inThisPaper":"The paper defines problem intuitions (E4) by their topic-neutral content: roughly, that we have properties hard to explain physically, known in a special first-person way, that could be missing in a functional duplicate. This lets P1 claim that a duplicate shares the intuitions' topic-neutral content even though it disagrees with realism about their fuller phenomenal content.","related":["P1","meta-problem","problem intuitions"]},{"id":"meta-problem-of-consciousness","term":"meta-problem (of consciousness)","aliases":["meta-problem","the meta-problem"],"kind":"term of art","short":"The problem of explaining, in physical and functional terms, why we judge that there is a hard problem of consciousness at all.","background":"The term was coined by David Chalmers in his 2018 paper 'The Meta-Problem of Consciousness,' as a way of reframing debates about the hard problem: instead of asking whether phenomenal consciousness can be physically explained, one asks why humans are disposed to find such explanation so puzzling. Chalmers argued the meta-problem is tractable by ordinary scientific and philosophical methods even if the hard problem is not, and different theories of consciousness can be compared by how well they solve it. It has become a widely used framework in illusionist and functionalist responses to the hard problem.","inThisPaper":"The paper treats explaining the 'problem intuitions' (E4) as solving the meta-problem, and Chalmers's own concession that the meta-problem is 'strictly speaking one of the easy problems' is used as support for P1, since it implies a full functional explanation of the intuitions is available even to a realist.","related":["problem intuitions","P1","hard problem","topic-neutral (content)"]},{"id":"causal-closure-of-the-physical","term":"causal closure of the physical","aliases":["causal closure"],"kind":"term of art","short":"The thesis that every physical event that has a cause has a sufficient physical cause, leaving no room for non-physical causes to intervene.","background":"Causal closure is a longstanding principle in philosophy of mind, often traced to arguments against Cartesian dualism and defended on the basis of the success of physics in explaining physical events without appeal to non-physical causes. It underlies standard arguments against interactionist dualism and for physicalism, since if the physical realm is causally closed, non-physical mental causes would be either epiphenomenal or would 'overdetermine' physical effects. It remains disputed, especially by philosophers sympathetic to libertarian free will or interactionist views of mind.","inThisPaper":"The paper notes that P1 assumes causal closure of the physical, and that interactionist dualists, who hold that phenomenal properties causally affect physical events, must reject P1 and instead argue directly against causal closure — a dispute the paper explicitly sets aside.","related":["interactionist dualism","P1","epiphenomenal","coincidence argument"]},{"id":"local-independence-global-independence","term":"local independence / global independence","aliases":["local independence","global independence"],"kind":"distinction","short":"A distinction between a belief being independent of its object in a narrow, situation-specific way (local) versus the entire structural/causal explanation of a belief being independent of the property it concerns across all cases (global).","background":"The distinction is due to David Chalmers, introduced to defend the coincidence argument from the objection that all beliefs, even true perceptual ones, can be held even if false (as in ordinary hallucination cases) — which would make the 'sensitivity' objection prove too much. Chalmers argued that ordinary hallucinations exhibit only local independence, since the general explanatory story of perception still runs through the perceived object in normal cases, whereas phenomenal properties on realist views would be globally independent: the entire structural explanation of our intuitions about them could hold unchanged whether or not the properties existed.","inThisPaper":"The paper uses this Chalmers's distinction to block the objection that a general 'sensitivity principle' would over-generate skepticism (via the hallucination case), and instead grounds P2 specifically in global independence: for a non-functional property, nothing in the structural explanation of our problem intuitions runs through that property, in a way that a hallucinated table's absence does not undermine ordinary perceptual explanation.","related":["sensitivity principle","P2","structural explanation"]},{"id":"sensitivity-principle","term":"sensitivity principle","aliases":[],"kind":"term of art","short":"The epistemological principle that a belief provides no evidence for its content if the believer would hold that belief even were it false.","background":"Sensitivity is a well-known condition on knowledge in epistemology, associated with Robert Nozick's tracking theory of knowledge (1981), which holds that for S to know that p, S must not believe p in the nearest possible worlds where p is false. It has been widely discussed and criticized, notably because it seems to rule out knowledge in cases (like ordinary perceptual beliefs about hallucination-prone situations) where intuitively we still know.","inThisPaper":"The paper raises the sensitivity principle only to reject it as the basis of P2, noting that it 'proves too much' by undermining even a hallucinating subject's belief that there's a table. Instead, P2 is grounded in the more specific notion of global independence.","related":["global independence","P2"]},{"id":"structural-explanation","term":"structural explanation","aliases":["near-complete structural explanation"],"kind":"term of art","short":"An explanation of a phenomenon purely in terms of causal/functional structure, without invoking any further intrinsic or phenomenal nature.","background":"The phrase derives from Chalmers's discussions of the meta-problem and coincidence argument, where he grants that even on realist views (including Russellian monism and realizer theories), a 'near-complete structural explanation' of our reports and judgments about consciousness is available in principle, since these behaviors and judgments are functionally/causally produced.","inThisPaper":"The paper cites Chalmers's concession that a near-complete structural explanation of problem intuitions could exist even on realist and Russellian views, using this as direct textual support for P1.","related":["P1","global independence","Russellian monism"]},{"id":"constitution-reply","term":"Constitution (reply)","aliases":["constitution","constitutional route"],"kind":"term of art","short":"The reply to the coincidence argument holding that phenomenal properties partly constitute phenomenal beliefs themselves, so that a duplicate lacking those properties would have false or empty beliefs rather than true ones matching ours.","background":"This reply draws on Chalmers's earlier work on the content and epistemology of phenomenal belief (2003), where he argued that phenomenal concepts might have their reference partly fixed by the phenomenal property itself, so beliefs deploying such concepts could not be duplicated without the property. It is one of several routes realists have proposed for explaining why our beliefs about consciousness are true while a functional duplicate's parallel beliefs might not be.","inThisPaper":"Presented as the first of three candidate 'non-coincidental connections' a realist might invoke against P3. The paper grants it may work for beliefs individuated by their phenomenal constituents, but argues it doesn't address the topic-neutral problem intuitions (E4), which are shared with the duplicate and produced the same way in both.","related":["Acquaintance","Realization","P3","topic-neutral (content)"]},{"id":"quotational-account-of-phenomenal-concepts","term":"quotational account of phenomenal concepts","aliases":[],"kind":"theory","short":"Katalin Balog's proposal that phenomenal concepts work by literally incorporating (or 'quoting') a token of the very experience they refer to, explaining their special epistemic features while remaining compatible with physicalism.","background":"Balog developed this view (notably in her 2012 paper 'Acquaintance and the mind-body problem') as part of the phenomenal concept strategy, a family of physicalist responses to the knowledge argument and explanatory gap. The idea is that a phenomenal concept's reference-fixing involves instantiating or 'quoting' the experience itself, which is meant to explain acquaintance-like features (immediacy, certainty) without positing non-physical properties.","inThisPaper":"Cited as an example of a physicalist attempt to make acquaintance compatible with physicalism, feeding into the paper's three-way dilemma about whether acquaintance so construed is functional, a further physical realizer property, or primitive.","related":["Acquaintance","phenomenal concept strategy"]},{"id":"realization-mrchs-view-phenomenal-powers-view","term":"Realization (Mørch's view / phenomenal powers view)","aliases":["Realization","phenomenal powers view","Mørch's realization thesis"],"kind":"theory","short":"The view (associated with Hedda Hassel Mørch) that a conscious state's phenomenal nature constrains or constitutes its specific causal powers, so that phenomenal properties directly realize the processes producing our intuitions about consciousness.","background":"Mørch's phenomenal powers view is part of the broader Russellian monist program, aiming to explain how consciousness could have genuine causal efficacy by identifying phenomenal properties with, or grounding them in, the categorical bases of physical causal powers. It responds to worries about epiphenomenalism by giving experience a non-accidental causal role. Chalmers discusses it favorably as one candidate solution to the meta-problem, alongside Bradford Saad's teleological law proposal.","inThisPaper":"Treated as the third candidate reply (‘Realization’) to the coincidence argument, given a three-way dilemma in ¶52–55: either the phenomenal nature varies independently of organization (non-functional, falls to global independence), consists in the organization's role properties (no further fact), or is necessitated by but goes beyond the organization (a primitive posit, costed by P4). The third option is granted partial support for the Substrate/Knowledge consequences but not the moral argument.","related":["Russellian monism","combination problem","fundamental law (Saad)","global independence"]},{"id":"fundamental-law-saads-teleological-law","term":"fundamental law (Saad's teleological law)","aliases":["Saad's law","teleological strategy"],"kind":"theory","short":"Bradford Saad's proposal of a fundamental law of nature under which experiences tend to cause the states and actions they rationalize, including judgments about the hard problem, thereby explaining why our phenomenal judgments are apt.","background":"Saad's proposal (2019, 'A teleological strategy for solving the meta-problem of consciousness') is one of several attempts to answer Chalmers's meta-problem by positing a special causal-cum-rational connection between phenomenal states and the behaviors/judgments they are supposed to explain, modeled loosely on teleological or function-like laws in other domains. It commits to phenomenal properties having genuine causal effects on the physical world, making it a form of interactionism.","inThisPaper":"Discussed alongside Mørch's view as a promising realist response noted by Chalmers; the paper points out that Saad's law is interactionist (letting phenomenal properties affect physical events), setting it apart from Mørch's non-interactionist realization proposal and placing it outside the paper's main line of argument (per the interactionist dualism row in the view-table of Section 2).","related":["Realization (Mørch's view)","interactionist dualism","P1"]},{"id":"combination-problem","term":"combination problem","aliases":[],"kind":"term of art","short":"The problem of explaining how micro-level phenomenal or proto-phenomenal natures could combine or add up to produce the macro-level powers involved in complex processes like introspective judgment.","background":"The combination problem is a well-known objection to panpsychist and Russellian monist views, first prominently pressed by William James and revived in contemporary debates by philosophers like William Seager and Philip Goff. It asks how countless micro-experiences (e.g., of fundamental particles) could combine into the unified macro-experience of a subject, or how micro-level intrinsic natures could jointly realize macro-level causal powers.","inThisPaper":"Raised as a residual difficulty for all three versions of Mørch's realization view discussed in ¶55: however phenomenal nature relates to organization, there remains the further question of how micro-level natures could combine to produce macro-level powers like introspective judgment.","related":["Realization (Mørch's view)","Russellian monism"]},{"id":"revelation","term":"Revelation","aliases":[],"kind":"term of art","short":"The thesis that acquaintance with a phenomenal property reveals its complete essential nature to the subject, leaving nothing about that nature hidden.","background":"The term and thesis are particularly associated with Philip Goff's 2017 book Consciousness and Fundamental Reality, though the underlying idea (that introspection gives us privileged, complete insight into the nature of experience) has older roots in discussions of phenomenal knowledge. Revelation is often invoked by realists to explain the intuitive pull of claims that experience is intrinsic and ineffable, and it is a frequent target of illusionist critique.","inThisPaper":"Mentioned as a possible fallback for realizer/realization theorists needing to explain why problem intuitions (not just first-order judgments) arise: appealing to Revelation returns the dispute to the status of acquaintance, which the coincidence argument has already addressed. It reappears in Section 6 as something the self-model's mechanism is meant to predict people will find compelling, without thereby vindicating it.","related":["Acquaintance","Moorean objection","self-model","acquaintance"]},{"id":"quasi-phenomenal","term":"Quasi-phenomenal","aliases":["quasi-phenomenal states"],"kind":"stipulated term","short":"Frankish's label for first-order functional states that dispose introspection to represent them as if they were phenomenal.","background":"Keith Frankish coined the term in his influential 2016 paper distinguishing 'weak' from 'strong' illusionism about consciousness. It names the real, functionally characterized states that illusionists say actually exist in place of the 'phenomenal' properties realists posit. The term is meant to let illusionists talk about pains, colors and so on without committing to their having any intrinsic felt quality.","inThisPaper":"Used to describe the ordinary referents of words like 'pain' and 'conscious': states with the right functional role that dispose introspection (via the self-model) to seem phenomenal, even though nothing is really phenomenal in the philosophers' sense.","related":["strong illusionism","self-model","phenomenal properties"]},{"id":"recognitional-concepts","term":"Recognitional concepts","aliases":["recognitional concept"],"kind":"term of art","short":"Concepts that let a thinker directly recognize and re-identify a type of state without describing its underlying nature.","background":"Brian Loar introduced phenomenal recognitional concepts in his 1990 paper 'Phenomenal States' as a way for a physicalist to explain why phenomenal concepts seem to pick out something over and above the physical: they refer to physical states directly, by a recognitional capacity, rather than via a description of their physical nature. Loar himself was a realist about phenomenal consciousness, not an illusionist, so his device is usually invoked to defend physicalism while keeping full-blooded qualia.","inThisPaper":"Cited as a model for how a physicalist realist could accept 'no further fact' about consciousness while still calling the underlying role-states 'phenomenal', since Loar's concepts refer to physical states without characterizing them as intrinsic.","related":["a posteriori materialism","quasi-phenomenal"]},{"id":"a-posteriori-materialism","term":"A posteriori materialism","aliases":["a posteriori materialists","a posteriori physicalism"],"kind":"position","short":"The view that phenomenal truths are identical to or necessitated by physical truths, but knowable only empirically ('a posteriori'), not derivable from physical facts by pure reasoning.","background":"This position emerged in the 1990s–2000s as physicalists' main response to conceivability arguments (like Chalmers's zombie argument): they concede that we cannot deduce facts about experience from physical facts a priori, but insist this reflects only a gap in our concepts, not a gap in reality. Loar, Papineau and others are prominent defenders. Critics like Chalmers argue the position still owes an explanation of why the a priori gap exists at all if there is truly no further fact.","inThisPaper":"Mentioned as a family of realist physicalists who can use Chalmers's 'method for verbal disputes' to treat 'consciousness' as a bedrock, primitive term rather than settling whether the paper's illusionism or their realism is correct.","related":["recognitional concepts","verbal dispute","bedrock concept"]},{"id":"verbal-dispute-method-for-verbal-disputes","term":"Verbal dispute (method for verbal disputes)","aliases":["Chalmers's method for verbal disputes"],"kind":"method","short":"A diagnostic procedure for telling whether a philosophical disagreement is merely about which meaning to give a word, rather than about the facts.","background":"David Chalmers proposed this method in a 2011 Philosophical Review article, suggesting that many disputes can be tested by asking whether they would dissolve if the disputants used a neutral replacement term instead of the contested word. It has been applied widely in philosophy of mind to disputes about 'consciousness', 'free will', and similar terms.","inThisPaper":"Invoked to note that a posteriori materialists could use this method to simply stipulate that 'consciousness' names whatever the functional/self-model states are (treating it as 'bedrock'), sidestepping the paper's dispute with illusionism.","related":["bedrock concept","a posteriori materialism"]},{"id":"bedrock-concept","term":"Bedrock concept","aliases":["bedrock"],"kind":"term of art","short":"A concept treated as basic or primitive, not needing further philosophical analysis or reduction.","background":"The idea of treating certain terms as 'bedrock' rather than analyzing them further is a move available in Chalmers's framework for verbal disputes: instead of arguing over what a word 'really' means, a party can simply adopt it as an unanalyzed primitive for their theory. It is a way of ending regress in conceptual analysis.","inThisPaper":"Used to describe how an a posteriori materialist might treat 'consciousness' as bedrock instead of engaging with the paper's functionalist reduction, thereby sidestepping rather than resolving the dispute.","related":["verbal dispute","a posteriori materialism"]},{"id":"what-it-is-like","term":"What it is like","aliases":["phenomenal sense of 'what it is like'"],"kind":"term of art","short":"A phrase used to pick out the subjective character of experience — 'what it is like' to be in a given state.","background":"Thomas Nagel's 1974 paper 'What Is It Like to Be a Bat?' made this phrase central to philosophy of mind, using it to argue that subjective experience resists third-person, objective explanation. It has since become near-synonymous with phenomenal consciousness itself.","inThisPaper":"Cited as one of the philosophers' concepts (alongside 'phenomenal consciousness' and 'quale') that presuppose an intrinsic, directly revealed nature the paper denies anything has.","related":["qualia","phenomenal consciousness"]},{"id":"mode-of-presentation","term":"Mode of presentation","aliases":["substantive mode of presentation"],"kind":"term of art","short":"The particular way a concept presents its referent to a thinker, as opposed to merely which object or property it refers to.","background":"The notion derives from Gottlob Frege's distinction between sense (mode of presentation) and reference: two concepts can refer to the same thing while presenting it differently (e.g., 'the morning star' and 'the evening star'). In philosophy of mind, phenomenal concepts are often said to have a distinctively rich, 'substantive' mode of presentation that seems to reveal the nature of the quality it presents.","inThisPaper":"Used to describe the appearance that phenomenal concepts present qualities 'from the inside'; the paper explains this appearance away as a product of the self-model's format rather than a real semantic feature.","related":["quasi-phenomenal","self-model"]},{"id":"uninstantiated-property","term":"Uninstantiated property","aliases":[],"kind":"term of art","short":"A property that is represented or referred to but that nothing in reality actually has.","background":"The problem of how thought or language can meaningfully represent properties that don't exist (e.g., a unicorn's horn, or on illusionism, 'intrinsic qualia') is a long-standing puzzle in philosophy of mind and language, closely tied to debates about empty reference and intentionality.","inThisPaper":"Central to 'Levine's challenge': the puzzle of how the self-model can represent an intrinsic phenomenal property when, on illusionism, no such property is instantiated anywhere.","related":["mode of presentation","self-model"]},{"id":"space-of-qualities","term":"Space of qualities","aliases":["quality space"],"kind":"term of art","short":"A structured space of possible qualitative distinctions (e.g., locations in a color space) used to give determinate content to representations.","background":"Quality-space theories of mental representation, developed by theorists like Austen Clark, hold that a representational system encodes qualities by their relative position within a similarity space (e.g., how a color relates to other colors), rather than by intrinsic features.","inThisPaper":"Invoked, following Kammerer, as one resource the self-model uses to give its representations determinate content: representing a state's location in such a space, plus falsely attributing primitiveness to it.","related":["inferential role","uninstantiated property"]},{"id":"inferential-role","term":"Inferential role","aliases":["inferential-role account","inferential role semantics"],"kind":"term of art","short":"A theory of content on which what a representation means is fixed by its causal/inferential relations to other representations and states, not by resemblance or direct pointing.","background":"Inferential role semantics grew out of functionalist philosophy of mind and language in the mid-to-late 20th century (associated with figures like Wilfrid Sellars and later Ned Block), holding that the meaning of a concept is constituted by the inferences it licenses. It contrasts with causal or teleosemantic theories of content.","inThisPaper":"Used as the paper's proposed account of how the self-model's representations get their content: fixed by the state's role in licensing further judgments (e.g., that a state is primitive, self-revealing), built from features (like quality-space location) that are genuinely instantiated elsewhere.","related":["space of qualities","self-model","uninstantiated property"]},{"id":"immediate-justification","term":"Immediate justification","aliases":[],"kind":"term of art","short":"Justification for a belief that does not derive from inference from other beliefs or evidence.","background":"The notion of immediate (or non-inferential) justification is central to foundationalist epistemology, which holds that some beliefs are justified directly, without needing support from further beliefs, to stop an infinite regress of justification. Perceptual and introspective beliefs are classic candidates for this status.","inThisPaper":"Used in discussing Merlo's argument that an illusion of a phenomenal property would still give immediate justification for believing one has that property, and that such immediate justification would entail truth; the paper rejects the entailment, holding introspective justification is defeasible.","related":["defeasible justification","acquaintance"]},{"id":"defeasible-justification","term":"Defeasible justification","aliases":["defeasible","epistemic sense of 'seem'"],"kind":"term of art","short":"Justification for a belief that can be overridden or defeated by further evidence, rather than guaranteeing truth.","background":"The concept comes from epistemology's treatment of prima facie versus conclusive justification: many everyday beliefs (perceptual, testimonial, introspective) are justified in a way that can later be undermined, distinguishing ordinary fallible justification from infallible or self-guaranteeing knowledge.","inThisPaper":"The paper insists introspective justification about one's own states is defeasible 'like justification from every other source', against views (Merlo, Nida-Rümelin) that treat introspective/phenomenal justification as guaranteeing truth.","related":["immediate justification","acquaintance"]},{"id":"rationalize-rationalization","term":"Rationalize / rationalization","aliases":["rationalized by"],"kind":"term of art","short":"For a mental state to make an action or judgment intelligible as a reasonable response, i.e., to provide the reasons that explain it.","background":"The idea that beliefs and desires 'rationalize' actions (make them intelligible in light of reasons, not just cause them mechanically) traces to Donald Davidson's philosophy of action ('Actions, Reasons, and Causes', 1963), and is a staple notion in philosophy of mind for linking causal and normative/rational explanation.","inThisPaper":"Used in response to Pautz's question of why experience's effects 'fit' the beliefs/actions it rationalizes: the paper says the functional judgment 'I am in a state with pain's role' is both caused and rationalized by that state, while further, false phenomenal-seeming intuitions are caused but have nothing to rationalize them.","related":["Pautz's challenge"]},{"id":"moorean-objection-moorean-argument","term":"Moorean objection (Moorean argument)","aliases":["Moorean argument"],"kind":"named argument","short":"The objection that illusionism about consciousness is refuted simply by the plain fact that we do have experiences — 'the datum is the pain'.","background":"Named after G. E. Moore's style of common-sense refutation (as in his 'Here is one hand' response to skepticism), a 'Moorean' move rejects a theory by appeal to an obvious, more certain datum than any premise used to argue against it. In consciousness debates, Chalmers and others press this style of objection against illusionism, insisting that our having experience is more certain than any philosophical argument that we don't.","inThisPaper":"Discussed at length in Section 6: the paper distinguishes senses in which 'the datum is the pain' could be true, denies the phenomenal sense, and reduces the objection's force to the same acquaintance claim already weighed in the coincidence argument.","related":["acquaintance","phenomenologically blank"]},{"id":"phenomenologically-blank","term":"Phenomenologically blank","aliases":["blank"],"kind":"stipulated term","short":"Chalmers's phrase for the state illusionism is accused of implying we're in: having no experience at all, like an empty system with nothing going on 'inside'.","background":"Chalmers uses this phrase in his critiques of illusionism (e.g., 2020) to dramatize the Moorean objection: if illusionism were true, we would supposedly have no experience whatsoever, which strikes him and many readers as obviously false given how vivid experience seems.","inThisPaper":"The paper answers this charge by arguing that being in states the self-model represents as primitive and self-revealing is what 'not being blank' amounts to, so illusionism does not imply blankness even though it denies intrinsic qualia.","related":["Moorean objection","self-model"]},{"id":"three-senses-of-i-feel-pain","term":"Three senses of 'I feel pain'","aliases":["functional sense","normative sense","phenomenal sense"],"kind":"distinction","short":"A three-way disambiguation of the statement 'I feel pain': (1) being in a state with pain's functional role, (2) being in a state bad for one and giving reason to end it, (3) the state having an intrinsic qualitative character.","background":"The distinction is drawn from François Kammerer's work (cited as 2022b) analyzing why illusionism seems to deny something obvious; separating these senses lets illusionists concede two of the three while denying only the phenomenal sense.","inThisPaper":"Used to answer the Moorean objection: the paper affirms the functional and normative senses of 'I feel pain' and denies only the phenomenal sense, showing illusionism need not deny the 'obvious' truths people actually care about.","related":["Moorean objection","quasi-phenomenal"]},{"id":"implementation","term":"Implementation","aliases":["implements","implementing"],"kind":"term of art","short":"The relation between a physical system and an abstract computation or organization: the system counts as implementing that organization when its states realize the right variables with the right actual and counterfactual transitions.","background":"The notion comes from philosophy of computation and functionalism, where a central puzzle is what makes a physical system a computer or mind rather than an arbitrary lump of matter. Putnam and later Searle worried that almost any system could be said to implement almost any program, threatening to make functionalism trivial. Chalmers (1996b) and Godfrey-Smith (2009) are cited here as sources of 'triviality arguments' that press this worry, which functionalists answer by adding constraints (such as causal structure or counterfactual sensitivity) on what counts as genuine implementation.","inThisPaper":"The paper defines implementation using its own interventionist criterion from Section 2: a system implements the relevant organization when its states realize V's variables with the right transitions and responses to intervention. This is used to answer triviality worries and to analyze thought experiments like Olympia and the Chinese nation.","related":["relevant organization","triviality arguments","Olympia","Chinese nation"]},{"id":"triviality-arguments","term":"Triviality arguments","aliases":[],"kind":"named argument","short":"Arguments claiming that almost any sufficiently complex physical system can be seen as implementing almost any computation, which would make functionalist claims about minds empty.","background":"These arguments trace to worries raised in the philosophy of mind and computation literature, notably discussed by Putnam and developed by Chalmers (1996b) and Godfrey-Smith (2009), both cited in the text. The concern is that if implementation is too easy to satisfy, then saying a system 'implements' a mind-like organization tells us nothing distinctive about it. Responses typically tighten the notion of implementation by requiring genuine causal structure, counterfactual robustness, or distinct interacting parts.","inThisPaper":"The paper says these arguments 'are met to the extent that V's variables must be distinct parts with their own intervention profiles,' using its interventionist criterion for the relevant organization to block trivialization.","related":["Implementation","relevant organization"]},{"id":"olympia","term":"Olympia","aliases":[],"kind":"named argument","short":"Maudlin's thought experiment about a machine whose behavior on a given run is driven by a recording while the machinery for handling other possible inputs sits idle, used to argue that consciousness cannot be purely functional.","background":"Introduced by Tim Maudlin (1989) in 'Computation and Consciousness,' Olympia is meant to show that a system's actual run can be functionally identical to a conscious system's run while lacking active machinery for counterfactual inputs, suggesting that mere functional organization (including inert backup machinery) cannot be what fixes consciousness. It has been widely discussed in debates about computationalism and functionalism, with critics like Klein (2018) tracing Maudlin's intuition to an assumption that consciousness must be 'intrinsic and occurrent.'","inThisPaper":"The paper's interventionist criterion is used to reject Maudlin's premise: since idle machinery still makes a difference to what the system would do under intervention, it is part of the relevant organization, so Olympia with that machinery attached does implement the organization, while without it, it does not.","related":["Implementation","counterfactual transitions","relevant organization"]},{"id":"nesting-and-overlap-of-implementations","term":"Nesting and overlap (of implementations)","aliases":["nested implementation","nesting","overlap","nested-implementation case"],"kind":"distinction","short":"Two ways one physical system can support more than one organization at once: nesting, where a larger organization's components are themselves smaller organized systems (subjects within subjects), and overlap, where the same components play roles in two organizations at the same level.","background":"This is the third category in the paper's three-way distinction, modeled loosely on earlier discussions of 'nesting' in Section 7 (e.g. Block's Chinese nation, where smaller systems' activities compose a larger subject). It is meant to mark the strong, currently unevidenced possibility that a simulated character could be a genuine second welfare subject distinct from the model enacting it.","inThisPaper":"The paper uses the distinction to classify cases like Block's Chinese nation as nesting (subjects nested within subjects, which it allows) versus overlap (same-level sharing, whose subject-count it leaves unresolved), applying its own criterion for the relevant organization to each case.","related":["Chinese nation","Implementation","depiction","enactment","nesting","conversation thread","ownership (of evaluations)"]},{"id":"chinese-nation","term":"Chinese nation","aliases":["Block's Chinese nation","China brain"],"kind":"named argument","short":"Ned Block's thought experiment in which the population of China is organized, via radios and satellites, to realize the functional organization of a single mind, used to probe intuitions about whether a suitably organized group could be conscious.","background":"Block introduced the thought experiment in 'Troubles with Functionalism' (1978) as part of a broader challenge to functionalism, arguing that intuitively such a system would not be conscious even if it satisfied a functionalist description, which he took to be evidence against pure functionalism. It has since been used (e.g., by Schwitzgebel 2015 on the United States) to probe whether large-scale, loosely coupled systems could count as conscious subjects.","inThisPaper":"The paper treats the Chinese nation as a case of nesting (people's activities compose the mind's organization) and says the view 'has no principle that rules collective consciousness out,' making its status depend entirely on whether it truly shares the relevant organization. It is also used in Section 8 to test whether the population's evaluative attitudes would count as the system's own.","related":["Nesting and overlap","Implementation","ownership","self-maintaining organization"]},{"id":"borderline-case-indeterminacy-of-conscious","term":"Borderline case / indeterminacy (of 'conscious')","aliases":["borderline cases","vague","vagueness"],"kind":"distinction","short":"A case where it is neither definitely true nor definitely false that a vague concept like 'conscious' applies, because the system is unclearly similar enough to paradigm cases.","background":"Vagueness is a classic topic in philosophy of language and metaphysics (sorites paradoxes, heaps, baldness), and its application to consciousness is more recent and contested: some philosophers (e.g., Antony 2006, Simon 2017) argue phenomenal consciousness is a sharp, all-or-nothing property with no borderline cases, while others (Papineau 2002, Schwitzgebel 2023b, Hall 2023, Tye 2021) defend genuine borderline conscious cases.","inThisPaper":"The paper predicts borderline cases for the ordinary concept of 'conscious' because organizational similarity to us comes in degrees, and offers an illusionist explanation (the self-model does not represent degrees of its own presence) for why the concept nonetheless feels sharp. It distinguishes this vagueness-based indeterminacy from the separate role/realizer indeterminacy of Section 4, and says neither affects moral status.","related":["'phenomenally conscious'","Knowledge consequence"]},{"id":"homology-and-analogy-as-evidence","term":"Homology and analogy (as evidence)","aliases":["neural evidence","homology","analogy"],"kind":"method","short":"Two ways of inferring shared mental capacities across species: homology infers from shared evolutionary ancestry and mechanisms, while analogy infers from similar funct
