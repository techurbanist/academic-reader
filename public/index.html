/* ============ read aloud (Web Speech API) ============ */
/* Speaks one sentence at a time: long utterances get cut off in some browsers, and sentence-sized pieces
   make pausing, skipping and highlighting exact. Pause is implemented as stop-and-remember, because
   speechSynthesis.pause() is unreliable on Android. */
const TTS = {
  bids:[], i:0, s:0, playing:false, utter:null, wake:null, cache:new Map(), voices:[],
  ok(){ return 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window; },
  loadVoices(){ if (!this.ok()) return; const v=speechSynthesis.getVoices(); if (v.length) this.voices=v; },
  voice(){ this.loadVoices(); return this.voices.find(v=>v.voiceURI===P.ttsVoice) || null; },
  readable(){ return BLOCKS.filter((b,i)=>!b.bib && b.tag!=='tr' && b.tag!=='pre' && !(b.isH && BLOCKS[i+1] && BLOCKS[i+1].bib) && (P.ttsNotes || !b.el.querySelector('.fn'))).map(b=>b.bid); },
  // the text as a listener should hear it: no footnote numbers, optionally no bracketed citations, expanded abbreviations
  spoken(el){
    const c=el.cloneNode(true); c.querySelectorAll('sup,.rail,.fn').forEach(x=>x.remove());
    let t=c.textContent.replace(/\s+/g,' ').trim();
    if (P.ttsSkipCites) t=t.replace(/\s?\((?=[^()]*(\b1[5-9]\d\d\b|\b20\d\d\b|forthcoming|\bp{1,2}\.\s?\d|\bch\.\s?\d|§))[^()]*\)/g,'');
    return t.replace(/\bcf\.\s/gi,'compare ').replace(/\be\.g\.,?/gi,'for example,').replace(/\bi\.e\.,?/gi,'that is,').replace(/\bet al\./g,'and colleagues').replace(/\bvs?\.\s/g,'versus ')
            .replace(/§§?\s?/g,'section ').replace(/\bpp\.\s?/g,'pages ').replace(/\bp\.\s?(?=\d)/g,'page ').replace(/\bch\.\s?(?=\d)/g,'chapter ')
            .replace(/(\w)\s?[–—-]\s?(?=\w)/g,(m,a)=>/\d/.test(a)?a+' to ':m).replace(/\s+([,.;:])/g,'$1');
  },
  sentences(bid){
    if (this.cache.has(bid)) return this.cache.get(bid);
    const b=BY.get(bid); if (!b) return [];
    const text=this.spoken(b.el); let parts=[];
    if (window.Intl && Intl.Segmenter){ for (const seg of new Intl.Segmenter('en',{granularity:'sentence'}).segment(text)) parts.push(seg.segment.trim()); }
    else parts=text.match(/[^.!?]+[.!?]+["”’)]*\s*|[^.!?]+$/g)||[text];
    // fold short fragments (labels like "P1.", "C.") into the sentence that follows, so they are read as one
    const merged=[]; let carry='';
    for (const p of parts.filter(Boolean)){ const q=(carry?carry+' ':'')+p; if (q.length<12){ carry=q; continue; } merged.push(q); carry=''; }
    if (carry){ if (merged.length) merged[merged.length-1]+=' '+carry; else merged.push(carry); }
    const out=[]; for (let p of merged){
      while (p.length>320){ let cut=p.lastIndexOf('; ',300); if (cut<120) cut=p.lastIndexOf(', ',300); if (cut<120) cut=p.lastIndexOf(' ',300); out.push(p.slice(0,cut+1).trim()); p=p.slice(cut+1).trim(); }
      out.push(p);
    }
    if (b.isH && out.length) out[out.length-1]=out[out.length-1].replace(/([^.!?])$/,'$1.');
    this.cache.set(bid,out); return out;
  },
  start(bid){
    if (!this.ok()) return toast('This browser cannot read aloud.', 4000, true);
    if (!DOC || DOC.convert || !BLOCKS.length) return toast('Open a text first.');
    this.stopSpeech(); this.cache.clear(); this.bids=this.readable();
    let i=bid?this.bids.indexOf(bid):-1;
    if (i<0){ const top=$('#top').getBoundingClientRect().bottom+8; const vis=BLOCKS.find(b=>b.el.getBoundingClientRect().bottom>top && this.bids.includes(b.bid)); i=vis?this.bids.indexOf(vis.bid):0; }
    this.i=Math.max(0,i); this.s=0; this.playing=true; document.body.classList.add('tts-on'); this.lock(); this.draw(); this.speak();
  },
  speak(){
    if (!this.playing) return;
    if (this.i>=this.bids.length){ this.stop(); toast('Finished reading.'); return; }
    const bid=this.bids[this.i], b=BY.get(bid), sents=this.sentences(bid);
    if (!b || this.s>=sents.length){ this.i++; this.s=0; return this.speak(); }
    $$('.blk.reading').forEach(e=>e.classList.remove('reading')); b.el.classList.add('reading');
    if (this.s===0){ const r=b.el.getBoundingClientRect(), top=$('#top').getBoundingClientRect().bottom;
      if (r.top<top || r.top>innerHeight*0.55) b.el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth', block:'center'});
      if (DOC.posBid!==bid){ DOC.posBid=bid; touch(DOC); Sync.schedule(DOC, 20000); DB.put(DOC); } }
    const text=sents[this.s]; this.mark(b.el, text); this.draw();
    const u=new SpeechSynthesisUtterance(text); const v=this.voice(); if (v){ u.voice=v; u.lang=v.lang; } else u.lang='en';
    u.rate=P.ttsRate||1; this.utter=u;
    u.onend=()=>{ if (this.utter!==u) return; this.s++; this.speak(); };
    u.onerror=e=>{ if (this.utter!==u || e.error==='interrupted' || e.error==='canceled') return; Log.add('warn','Read aloud', e.error||'speech error', {voice:v&&v.name}); this.s++; setTimeout(()=>this.speak(),200); };
    speechSynthesis.speak(u);
  },
  mark(el, sentence){

    CSS.highlights.delete('tts');
    const text=el.textContent; let r=findQuote(text, sentence);
    if (!r){ const w=sentence.split(' '); const head=findQuote(text, w.slice(0,6).join(' ')), tail=findQuote(text, w.slice(-4).join(' '), head?head[0]:0); if (head&&tail) r=[head[0],tail[1]]; else if (head) r=head; }

  },
  stopSpeech(){ this.utter=null; if (this.ok()) speechSynthesis.cancel(); },
  pause(){ this.playing=false; this.stopSpeech(); this.draw(); this.unlock(); },
  resume(){ this.playing=true; this.lock(); this.speak(); },
  toggle(){ this.playing?this.pause():this.resume(); },
  skip(d){ this.stopSpeech(); if (d<0 && this.s>0) this.s=0; else { this.i=Math.max(0,Math.min(this.bids.length-1,this.i+d)); this.s=0; } if (this.playing) this.speak(); else { this.draw(); const b=BY.get(this.bids[this.i]); if (b){ $$('.blk.reading').forEach(e=>e.classList.remove('reading')); b.el.classList.add('reading'); b.el.scrollIntoView({block:'center'}); } } },
  stop(){ this.playing=false; this.stopSpeech(); this.unlock(); document.body.classList.remove('tts-on'); $$('.blk.reading').forEach(e=>e.classList.remove('reading')); if (window.CSS&&CSS.highlights) CSS.highlights.delete('tts'); },
  rate(){ const steps=[0.8,1,1.15,1.3,1.5,1.75,2]; const i=steps.findIndex(x=>x>=(P.ttsRate||1)-0.001); P.ttsRate=steps[(i+1)%steps.length]; savePrefs(); this.draw(); if (this.playing){ this.stopSpeech(); this.speak(); } },
  draw(){
    const b=BY.get(this.bids[this.i]);
    $('#ttsWhere').innerHTML=''; $('#ttsWhere').append(h('b',{}, b?(b.isH?b.text:b.section)||DOC.title:DOC?DOC.title:''), h('span',{}, `Paragraph ${this.i+1} of ${this.bids.length}`));
    const pl=$('#ttsPlay'); pl.setAttribute('aria-label', this.playing?'Pause':'Play');
    pl.innerHTML = this.playing ? '<svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg>';
    $('#ttsRate').textContent=`${(+P.ttsRate||1).toString().replace(/^0/,'')}×`;
  },
  async lock(){ try{ if ('wakeLock' in navigator && !this.wake) { this.wake=await navigator.wakeLock.request('screen'); this.wake.addEventListener('release',()=>{ this.wake=null; }); } }catch{} },
  unlock(){ try{ this.wake&&this.wake.release(); }catch{} this.wake=null; },
  settings(){
    if (!this.ok()) return [h('h3',{},'Read aloud'), h('p',{class:'muted small'},'This browser cannot read aloud.')];
    this.loadVoices();
    const vs=[...this.voices].sort((a,b)=>(/^en/i.test(b.lang)-/^en/i.test(a.lang)) || a.lang.localeCompare(b.lang) || a.name.localeCompare(b.name));
    const sel=h('select',{onchange:e=>{ P.ttsVoice=e.target.value; savePrefs(); const u=new SpeechSynthesisUtterance('This is how I will sound.'); const v=this.voice(); if (v){u.voice=v;u.lang=v.lang;} u.rate=P.ttsRate||1; speechSynthesis.cancel(); speechSynthesis.speak(u); }},
      h('option',{value:''},'System default'), vs.map(v=>h('option',{value:v.voiceURI,selected:P.ttsVoice===v.voiceURI}, `${v.name} (${v.lang})${v.localService?'':', online'}`)));
    const chk=(key,label)=>h('label',{class:'opt'}, h('input',{type:'checkbox',checked:!!P[key],onchange:e=>{ P[key]=e.target.checked; savePrefs(); this.cache.clear(); }}), h('span',{},label));
    return [h('h3',{},'Read aloud'), h('div',{class:'field'}, h('label',{},'Voice'), sel),
      h('div',{class:'slider'}, h('label',{},'Speed'), h('input',{type:'range',min:0.6,max:2.2,step:0.05,value:P.ttsRate||1,oninput:e=>{ P.ttsRate=+e.target.value; e.target.nextSibling.textContent=P.ttsRate.toFixed(2)+'×'; savePrefs(); if (document.body.classList.contains('tts-on')) this.draw(); }}), h('output',{},(+P.ttsRate||1).toFixed(2)+'×')),
      chk('ttsSkipCites','Skip bracketed citations like “(Chalmers 2018, p. 47)”'), chk('ttsNotes','Read footnotes')];
  }

/* ============ sync: where the data goes ============ */
/* The merge logic (Sync, below) talks to a backend with a few operations: heads with a revision check, immutable
   text versions and guides, and flashcard decks. Three backends: this site's own server (/api/sync, Netlify Blobs),
   and the reader's own Dropbox or Google Drive, reached straight from the browser. The two cloud drives share one
   adapter over a tiny file store (list, read, write with a revision check, remove). */
const vh = md => fnv(md)+md.length.toString(36);
const packHash = pk => pk ? fnv(JSON.stringify(pk)) : '';
class NeedsAuth extends Error {}
class Conflict extends Error {}
const SYNC_FOLDER = 'Academic Reader';

function serverBackend(){
  const api = async (path, opts={}) => {
    const r = await fetch('/api/sync/'+path, {...opts, credentials:'same-origin', headers:{...(opts.headers||{}), ...(P.syncToken?{'x-sync-token':P.syncToken}:{})}});
    const ct=r.headers.get('content-type')||'';
    if (r.status===401 && ct.includes('json')) throw new NeedsAuth('Enter your sync key to sync with this site’s server.');
    if (r.status===503 && ct.includes('json')) throw new Error('Sync is not set up on this site’s server (no SYNC_TOKEN).');
    if (r.status===401||r.status===403||(r.ok && ct.includes('text/html'))) throw new NeedsAuth('This site needs you to be signed in to Netlify to sync.');
    return r;
  };
  const ok = async r => { if (!r.ok) throw new Error('sync request failed ('+r.status+')'); return r; };
  const put = (path, body, headers={}) => api(path,{method:'PUT',headers,body}).then(ok);
  return {
    listHeads: async () => (await ok(await api('list'))).json(),
    async putHead(id, head, base){ const r=await api(`head/${id}`,{method:'PUT',headers:{'content-type':'application/json','x-base-rev':String(base)},body:JSON.stringify(head)});
      if (r.status===409) return {conflict:await r.json()}; await ok(r); return {ok:true}; },
    getVer: async (id,h) => { const r=await api(`ver/${id}/${h}`); return r.ok ? r.text() : null; },
    putVer: (id,h,md) => put(`ver/${id}/${h}`, md),
    getPack: async (id,h) => { const r=await api(`pack/${id}/${h}`); return r.ok ? r.json() : null; },
    putPack: (id,h,pk) => put(`pack/${id}/${h}`, JSON.stringify(pk)),
    listDecks: async () => (await ok(await api('decks'))).json(),
    getDeck: async id => { const r=await api(`deck/${id}`); return r.ok ? r.json() : null; },
    putDeck: async (id, body) => (await (await put(`deck/${id}`, JSON.stringify(body), {'content-type':'application/json'})).json()).etag,
  };
}

// The same operations over a folder of files. Heads are compare-and-swap on the file's revision.
function fileBackend(fs){
  const N={head:id=>`head.${id}.json`, ver:(id,h)=>`ver.${id}.${h}.md`, pack:(id,h)=>`pack.${id}.${h}.json`, deck:id=>`deck.${id}.json`};
  const heads=new Map();   // file name -> {rev, head}, so a pull reads only the heads that changed
  const drop = async prefix => { for (const name of (await fs.list()).keys()) if (name.startsWith(prefix)) await fs.remove(name); };
  return {
    async listHeads(){
      const out=[];
      for (const [name,rev] of await fs.list()){ if (!/^head\.[a-z0-9]+\.json$/.test(name)) continue;
        let c=heads.get(name); if (!c || c.rev!==rev){ const f=await fs.read(name); if (!f) continue; c={rev:f.rev, head:JSON.parse(f.text)}; heads.set(name,c); }
        out.push(c.head); }
      return out;
    },
    async putHead(id, head, base){
      const name=N.head(id);
      for (let tries=0; tries<3; tries++){
        const f=await fs.read(name), cur=f?JSON.parse(f.text):null;
        if (cur && cur.rev!==base) return {conflict:cur};
        try{ const rev=await fs.write(name, JSON.stringify(head), f?f.rev:null); heads.set(name,{rev,head}); }
        catch(e){ if (e instanceof Conflict) continue; throw e; }
        if (head.deleted){ await drop(`ver.${id}.`); await drop(`pack.${id}.`); }
        else if (cur && cur.packHash && cur.packHash!==head.packHash) await fs.remove(N.pack(id,cur.packHash));
        return {ok:true};
      }
      const f=await fs.read(name); return {conflict:f?JSON.parse(f.text):{rev:0}};
    },
    getVer: async (id,h) => { const f=await fs.read(N.ver(id,h)); return f ? f.text : null; },
    putVer: (id,h,md) => fs.write(N.ver(id,h), md),
    getPack: async (id,h) => { const f=await fs.read(N.pack(id,h)); return f ? JSON.parse(f.text) : null; },
    putPack: (id,h,pk) => fs.write(N.pack(id,h), JSON.stringify(pk)),
    listDecks: async () => [...await fs.list()].filter(([n])=>/^deck\.[a-z0-9]+\.json$/.test(n)).map(([n,rev])=>({id:n.slice(5,-5), etag:rev})),
    getDeck: async id => { const f=await fs.read(N.deck(id)); return f ? JSON.parse(f.text) : null; },
    putDeck: (id, body) => fs.write(N.deck(id), JSON.stringify(body)),
  };
}

/* ---- sign-in for the cloud drives ---- */
// Both redirect away and back. The OAuth state is kept in sessionStorage; tokens in localStorage (they reach only
// the Academic Reader folder, and they are revoked by disconnecting here or in the Dropbox or Google account).
const b64url = u8 => btoa(String.fromCharCode(...u8)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const redirectUri = () => location.origin + location.pathname;
const jget = k => { try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch{ return null; } };
const jset = (k,v) => v==null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v));
const Auth = {
  dropbox: {
    key:'gloss.sync.dropbox', label:'Dropbox', where:'Apps › Academic Reader in your Dropbox',
    ready: () => !!CONFIG.dropboxAppKey,
    connected(){ return !!jget(this.key); },
    async start(){
      const verifier=b64url(crypto.getRandomValues(new Uint8Array(48))), state=b64url(crypto.getRandomValues(new Uint8Array(16)));
      const challenge=b64url(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier))));
      sessionStorage.setItem('gloss.oauth', JSON.stringify({provider:'dropbox', state, verifier}));
      location.href='https://www.dropbox.com/oauth2/authorize?'+new URLSearchParams({client_id:CONFIG.dropboxAppKey, response_type:'code', code_challenge:challenge,
        code_challenge_method:'S256', redirect_uri:redirectUri(), token_access_type:'offline', state});
    },
    async finish(q, saved){
      const r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST', body:new URLSearchParams({grant_type:'authorization_code', code:q.get('code'),
        client_id:CONFIG.dropboxAppKey, code_verifier:saved.verifier, redirect_uri:redirectUri()})});
      const j=await r.json(); if (!r.ok || !j.refresh_token) throw new Error(j.error_description||j.error||'Dropbox did not return a token');
      jset(this.key, {refresh:j.refresh_token, access:j.access_token, exp:Date.now()+(j.expires_in-60)*1000});
    },
    async token(force){
      const t=jget(this.key); if (!t) throw new NeedsAuth('Connect Dropbox to sync.');
      if (!force && t.access && Date.now()<t.exp) return t.access;
      const r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST', body:new URLSearchParams({grant_type:'refresh_token', refresh_token:t.refresh, client_id:CONFIG.dropboxAppKey})});
      const j=await r.json().catch(()=>({}));
      if (!r.ok){ if (r.status===400||r.status===401) throw new NeedsAuth('Dropbox access was withdrawn. Connect Dropbox again.'); throw new Error('Could not reach Dropbox ('+r.status+')'); }
      jset(this.key, {...t, access:j.access_token, exp:Date.now()+(j.expires_in-60)*1000}); return j.access_token;
    },
    async disconnect(){ const t=jget(this.key); jset(this.key,null);
      if (t && t.access) fetch('https://api.dropboxapi.com/2/auth/token/revoke',{method:'POST',headers:{authorization:'Bearer '+t.access}}).catch(()=>{}); },
  },
  gdrive: {
    key:'gloss.sync.gdrive', label:'Google Drive', where:'the Academic Reader folder in your Google Drive',
    ready: () => !!CONFIG.googleClientId,
    connected(){ return !!jget(this.key); },
    start(silent){
      const state=b64url(crypto.getRandomValues(new Uint8Array(16)));
      sessionStorage.setItem('gloss.oauth', JSON.stringify({provider:'gdrive', state, silent:!!silent}));
      location.href='https://accounts.google.com/o/oauth2/v2/auth?'+new URLSearchParams({client_id:CONFIG.googleClientId, redirect_uri:redirectUri(), response_type:'token',
        scope:'https://www.googleapis.com/auth/drive.file', include_granted_scopes:'true', state, ...(silent?{prompt:'none'}:{})});
    },
    async finish(q){
      if (q.get('error')) throw new NeedsAuth(q.get('error')==='access_denied'?'Google Drive was not connected.':'Google Drive needs you to sign in again.');
      const t=jget(this.key)||{}; jset(this.key, {...t, access:q.get('access_token'), exp:Date.now()+(+q.get('expires_in')-60)*1000});
    },
    async token(){ const t=jget(this.key); if (!t) throw new NeedsAuth('Connect Google Drive to sync.');
      if (t.access && Date.now()<t.exp) return t.access;
      throw new NeedsAuth('Google Drive needs a quick reconnect (Google asks every hour).'); },
    async disconnect(){ const t=jget(this.key); jset(this.key,null); localStorage.removeItem('gloss.sync.gdrive.folder');
      if (t && t.access) fetch('https://oauth2.googleapis.com/revoke?token='+encodeURIComponent(t.access),{method:'POST'}).catch(()=>{}); },
  },
};
// Called at start-up: finish a sign-in that has just redirected back here, and tidy the address bar.
async function finishSignIn(){
  let saved=null; try{ saved=JSON.parse(sessionStorage.getItem('gloss.oauth')||'null'); }catch{}
  if (!saved) return;
  const q = saved.provider==='gdrive' ? new URLSearchParams(location.hash.slice(1)) : new URLSearchParams(location.search);
  if (!q.get('state') && !q.get('error')) return;
  sessionStorage.removeItem('gloss.oauth'); history.replaceState(null,'',location.pathname);
  if (q.get('state')!==saved.state) return toast('That sign-in did not match; try connecting again.', 6000, true);
  try{
    if (q.get('error') && saved.provider==='dropbox') throw new Error(q.get('error')==='access_denied'?'Dropbox was not connected.':q.get('error_description')||q.get('error'));
    await Auth[saved.provider].finish(q, saved);
    if (P.syncProvider!==saved.provider){ P.syncProvider=saved.provider; savePrefs(); await resetSyncState(); }
    if (!saved.silent) toast(`${Auth[saved.provider].label} connected. Syncing…`);
  }catch(e){ if (!saved.silent) toast(e.message, 6000, true); Log.add('warn','Sync sign-in', e.message); if (saved.silent) sessionStorage.setItem('gloss.gdrive.silentFailed','1'); }
}

function dropboxStore(){
  const A=Auth.dropbox;
  const call = async (url, init, retry=true) => {
    const r=await fetch(url, {...init, headers:{...init.headers, authorization:'Bearer '+await A.token()}});
    if (r.status===401 && retry){ await A.token(true); return call(url, init, false); }
    if (r.status===429 || r.status>=500) throw new Error('Dropbox is busy ('+r.status+'); will retry.');
    return r;
  };
  // Dropbox-API-Arg must be ASCII: escape anything else as \uXXXX
  const arg = o => JSON.stringify(o).replace(/[\u007f-￿]/g, c=>'\\u'+c.charCodeAt(0).toString(16).padStart(4,'0'));
  const rpc = (path, body) => call('https://api.dropboxapi.com/2/'+path, {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body)});
  // Dropbox answers errors as JSON (error_summary) or, for bad requests such as a missing app permission, as plain
  // text. Keep the whole answer: the short label alone ("other/...") is not enough to diagnose anything.
  const err = async (r, what) => { const t=await r.text().catch(()=>''); let j=null; try{ j=JSON.parse(t); }catch{}
    const msg=`Dropbox ${what}: ${r.status} ${j&&j.error_summary ? j.error_summary : t.replace(/\s+/g,' ').slice(0,300)}`.trim();
    Log.add('warn','Dropbox', msg, {status:r.status, body:t.slice(0,1000), request:r.headers.get('X-Dropbox-Request-Id')||''});
    if (/required scope|not permitted to access this endpoint/i.test(t)) return 'The Dropbox app is missing a permission (see the error log). Its owner must enable files.metadata.read, files.content.read and files.content.write, then you disconnect and connect again.';
    if (j && j.error && j.error['.tag']==='missing_scope') return 'This connection was made before a Dropbox permission was added. Disconnect and connect Dropbox again.';
    return msg; };
  return {
    async list(){
      const m=new Map(); let r=await rpc('files/list_folder',{path:''});
      for(;;){ if (!r.ok) throw new Error(await err(r,'list')); const j=await r.json();
        for (const e of j.entries) if (e['.tag']==='file') m.set(e.name, e.rev);
        if (!j.has_more) break; r=await rpc('files/list_folder/continue',{cursor:j.cursor}); }
      return m;
    },
    async read(name){
      const r=await call('https://content.dropboxapi.com/2/files/download',{method:'POST', headers:{'Dropbox-API-Arg':arg({path:'/'+name})}});
      if (r.status===409){ const t=await r.text(); if (/not_found/.test(t)) return null; throw new Error('Dropbox read: 409 '+t.slice(0,200)); }
      if (!r.ok) throw new Error(await err(r,'read '+name));
      const meta=JSON.parse(r.headers.get('Dropbox-API-Result')||'{}'); return {text:await r.text(), rev:meta.rev};
    },
    async write(name, text, expect){
      const mode = expect===undefined ? 'overwrite' : expect===null ? 'add' : {'.tag':'update', update:expect};
      const r=await call('https://content.dropboxapi.com/2/files/upload',{method:'POST', headers:{'content-type':'application/octet-stream',
        'Dropbox-API-Arg':arg({path:'/'+name, mode, autorename:false, mute:true, ...(expect===undefined?{}:{strict_conflict:true})})}, body:new TextEncoder().encode(text)});
      if (r.status===409){ const e=await err(r,'write '+name); if (/conflict/.test(e)) throw new Conflict(e); throw new Error(e); }
      if (!r.ok) throw new Error(await err(r,'write '+name));
      return (await r.json()).rev;
    },
    async remove(name){ const r=await rpc('files/delete_v2',{path:'/'+name}); if (!r.ok && r.status!==409) throw new Error(await err(r,'delete '+name)); },
  };
}

function driveStore(){
  const A=Auth.gdrive, API='https://www.googleapis.com/drive/v3/files', UP='https://www.googleapis.com/upload/drive/v3/files';
  const ids=new Map();   // name -> file id
  const call = async (url, init={}) => {
    const r=await fetch(url, {...init, headers:{...(init.headers||{}), authorization:'Bearer '+await A.token()}});
    if (r.status===401){ const t=jget(A.key); if (t) jset(A.key,{...t, exp:0}); throw new NeedsAuth('Google Drive needs a quick reconnect (Google asks every hour).'); }
    if (r.status===429 || r.status>=500) throw new Error('Google Drive is busy ('+r.status+'); will retry.');
    return r;
  };
  const need = async r => { if (!r.ok){ const j=await r.json().catch(()=>({})); throw new Error('Google Drive: '+((j.error&&j.error.message)||r.status)); } return r; };
  async function folder(){
    let id=localStorage.getItem('gloss.sync.gdrive.folder'); if (id) return id;
    const q=`name='${SYNC_FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false`;
    const j=await (await need(await call(`${API}?${new URLSearchParams({q, fields:'files(id)', spaces:'drive'})}`))).json();
    id = j.files[0] ? j.files[0].id : (await (await need(await call(API+'?fields=id',{method:'POST', headers:{'content-type':'application/json'},
      body:JSON.stringify({name:SYNC_FOLDER, mimeType:'application/vnd.google-apps.folder'})}))).json()).id;
    localStorage.setItem('gloss.sync.gdrive.folder', id); return id;
  }
  const version = async id => { const r=await call(`${API}/${id}?fields=version,trashed`); if (r.status===404) return null; const j=await (await need(r)).json(); return j.trashed?null:String(j.version); };
  const find = async name => { if (!ids.has(name)) await store.list(); return ids.get(name); };
  const store = {
    async list(){
      const fid=await folder(), m=new Map(); ids.clear(); let page='';
      do { const r=await call(`${API}?${new URLSearchParams({q:`'${fid}' in parents and trashed=false`, fields:'nextPageToken,files(id,name,version)', pageSize:'1000', ...(page?{pageToken:page}:{})})}`);
        if (r.status===404){ localStorage.removeItem('gloss.sync.gdrive.folder'); throw new Error('The Academic Reader folder was removed from Google Drive; it will be made again.'); }
        const j=await (await need(r)).json();
        for (const f of j.files){ if (!ids.has(f.name) || +f.version>+m.get(f.name)){ ids.set(f.name,f.id); m.set(f.name,String(f.version)); } }
        page=j.nextPageToken; } while (page);
      return m;
    },
    async read(name){
      const id=await find(name); if (!id) return null;
      const rev=await version(id); if (rev==null){ ids.delete(name); return null; }
      const r=await call(`${API}/${id}?alt=media`); if (r.status===404){ ids.delete(name); return null; }
      return {text:await (await need(r)).text(), rev};
    },
    // Drive has no conditional write, so the revision is checked just before writing. The window is small.
    async write(name, text, expect){
      const id=await find(name);
      if (id){
        if (expect===null) throw new Conflict('exists');
        if (expect!==undefined && await version(id)!==expect) throw new Conflict('changed');
        const j=await (await need(await call(`${UP}/${id}?uploadType=media&fields=version`,{method:'PATCH', headers:{'content-type':'text/plain; charset=utf-8'}, body:text}))).json();
        return String(j.version);
      }
      if (expect) throw new Conflict('gone');
      const b='ar'+uid(), meta=JSON.stringify({name, parents:[await folder()]});
      const body=`--${b}\r\ncontent-type: application/json; charset=utf-8\r\n\r\n${meta}\r\n--${b}\r\ncontent-type: text/plain; charset=utf-8\r\n\r\n${text}\r\n--${b}--`;
      const j=await (await need(await call(`${UP}?uploadType=multipart&fields=id,version`,{method:'POST', headers:{'content-type':`multipart/related; boundary=${b}`}, body}))).json();
      ids.set(name, j.id); return String(j.version);
    },
    async remove(name){ const id=await find(name); if (!id) return; const r=await call(`${API}/${id}`,{method:'DELETE'}); ids.delete(name); if (!r.ok && r.status!==404) await need(r); },
  };
  return store;
}
function makeBackend(p){ return p==='server' ? serverBackend() : p==='dropbox' ? fileBackend(dropboxStore()) : p==='gdrive' ? fileBackend(driveStore()) : null; }
// Changing where data syncs to: forget the old revisions, so everything is merged into the new place from scratch.
async function resetSyncState(){
  for (const d of await DB.all()){ if (d.deleted){ await DB.del(d.id); continue; } delete d.sync; d.dirty=true; await DB.put(d); if (DOC && DOC.id===d.id) DOC=d; }
  for (const k of await Decks.all()){ delete k.etag; k.dirty=true; await Decks.put(k); }
}

/* ============ sync: merging ============ */
const Sync = {
  B:null, needsAuth:false, busy:new Set(), timers:{}, last:null, error:'', running:false,
  on(){ return !!this.B && !this.needsAuth; },
  // Does this site run the sync function with a key set? (Only a copy someone deploys for themselves does.)
  probe(){ return this._probe ||= fetch('/api/sync/ping',{headers:P.syncToken?{'x-sync-token':P.syncToken}:{}})
    .then(r=>(r.headers.get('content-type')||'').includes('json') && [200,401].includes(r.status)).catch(()=>false); },
  provider(){ return P.syncProvider||''; },
  fail(e, where){ if (e instanceof NeedsAuth){ this.needsAuth=true; this.error=e.message; } else { this.error=e.message; Log.add('warn', where, e.message); } },
  async init(){
    if (STATIC) return;
    this.B=null; this.needsAuth=false; this.error='';
    const p=this.provider(); if (!p) return;
    if (p!=='server' && !Auth[p].ready()){ this.error=`${Auth[p].label} sync is not set up on this site.`; return; }
    if (p!=='server' && !Auth[p].connected()){ this.needsAuth=true; this.error=`Connect ${Auth[p].label} to sync.`; return; }
    this.B=makeBackend(p); this.listen();
    // Google gives browser apps hour-long access with no refresh: at start-up, renew it quietly by a quick redirect.
    if (p==='gdrive'){ const t=jget(Auth.gdrive.key); if (t && !(t.access && Date.now()<t.exp) && !sessionStorage.getItem('gloss.gdrive.silentFailed')) return Auth.gdrive.start(true); }
    await this.pullAll();
  },
  async connect(p){
    if (p==='server'){ P.syncProvider='server'; savePrefs(); await resetSyncState(); return this.init(); }
    if (Auth[p]) return Auth[p].start();
  },
  async disconnect(){
    const p=this.provider(); if (p && Auth[p]) await Auth[p].disconnect();
    P.syncProvider=''; savePrefs(); this.B=null; this.needsAuth=false; this.error='';
  },
  listened:false,
  listen(){ if (this.listened) return; this.listened=true;
    document.addEventListener('visibilitychange',()=>{ if (document.visibilityState==='visible') this.pullAll(); else this.flushAll(); });
    addEventListener('online',()=>this.pullAll());
    setInterval(()=>{ if (document.visibilityState==='visible') this.pullAll(); }, 90000);
  },
  schedule(d, delay=4000){ if (!this.on()||!d) return; clearTimeout(this.timers[d.id]); this.timers[d.id]=setTimeout(()=>this.push(d), delay); },
  flushAll(){ for (const [id,t] of Object.entries(this.deckTimers)){ clearTimeout(t); delete this.deckTimers[id]; this.pushDeck(id); }
    for (const [id,t] of Object.entries(this.timers)){ clearTimeout(t); delete this.timers[id]; const d=DOC&&DOC.id===id?DOC:null; if (d) this.push(d); } },
  headOf(d, rev){ const ph=d.pack?packHash(d.pack):''; return {id:d.id, rev, group:d.group||null, title:d.title, created:d.created, updated:d.updated, posBid:d.posBid||null, deleted:!!d.deleted,
      versions:d.versions.map(v=>({at:v.at, name:v.name||'', h:vh(v.md)})), packHash:ph, packAt:d.packAt||d.updated}; },
  async push(d, depth=0){
    if (d.convert) return;
    if (!this.on() || this.busy.has(d.id)) { if (this.on()) this.schedule(d, 3000); return; }
    this.busy.add(d.id); const seq=d.editSeq||0;
    try{
      d.sync ||= {rev:0, vers:{}, packHash:''};
      if (!d.deleted){
        for (const v of d.versions){ const h=vh(v.md); if (!d.sync.vers[h]){ await this.B.putVer(d.id, h, v.md); d.sync.vers[h]=1; } }
        const ph=d.pack?packHash(d.pack):'';
        if (ph && ph!==d.sync.sentPack){ await this.B.putPack(d.id, ph, d.pack); d.sync.sentPack=ph; }
      }
      const head=this.headOf(d, d.sync.rev+1);
      const r=await this.B.putHead(d.id, head, d.sync.rev);
      if (r.conflict){ this.busy.delete(d.id); await this.merge(d, r.conflict); if (depth<3) return this.push(d, depth+1); return; }
      d.sync.rev=head.rev; d.sync.packHash=head.packHash;
      if ((d.editSeq||0)===seq) d.dirty=false;
      if (d.deleted) await DB.del(d.id); else await DB.put(d);
      this.last=Date.now(); this.error='';
    }catch(e){ this.fail(e, 'Sync upload'); }
    finally{ this.busy.delete(d.id); }
  },
  async fetchVersions(d, remote){
    const have=new Set(d.versions.map(v=>vh(v.md)));
    for (const v of remote.versions||[]){ if (have.has(v.h)) { d.sync.vers[v.h]=1; continue; }
      const md=await this.B.getVer(d.id, v.h); if (md==null) continue; d.versions.push({md, at:v.at, name:v.name}); d.sync.vers[v.h]=1; have.add(v.h); }
    d.versions.sort((a,b)=>a.at-b.at);
  },
  async fetchPack(d, remote){ return remote.packHash ? this.B.getPack(d.id, remote.packHash) : null; },
  // Remote changed and so did we: keep both sides' text versions and questions; the newer guide wins otherwise.
  async merge(d, remote){
    d.sync ||= {rev:0, vers:{}, packHash:''};
    if (remote.deleted){ d.deleted=true; d.sync.rev=remote.rev; await DB.del(d.id); return; }
    await this.fetchVersions(d, remote);
    const localChanged = d.pack && packHash(d.pack)!==d.sync.packHash;
    if (remote.packHash && remote.packHash!==d.sync.packHash){
      const rp=await this.fetchPack(d, remote);
      if (rp){
        if (!localChanged || !d.pack) d.pack=rp;
        else {
          const newer = (remote.packAt||0) > (d.packAt||0) ? rp : d.pack, older = newer===rp ? d.pack : rp;
          const notes=new Map(); for (const n of [...(older.notes||[]), ...(newer.notes||[])]){ const ex=notes.get(n.id); if (!ex || (n.thread||[]).length>=(ex.thread||[]).length) notes.set(n.id,n); }
          newer.notes=[...notes.values()]; d.pack=newer;
        }
      }
    }
    if ((remote.updated||0)>(d.updated||0)){ d.title=remote.title||d.title; if (remote.posBid) d.posBid=remote.posBid; }
    d.sync.rev=remote.rev; d.sync.packHash=remote.packHash; d.sync.sentPack=remote.packHash;
    touch(d); await DB.put(d);
  },
  async pullAll(manual){
    if (!this.on() || this.running) { if (manual && !this.on()) toast(this.error||'Sync is off.'); return; }
    this.running=true;
    try{
      const heads=await this.B.listHeads(); const seen=new Set(); let changedOpen=false, added=0;
      for (const remote of heads){
        seen.add(remote.id);
        const open = DOC && DOC.id===remote.id;
        let d = open ? DOC : await DB.get(remote.id);
        if (!d){ if (remote.deleted) continue;
          d={id:remote.id, title:remote.title, group:remote.group||null, created:remote.created, updated:remote.updated, versions:[], pack:null, pos:0, posBid:remote.posBid, sync:{rev:remote.rev, vers:{}, packHash:remote.packHash, sentPack:remote.packHash}};
          await this.fetchVersions(d, remote); if (!d.versions.length) continue; d.pack=await this.fetchPack(d, remote); d.packAt=remote.packAt; await DB.put(d); added++; continue; }
        d.sync ||= {rev:0, vers:{}, packHash:''};
        if (remote.rev<=d.sync.rev) continue;
        if (open && RUNNING) continue; // don't swap a guide out from under a running build; its next push will merge
        if (remote.deleted){ await DB.del(d.id); if (open){ DOC=null; changedOpen=true; } continue; }
        if (!d.dirty){
          await this.fetchVersions(d, remote);
          if (remote.packHash!==d.sync.packHash){ d.pack=await this.fetchPack(d, remote); d.packAt=remote.packAt; }
          Object.assign(d, {title:remote.title, group:remote.group||d.group||null, updated:remote.updated, posBid:remote.posBid||d.posBid});
          d.sync.rev=remote.rev; d.sync.packHash=d.sync.sentPack=remote.packHash; await DB.put(d);
        } else { await this.merge(d, remote); this.schedule(d, 500); }
        if (open) changedOpen=true;
      }
      // push anything this device has that the other side lacks or that changed locally
      for (const d of await DB.all()){ const live = DOC && DOC.id===d.id ? DOC : d; if (!seen.has(d.id) || live.dirty) await this.push(live); }
      await this.pullDecks();
      this.last=Date.now(); if (!this.needsAuth) this.error='';
      if (changedOpen){ if (DOC){ DOC=await DB.get(DOC.id); } renderDoc(true); }
      if (added && !DOC){ const all=(await DB.all()).filter(x=>!x.deleted).sort((a,b)=>b.updated-a.updated); if (all[0]) openDoc(all[0].id); }
      if (manual) toast(added?`Synced; ${added} text${added>1?'s':''} added from your other devices.`:'Synced.');
    }catch(e){ this.fail(e, 'Sync download'); if (manual) toast(e.message,5000); }
    finally{ this.running=false; }
  },
  deckTimers:{},
  scheduleDeck(deck, delay=5000){ if (!this.on()) return; clearTimeout(this.deckTimers[deck.id]); this.deckTimers[deck.id]=setTimeout(()=>this.pushDeck(deck.id), delay); },
  mergeDeck(a, b){
    if (!a) return b; if (!b) return a;
    const cards=new Map(); for (const c of [...a.cards, ...b.cards]){ const ex=cards.get(c.id); if (!ex || (c.mod||0)>(ex.mod||0)) cards.set(c.id,c); }
    const newer=(b.mod||0)>(a.mod||0)?b:a;
    return {...newer, cards:[...cards.values()], deleted:!!(a.deleted||b.deleted), mod:Math.max(a.mod||0,b.mod||0)};
  },
  async pushDeck(id){
    if (!this.on()) return; const deck=await Decks.get(id); if (!deck) return;
    try{
      const {etag, dirty, ...body}=deck;
      const tag=await this.B.putDeck(id, body);
      const cur=await Decks.get(id); if (!cur) return;
      cur.etag=tag; if (cur.mod===deck.mod) cur.dirty=false; if (cur.deleted) await Decks.del(id); else await Decks.put(cur);
    }catch(e){ this.fail(e, 'Sync flashcards'); }
  },
  async pullDecks(){
    const remote=await this.B.listDecks(); const seen=new Set();
    for (const {id, etag} of remote){ seen.add(id);
      const local=await Decks.get(id);
      if (local && local.etag===etag){ if (local.dirty) await this.pushDeck(id); continue; }
      const rd=await this.B.getDeck(id); if (!rd) continue;
      if (rd.deleted){ if (local) await Decks.del(id); continue; }
      const merged=this.mergeDeck(local, rd); merged.etag=etag;
      const localNewer = local && local.cards.some(c=>{ const o=rd.cards.find(x=>x.id===c.id); return !o || (c.mod||0)>(o.mod||0); });
      merged.dirty=!!localNewer; await Decks.put(merged); if (localNewer) await this.pushDeck(id);
    }
    for (const d of await Decks.all()) if (!seen.has(d.id) || d.dirty) await this.pushDeck(d.id);
  },
  async remove(d){
    { const deck=await Decks.get(d.id); if (deck){ if (this.on()){ deck.deleted=true; deck.cards=[]; deck.mod=Date.now(); await Decks.put(deck); await this.pushDeck(d.id); } else await Decks.del(d.id); } }
    if (DOC && DOC.id===d.id){ DOC=null; renderDoc(); }
    if (this.on() && d.sync && d.sync.rev){ d.deleted=true; touch(d); await DB.put(d); await this.push(d); }
    else await DB.del(d.id);
  },
  statusText(){
    const p=this.provider(), where=p==='server'?'this site’s server':p?Auth[p].label:'';
    return !p ? 'Sync is off: everything stays on this device.' : this.error ? `${where}: ${this.error}` :
      this.last ? `Synced with ${where} ${Math.max(0,Math.round((Date.now()-this.last)/60000))} min ago.` : `Syncing with ${where}…`;
  },
  statusLine(){ return h('p',{class:'muted small',style:'margin:10px 0 0'}, this.statusText(),
    this.needsAuth && this.provider() && this.provider()!=='server' ? [' ', h('a',{href:'#',onclick:e=>{ e.preventDefault(); Sync.connect(Sync.provider()); }},'Reconnect')] : null); }
};

/* ============ flashcards ============ */
/* Scheduling follows Anki's classic SM-2 defaults: learning steps 1m and 10m, graduating interval 1 day,
   easy interval 4 days, starting ease 250%, lapses relearn over 10m and restart at 1 day, days roll over at 4am. */
const SRS = {
  steps:[1,10], relearn:[10], grad:1, easy:4, ease0:2.5, minEase:1.3, easyBonus:1.3, hard:1.2, maxIvl:36500, learnAhead:20*60e3,
  MIN:60e3, DAY:86400e3,
  dayStart(t=Date.now()){ const d=new Date(t-4*3600e3); d.setHours(0,0,0,0); return d.getTime()+4*3600e3; },
  endOfDay(t=Date.now()){ return this.dayStart(t)+this.DAY; },
  fuzz(ivl){ return ivl<3 ? ivl : Math.round(ivl*(0.95+Math.random()*0.1)); },
  next(card, r, now=Date.now()){
    const c={...card, hist:[...(card.hist||[])]}; const prevState=c.state||'new';
    c.ease ||= this.ease0; c.ivl ||= 0; c.reps=(c.reps||0)+1; c.lapses ||= 0; c.step ||= 0;
    const grad = ivl => { c.state='review'; c.ivl=Math.min(this.maxIvl, ivl); c.step=0; c.due=this.dayStart(now)+c.ivl*this.DAY; };
    if (prevState==='new'){ c.state='learn'; c.step=0; c.first=now; }
    if (c.state==='learn' || c.state==='relearn'){
      const steps = c.state==='learn' ? this.steps : this.relearn;
      if (r===1){ c.step=0; c.due=now+steps[0]*this.MIN; }
      else if (r===2){ const cur=steps[c.step]??steps[0], nx=steps[c.step+1]; c.due=now+(c.step===0&&nx?(cur+nx)/2:cur)*this.MIN; }
      else if (r===3){ if (c.step+1<steps.length){ c.step++; c.due=now+steps[c.step]*this.MIN; } else grad(c.state==='learn'?this.grad:Math.max(1,c.ivl)); }
      else grad(c.state==='learn'?this.easy:Math.max(1,c.ivl)+1);
    } else {
      const late=Math.max(0,(now-c.due)/this.DAY), ivl=c.ivl||1, ease=c.ease;
      if (r===1){ c.lapses++; c.ease=Math.max(this.minEase, ease-0.2); c.state='relearn'; c.step=0; c.ivl=1; c.due=now+this.relearn[0]*this.MIN; }
      else {
        // as Anki: each button gives at least a day more than the one before it
        const hardI=Math.max(ivl+1, Math.round(ivl*this.hard)), goodI=Math.max(hardI+1, Math.round((ivl+late/2)*ease)), easyI=Math.max(goodI+1, Math.round((ivl+late)*ease*this.easyBonus));
        const n = r===2 ? hardI : r===3 ? goodI : easyI;
        if (r===2) c.ease=Math.max(this.minEase, ease-0.15); if (r===4) c.ease=ease+0.15;
        c.ivl=Math.min(this.maxIvl, this.fuzz(n)); c.due=this.dayStart(now)+c.ivl*this.DAY; }
    }
    c.last=now; c.mod=now; c.hist.push({t:now, r, s:prevState, ivl:c.ivl}); if (c.hist.length>40) c.hist.shift();
    return c;
  },
  label(card, r, now=Date.now()){ const c=this.next({...card, hist:[]}, r, now); const ms=c.state==='review'&&c.due>now ? c.ivl*this.DAY : c.due-now; return this.span(ms); },
  span(ms){ const m=ms/this.MIN; if (m<1) return '<1m'; if (m<60) return Math.round(m)+'m'; const hrs=m/60; if (hrs<24) return Math.round(hrs)+'h'; const d=hrs/24; if (d<30) return Math.round(d)+'d'; if (d<365) return (d/30).toFixed(1).replace(/\.0$/,'')+'mo'; return (d/365).toFixed(1).replace(/\.0$/,'')+'y'; }
};
const NEW_PER_DAY = () => +P.newPerDay || 20;
const Cards = {
  live: c => c && !c.deleted,
  counts(deck, now=Date.now()){
    const eod=SRS.endOfDay(now), start=SRS.dayStart(now); let n=0, l=0, d=0, total=0, introduced=0;
    for (const c of deck.cards){ if (!this.live(c)) continue; total++; if (c.suspended) continue;
      if (!c.state || c.state==='new') n++; else if (c.state==='review'){ if (c.due<=eod) d++; } else if (c.due<=eod) l++;
      if (c.first && c.first>=start) introduced++; }
    return {n:Math.min(n, Math.max(0, NEW_PER_DAY()-introduced)), newTotal:n, l, d, total};
  },
  async deck(docId, create){
    let d=await Decks.get(docId);
    if (!d && create){ const doc=await DB.get(docId); d={id:docId, title:doc?doc.title:'Deck', cards:[], mod:Date.now()}; }
    return d;
  },
  async save(deck){ deck.mod=Date.now(); deck.dirty=true; await Decks.put(deck); Sync.scheduleDeck(deck); },
  add(deck, list){
    const norm=t=>String(t||'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim();
    const have=new Set(deck.cards.filter(this.live).map(c=>norm(c.front))), srcs=new Set(deck.cards.filter(this.live).map(c=>c.src).filter(Boolean));
    let added=0;
    for (const x of list){ if (!x.front||!x.back) continue; if (have.has(norm(x.front)) || (x.src && srcs.has(x.src))) continue;
      deck.cards.push({id:uid(), front:x.front.trim(), back:x.back.trim(), bid:x.bid||null, src:x.src||null, origin:x.origin||'manual', created:Date.now(), mod:Date.now(), state:'new'});
      have.add(norm(x.front)); if (x.src) srcs.add(x.src); added++; }
    return added;
  },
  fromGuide(doc){
    const pk=doc.pack; if (!pk || pk.stub) return [];
    const out=[];
    for (const t of pk.terms||[]) if (t.short) out.push({src:'term:'+t.id, origin:'guide', front:`What does **${t.term}** mean${t.inThisPaper?' in this text':''}?`, back:t.short+(t.inThisPaper?`\n\n*In this text:* ${t.inThisPaper}`:'')});
    for (const a of pk.arguments||[]) if ((a.premises||[]).length) out.push({src:'arg:'+a.id, origin:'guide', bid:a.bid, front:`Lay out **${a.name}**: what are its premises and conclusion?`,
      back:(a.premises||[]).map(p=>`**${p.label||''}** ${p.text}`).join('\n\n')+(a.conclusion?`\n\n**${a.conclusion.label||'C'}** ${a.conclusion.text}`:'')});
    for (const p of pk.people||[]) if (p.importance==='major' && p.inThisPaper) out.push({src:'person:'+p.id, origin:'guide', front:`Who is **${p.name}**, and what role do they play in this text?`, back:`${p.role||''}\n\n${p.inThisPaper}`});
    return out;
  },
  anki(deck){
    const html = t => DOMPurify.sanitize(marked.parse(t||'')).replace(/\n/g,' ').replace(/\t/g,' ');
    return '#separator:tab\n#html:true\n#notetype:Basic\n#deck:'+deck.title.replace(/[\n:]/g,' ')+'\n'+deck.cards.filter(this.live).map(c=>html(c.front)+'\t'+html(c.back)).join('\n')+'\n';
  }
};

/* ---- full-screen panel for decks and study ---- */
const Screen = {
  stack:[],
  open(title, render, opts={}){ this.stack.push({title, render, ...opts}); this.draw(); },
  replace(title, render, opts={}){ this.stack.pop(); this.open(title, render, opts); },
  draw(){ const top=this.stack[this.stack.length-1]; const el=$('#screen');
    if (!top){ el.classList.remove('open'); document.removeEventListener('keydown', Screen.keys); return; }
    el.classList.add('open'); $('#scrTitle').textContent=top.title; $('#scrBack').style.visibility=this.stack.length>1?'visible':'hidden';
    const body=$('#screenBody'); body.innerHTML=''; body.scrollTop=0; const w=h('div',{class:'wrap'}); body.append(w); top.render(w);
    document.removeEventListener('keydown', Screen.keys); if (top.keys) document.addEventListener('keydown', Screen.keys); },
  keys(e){ const top=Screen.stack[Screen.stack.length-1]; if (top && top.keys && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) top.keys(e); },
  back(){ this.stack.pop(); this.draw(); }, close(){ this.stack=[]; this.draw(); }
};
$('#scrBack').onclick=()=>Screen.back(); $('#scrClose').onclick=()=>Screen.close();

const countsEl = c => h('span',{class:'counts'}, h('span',{class:'n'+(c.n?'':' z'),title:'New'},String(c.n)), h('span',{class:'l'+(c.l?'':' z'),title:'Learning'},String(c.l)), h('span',{class:'d'+(c.d?'':' z'),title:'Due for review'},String(c.d)));
async function allDecks(){ return (await Decks.all()).filter(d=>!d.deleted && d.cards.some(Cards.live)); }
async function dueTotal(){ let t=0; for (const d of await allDecks()){ const c=Cards.counts(d); t+=c.n+c.l+c.d; } return t; }

    w.append(list, h('div',{class:'row',style:'margin-top:10px'}, decks.length>1?h('button',{class:'chip',onclick:()=>{ sel=new Set(decks.map(d=>d.id)); Screen.draw(); }},'Tick all'):null, decks.length>1?h('button',{class:'chip',onclick:()=>{ sel=new Set(); Screen.draw(); }},'Untick all'):null), study);
    refresh();

    w.append(h('p',{class:'small muted',style:'margin-top:22px'}, 'New cards per deck per day: ', sett));
  });
}
function shortTitle(doc){ return doc.group && doc.title.startsWith(doc.group.title+': ') ? doc.title.slice(doc.group.title.length+2) + ' — ' + doc.group.title : doc.title; }

const hasGuideDoc = d => !!(d.pack && !d.pack.stub && Object.keys(d.pack.moves||{}).length);

/* ---- study session ---- */
async function startStudy(ids){
  const decks=(await Promise.all(ids.map(id=>Decks.get(id)))).filter(d=>d&&!d.deleted);
  if (!decks.length) return toast('Choose at least one deck.');
  const byCard=new Map(); for (const d of decks) for (const c of d.cards) byCard.set(c.id,d);
  let current=null, shown=false, undo=null, done=0;
  const pick=()=>{
    const now=Date.now(), eod=SRS.endOfDay(now), start=SRS.dayStart(now);
    const live=[]; for (const d of decks) for (const c of d.cards) if (Cards.live(c)&&!c.suspended) live.push([c,d]);
    const learn=live.filter(([c])=>c.state==='learn'||c.state==='relearn').sort((a,b)=>a[0].due-b[0].due);
    if (learn.length && learn[0][0].due<=now) return learn[0];
    const rev=live.filter(([c])=>c.state==='review'&&c.due<=eod).sort((a,b)=>a[0].due-b[0].due);
    // new cards are shown after every few reviews, as Anki mixes them in
    const fresh=[]; for (const d of decks){ const intro=d.cards.filter(c=>c.first&&c.first>=start).length; let room=Math.max(0,NEW_PER_DAY()-intro);
      for (const c of d.cards) if (room>0 && Cards.live(c) && !c.suspended && (!c.state||c.state==='new')){ fresh.push([c,d]); room--; } }
    if (fresh.length && (!rev.length || done%4===3)) return fresh[0];
    if (rev.length) return rev[0];
    if (learn.length && learn[0][0].due<=now+SRS.learnAhead) return learn[0];
    return null;
  };
  const counts=()=>{ let t={n:0,l:0,d:0}; for (const d of decks){ const c=Cards.counts(d); t.n+=c.n; t.l+=c.l; t.d+=c.d; } return t; };
  const answer=async r=>{
    const [c,d]=current; const before={...c, hist:[...(c.hist||[])]}; const idx=d.cards.indexOf(c);
    const nc=SRS.next(c, r); d.cards[idx]=nc; undo={d, idx, before}; done++;
    await Cards.save(d); shown=false; current=pick(); Screen.draw();
  };
  const render=w=>{
    if (!current) current=pick();
    const t=counts();
    w.append(h('div',{class:'row',style:'justify-content:space-between;margin-bottom:6px'}, countsEl(t),
      undo?h('button',{class:'chip',onclick:async()=>{ undo.d.cards[undo.idx]={...undo.before, mod:Date.now()}; await Cards.save(undo.d); done=Math.max(0,done-1); current=[undo.d.cards[undo.idx], undo.d]; undo=null; shown=false; Screen.draw(); }},'Undo'):null));
    if (!current){
      const next=Math.min(...decks.flatMap(d=>d.cards.filter(c=>Cards.live(c)&&!c.suspended&&c.state&&c.state!=='new').map(c=>c.due)));
      w.append(h('div',{class:'fcard'}, h('div',{},'All done for now.'), h('div',{class:'muted small',style:'margin-top:10px'}, isFinite(next)?`The next card is due in ${SRS.span(Math.max(0,next-Date.now()))}.`:`You reviewed ${done} card${done===1?'':'s'}.`)),
        h('button',{class:'btn bigbtn',onclick:()=>Screen.back()},'Back to decks')); return; }
    const [c,d]=current;
    const card=h('div',{class:'fcard'}, h('div',{class:'prose',html:md(c.front)}));
    if (shown) card.append(h('div',{class:'ans prose',html:md(c.back)}));
    w.append(card);
    const meta=h('div',{class:'row',style:'justify-content:center;gap:14px'},
      h('span',{class:'muted small'}, decks.length>1?shortTitleSync(d):'', (!c.state||c.state==='new')?' new card':''),
      c.bid?h('a',{href:'#',class:'small',onclick:e=>{ e.preventDefault(); showInText(d.id,c.bid); }},'Show in text'):null,
      h('a',{href:'#',class:'small',onclick:e=>{ e.preventDefault(); editCard(d,c); }},'Edit'));
    w.append(meta);
    if (!shown) w.append(h('button',{class:'btn primary bigbtn',onclick:()=>{ shown=true; Screen.draw(); }},'Show answer'));
    else w.append(h('div',{class:'rate'}, [['again','Again',1],['hard','Hard',2],['good','Good',3],['easy','Easy',4]].map(([k,l,r])=>h('button',{class:k,onclick:()=>answer(r)}, l, h('small',{},SRS.label(c,r))))));
  };
  const titles=new Map((await DB.all()).map(x=>[x.id, shortTitle(x)])); const shortTitleSync=d=>titles.get(d.id)||d.title;
  Screen.open('Study', render, {keys:e=>{ if (!current) return; if (!shown && (e.key===' '||e.key==='Enter')){ e.preventDefault(); shown=true; Screen.draw(); } else if (shown && /^[1-4]$/.test(e.key)) answer(+e.key); else if (shown && (e.key===' '||e.key==='Enter')){ e.preventDefault(); answer(3); } }});
}

/* ---- Claude-written cards: same cached copy of the text as the guide ---- */
async function cardsWithClaude(docId){
  if (!DOC || DOC.id!==docId){ Screen.close(); await openDoc(docId); }
  if (!DOC || DOC.convert) return;
  try { await Vault.get(); } catch { return; }
  const deck=await Cards.deck(docId, true);
  const chunks=chunkBlocks(BLOCKS.filter(b=>!b.bib), 2400);
  const jobs=chunks.map(ch=>({id:uid(), layer:'cards', label:`${range(ch)} (${sectionName(ch)})`, ids:ch.map(b=>b.bid)}));
  let done=0, added=0, failed=0; Prog.show('Writing flashcards…');
  const run=async job=>{
    try{
      const {blocks}=await claudeStream(jobRequest(job), ()=>{});
      const res=parseLoose(blocks.filter(b=>b&&b.type==='text').map(b=>b.text).join(''));
      if (!res) throw new Error('reply was not valid JSON');
      added+=Cards.add(deck, (res.cards||[]).map(x=>({front:x.front, back:x.back, bid:blockNum.get(x.p)||null, origin:'claude'})));
      await Cards.save(deck);
    }catch(e){ failed++; Log.add('error','Flashcards', e.message, {doc:DOC.title, part:job.label}); }
    done++; Prog.set(`Writing flashcards: ${sectionName(chunks[Math.min(done,chunks.length-1)])}`, done/jobs.length, `${done} of ${jobs.length} parts`);
  };
  try{ if (jobs.length){ await run(jobs[0]); await pool(jobs.slice(1), 3, run); } } finally { Prog.hide(); }
  toast(`${added} card${added===1?'':'s'} added${failed?`; ${failed} part${failed>1?'s':''} failed (see the error log)`:''}.`, 5000, !!failed);
  openDeck(docId);
}
async function cardFromSelection(bid, q, thread){
  try { await Vault.get(); } catch { return; }
  toast('Drafting a card…');
  const ctx=contextFor(bid,q)+(thread&&thread.length?`\n\nWhat the reader asked and was told:\n${thread.map(m=>(m.role==='user'?'Q: '+(m.label||''):'A: '+m.content)).join('\n').slice(0,4000)}`:'');
  try{
    const {blocks}=await claudeStream({model:P.mainModel, max_tokens:2000, output_config:{effort:'low'}, system:tutorSystem(),
      messages:[{role:'user',content:`${ctx}\n\nWrite one flashcard that tests the most important idea in the selected passage. The front is a clear question answerable from memory; the back is a short answer (1 to 3 sentences) with the key reason. Reply with only JSON: {"front": string, "back": string}`}]});
    const res=parseLoose(blocks.filter(b=>b&&b.type==='text').map(b=>b.text).join(''));
    if (!res) throw new Error('The draft was not valid JSON.');
    editCard(await Cards.deck(DOC.id, true), null, {front:res.front, back:res.back, bid, origin:'selection'});
  }catch(e){ toast(e.message,5000,true); }
}

/* ============ boot ============ */
let posT; addEventListener('scroll',()=>{ clearTimeout(posT); posT=setTimeout(()=>{ if (!DOC) return; DOC.pos=scrollY;
  const top=(document.getElementById('top').getBoundingClientRect().bottom)+8; const b=BLOCKS.find(b=>b.el.getBoundingClientRect().bottom>top);
  if (b && b.bid!==DOC.posBid){ DOC.posBid=b.bid; touch(DOC); Sync.schedule(DOC, 15000); } DB.put(DOC); },800); },{passive:true});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyPrefs);
(async function boot(){
  applyPrefs();
  if (STATIC){
    DOC=STATIC.doc; renderDoc();
    const hb=location.hash.slice(1); let saved=null; try{ saved=localStorage.getItem('gloss.static.'+DOC.id); }catch{}
    if (BY.has(hb)) setTimeout(()=>gotoBlock(hb),50); else if (saved && BY.has(saved)){ DOC.posBid=saved; restorePos(DOC); }
    addEventListener('hashchange',()=>{ const b=location.hash.slice(1); if (BY.has(b)) gotoBlock(b); });
    staticBadge();
    return;
  }
  await finishSignIn(); receiveFromPage();
  const last=localStorage.getItem('gloss.last');
  if (last && await DB.get(last)) await openDoc(last); else renderDoc();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
  Sync.init();
  try{ if (navigator.storage && navigator.storage.persist && !(await navigator.storage.persisted())) await navigator.storage.persist(); }catch{}
})();
