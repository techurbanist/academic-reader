<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Academic Reader</title>
<meta name="theme-color" content="#1f2a44">
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Figtree:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" integrity="sha512-xeUh+KxNyTufZOje++oQHstlMQ8/rpyzPuM+gjMFYK3z5ILJGE7l2NvYL+XfliKURMpBIKKp1XoPN/qswlSMFA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" integrity="sha512-jB0TkTBeQC9ZSkBqDhdmfTv1qdfbWpGE72yJ/01Srq6hEzZIz2xkz1e57p9ai7IeHMwEG7HpzG6NdptChif5Pg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
:root{
  --bg:#f4f5f2; --surface:#ffffff; --ink:#1d2126; --muted:#5e6670; --rule:#d9dcd6; --shade:rgba(29,33,38,.06);
  --c-move:#4152b8; --c-term:#0e7a72; --c-person:#8b3a7a; --c-ref:#936000; --c-note:#b23a48;
  --read-font:"Literata",Georgia,serif; --ui:"Figtree",system-ui,sans-serif;
  --fs:19px; --lh:1.65; --measure:34em; --pad:20px; --gutter:16px;
  color-scheme:light;
}
:root[data-theme="vellum"]{--bg:#ece2cd;--surface:#f6eedc;--ink:#35291c;--muted:#6f5f4b;--rule:#d4c6a8;--shade:rgba(53,41,28,.07);--c-move:#44508f;--c-term:#1d6b5f;--c-person:#7d3668;--c-ref:#8a5500;--c-note:#a3343f}
:root[data-theme="night"]{--bg:#15171a;--surface:#1e2125;--ink:#e3e1dc;--muted:#99a0a8;--rule:#33373d;--shade:rgba(255,255,255,.05);--c-move:#9aa6ff;--c-term:#5ccfc3;--c-person:#e08bd0;--c-ref:#e3b25a;--c-note:#ff8a98;color-scheme:dark}
@media (prefers-color-scheme:dark){:root[data-theme="auto"]{--bg:#15171a;--surface:#1e2125;--ink:#e3e1dc;--muted:#99a0a8;--rule:#33373d;--shade:rgba(255,255,255,.05);--c-move:#9aa6ff;--c-term:#5ccfc3;--c-person:#e08bd0;--c-ref:#e3b25a;--c-note:#ff8a98;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:calc(56px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--ui);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--c-move);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:4px;padding:calc(6px + env(safe-area-inset-top,0px)) 8px 6px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
#top h1{flex:1;min-width:0;margin:0 6px;font:500 15px/1.2 var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.ib{display:inline-grid;place-items:center;width:40px;height:40px;border:0;border-radius:10px;background:none;color:var(--ink)}
.ib:hover{background:var(--shade)}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.aa{font:600 17px/1 var(--read-font)}

/* reader */
#reader{padding:24px 0 40vh;transition:padding .2s}
#doc{max-width:calc(var(--measure) + 2*var(--pad) + var(--gutter));margin:0 auto;padding:0 var(--pad) 0 calc(var(--pad) + var(--gutter));font-family:var(--read-font);font-size:var(--fs);line-height:var(--lh);hyphens:auto;-webkit-hyphens:auto}
#doc h1,#doc h2,#doc h3,#doc h4{font-weight:600;line-height:1.25;hyphens:none}
#doc h1{font-size:1.6em;margin:.4em 0 .8em}
#doc h2{font-size:1.2em;margin:2em 0 .6em}
#doc h3{font-size:1.02em;font-style:italic;font-weight:400;margin:1.6em 0 .4em}
#doc p,#doc li{margin:0 0 .85em}
#doc blockquote{margin:1em 0;padding-left:1em;border-left:2px solid var(--rule);color:var(--muted)}
#doc table{border-collapse:collapse;font-size:.82em;line-height:1.4;display:block;overflow-x:auto;margin:1em 0}
#doc th,#doc td{border-bottom:1px solid var(--rule);padding:.45em .6em;text-align:left;vertical-align:top}
#doc hr{border:0;border-top:1px solid var(--rule);margin:2.4em 0}
#doc a{color:inherit}
#doc sup a{text-decoration:none;color:var(--c-move);padding:0 2px}
#doc .fn{font-size:.86em}
#doc img{max-width:100%}
#doc code{font-size:.88em}
.blk{position:relative}
.rail{position:absolute;left:calc(-1*var(--gutter) - 4px);top:.15em;bottom:.15em;width:calc(var(--gutter) + 2px);border:0;padding:0;background:none}
.rail::before{content:"";position:absolute;left:4px;top:0;bottom:0;width:3px;border-radius:2px;background:color-mix(in srgb,var(--c-move) 45%,transparent)}
.rail:hover::before,.blk.active>.rail::before{background:var(--c-move)}
.rail .lbl{display:none}
.blk.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:color-mix(in srgb,var(--c-move) 16%,transparent)}100%{background:transparent}}
@media (min-width:980px){
  .rail .lbl{display:block;position:absolute;right:calc(100% + 6px);top:.2em;width:9.5em;text-align:right;font:italic 12.5px/1.3 var(--ui);color:var(--muted)}
  .rail:hover .lbl{color:var(--c-move)}
}
/* inline marks */
[data-t]{cursor:pointer;border-radius:2px}
.m-term{text-decoration:underline dotted var(--c-term);text-decoration-thickness:1.5px;text-underline-offset:.2em}
.m-person{text-decoration:underline solid color-mix(in srgb,var(--c-person) 55%,transparent);text-decoration-thickness:1.5px;text-underline-offset:.2em}
.m-ref{color:var(--c-ref)}
.m-sig{background:linear-gradient(transparent 60%,color-mix(in srgb,var(--c-move) 17%,transparent) 60%)}
.m-note{background:color-mix(in srgb,var(--c-note) 13%,transparent);box-shadow:0 1.5px 0 color-mix(in srgb,var(--c-note) 55%,transparent)}
[data-t]:hover{background-color:var(--shade)}

/* welcome and settings */
.welcome{max-width:36em;margin:1em auto 2em;font:16px/1.55 var(--ui)}
.welcome h2{font:600 1.5em/1.25 var(--read-font)!important;margin:.2em 0 .5em!important}
.welcome h3{font:600 15px/1.3 var(--ui)!important;font-style:normal!important;margin:1.6em 0 .4em!important}
.welcome .lede{font-size:1.08em}
.welcome p{margin:0 0 .7em}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(14em,1fr));gap:10px;margin:1.2em 0}
.feat{padding:12px 14px;border:1px solid var(--rule);border-radius:12px;background:var(--surface)}
.feat b{display:block;margin-bottom:3px}
.feat span{color:var(--muted);font-size:14px}
ol.steps{padding-left:1.3em;margin:.4em 0 1em}
ol.steps li{margin:0 0 6px}
ul.plain{padding-left:1.1em}
ul.plain li{margin:0 0 6px}
.conn{border:1px solid var(--rule);border-radius:12px;padding:10px 12px;margin:0 0 10px}
.conn .t1{font-weight:600}
.conn p{margin:4px 0 8px}
.syncopt{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--rule)}
.syncstat{border-top:1px solid var(--rule);padding-top:2px}
.syncstat p{margin-top:8px!important}
.syncopt.on b::after{content:" · on";color:var(--c-term);font-weight:500}
.syncopt input{flex:1;min-width:8em}
details.adv{margin-top:16px}
details.adv summary{cursor:pointer;font-weight:600}
table.dtable{border-collapse:collapse;font-size:13px;line-height:1.4;width:100%;margin:6px 0 10px}
table.dtable th,table.dtable td{border-bottom:1px solid var(--rule);padding:6px 6px 6px 0;text-align:left;vertical-align:top}
/* static edition */
.badge{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;align-items:center;background:var(--surface);border:1px solid var(--rule);border-radius:999px;box-shadow:0 2px 10px rgba(0,0,0,.12);font:500 13px/1 var(--ui)}
.badge .pill{display:flex;align-items:center;gap:7px;border:0;background:none;padding:8px 4px 8px 10px;color:var(--ink)}
.badge .pill img{width:18px;height:18px;border-radius:4px}
.badge .x{border:0;background:none;color:var(--muted);padding:8px 10px 8px 6px;font-size:16px;line-height:1}
body.sheet-open .badge,body.tts-on .badge{display:none}
.static #bLib,.static #askFab{display:none!important}
.intro{margin:0 0 2em;padding:14px 16px;border:1px solid var(--rule);border-radius:12px;background:var(--surface);font:15px/1.5 var(--ui)}
.intro h2{margin:0 0 6px!important;font:600 16px/1.3 var(--ui)!important}
.intro .note{margin:0 0 10px}
.intro ul{margin:0 0 10px;padding-left:1.2em}
.intro li{margin:0 0 4px!important}
.intro .key{display:inline-block;width:.8em;height:.8em;border-radius:2px;vertical-align:-.05em;margin-right:2px}
/* empty */
.empty{max-width:30em;margin:12vh auto;padding:0 24px;text-align:left}
.empty h2{font:600 26px/1.2 var(--read-font);margin:0 0 .5em}
.empty p{color:var(--muted);margin:0 0 1.2em}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;border:1px solid var(--rule);background:var(--surface);font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--c-move);border-color:var(--c-move);color:#fff}
:root[data-theme="night"] .btn.primary{color:#101216}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{padding:6px 11px;border-radius:99px;border:1px solid var(--rule);background:none;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--c-move);border-color:var(--c-move);color:var(--surface)}
.chip[aria-pressed="true"] .swatch{box-shadow:0 0 0 1.5px var(--surface)}

/* sheet (cards) */
#sheet{position:fixed;z-index:30;left:0;right:0;bottom:0;max-height:78vh;display:flex;flex-direction:column;background:var(--surface);border-top:1px solid var(--rule);border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.12);transform:translateY(105%);transition:transform .22s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet.open{transform:none}
#sheet header{display:flex;align-items:center;gap:2px;padding:6px 6px 4px;border-bottom:1px solid var(--rule)}
#sheet header .crumb{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sheetBody{overflow-y:auto;padding:14px 18px 28px;-webkit-overflow-scrolling:touch}
@media (min-width:1100px){
  #sheet{left:auto;top:0;width:430px;max-height:none;border-radius:0;border-top:0;border-left:1px solid var(--rule);box-shadow:none;transform:translateX(105%);padding-top:env(safe-area-inset-top,0px)}
  body.sheet-open #reader{padding-right:430px}
}
.card h2{font:600 22px/1.2 var(--read-font);margin:2px 0 4px}
.card .kind{font-size:13px;color:var(--muted);margin:0 0 12px}
.card .kind b{font-weight:600}
.card section{margin:0 0 16px}
.card h3{font:600 13.5px/1.3 var(--ui);color:var(--muted);margin:18px 0 6px}
.card .prose{font:16px/1.55 var(--read-font)}
.card .prose p{margin:0 0 .7em}
.card .prose h3{font:600 14px/1.3 var(--ui);color:var(--ink);margin:1.2em 0 .4em}
.card .prose ul,.card .prose ol{padding-left:1.2em;margin:0 0 .7em}
.card .prose details{margin:.4em 0 .8em;padding:8px 10px;border-radius:8px;background:var(--shade)}
.card .prose summary{cursor:pointer;font-family:var(--ui);font-size:14px}
.card blockquote.q{margin:0 0 14px;padding:8px 12px;border-left:3px solid var(--c-move);background:var(--shade);font:italic 15px/1.5 var(--read-font);border-radius:0 8px 8px 0}
.card .sig{margin:0 0 10px}
.card .sig q{font-style:italic;quotes:"“" "”"}
.card .accent-term h2{color:var(--c-term)} .card .accent-person h2{color:var(--c-person)} .card .accent-ref h2{color:var(--c-ref)} .card .accent-note h2{color:var(--c-note)}
.links{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.links a{font-size:13.5px;padding:5px 10px;border-radius:99px;border:1px solid var(--rule);text-decoration:none;color:var(--ink)}
.links a:hover{border-color:var(--muted)}
.xl{color:var(--ink);text-decoration:underline dotted;text-underline-offset:.2em;cursor:pointer}
.xl.p{text-decoration-style:solid;text-decoration-color:color-mix(in srgb,var(--c-person) 55%,transparent)}
.xl.t{text-decoration-color:var(--c-term)}
.list{list-style:none;margin:0;padding:0}
.list li{padding:10px 2px;border-bottom:1px solid var(--rule);cursor:pointer}
.list li:hover{background:var(--shade)}
.list .t1{font-weight:600}
.list .t2{font-size:13.5px;color:var(--muted);margin-top:2px}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:-4px -4px 12px;padding:4px}
.wiki{display:flex;gap:12px;align-items:flex-start;margin:0 0 12px;padding:10px;border-radius:10px;background:var(--shade);font-size:14px}
.wiki img{width:64px;height:64px;object-fit:cover;border-radius:8px;flex:none}
.muted{color:var(--muted)}
.small{font-size:13px}
.thread .u{margin:14px 0 6px;font-weight:600;font-size:14px}
.ask-box{display:flex;gap:6px;margin-top:12px}
.ask-box textarea{flex:1;min-height:44px;max-height:30vh;padding:10px;border:1px solid var(--rule);border-radius:10px;background:var(--bg);resize:vertical}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--rule);border-top-color:var(--c-move);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.arg .prem{margin:0 0 8px;padding-left:2.6em;text-indent:-2.6em}
.arg .prem b{display:inline-block;width:2.4em;text-indent:0}
.arg .concl{border-top:1px solid var(--ink);padding-top:8px}

/* floating ask */
#askFab{position:fixed;z-index:25;display:none;padding:8px 14px;border-radius:99px;border:0;background:var(--ink);color:var(--bg);font-weight:600;box-shadow:0 4px 18px rgba(0,0,0,.25)}

/* dialogs */
dialog{border:0;padding:0;border-radius:16px;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 20px));max-height:calc(100vh - 40px);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dlg{padding:18px 20px 20px;overflow-y:auto;max-height:calc(100vh - 40px)}
.dlg h2{font:600 20px/1.2 var(--read-font);margin:0 0 14px;display:flex;align-items:center}
.dlg h2 span{flex:1}
.dlg h3{font:600 13.5px/1.3 var(--ui);color:var(--muted);margin:18px 0 8px}
.field{display:grid;gap:4px;margin:0 0 12px}
.field label{font-size:13.5px;color:var(--muted)}
.field input[type=text],.field input[type=password],.field textarea,.field select{padding:9px 10px;border:1px solid var(--rule);border-radius:9px;background:var(--bg);width:100%}
.slider{display:grid;grid-template-columns:7.5em 1fr 3em;align-items:center;gap:8px;margin:0 0 8px;font-size:14px}
.slider output{text-align:right;color:var(--muted)}
.fontpick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fontpick button{padding:10px;border-radius:10px;border:1px solid var(--rule);background:none;text-align:left;font-size:17px}
.fontpick button[aria-pressed="true"]{border-color:var(--c-move);box-shadow:inset 0 0 0 1px var(--c-move)}
.fontpick small{display:block;font:12px var(--ui);color:var(--muted)}
.swatch{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:0}
.doclist li{display:flex;align-items:center;gap:8px}
.doclist li .grow{flex:1;min-width:0}
.doclist .cur .t1::after{content:" (open)";font-weight:400;color:var(--muted)}
.opt{display:flex;gap:10px;align-items:flex-start;margin:6px 0}.opt input{margin-top:3px;flex:none}
.note{padding:10px 12px;border-radius:10px;background:var(--shade);font-size:13.5px;color:var(--muted);margin:0 0 12px}
.err{color:var(--c-note)}

/* progress */
#tts{position:fixed;z-index:27;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100vw - 16px));display:none;align-items:center;gap:2px;padding:6px 8px 6px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--rule);box-shadow:0 8px 28px rgba(0,0,0,.18)}
body.tts-on #tts{display:flex}
body.tts-on #prog{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body.tts-on #reader{padding-bottom:50vh}
#tts .where{flex:1;min-width:0;font-size:13px;line-height:1.3;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tts .where b{display:block;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}
#tts .spd{font:600 13px/1 var(--ui);width:46px;height:36px;border-radius:10px;border:1px solid var(--rule);background:none}
#tts .ib.play{background:var(--c-move);color:var(--surface)}
.blk.reading{background:color-mix(in srgb,var(--c-move) 7%,transparent);border-radius:4px;box-shadow:-6px 0 0 color-mix(in srgb,var(--c-move) 7%,transparent),6px 0 0 color-mix(in srgb,var(--c-move) 7%,transparent)}
::highlight(tts){background-color:color-mix(in srgb,var(--c-move) 24%,transparent)}
#screen{position:fixed;inset:0;z-index:34;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#screen.open{display:flex}
#screen>header{display:flex;align-items:center;gap:4px;padding:6px 8px;border-bottom:1px solid var(--rule)}
#screen>header h2{flex:1;min-width:0;margin:0 6px;font:600 17px/1.2 var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#screenBody{flex:1;overflow-y:auto;padding:16px 18px 40px}
#screenBody .wrap{max-width:680px;margin:0 auto}
.counts{display:inline-flex;gap:10px;font:600 14px/1 var(--ui)}
.counts .n{color:#3b6fd4}.counts .l{color:#c2561b}.counts .d{color:#2c8a4c}
:root[data-theme="night"] .counts .n{color:#8fb0ff}:root[data-theme="night"] .counts .l{color:#f0a070}:root[data-theme="night"] .counts .d{color:#7fd39a}
.counts .z{opacity:.35}
.deckrow{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--rule)}
.deckrow .grow{flex:1;min-width:0;cursor:pointer}
.deckrow .t1{font-weight:600}
.deckrow .t2{font-size:13px;color:var(--muted);margin-top:2px}
.fcard{min-height:40vh;display:flex;flex-direction:column;justify-content:center;font:20px/1.5 var(--read-font);text-align:center;padding:10px 4px}
.fcard .ans{border-top:1px solid var(--rule);margin-top:22px;padding-top:22px;font-size:18px}
.fcard .prose{font:inherit}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.rate button{padding:12px 4px;border-radius:12px;border:1px solid var(--rule);background:var(--surface);font:600 15px/1.2 var(--ui)}
.rate button small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:4px}
.rate .again{border-color:#c0392b55}.rate .easy{border-color:#2c8a4c55}
.bigbtn{width:100%;padding:14px;border-radius:12px;font-size:16px;font-weight:600;margin-top:18px}
.lib-group>.grow .t1::before{content:"";display:inline-block;width:0;height:0;border-left:5px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;margin-right:8px;vertical-align:1px;transition:transform .15s}
.lib-group.open>.grow .t1::before{transform:rotate(90deg)}
.list li.lib-child{padding-left:20px;margin-left:6px;border-left:2px solid var(--rule)}

<script>
"use strict";
/* ============ utilities ============ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
function h(tag, attrs={}, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v==null || v===false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k==='html') el.innerHTML = v;
    else if (k==='class') el.className = v;
    else el.setAttribute(k, v===true?'':v);
  }
  for (const k of kids.flat()) if (k!=null && k!==false) el.append(k.nodeType?k:document.createTextNode(String(k)));
  return el;
}
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fnv(str){ let h=0x811c9dc5; for (let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193);} return (h>>>0).toString(36); }
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const slug = s => String(s).toLowerCase().normalize('NFKD').replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-').slice(0,60);
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const collapse = s => String(s||'').replace(/\s+/g,' ').trim();
let toastT;
function toast(msg, ms=3200, isErr){ if (isErr) Log.add('error','notice',msg); const t=$('#toast'); t.textContent=msg; t.style.display='block'; clearTimeout(toastT); toastT=setTimeout(()=>t.style.display='none', ms); }
function md(s){ return DOMPurify.sanitize(marked.parse(String(s||''))); }
function download(name, text, type='application/json'){ const a=h('a',{href:URL.createObjectURL(new Blob([text],{type})),download:name}); document.body.append(a); a.click(); a.remove(); }
const wordCount = s => (String(s).match(/\S+/g)||[]).length;

/* quote normalisation with index map */
const QMAP = {'\u2018':"'",'\u2019':"'",'\u201a':"'",'\u201b':"'",'\u2032':"'",'\u201c':'"','\u201d':'"','\u201e':'"','\u2033':'"','\u2013':'-','\u2014':'-','\u2212':'-','\u2011':'-','\u00a0':' '};
function normMap(s){
  let out='', map=[], sp=false;
  for (let i=0;i<s.length;i++){
    let c=s[i];
    if (/\s/.test(c)){ if (sp) continue; c=' '; sp=true; } else sp=false;
    c = QMAP[c]||c; out+=c.toLowerCase(); map.push(i);
  }
  return {out,map};
}
function findQuote(text, q, from=0){
  if (!q) return null;
  const n = normMap(text); const qn = normMap(q).out.trim(); if (!qn) return null;
  let fromN = 0; while (fromN<n.map.length && n.map[fromN]<from) fromN++;
  const i = n.out.indexOf(qn, fromN); if (i<0) return null;
  return [n.map[i], n.map[i+qn.length-1]+1];
}
function wrapRange(root, start, end, make){
  const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); const nodes=[]; let pos=0, n;
  while ((n=tw.nextNode())){ nodes.push([n,pos]); pos+=n.nodeValue.length; }
  for (const [node0,p] of nodes){
    const len=node0.nodeValue.length, s=Math.max(start,p), e=Math.min(end,p+len);
    if (s>=e) continue;
    if (node0.parentElement && node0.parentElement.closest('.rail,sup')) continue;
    let node=node0; if (s>p) node=node.splitText(s-p); if (e-s<node.nodeValue.length) node.splitText(e-s);
    const w=make(); node.parentNode.insertBefore(w,node); w.appendChild(node);
  }
}

/* ============ error log ============ */
// A rolling log of errors and warnings, kept on this device so problems can be reported precisely.
// Never records the API key, sync key, or document text.
// Per-site settings, stamped by build.sh from Netlify environment variables (see README). Unstamped values
// (a local copy) count as empty: Dropbox and Google Drive sync are then offered as "not set up here".
const CONFIG = (()=>{ const v=x=>/^__.*__$/.test(x)?'':x;
  return { publicUrl: v('__PUBLIC_URL__') || 'https://academic-reader.initialloop.com', dropboxAppKey: v('__DROPBOX_APP_KEY__'), googleClientId: v('__GOOGLE_CLIENT_ID__') }; })();
const APP_VERSION = '2026-09-25.15';
const APP_BUILD = '__BUILD_TIME__';   // replaced with the UTC deploy time by the Netlify build
const buildLabel = b => /^__/.test(b) ? 'local copy' : `${b.replace('T',' ').replace(/Z$/,'')} UTC`;
const Log = {
  KEY:'gloss.log', MAX:300,
  all(){ try{ return JSON.parse(localStorage.getItem(this.KEY)||'[]'); }catch{ return []; } },
  add(level, where, msg, detail){
    const clean = v => String(v==null?'':v).replace(/sk-ant-[\w-]+/g,'sk-ant-…').replace(/("x-sync-token"\s*:\s*")[^"]+/g,'$1…').slice(0,2000);
    const e={t:new Date().toISOString(), level, where:String(where||''), msg:clean(msg), detail:detail?clean(typeof detail==='string'?detail:JSON.stringify(detail)):''};
    const a=this.all(); a.push(e); while (a.length>this.MAX) a.shift();
    try{ localStorage.setItem(this.KEY, JSON.stringify(a)); }catch{}
    return e;
  },
  clear(){ localStorage.removeItem(this.KEY); },
  text(){ return [`Academic Reader ${APP_VERSION}`, navigator.userAgent, `models: ${P.mainModel} / ${P.fastModel}, effort: ${P.guideEffort}/${P.askEffort}`, '',
    ...this.all().slice().reverse().map(e=>`${e.t} [${e.level}] ${e.where}: ${e.msg}${e.detail?`\n    ${e.detail}`:''}`)].join('\n'); }
};
addEventListener('error', e=>Log.add('error','page', e.message, e.error&&e.error.stack));
addEventListener('unhandledrejection', e=>Log.add('error','promise', e.reason&&e.reason.message||String(e.reason), e.reason&&e.reason.stack));
function openLog(){
  const pre=h('pre',{style:'white-space:pre-wrap;font-size:12px;line-height:1.45;max-height:55vh;overflow:auto;background:var(--shade);padding:10px;border-radius:8px'}, Log.all().length?Log.text():'No errors recorded.');
  showDlg([h('h2',{},h('span',{},'Error log'),closeX()),
    h('p',{class:'muted small'},'The most recent problems on this device, newest first. Copy this and paste it to Claude when something goes wrong.'),
    pre, h('div',{class:'row',style:'margin-top:10px'},
      h('button',{class:'btn primary',onclick:async()=>{ try{ await navigator.clipboard.writeText(Log.text()); toast('Copied'); }catch{ download('gloss-log.txt', Log.text(), 'text/plain'); } }},'Copy'),
      h('button',{class:'btn',onclick:()=>download('gloss-log.txt', Log.text(), 'text/plain')},'Download'),
      h('button',{class:'btn',onclick:()=>{ Log.clear(); pre.textContent='No errors recorded.'; }},'Clear'))]);
}

/* ============ static edition ============ */
// A page made with "Web page for readers" carries its text and guide in <script id="gloss-static">. It runs read-only:
// no library, API key, Ask, flashcards or sync. Nothing is stored except reading preferences and the reader's place.
const STATIC = (()=>{ const el=document.getElementById('gloss-static'); if (!el) return null; try{ return JSON.parse(el.textContent); }catch{ return null; } })();
if (STATIC) document.documentElement.classList.add('static');
const staticStore = () => ({
  get: async id => STATIC && STATIC.doc.id===id ? STATIC.doc : null,
  all: async () => STATIC ? [STATIC.doc] : [],
  put: async d => { try{ if (d && d.posBid) localStorage.setItem('gloss.static.'+d.id, d.posBid); }catch{} },
  del: async () => {} });

/* ============ storage ============ */
const Store = (()=>{
  let dbp;
  const open = () => dbp ||= new Promise((res,rej)=>{ const r=indexedDB.open('gloss',2);
    r.onupgradeneeded=()=>{ const db=r.result; if (!db.objectStoreNames.contains('docs')) db.createObjectStore('docs',{keyPath:'id'}); if (!db.objectStoreNames.contains('decks')) db.createObjectStore('decks',{keyPath:'id'}); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
  const tx = async (store, mode, fn) => { const db=await open(); return new Promise((res,rej)=>{ const t=db.transaction(store,mode); const st=t.objectStore(store); const r=fn(st); t.oncomplete=()=>res(r&&r.result); t.onerror=()=>rej(t.error); }); };
  const api = name => ({ get:id=>tx(name,'readonly',s=>s.get(id)), put:d=>tx(name,'readwrite',s=>s.put(d)), del:id=>tx(name,'readwrite',s=>s.delete(id)), all:()=>tx(name,'readonly',s=>s.getAll()) });
  return { docs:api('docs'), decks:api('decks') };
})();
const DB = STATIC ? staticStore() : Store.docs, Decks = STATIC ? {...staticStore(), get:async()=>null, all:async()=>[]} : Store.decks;
const DEF_PREFS = {theme:'auto', font:'literata', fs:19, lh:1.65, measure:34, pad:20, layers:{moves:true,sigs:true,terms:true,people:true,refs:true,notes:true}, density:'para',
  mainModel:'claude-sonnet-5', fastModel:'claude-haiku-4-5-20251001', maxTokens:32000, guideEffort:'medium', askEffort:'high', openalexKey:'', unlockMins:60, ttsVoice:'', ttsRate:1, ttsSkipCites:true, ttsNotes:false,
  about:''};
let P = Object.assign({}, DEF_PREFS, JSON.parse(localStorage.getItem('gloss.prefs')||'{}'));
if (P.maxTokens<32000) P.maxTokens=32000;
P.layers = Object.assign({}, DEF_PREFS.layers, P.layers||{});
if (P.syncProvider===undefined) P.syncProvider = P.syncToken && P.sync!==false ? 'server' : '';
const savePrefs = () => localStorage.setItem('gloss.prefs', JSON.stringify(P));

/* ============ key vault (PBKDF2 + AES-GCM) ============ */
const Vault = (()=>{
  let key=null, until=0;
  const enc=new TextEncoder(), dec=new TextDecoder();
  const b64 = u8 => btoa(String.fromCharCode(...u8)); const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
  async function derive(pwd, salt){ const base=await crypto.subtle.importKey('raw', enc.encode(pwd), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:600000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']); }
  // "Keep unlocked on this device": a non-extractable AES key held in its own small IndexedDB database
  const kdb = (mode, fn) => new Promise((res,rej)=>{ const r=indexedDB.open('gloss-keys',1); r.onupgradeneeded=()=>r.result.createObjectStore('k');
    r.onerror=()=>rej(r.error); r.onsuccess=()=>{ const t=r.result.transaction('k',mode); const q=fn(t.objectStore('k')); t.oncomplete=()=>res(q&&q.result); t.onerror=()=>rej(t.error); }; });
  const stored = () => { try{ return JSON.parse(localStorage.getItem('gloss.vault')||'null'); }catch{ return null; } };
  return {
    has: () => !!stored(),
    mode: () => { const v=stored(); return !v ? null : v.mode==='device' ? 'device' : 'password'; },
    async set(apiKey, pwd){ const iv=crypto.getRandomValues(new Uint8Array(12)); let k, rec;
      if (pwd==null){ k=await crypto.subtle.generateKey({name:'AES-GCM', length:256}, false, ['encrypt','decrypt']); await kdb('readwrite', s=>s.put(k,'vault')); rec={v:2, mode:'device'}; }
      else { const salt=crypto.getRandomValues(new Uint8Array(16)); k=await derive(pwd,salt); rec={v:1, salt:b64(salt)}; if (this.mode()==='device') await kdb('readwrite', s=>s.delete('vault')); }
      const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(apiKey)));
      localStorage.setItem('gloss.vault', JSON.stringify({...rec, iv:b64(iv), ct:b64(ct)})); key=apiKey; until=pwd==null?Infinity:Date.now()+P.unlockMins*60000; },
    async unlock(pwd){ const v=stored(); const k=v.mode==='device' ? await kdb('readonly', s=>s.get('vault')) : await derive(pwd,unb64(v.salt));
      if (!k) throw new Error('This browser no longer holds the key that protected your Claude key. Add the key again.');
      try { key=dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(v.iv)},k,unb64(v.ct))); } catch { throw new Error(v.mode==='device'?'Could not unlock the stored key. Add it again.':'That passphrase did not unlock the key.'); }
      until=v.mode==='device'?Infinity:Date.now()+P.unlockMins*60000; },
    lock(){ key=null; until=0; },
    async forget(){ localStorage.removeItem('gloss.vault'); key=null; until=0; try{ await kdb('readwrite', s=>s.delete('vault')); }catch{} },
    isOpen: () => key && Date.now()<until,
    async get(){ if (this.isOpen()) return key;
      if (this.mode()==='device'){ try{ await this.unlock(); return key; }catch(e){ toast(e.message, 6000, true); await this.forget(); } }
      await askUnlock(); return key; }
  };
})();
function askUnlock(){
  return new Promise((resolve, reject)=>{
    if (!Vault.has()) { openKeySetup(resolve, reject, 'This uses Claude, so it needs your own Anthropic API key. It takes about two minutes to set up.'); return; }
    const pw = h('input',{type:'password',autocomplete:'current-password'}); const err=h('div',{class:'err small'});
    const go = async () => { try { err.textContent=''; btn.disabled=true; btn.textContent='Unlocking…'; await Vault.unlock(pw.value); closeDlg(); resolve(); } catch(e){ err.textContent=e.message; btn.disabled=false; btn.textContent='Unlock'; } };
    const btn = h('button',{class:'btn primary',onclick:go},'Unlock');
    pw.addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
    showDlg([h('h2',{},h('span',{},'Unlock your Claude key')),
      h('p',{class:'muted small'},`Your key stays unlocked for ${P.unlockMins} minutes.`),
      h('div',{class:'field'},h('label',{},'Passphrase'),pw), err,
      h('div',{class:'row'},btn,h('button',{class:'btn',onclick:()=>{closeDlg();reject(new Error('Locked'));}},'Cancel'))], ()=>reject(new Error('Locked')));
    setTimeout(()=>pw.focus(),50);
  });
}
/* ============ Claude API (streaming) ============ */
async function claudeStream(body, onDelta){
  if (STATIC) throw new Error('This page is read-only.');
  const apiKey = await Vault.get();
  const res = await fetch('https://api.anthropic.com/v1/messages', {method:'POST',
    headers:{'content-type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body: JSON.stringify({...body, stream:true})});
  if (!res.ok){ let t=await res.text(); try{ t=JSON.parse(t).error.message; }catch{} Log.add('error','Claude API', `${res.status}: ${t}`, {model:body.model, max_tokens:body.max_tokens, effort:body.output_config&&body.output_config.effort, promptChars:JSON.stringify(body.messages).length}); throw new Error(`Claude API ${res.status}: ${t}`); }
  const reader=res.body.getReader(), td=new TextDecoder(); let buf='', blocks=[], stop=null, got=0, usage=null;
  for(;;){
    const {value, done} = await reader.read(); if (done) break;
    buf += td.decode(value,{stream:true}); let i;
    while ((i=buf.indexOf('\n\n'))>=0){
      const chunk=buf.slice(0,i); buf=buf.slice(i+2);
      const data = chunk.split('\n').filter(l=>l.startsWith('data:')).map(l=>l.slice(5).trim()).join('');
      if (!data) continue; let ev; try{ ev=JSON.parse(data); }catch{ continue; }
      if (ev.type==='content_block_start'){ blocks[ev.index]={type:ev.content_block.type, name:ev.content_block.name, text:'', json:''}; if (ev.content_block.type==='thinking') onDelta&&onDelta(null, got, 'thinking'); }
      else if (ev.type==='content_block_delta'){ const b=blocks[ev.index]; const d=ev.delta;
        if (d.type==='text_delta'){ b.text+=d.text; got+=d.text.length; onDelta&&onDelta(b.text, got); }
        else if (d.type==='input_json_delta'){ b.json+=d.partial_json; got+=d.partial_json.length; onDelta&&onDelta(null, got); }
        else if (d.type==='thinking_delta'){ onDelta&&onDelta(null, got, 'thinking'); } }
      else if (ev.type==='message_delta'){ stop = ev.delta.stop_reason||stop; usage = ev.usage||usage; }
      else if (ev.type==='error'){ Log.add('error','Claude API stream', ev.error&&ev.error.message||'stream error', {model:body.model}); throw new Error('Claude API: '+(ev.error&&ev.error.message||'stream error')); }
    }
  }
  const out={blocks, stop, usage};
  LAST_DEBUG = {at:new Date().toISOString(), model:body.model, stop, usage, blocks:blocks.filter(Boolean).map(b=>b.type), text:blocks.filter(b=>b&&b.type==='text').map(b=>b.text).join('').slice(0,1500)};
  return out;
}
let LAST_DEBUG=null;
function addStrict(schema){
  if (!schema || typeof schema!=='object') return schema;
  const s={...schema};
  if (s.type==='object'){ s.additionalProperties=false; s.properties=Object.fromEntries(Object.entries(s.properties||{}).map(([k,v])=>[k,addStrict(v)])); }
  if (s.type==='array') s.items=addStrict(s.items);
  return s;
}
function explainStop(stop){
  return ({max_tokens:'it ran out of output tokens (raise "Max output tokens" in Settings, or lower the effort)', refusal:'the model declined the request', pause_turn:'the model paused', model_context_window_exceeded:'the text is too long for the model'})[stop] || ('stop reason: '+(stop||'none'));
}
async function claudeJSON({model, system, user, schema, maxTokens, effort, onProgress}){
  const body={model, max_tokens:maxTokens||P.maxTokens, system, messages:[{role:'user',content:user}], output_config:{format:{type:'json_schema', schema:addStrict(schema)}}};
  if (effort && !/haiku/.test(model)) body.output_config.effort=effort;
  const {blocks, stop} = await claudeStream(body, (t,n,phase)=>onProgress&&onProgress(n,phase));
  const text=blocks.filter(b=>b&&b.type==='text').map(b=>b.text).join('').trim();

// US$ per million tokens [input, output], checked September 2026. Cache writes (1 hour) cost 2× input, cache reads 0.1×.
const PRICES = {'claude-sonnet-5':[2,10], 'claude-haiku-4-5':[1,5], 'claude-haiku-4-5-20251001':[1,5], 'claude-opus-5':[5,25], 'claude-opus-5-5':[4,20], 'claude-fable-5-1':[10,50]};
// A rough price for a guide: one cache write of the whole text, cache reads for the other jobs, and an average
// output per job (JSON plus thinking at medium effort). Real costs vary with the text and the model's thinking.
function guideEstimate(words, model=P.mainModel){
  const p=PRICES[model]; if (!p) return null;
  const prefix=Math.round(words*1.4)+1500, jobs=3+3*Math.max(1,Math.ceil(words/1700));
  const usd=((prefix*2 + prefix*0.1*(jobs-1) + jobs*400)*p[0] + jobs*3500*p[1])/1e6;
  return {jobs, lo:usd*0.6, hi:usd*1.6};
}

async function backupAll(){
  const docs=(await DB.all()).filter(d=>!d.deleted && !d.convert).map(({sync,dirty,editSeq,...d})=>d);
  const decks=(await Decks.all()).filter(k=>!k.deleted).map(({etag,dirty,...k})=>k);
  const {syncToken, ...prefs}=P;
  download(`academic-reader-backup-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify({schema:'gloss-backup/1', at:Date.now(), app:APP_VERSION, docs, decks, prefs}));
  toast(`Backup saved: ${docs.length} text${docs.length===1?'':'s'}, ${decks.length} flashcard deck${decks.length===1?'':'s'}. The Claude key is not included.`, 5000);
}
async function restoreBackup(j){
  let n=0, m=0;
  for (const d of j.docs||[]){ if (!d || !d.id || !Array.isArray(d.versions)) continue; const cur=await DB.get(d.id);
    if (!cur || (d.updated||0)>(cur.updated||0)){ touch(d); if (cur && cur.sync) d.sync=cur.sync; await DB.put(d); Sync.schedule(d); n++; } }
  for (const k of j.decks||[]){ if (!k || !k.id || !Array.isArray(k.cards)) continue; const cur=await Decks.get(k.id);
    const merged=Sync.mergeDeck(cur, k); merged.dirty=true; if (cur && cur.etag) merged.etag=cur.etag; await Decks.put(merged); Sync.scheduleDeck(merged); m++; }
  toast(`Restored ${n} text${n===1?'':'s'} and ${m} deck${m===1?'':'s'}. Newer copies already here were kept.`, 5000);
  if (!DOC){ const all=(await DB.all()).filter(x=>!x.deleted).sort((a,b)=>b.updated-a.updated); if (all[0]) openDoc(all[0].id); }
}

/* ---- arXiv: the browser downloads the PDF straight from arXiv (it allows this), then imports it as usual ---- */
const arxivId = s => { const m=String(s||'').trim().match(/(?:arxiv\.org\/(?:abs|pdf|html)\/)?(\d{4}\.\d{4,5}(?:v\d+)?|[a-z-]+(?:\.[a-z]{2})?\/\d{7}(?:v\d+)?)/i); return m ? m[1] : null; };
async function fetchArxivPdf(id){
  const r=await fetch(`https://arxiv.org/pdf/${id}`); if (!r.ok) throw new Error(`arXiv replied ${r.status} for ${id}`);
  const b=await r.blob(); if (!/pdf/.test(b.type) && b.size<2000) throw new Error('arXiv did not return a PDF');
  return new File([b], id.replace('/','_')+'.pdf', {type:'application/pdf'});
}
function arxivDialog(){
  const inp=h('input',{type:'text',placeholder:'https://arxiv.org/abs/1706.03762 or 1706.03762',autocomplete:'off'});
  const go=async()=>{ const id=arxivId(inp.value); if (!id) return toast('That does not look like an arXiv link or ID.'); closeDlg();
    try{ Prog.show(`Downloading ${id} from arXiv…`); const f=await fetchArxivPdf(id); Prog.hide(); await importPdf(f); }
    catch(e){ Prog.hide(); toast('Could not download from arXiv: '+e.message, 6000, true); } };
  inp.addEventListener('keydown',e=>{ if (e.key==='Enter') go(); });
  showDlg([h('h2',{},h('span',{},'Import from arXiv'),closeX()), h('div',{class:'field'}, h('label',{},'arXiv link or ID'), inp),
    h('p',{class:'muted small'},'Your browser downloads the PDF directly from arXiv, then converts it here.'), h('button',{class:'btn primary',onclick:go},'Import')]);
  setTimeout(()=>inp.focus(),50);
}

// Earlier PDF imports have no group: infer one from the shared "Book title: " prefix they were given.
async function inferGroups(docs){
  const pre=new Map();
  for (const d of docs) if (!d.group && d.versions.length && d.versions[0].name==='PDF' && d.title.includes(': ')){ const k=d.title.split(': ')[0]; (pre.get(k)||pre.set(k,[]).get(k)).push(d); }
  for (const [title, ds] of pre) if (ds.length>1){ const gid='g'+fnv(title);
    ds.sort((x,y)=>x.created-y.created).forEach((d,i)=>{ d.group={id:gid, title, order:i}; touch(d); }); for (const d of ds){ await DB.put(d); Sync.schedule(d); } }
}
async function libraryRecords(){
  const docs=(await DB.all()).filter(d=>!d.deleted);
  await inferGroups(docs);
  const groups=new Map(), recs=[];
  for (const d of docs){ if (d.group){ let g=groups.get(d.group.id); if (!g){ g={group:d.group, docs:[]}; groups.set(d.group.id,g); recs.push(g); } g.docs.push(d); } else recs.push({doc:d}); }
  for (const g of groups.values()){ g.docs.sort((x,y)=>(x.group.order??0)-(y.group.order??0) || x.created-y.created); g.updated=Math.max(...g.docs.map(d=>d.updated||0)); }
  recs.forEach(r=>{ if (r.doc) r.updated=r.doc.updated||0; });
  recs.sort((x,y)=>y.updated-x.updated);
  return recs;
}

async function staticHtml(d, opt){
  const res=await fetch('index.html',{cache:'no-cache'}); if (!res.ok) throw new Error(`could not read the app page (${res.status})`);
  let src=await res.text(); if (!src.includes('<script>\n"use strict";')) throw new Error('the app page is not in the expected form');
  const pk=JSON.parse(JSON.stringify(d.pack)); delete pk.jobs; if (!opt.notes) pk.notes=[];
  for (const r of pk.references||[]) if (r.live && !r.live.title) delete r.live;
  const data={schema:'gloss-static/1', exported:Date.now(), app:APP_VERSION, intro:opt.intro||'',
    doc:{id:d.id, title:d.title, versions:[{md:currentMd(), at:d.versions[d.versions.length-1].at, name:''}], pack:pk, created:d.created, updated:d.updated, pos:0}};
  const json=JSON.stringify(data).replace(/</g,'\\u003c');   // safe inside <script>
  let icon='icon-192.png'; try{ const b=await (await fetch('icon-192.png')).blob(); icon=await new Promise(r=>{ const f=new FileReader(); f.onload=()=>r(f.result); f.readAsDataURL(b); }); }catch{}
  const desc=collapse((pk.meta&&pk.meta.summary)||'').slice(0,300), title=d.title;
  const meta=`<title>${esc(title)}</title>\n<meta name="description" content="${esc(desc)}">\n<meta property="og:type" content="article">\n<meta property="og:title" content="${esc(title)}">\n<meta property="og:description" content="${esc(desc)}">\n<meta name="twitter:card" content="summary">`;
  src=src.replace(/<title>[^<]*<\/title>/, ()=>meta)
    .replace(/<link rel="manifest"[^>]*>\n?/, '')
    .replace(/href="icon-192\.png"/g, ()=>`href="${icon}"`);
  const at=src.lastIndexOf('<script>\n"use strict";');
  return src.slice(0,at)+`<script id="gloss-static" type="application/json">${json}<\/script>\n`+src.slice(at);
}

async function pool(items, n, fn){ const out=new Array(items.length); let i=0; await Promise.all(Array.from({length:Math.min(n,items.length)},async()=>{ while(i<items.length){ const k=i++; out[k]=await fn(items[k],k); } })); return out; }

/* ============ guide generation: a job queue over one cached copy of the text ============ */
/* Every job sends the same prefix (system prompt + the whole numbered text, marked for caching) and one
   shared output schema, so after the first job the text is read from cache. Only the short task differs.
   Jobs are independent, saved as they finish, retried individually, and resumable after the app closes. */
const MOVE_KINDS = Object.keys(MOVE_HELP);
const TERM_KINDS = ['term of art','stipulated term','jargon','named argument','theory','position','distinction','method','Latin phrase','technical (science)','acronym','algorithm or model','dataset or benchmark','metric','statistical concept','system or tool'];
const S = { str:{type:'string'}, int:{type:'integer'}, arr:(items)=>({type:'array',items}), obj:(props,req)=>({type:'object',properties:props,required:req||Object.keys(props)}) };
const PERSON = S.obj({name:S.str, aliases:S.arr(S.str), role:S.str, inThisPaper:S.str, importance:{type:'string',enum:['major','minor']}});
// One schema for every job: changing the schema between requests would invalidate the prompt cache.
const GUIDE_SCHEMA = S.obj({
  overview: S.obj({title:S.str, authors:S.arr(S.str), summary:S.str, field:S.str, outline:S.arr(S.obj({p:S.int, heading:S.str, gist:S.str}))}),
  arguments: S.arr(S.obj({name:S.str, form:{type:'string',enum:['deductive','abductive','dilemma','analogical','inductive','transcendental','reductio','other']}, p:S.int, gloss:S.str,
    premises:S.arr(S.obj({label:S.str,text:S.str,p:S.int})), conclusion:S.obj({label:S.str,text:S.str}), pressurePoints:S.str})),
  people: S.arr(PERSON),
  references: S.arr(S.obj({key:S.str, full:S.str, authors:S.str, year:S.str, title:S.str, doi:S.str, kind:{type:'string',enum:['ally','opponent','evidence','background','method','source of a term']}, use:S.str, anchors:S.arr(S.obj({p:S.int, q:S.str}))},
    ['key','full','authors','year','title','kind','use','anchors'])),
  moves: S.arr(S.obj({p:S.int, kind:{type:'string',enum:MOVE_KINDS}, label:S.str, what:S.str, how:S.str, signals:S.arr(S.obj({q:S.str,note:S.str})), critique:S.str},['p','kind','label','what','how','signals'])),
  terms: S.arr(S.obj({term:S.str, aliases:S.arr(S.str), kind:{type:'string',enum:TERM_KINDS}, short:S.str, background:S.str, inThisPaper:S.str, related:S.arr(S.str)}))
}, []);

const GEN_SYSTEM = () => `You annotate academic texts for a reader who is learning to read them closely. The text may come from any field: annotate it in the terms of its own field. About the reader: ${P.about||DEFAULT_READER}
The whole text is given once, with paragraphs numbered ¶n. Each request then asks for ONE part of the annotation. Reply with a single JSON object in exactly the shape the request gives, and nothing else: no prose before or after, no code fences. Escape quotation marks inside strings.
When asked for an exact quote (q), copy a short span character for character from that paragraph (keep its punctuation and capitalisation), 2 to 12 words long, unique within the paragraph.
Be accurate. If unsure of a biographical or bibliographic fact, leave it out rather than guess. Do not invent quotations. Plain, direct prose; Markdown allowed inside text fields.`;
const numbered = (blocks) => blocks.map(b=>`¶${b.n}${b.isH?' [heading]':''}${b.bib?' [reference list]':''} ${b.text}`).join('\n\n');
const range = (bl) => { const ns=bl.map(b=>b.n).sort((a,b)=>a-b), runs=[]; for (const n of ns){ const r=runs[runs.length-1]; if (r && n===r[1]+1) r[1]=n; else runs.push([n,n]); }
  return runs.map(([a,b])=>a===b?`¶${a}`:`¶${a}–¶${b}`).join(', '); };

function chunkBlocks(blocks, maxWords=1700){
  const chunks=[]; let cur=[], words=0;
  for (const b of blocks){
    const w=wordCount(b.text);
    if (cur.length && (words+w>maxWords || (b.isH && words>maxWords*0.55))){ chunks.push(cur); cur=[]; words=0; }
    cur.push(b); words+=w;
  }
  if (cur.length) chunks.push(cur);
  return chunks;
}
function sectionName(chunk){ const h=chunk.find(b=>b.isH); return collapse((h?h.text:chunk[0].section)||'').slice(0,48) || range(chunk); }

/* ---- the task text for each kind of job ---- */
const TASKS = {
  overview: () => `Fill "overview". field: the academic field and subfield, plainly named (for example "philosophy of mind", "machine learning (reinforcement learning)", "molecular biology"). summary: 3 to 5 sentences in plain English on what the text argues or shows, and how. outline: one entry per heading paragraph, with a one-sentence gist of that section. authors: if stated.`,
  arguments: () => `Fill "arguments": each named or formally stated argument in the text (for example numbered premises and a conclusion, or a named dilemma). For an empirical or technical paper, include its central claim and the chain of evidence or reasoning offered for it, as one argument with the key steps as premises. For each: the paragraph where it is stated (p); premises quoted or closely paraphrased, each with the paragraph where it is stated; the conclusion; form; gloss (what it says in plain terms, 2 to 4 sentences); pressurePoints (where it is most open to attack and who presses there, 2 to 4 sentences).`,
  people: (job) => `Fill "people": every person named in the text, including cited authors.${job.known&&job.known.length?` Only people NOT in this list: ${job.known.join('; ')}.`:''} role: one line on who they are (field, period, what they are known for). inThisPaper: how the text uses them, 1 to 2 sentences. aliases: the forms of their name used in the text (for example the surname alone). importance: major for people the text engages with at length.`,
  references: (job) => `Fill "references" for the works CITED in ${job.label} only (skip works that are not cited there, even if they are in the reference list). key: short citation as used in the text (for example “Chalmers 2018”). full: the entry from the reference list, as written (if there is no reference list, give what the text says). use: what these paragraphs use the work for, 1 to 2 sentences. anchors: each citation of the work within those paragraphs, with the paragraph number and an exact quote of the citation as it appears (for example “(2018, p. 47)” or “Chalmers 2018”). doi: if printed, else empty.`,
  moves: (job) => `Fill "moves" for every non-heading paragraph in ${job.label} (and no others). kind: the main job the paragraph does in the text (for an empirical or technical paper, method, result, limitation and similar kinds usually fit better than argument kinds). label: 2 to 6 words naming this particular move. what: what it says in plain English, 1 to 3 sentences. how: how it is built as argument and how the phrasing signals that (stipulation markers, hedges, concessions, scope limits, "other things equal", necessary vs sufficient, and so on), 2 to 4 sentences; mention links to other sections where they matter. signals: 1 to 4 exact phrases from the paragraph whose wording does logical or rhetorical work, each with a note on what that wording does. critique (optional): where the paragraph is weakest or what a critic would press, 1 to 3 sentences.`,
  terms: (job) => `Fill "terms" for ${job.label}: every term of art, stipulated term, named argument, theory, position, distinction, method or Latin phrase appearing in those paragraphs that a newcomer to ${fieldOf()||'this field'} would not know: terms of art, jargon, acronyms, named methods, algorithms, models, datasets, metrics and statistical ideas included. Skip ordinary words and terms the reader profile says they know. short: one-sentence definition. background: 3 to 6 sentences on where it comes from, who introduced or popularised it, how its use developed, and disputes about it. inThisPaper: how the whole text uses it, noting any departure from standard use. aliases: other forms that appear in the text (plurals, adjectives, abbreviations). related: other term names.${job.known&&job.known.length?`\nAlready in the glossary, so skip these: ${job.known.join('; ')}`:''}`
};
const oneOf = a => a.map(x=>`"${x}"`).join(' | ');
const SHAPES = {
  overview: `{"overview": {"title": string, "authors": [string], "summary": string, "field": string, "outline": [{"p": number, "heading": string, "gist": string}]}}`,
  arguments: `{"arguments": [{"name": string, "form": ${oneOf(['deductive','abductive','dilemma','analogical','inductive','transcendental','reductio','other'])}, "p": number, "gloss": string, "premises": [{"label": string, "text": string, "p": number}], "conclusion": {"label": string, "text": string}, "pressurePoints": string}]}`,
  people: `{"people": [{"name": string, "aliases": [string], "role": string, "inThisPaper": string, "importance": "major" | "minor"}]}`,
  references: `{"references": [{"key": string, "full": string, "authors": string, "year": string, "title": string, "doi": string, "kind": ${oneOf(['ally','opponent','evidence','background','method','source of a term'])}, "use": string, "anchors": [{"p": number, "q": string}]}]}`,
  moves: `{"moves": [{"p": number, "kind": one of ${oneOf(Object.keys(MOVE_HELP))}, "label": string, "what": string, "how": string, "signals": [{"q": string, "note": string}], "critique": string}]}`,
  terms: `{"terms": [{"term": string, "aliases": [string], "kind": ${oneOf(TERM_KINDS)}, "short": string, "background": string, "inThisPaper": string, "related": [string]}]}`
};
TASKS.cards = (job) => `Fill "cards" for ${job.label}: 4 to 8 flashcards that test understanding of the most important content in those paragraphs: central claims, definitions and distinctions, the steps of arguments, key evidence or results, and who holds which view. Each card tests one idea. The front is a clear question answerable from memory without the text; the back is a short answer (1 to 3 sentences) giving the key reason. Avoid trivia such as dates or page numbers unless they matter. p: the paragraph the card is based on.`;
SHAPES.cards = `{"cards": [{"p": number, "front": string, "back": string}]}`;
const LAYER_NAMES = {cards:'Flashcards', overview:'Outline', arguments:'Arguments', people:'People', references:'Sources', moves:'Paragraph notes', terms:'Terms'};

function planJobs(targetBlocks, opts={}){
  const jobs=[]; const J=(layer,label,ids,extra={})=>jobs.push({id:uid(), layer, label, ids, status:'pending', ...extra});
  if (opts.full!==false){ J('overview','the whole text'); J('arguments','the whole text'); J('people','the whole text'); }
  if (opts.people) J('people','changed paragraphs',null,{known:opts.people});
  for (const ch of chunkBlocks(targetBlocks.filter(b=>!b.bib))){ const ids=ch.map(b=>b.bid); const label=`${range(ch)} (${sectionName(ch)})`;
    J('moves',label,ids); J('terms',label,ids,{known:opts.knownTerms}); J('references',label,ids); }
  return jobs;
}
function parseLoose(text){
  let t=text.replace(/^```(?:json)?\s*/i,'').replace(/\s*```\s*$/,'');
  const a=t.indexOf('{'), b=t.lastIndexOf('}'); if (a<0||b<a) return null; t=t.slice(a,b+1);
  try { return JSON.parse(t); } catch {}
  try { return JSON.parse(t.replace(/,\s*([}\]])/g,'$1')); } catch {}   // trailing commas
  return null;
}
function relabel(job){ // paragraph numbers can shift between versions; rebuild the label from stable ids
  if (!job.ids) return job.label; const bl=job.ids.map(id=>BY.get(id)).filter(Boolean); if (!bl.length) return null;
  return `${range(bl)} (${sectionName(bl)})`;
}
function applyJob(pk, job, res){
  const toBid = n => blockNum.get(n); const inJob = bid => !job.ids || job.ids.includes(bid);
  if (job.layer==='overview' && res.overview){ const o=res.overview;
    pk.meta={title:o.title||DOC.title, authors:o.authors||[], summary:o.summary||'', field:o.field||''};
    pk.outline=(o.outline||[]).map(x=>({bid:toBid(x.p), heading:x.heading, gist:x.gist})).filter(x=>x.bid); }
  if (job.layer==='arguments') pk.arguments=(res.arguments||[]).map(a=>({id:slug(a.name)||uid(), name:a.name, form:a.form, bid:toBid(a.p), gloss:a.gloss, premises:(a.premises||[]).map(q=>({label:q.label,text:q.text,bid:toBid(q.p)})), conclusion:a.conclusion, pressurePoints:a.pressurePoints}));
  if (job.layer==='people') pk.people=dedupePeople(res.people||[], pk.people);
  if (job.layer==='references') for (const r of res.references||[]){
    if (!r.key) continue;
    const id=slug(r.key); const old=pk.references.find(x=>x.id===id||x.key===r.key);
    const anchors=(r.anchors||[]).map(a=>({bid:toBid(a.p), q:a.q})).filter(a=>a.bid && inJob(a.bid));
    if (!old){ pk.references.push({...r, id, doi:(r.doi||'').replace(/^https?:\/\/(dx\.)?doi\.org\//,''), anchors}); continue; }
    // the same work cited in several sections: keep one entry, gather every citation and use
    old.anchors=[...(old.anchors||[]).filter(a=>!inJob(a.bid)), ...anchors];
    if (r.use && !(old.use||'').includes(r.use.slice(0,40))) old.use=old.use?`${old.use} ${r.use}`:r.use;
    for (const k of ['full','authors','year','title','doi','kind']) if (!old[k] && r[k]) old[k]=k==='doi'?r[k].replace(/^https?:\/\/(dx\.)?doi\.org\//,''):r[k]; }
  if (job.layer==='moves') for (const m of res.moves||[]){ const bid=toBid(m.p); if (bid && inJob(bid)) pk.moves[bid]={kind:MOVE_HELP[String(m.kind||'').toLowerCase()]?String(m.kind).toLowerCase():'context',label:m.label,what:m.what,how:m.how,signals:(m.signals||[]).filter(x=>x.q),critique:m.critique||''}; }
  if (job.layer==='terms') mergeTerms(pk, res.terms);
}
function dedupePeople(list, existing=[]){
  const out=[...existing];
  for (const p of list){ const id=slug(p.name); const ex=out.find(x=>x.id===id);
    if (ex){ ex.aliases=[...new Set([...(ex.aliases||[]),...(p.aliases||[])])]; continue; }
    out.push({id, name:p.name, aliases:(p.aliases||[]).filter(a=>a.length>2), role:p.role, inThisPaper:p.inThisPaper, importance:p.importance}); }
  return out;
}
function mergeTerms(pk, terms){
  for (const t of terms||[]){
    if (!t.term) continue; const key=t.term.toLowerCase(); const ex=pk.terms.find(x=>x.term.toLowerCase()===key || (x.aliases||[]).some(a=>a.toLowerCase()===key));
    if (ex){ ex.aliases=[...new Set([...(ex.aliases||[]),...(t.aliases||[])])]; if ((t.background||'').length>(ex.background||'').length) ex.background=t.background; ex.related=[...new Set([...(ex.related||[]),...(t.related||[])])]; }
    else pk.terms.push({id:slug(t.term)||uid(), term:t.term, aliases:t.aliases||[], kind:t.kind, short:t.short, background:t.background, inThisPaper:t.inThisPaper, related:t.related||[]});
  }
}

/* ---- running the queue ---- */
let RUNNING=false;
function jobRequest(job){
  return {model:P.mainModel, max_tokens:P.maxTokens,
    system:[{type:'text', text:GEN_SYSTEM()}],
    messages:[{role:'user', content:[
      {type:'text', text:`<text title="${esc(DOC.title)}">\n${numbered(BLOCKS)}\n</text>`, cache_control:{type:'ephemeral', ttl:'1h'}},
      {type:'text', text:`${TASKS[job.layer](job)}\n\nReply with only this JSON:\n${SHAPES[job.layer]}`} ]}],
    output_config:{effort:P.guideEffort}};
}
async function runJob(pk, job){
  const lbl=relabel(job); if (lbl===null){ job.status='done'; job.note='paragraphs no longer exist'; return; }
  job.label=lbl; job.status='running'; job.error=''; drawJobs(pk);
  const req=jobRequest(job);
  const onDelta=(t,n,phase)=>{ job.phase = n?`${n.toLocaleString()} chars`:(phase==='thinking'?'thinking':''); drawJobs(pk); };
  try{
    let busy=0, bad=0;
    for(;;){
      let r;
      try { r = await claudeStream(req, onDelta); }
      catch(e){
        if (++busy<3 && /API (429|5\d\d)|Failed to fetch|network/i.test(e.message)){ job.phase=`busy, retrying in ${10*busy}s`; drawJobs(pk); await sleep(10000*busy); continue; }
        throw e;
      }
      const text=r.blocks.filter(b=>b&&b.type==='text').map(b=>b.text).join('').trim();
      if (!text) throw new Error(`No answer came back: ${explainStop(r.stop)}`);
      const res=parseLoose(text);
      if (!res){
        if (r.stop!=='max_tokens' && ++bad<2){ job.phase='reply was not clean JSON, retrying'; drawJobs(pk); continue; }
        throw new Error(`The reply was not valid JSON: ${explainStop(r.stop)}`);
      }
      applyJob(pk, job, res); job.status='done'; job.phase='';
      if (r.usage) job.cache = r.usage.cache_read_input_tokens>0 ? 'read' : (r.usage.cache_creation_input_tokens>0?'write':'none');
      break;
    }
  }catch(e){ console.error(e); job.status='failed'; job.error=e.message; job.phase=''; Log.add('error','Guide: '+(LAYER_NAMES[job.layer]||job.layer), e.message, {doc:DOC&&DOC.title, part:job.label}); }
  DOC.packAt=Date.now(); await saveDoc(); renderDoc(true); drawJobs(pk);
}
async function runQueue(pk){
  if (RUNNING) return toast('Already running'); 
  try { await Vault.get(); } catch { return; }
  RUNNING=true; Prog.show('Building the guide…'); drawJobs(pk);
  try{
    const todo = () => pk.jobs.filter(j=>j.status==='pending'||j.status==='failed'||j.status==='running');
    todo().forEach(j=>{ if (j.status!=='pending'){ j.status='pending'; } });
    const list=todo();
    // The first job writes the cache; parallel requests only hit it once that response has begun.
    if (list.length){ await runJob(pk, list[0]); }
    await pool(list.slice(1), 3, j=>runJob(pk,j));
  } finally { RUNNING=false; Prog.hide(); }
  const failed=pk.jobs.filter(j=>j.status==='failed').length;
  toast(failed?`${failed} part${failed>1?'s':''} failed. Tap ⋮ then “Resume” to retry just those.`:'Guide complete.', 6000);
}
function drawJobs(pk){
  const jobs=pk.jobs||[]; const done=jobs.filter(j=>j.status==='done').length;
  const by={}; for (const j of jobs){ (by[j.layer] ||= {done:0,total:0,failed:0,running:[]}); const b=by[j.layer]; b.total++; if (j.status==='done') b.done++; if (j.status==='failed') b.failed++; if (j.status==='running') b.running.push(j); }
  const running=jobs.filter(j=>j.status==='running');
  Prog.set(running.length?`Working on: ${running.map(j=>LAYER_NAMES[j.layer]+(j.phase?` (${j.phase})`:'')).join(', ')}`:'Building the guide…', jobs.length?done/jobs.length:0,
    Object.entries(by).map(([k,b])=>`${LAYER_NAMES[k]} ${b.done}/${b.total}${b.failed?`, ${b.failed} failed`:''}`).join('; '));
  Prog.phase='';
}
function queueState(pk){ const j=(pk&&pk.jobs)||[]; return {total:j.length, left:j.filter(x=>x.status!=='done').length, failed:j.filter(x=>x.status==='failed').length}; }

/* ============ new version: local diff, then targeted update ============ */

async function loadNewVersion(file){
  const newMd=await file.text(); const oldMd=currentMd();
  const oldBlocks=renderMd(oldMd, h('div')), newBlocks=renderMd(newMd, h('div'));
  const oldIds=new Set(oldBlocks.map(b=>b.bid)), newIds=new Set(newBlocks.map(b=>b.bid));
  const removed=oldBlocks.filter(b=>!newIds.has(b.bid)), added=newBlocks.filter(b=>!oldIds.has(b.bid));
  const remap=new Map(), used=new Set(), modified=[], fresh=[];
  for (const nb of added){
    let best=null, bs=0; for (const ob of removed){ if (used.has(ob.bid)) continue; const sc=similarity(ob.text, nb.text); if (sc>bs){ bs=sc; best=ob; } }
    if (best && bs>=0.45){ used.add(best.bid); remap.set(best.bid, nb.bid); modified.push(nb); } else fresh.push(nb);
  }
  const gone = removed.filter(b=>!remap.has(b.bid));
  const pk=pack();
  const summary = `${modified.length} paragraph${modified.length===1?'':'s'} changed, ${fresh.length} new, ${gone.length} removed. ${newBlocks.length-added.length} unchanged paragraphs keep their notes.`;
  const apply = async (update) => {
    closeDlg();
    DOC.versions.push({md:newMd, at:Date.now(), name:file.name}); DOC.title=titleFromMd(newMd, DOC.title);
    if (pk){
      const R = id => remap.get(id) || (newIds.has(id)?id:null);
      const moves={}; for (const [id,m] of Object.entries(pk.moves)){ const n=R(id); if (n && (!update || !remap.has(id))) moves[n]=m; } pk.moves=moves;
      pk.outline=pk.outline.map(o=>({...o,bid:R(o.bid)})).filter(o=>o.bid);
      pk.arguments.forEach(a=>{ a.bid=R(a.bid); (a.premises||[]).forEach(q=>q.bid=R(q.bid)); });
      pk.references.forEach(r=>r.anchors=(r.anchors||[]).map(a=>({...a,bid:R(a.bid)})).filter(a=>a.bid));
      pk.notes.forEach(n=>{ const nb=R(n.bid); if (nb) n.bid=nb; });
      pk.docHash=fnv(newMd);
    }
    await saveDoc(); renderDoc(true);
    if (update && pk && !pk.stub){
      const changed=[...modified,...fresh];
      const targets=changed.map(b=>BY.get(b.bid)).filter(b=>b&&!b.bib);
      pk.jobs = planJobs(targets, {full:false, people:pk.people.map(x=>x.name), knownTerms:pk.terms.map(t=>t.term)});
      await saveDoc(); await runQueue(pk);
    }
  };
  showDlg([h('h2',{},h('span',{},'New version'),closeX()), h('p',{},summary),
    hasGuide()?h('p',{class:'muted small'},'Updating re-annotates only the changed and new paragraphs (notes, terms and the works they cite) and looks for new people. Your questions stay attached where their passage survives.'):null,
    h('div',{class:'row'}, hasGuide()?h('button',{class:'btn primary',onclick:()=>apply(true)},'Load and update the guide'):null, h('button',{class:'btn'+(hasGuide()?'':' primary'),onclick:()=>apply(false)}, hasGuide()?'Load without updating':'Load it'))]);
}

function loadPdfJs(){ return pdfjsReady ||= new Promise((res,rej)=>{
  const fail=()=>{ pdfjsReady=null; rej(new Error('Could not load the PDF reader (are you offline?)')); };
  const s=h('script',{src:PDFJS+'pdf.min.js', integrity:PDFJS_SRI, crossorigin:'anonymous', referrerpolicy:'no-referrer'});
  s.onload=async()=>{ try{ const code=await (await fetch(PDFJS+'pdf.worker.min.js',{mode:'cors'})).arrayBuffer();
      const got=btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.digest('SHA-512', code))));

async function outlineRanges(pdf){
  let items=null; try{ items=await pdf.getOutline(); }catch{}
  if (!items||!items.length) return [];
  const pageOf=async it=>{ try{ let d=it.dest; if (typeof d==='string') d=await pdf.getDestination(d); if (!d) return null; return (await pdf.getPageIndex(d[0]))+1; }catch{ return null; } };
  const top=[]; for (const it of items){ const pg=await pageOf(it); if (pg) top.push({title:collapse(it.title), start:pg}); }
  top.sort((a,b)=>a.start-b.start);
  top.forEach((t,i)=>{ t.end = i+1<top.length ? Math.max(t.start, top[i+1].start-1) : pdf.numPages; });
  return top;
}
async function pageTexts(pdf, from, to, onPage){
  const pages=[];
  for (let i=from;i<=to;i++){
    const page=await pdf.getPage(i); const tc=await page.getTextContent(); const lines=[]; let cur=null;
    for (const it of tc.items){ if (!('str' in it)) continue; const y=Math.round(it.transform[5]);
      if (!cur || Math.abs(cur.y-y)>2){ cur={y,text:''}; lines.push(cur); }
      cur.text += (cur.text && !cur.text.endsWith(' ') && !it.str.startsWith(' ') && !cur.text.endsWith('-')?' ':'') + it.str; if (it.hasEOL) cur=null; }
    pages.push(lines.map(l=>l.text.trim()).filter(Boolean)); onPage&&onPage(i);
  }
  // drop running headers/footers: short lines recurring at page edges (digits ignored), and bare page numbers
  const key=x=>x.toLowerCase().replace(/\d+/g,'#').trim(); const freq={};
  pages.forEach(pg=>new Set([...pg.slice(0,2),...pg.slice(-2)].map(key)).forEach(k=>freq[k]=(freq[k]||0)+1));
  const thresh=Math.max(3, pages.length*0.3);
  return pages.map(pg=>pg.filter((l,i)=>{ const edge=i<2||i>=pg.length-2; if (edge && l.length<120 && freq[key(l)]>=thresh) return false; if (edge && /^[\divxlc]+$/i.test(l.trim())) return false; return true; }).join('\n'));
}

    convert:{mode, pages:data.pages||null, blocks:data.blocks||null, per:3, parts, clean:mode!=='none', appendFrom}};
  await DB.put(d); return d;
}

function guessLabels(blocks, a, z){

  const L={headings:[], remove:[], merge:[], quotes:[], notQuotes:[], joinHeading:[]};

async function runConversions(ids){
  if (CONVERTING) return toast('A conversion is already running.');
  const need = (await Promise.all(ids.map(id=>DB.get(id)))).filter(d=>d&&d.convert&&d.convert.mode!=='none'&&d.convert.parts.some(p=>p.status!=='done'));
  if (need.length){ try { await Vault.get(); } catch { return; } }
  CONVERTING=true; Prog.show('Cleaning up the PDF text…');
  const total=need.reduce((a,d)=>a+d.convert.parts.filter(p=>p.status!=='done').length,0); let done=0;
  try{
    for (const id of ids){
      const d=await DB.get(id); if (!d||!d.convert) continue;
      if (DOC && DOC.id===id) DOC=d;
      const c=d.convert; const todo=c.parts.filter(p=>p.status!=='done');
      await pool(todo, 3, async part=>{
        part.status='running';
        try{
          if (c.mode==='rewrite') part.md = await cleanPart(c.pages, part.start, c.per);
          else part.labels = await labelPart(c.blocks, part.start, part.end);
          part.status='done'; part.err=''; }
        catch(e){ part.status='failed'; part.err=e.message; Log.add('error','PDF clean-up', e.message, {doc:d.title, mode:c.mode||'rewrite', part:c.mode==='rewrite'?`pages ${part.start+1}–${part.start+c.per}`:`blocks ${part.start+1}–${part.end}`}); }
        done++; Prog.set(`Cleaning up “${d.title.slice(0,50)}”`, total?done/total:1, `${done} of ${total} parts`);
        await DB.put(d); if (DOC && DOC.id===d.id) renderDoc(true);
      });
    }
    // assemble finished documents (a reference list first, so it can be appended to the others)
    const results=[];
    for (const id of ids){ const d=await DB.get(id); if (d) results.push(d); }
    for (const d of results.sort((a,b)=>(a.convert&&a.convert.appendFrom?1:0)-(b.convert&&b.convert.appendFrom?1:0))){
      if (!d.convert || d.convert.parts.some(p=>p.status!=='done')) continue;
      let md;
      if (d.convert.mode==='rewrite' || !d.convert.mode) md=d.convert.parts.map(p=>p.md).join('\n\n').trim();
      else { const L={headings:[],remove:[],merge:[],quotes:[],notQuotes:[],joinHeading:[]};
        for (const p of d.convert.parts) for (const k of Object.keys(L)) L[k].push(...((p.labels||{})[k]||[]));
        md=blocksToMarkdown(d.convert.blocks, L).trim(); }
      if (!/^#\s/m.test(md.split('\n').slice(0,5).join('\n'))) md=`# ${d.title}\n\n${md}`;
      if (d.convert.appendFrom){ const b=await DB.get(d.convert.appendFrom); const bmd=b&&!b.convert&&b.versions.length?b.versions[b.versions.length-1].md:null;
        if (!bmd) continue; md += '\n\n## References\n\n' + bmd.replace(/^#[^\n]*\n+/, '').replace(/^#{1,3}\s*(references|bibliography)\s*\n+/im,''); }
      d.versions=[{md, at:Date.now(), name:'PDF'}]; delete d.convert; d.updated=Date.now(); touch(d); await DB.put(d); Sync.schedule(d);
      if (DOC && DOC.id===d.id) DOC=d;
    }
  } finally { CONVERTING=false; Prog.hide(); }
  const left=(await Promise.all(ids.map(id=>DB.get(id)))).filter(d=>d&&d.convert);
  if (left.length) toast(`${left.length} text${left.length>1?'s are':' is'} not finished. Open it from the library and tap “Resume conversion”.`, 7000, true);
  else toast(ids.length>1?`Imported ${ids.length} texts. Find them in the library.`:'Converted. Skim it against the PDF before building a guide.', 6000);
  const first=await DB.get(ids[ids.length-1]); if (first && (!DOC || DOC.id===first.id || ids.includes(DOC.id))) openDoc(first.id); else renderDoc(true);
}

Imagine a being physically identical to you, molecule for molecule, that has no experience at all. Philosophers call such a being a *zombie*. It talks about its inner life exactly as you do, yet, by hypothesis, nothing is going on inside.

David Chalmers argued that if zombies are even conceivable, then consciousness is a further fact over and above the physical facts (Chalmers 1996). Call this the conceivability argument.

**P1.** Zombies are conceivable.

**P2.** Whatever is conceivable is metaphysically possible.

**C.** So consciousness is not wholly grounded in the physical.

Most physicalists reject P2. Other things equal, they say, what we can imagine tells us about our concepts and only indirectly about the world.

Illusionists such as Keith Frankish go further. On their view the ingredient the zombie supposedly lacks is missing in us too, so in the philosopher's sense we are all zombies, and our conviction otherwise is the thing that needs explaining (Frankish 2016).

## References

Chalmers, D. J. (1996). *The Conscious Mind: In Search of a Fundamental Theory*. Oxford University Press.

Frankish, K. (2016). Illusionism as a theory of consciousness. *Journal of Consciousness Studies* 23(11–12): 11–39.
`;

// The sample: "Attention Is All You Need". Its licence lets arXiv distribute it but not us, so the reader's browser
// downloads the PDF from arXiv and converts it here. samples/attention.json holds only a recipe (which extracted
// blocks are headings, which to drop or join, and short fixes: equations, and the tables Google's notice lets us
// reproduce) and the guide. The recipe is keyed to extractLayout's blocks: if extractLayout changes, re-check it.
function applyRecipe(blocks, R){
  let L=blocks.map((b,i)=>({id:String(i+1), text:b.text}));
  const find=id=>L.find(x=>x.id===id);
  for (const [id,a,b] of R.fix||[]){ const x=find(id); if (x) x.text=x.text.split(a).join(b); }
  for (const [id,seps] of R.split||[]){ const i=L.findIndex(x=>x.id===id); if (i<0) continue; const parts=[L[i].text];
    for (const sp of seps){ const last=parts.pop(), k=last.indexOf(sp); if (k<0){ parts.push(last); continue; } parts.push(last.slice(0,k).trim(), last.slice(k).trim()); }
    L.splice(i,1,...parts.map((t,j)=>({id:j?`${id}.${j}`:id, text:t}))); }
  for (const [id,t] of Object.entries(R.text||{})){ const x=find(id); if (x) x.text=t; }
  const drop=new Set(R.drop||[]); L=L.filter(x=>!drop.has(x.id));
  for (const [id,after] of R.move||[]){ const i=L.findIndex(x=>x.id===id); if (i<0) continue; const [x]=L.splice(i,1); L.splice(L.findIndex(y=>y.id===after)+1,0,x); }
  for (const [before,level,t] of R.insert||[]){ const j=L.findIndex(y=>y.id===before); if (j>=0) L.splice(j,0,{id:'+'+j, text:t, level}); }
  const H=R.heading||{}, notes=R.notes||{}, join=new Set(R.join||[]), cap=new Set(R.caption||[]);
  const glob=(R.global||[]).map(([re,to])=>[new RegExp(re,'gu'),to]);
  const out=[], defs=[];
  for (const x of L){
    let t=x.text;
    if (x.level==null && parseInt(x.id)<(R.globalBefore||1e9)){
      if (R.normaliseCites) t=t.replace(/\[\s*(\d+(?:\s*,\s*\d+)*)\s*\]/g,(m,a)=>'['+a.split(/\s*,\s*/).join(', ')+']');
      for (const [re,to] of glob) t=t.replace(re,to); }
    t=t.replace(/\u0001(\d+)\u0002/g,'[^$1]');
    if (notes[x.id]){ defs.push(`[^${notes[x.id]}]: ${t}`); continue; }
    const level = x.level!=null ? x.level : H[x.id];
    if (level){ out.push('#'.repeat(level)+' '+t); continue; }
    if (x.level===0 || t.startsWith('|')){ out.push(t); continue; }
    if (join.has(x.id) && out.length){ out[out.length-1]+=(/[\p{L}]-$/u.test(out[out.length-1])&&/^\p{Ll}/u.test(t)?'':' ')+t; if (/[\p{L}]-[\p{Ll}]/u.test(out[out.length-1])) out[out.length-1]=out[out.length-1].replace(/([\p{L}])- (?=\p{Ll})/gu,'$1'); continue; }
    if (cap.has(x.id)){ out.push('*'+t+'*'); continue; }
    if (t.startsWith('• ')){ out.push('- '+t.slice(2)); continue; }
    out.push(t.replace(/^(\d+)\. /,'$1\\. ').replace(/^(#|>|[-+*] )/, m=>'\\'+m));
  }
  return out.join('\n\n')+(defs.length?'\n\n'+defs.join('\n\n'):'');
}
async function openSample(){
  try{
    const have=(await DB.all()).find(d=>!d.deleted && d.sample==='attention'); if (have){ await openDoc(have.id); window.scrollTo(0,0); return; }
    Prog.show('Downloading the paper from arXiv…');
    const sample=await (await fetch('samples/attention.json')).json();
    await loadPdfJs();
    const pdf=await pdfjsLib.getDocument({data:await (await fetchArxivPdf(sample.source.arxiv)).arrayBuffer()}).promise;
    Prog.set('Reading the pages…', null, '');
    const x=await extractLayout(pdf, 1, pdf.numPages, i=>Prog.set(`Reading page ${i} of ${pdf.numPages}`, null, ''));
    const md=applyRecipe(x.blocks, sample.recipe); Prog.hide();
    DOC={id:uid(), title:sample.title, sample:'attention', versions:[{md, at:Date.now(), name:'arXiv '+sample.source.arxiv}], pack:sample.pack, created:Date.now(), updated:Date.now(), pos:0};
    await saveDoc(); localStorage.setItem('gloss.last', DOC.id); closeSheet(); renderDoc(); window.scrollTo(0,0);
    if (sample.pack){ const hit=Object.keys(sample.pack.moves||{}).filter(k=>BY.has(k)).length, all=Object.keys(sample.pack.moves||{}).length;
      if (hit<all*0.9) Log.add('warn','Sample', `Only ${hit} of ${all} paragraph notes matched the downloaded text.`); }
    toast('Tap a bar in the margin, an underlined word or a citation.', 5000);
  }catch(e){ Prog.hide(); Log.add('error','Sample', e.message);
    toast('Could not download the sample from arXiv ('+e.message+'). Opening a short example instead.', 6000); openShortSample(); }
}
