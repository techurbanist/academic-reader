[build]
  publish = "public"
  command = "bash build.sh"

# The Dropbox app key and Google client ID are public identifiers that build.sh writes into the page on purpose
# (the browser needs them to start sign-in; the app uses PKCE and has no client secret). Netlify's secret scanner
# would otherwise fail the build on finding their values in the output.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "DROPBOX_APP_KEY,GOOGLE_CLIENT_ID,PUBLIC_URL"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# The privacy policy at a stable address (linked from the Dropbox and Google app registrations).
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

# Asked for by the "Deploy to Netlify" button. All optional; see README.
[template.environment]
  SYNC_TOKEN = "Optional: a long random key, to sync your devices through this site"
  DROPBOX_APP_KEY = "Optional: your Dropbox app key, to offer Dropbox sync"
  GOOGLE_CLIENT_ID = "Optional: your Google OAuth client ID, to offer Google Drive sync"
