[build]
  publish = "public"
  command = "bash build.sh"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# The privacy policy at a stable address (linked from the Dropbox and Google app registrations).
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

# Asked for by the "Deploy to Netlify" button. All optional; see README.
[template.environment]
  SYNC_TOKEN = "Optional: a long random key, to sync your devices through this site"
  DROPBOX_APP_KEY = "Optional: your Dropbox app key, to offer Dropbox sync"
  GOOGLE_CLIENT_ID = "Optional: your Google OAuth client ID, to offer Google Drive sync"
